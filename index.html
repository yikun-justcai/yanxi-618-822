的定义强调政策导向与决策过程这两点。抓住它，答「预算为什么是政治的」就有依据。"},{"t":"multi","q":"希克把政府预算的职能划分为：","opts":["计划","管理","控制","优先性排序"],"a":[0,1,2],"why":"「优先性排序」是鲁宾补充的两个职能之一（另一个是预算问责）。答题时最好分层写：希克三个 + 鲁宾两个。"},{"t":"multi","q":"希克提出的公共预算三个要素是：","opts":["资源申请","资源分配","资源保护","资源审计"],"a":[0,1,2],"why":"三个要素对应三类参与者。审计属于立法机关的监督权，不在三要素之列。"},{"t":"judge","q":"不同预算系统强调的功能不同，例如计划-项目预算系统强调计划功能。","a":true,"why":"教材明确指出五个功能在各系统中地位不同：计划-项目预算强调计划，结果导向的预算强调管理与问责。"},{"t":"order","q":"把从「提出申请」到「最终决定」的预算参与者顺序排好。","items":["支出部门提出预算申请","财政部门进行资源分配与保护","议会或最高权力机关作出最终分配决策","围绕三要素形成预算制度与程序"],"a":[0,1,2,3],"why":"这条顺序也解释了为什么支出部门既是申请者又是保护者——它在申请时必须考虑资源有限性。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「公共预算」的名词解释（5 分）。","minutes":6,"points":["给出定义：经法定程序批准的政府年度财政收支计划，及为实现公共政策目标而进行的财政资源分配活动","点出政策导向与决策过程这两个关键","写出四个维度（政治、管理、经济、财务管理）或三个要素（资源申请、资源分配、资源保护）","写出功能之一二（计划、管理、控制，或优先性排序与预算问责）","有一句意义或判断：预算是政策优先性的显性化，是责任政府的工具"],"sample":"公共预算是指经法定程序批准的政府年度财政收支计划，以及政府的资金筹集、使用计划与相关制度，其实质是为实现一定的公共政策目标而进行的财政资源分配活动。可从四个维度理解：政治维度，分配反映政策优先性，是利益相关者讨价还价的结果；管理维度，要求以管理方法技术保证资源有效使用；经济维度，承担刺激增长、稳定经济、促进就业等宏观职能；财务管理维度，以微观财务工具约束参与者行为。希克把预算职能分为计划、管理、控制三种，鲁宾补充了优先性排序与预算问责。预算还包含资源申请、资源分配和资源保护三个要素，围绕它们形成预算制度与程序。","tip":"名解里「四个维度」与「三个要素」二选一即可，但「政策导向 + 决策过程」这两个关键必须写——它把公共预算和企业预算区分开了。"},"evidence":[{"src":"cai-wang-3","pages":[243],"quote":"公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动","context":"…问题就是要回答“应该以什么为基础来决定把X数量的预算资金分给A项目，而不是B项目”②。以美国著名政治学家、公共管理学家威尔达夫斯基为代表的早期公共管理学家认为：公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动③。这个定义指出了公共预算的两个关键：其一，预算分配的公共政策导向，即财政资源的分配是围绕公共政策的目标而进行的；其二，公共预算活动实质上是一系列资源的分配决策过程。从实际操作的角度看，公共预算是指经法定程序批准的政府年度财政收支计划，以及…","contextPage":243},{"src":"cai-wang-3","pages":[243],"quote":"即政治维度、管理维度、经济维度和财务管理维度","context":"…基认为，这个答案就在公共预算里。美国华盛顿特区布鲁金斯公共政策研究中心的阿尔伯特·C.海德教授对公共预算概念做了深入的解释④：我们可以从四个维度来理解公共预算，即政治维度、管理维度、经济维度和财务管理维度。首先，因为公共资源是稀缺的，公共预算分配公共资源时必须考虑不同利益相关者的需求，最终的预算分配实际上反映了政府政策的优先性，是不同的参与者讨价还价的结果，这反映了公共预算的政治性。其次，公共预算也是管理的工具，因为有效的分配并不能保证资源…","contextPage":243},{"src":"cai-wang-3","pages":[245],"quote":"公共预算有三个要素：资源申请、资源分配和资源保护","context":"分析就成为预算分析的重点。那么，应该怎样分析预算参与者的决策行为呢？这就需要我们了解公共预算的要素。艾伦·希克认为，公共预算有三个要素：资源申请、资源分配和资源保护。不论什么样的国家，其公共预算必有这三个要素，与之相对应的，预算的参与者可以分为资源申请者、资源分配者和资源保护者①。这些预算的参与者根据一定的规则和程序提出预算申请、进行预算分配并保护预算资源合理使用，从而构成了一个完整的预算体系。在实践…","contextPage":245},{"src":"chen-2","pages":[298],"quote":"公共预算是通过分配财政资源，实现人类各种不同目的的公共行政活动","note":"陈强调预算的本质是政治性、核心价值是公共性，正好补蔡王「四维度」里的政治维度。","context":"政府职能中的核心地位。从政治学的角度看，公共预算的本质是政治性的。公共预算是通过分配财政资源，实现人类各种不同目的的公共行政活动。公共预算是政府对所掌握的公共资源的分配，其核心价值是公共性问题。美国著名公共预算专家阿伦·威尔达夫斯基指出：“一方面，公共预算的核心是政治，预算过程是一个政治过程；另一方面，几乎所有的政治活动最后都需要在预算过程中结束。所有的预算改革都是…","contextPage":298}],"moduleId":"m7","order":1},"l7-2":{"id":"l7-2","title":"钱怎么改、谁来看：预算调整与人大监督","goal":"能准确说出「预算调整」的四类情形与法定程序，并解释立法机关审查监督为什么是责任政府的关键。","minutes":15,"tag":"第7章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2020 年名解考过「预算调整」。它和「预算变更」不是同义词，混淆这两个概念是这道题的常见失分点。"},{"t":"p","h":"先分清两个词","text":"**预算变更**是执行中因不可预见因素需要作出的变动；其中**属于预算调整的，要严格按法定程序经人大常委会批准**，不属于预算调整的事项按有关权限和程序变更即可。\n\n**预算调整**的界定是：经人民代表大会批准的预算，在执行中因特殊原因需要增加支出或减少收入，变更原来批准预算的过程。**关键词是「经人大批准」和「增支减收」**——只有动了这两件事，才需要人大批准。"},{"t":"p","h":"四类必须调整的情形","text":"按《预算法》，出现下列情况之一应当进行预算调整：\n\n**一、**需要增加或者减少预算总支出；\n**二、**需要调入预算稳定调节基金；\n**三、**需要调减预算安排的重点支出数额；\n**四、**需要增加举借债务数额。\n\n程序上，预算调整方案应说明调整的理由、项目和数额，提请本级人大常委会审查批准。遇自然灾害等突发事件必须及时增加支出的，**应先动支预备费**；预备费不足的可以先安排支出，属于预算调整的再列入调整方案。"},{"t":"p","h":"为什么立法机关要管钱袋子","text":"教材引克利夫兰那句很硬的话：**没有预算的政府是看不见的政府，看不见的政府是不负责的政府。** 建立责任政府有两条途径——赋予立法机关审查监督预算的权力，以及建立公民参与的预算模式；前者更传统、作用也更大。\n\n立法机关的预算审查监督权体现在三个时点：**批准前**（能否制定中长期财政规划、有无预算修正权、审议时间长短、有没有专业力量）、**执行中**（能否批准预算调整）、**执行后**（有无独立的预算审计权）。"},{"t":"p","h":"我国人大的职权与四个审查阶段","text":"宪法与《预算法》规定：全国人大审查中央和地方预算草案及执行情况报告、批准中央预算；全国人大常委会监督预算执行、审查批准中央预算调整方案和中央决算；地方各级人大及其常委会相应行使本级职权。\n\n人大审查批准预算大致分四个阶段：**前期工作**（提前介入编制、调查研究、听取人大代表与专家智库意见）、**初步审查**（财政部门在人大会议举行前将草案初步方案提交财经委员会或有关专门委员会初审，全国层面是会议举行四十五日前）、**会议审查**、**批准**。"},{"t":"ask","q":"为什么「预算调整要经人大常委会批准」这件事这么重要？","a":"因为它把「改变既定政策」的成本提高了。预算一旦经人大批准，就是一份对公众的承诺；如果政府可以随时增支减收，批准就失去意义，政策优先性也会被悄悄改写。要求调整方案说明理由、项目和数额并报批，等于强制把变更放到台面上接受审查。答「预算的约束力」类题目时，这个机制就是核心论据。"},{"t":"tip","text":"名解「预算调整」写四件事：经人大批准、因特殊原因、增支或减收、变更原批准预算；再补一句「四类情形需报人大常委会批准」，就能拿满。"}],"concepts":[{"term":"预算调整","def":"经人民代表大会批准的预算，在执行中因特殊原因需要增加支出或减少收入，变更原来批准预算的过程。","points":["须经人大常委会审查批准，方案要说明理由、项目和数额","四类情形：增减预算总支出、调入预算稳定调节基金、调减重点支出、增加举借债务","与一般预算变更的区别在于是否动到批准过的收支总盘子"],"exam":"2020 年名解原题。四类情形能写出三条以上，就是高分答案。"},{"term":"预算审查监督","def":"立法机关在预算批准前、执行中、执行后对政府预算行使的审查、批准与监督权力。","points":["三个时点：批准前、执行中、执行后（审计）","我国：人大审查批准预算，人大常委会批准调整方案与决算","四个阶段：前期工作、初步审查、会议审查、批准"],"exam":"「为什么要加强人大预算监督」「如何建设责任政府」类论述的落点。"}],"exercises":[{"t":"choice","q":"预算调整与一般预算变更的关键区别是：","opts":["金额大小不同","是否属于经人大批准的预算在增支减收后需要变更并报人大常委会批准","是否涉及政府采购","是否跨年度"],"a":1,"why":"预算调整的对象是「经人大批准的预算」，且动到增支或减收；只有这类变动才需要走人大常委会批准程序。"},{"t":"multi","q":"按《预算法》，应当进行预算调整的情形包括：","opts":["需要增加或者减少预算总支出","需要调入预算稳定调节基金","需要调减预算安排的重点支出数额","需要增加举借债务数额"],"a":[0,1,2,3],"why":"四类情形全部正确。它们共同的特点是都改变了人大批准过的收支格局。"},{"t":"judge","q":"预算执行中遇到自然灾害等突发事件必须增加支出时，应当先动支预备费。","a":true,"why":"这是《预算法》的安排：先动预备费，预备费不足才先安排支出，属于预算调整的再列入调整方案。顺序不能颠倒。"},{"t":"choice","q":"立法机关的预算审查监督权在预算执行过程中体现为：","opts":["能否制定中长期财政规划","是否有权批准预算调整","是否有独立的预算审计权","是否有预算修正权"],"a":1,"why":"三个时点要分清：批准前看规划权、修正权与审议时间；执行中看能否批准预算调整；执行后看有无独立审计权。"},{"t":"order","q":"把人大审查批准预算的四个阶段排好顺序。","items":["预算审查前期工作：提前介入编制、调查研究","初步审查：财政部门将草案初步方案提交专门委员会","人民代表大会会议审查","审查批准"],"a":[0,1,2,3],"why":"这条顺序说明人大并非只在会上看一眼，前期介入与专门委员会初审才是专业审查发生的地方。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「预算调整」的名词解释（5 分）。","minutes":6,"points":["给出定义：经人大批准的预算，在执行中因特殊原因增加支出或减少收入、变更原批准预算的过程","点明法定程序：须报本级人大常委会审查批准，方案说明理由、项目和数额","列出至少三类情形（增减总支出、调入预算稳定调节基金、调减重点支出、增加举借债务）","区分：不同于一般预算变更，只有动到批准过的收支格局才需报批","补一句意义或边界（如：遇突发事件应先动支预备费）"],"sample":"预算调整是指经人民代表大会批准的预算，在执行中因特殊原因需要增加支出或减少收入，变更原来批准预算的过程。按《预算法》，出现下列情形之一应当进行预算调整：需要增加或者减少预算总支出；需要调入预算稳定调节基金；需要调减预算安排的重点支出数额；需要增加举借债务数额。预算调整方案应当说明调整的理由、项目和数额，提请本级人大常委会审查批准。它不是一般的预算变更：只有动到人大批准过的收支盘子才需走法定批准程序，其他变更事项按有关权限和程序办理。预算执行中因自然灾害等突发事件必须及时增加支出的，应先动支预备费。","tip":"这道题的分水岭是「四类情形」。只写定义和「报人大批准」能拿 3 分，把情形写上三四条才是 5 分。"},"evidence":[{"src":"cai-wang-3","pages":[259],"quote":"预算调整是指经人民代表大会批准的预算，在执行中因特殊原因需要增加支出或减少收入，变更原来批准预算的过程","context":"…可能确需进行预算变更。预算变更中属于预算调整的，要严格按照法定程序经人大常委会批准后调整预算；其他不属于预算调整的预算变更事项，要按有关规定权限和程序予以变更。预算调整是指经人民代表大会批准的预算，在执行中因特殊原因需要增加支出或减少收入，变更原来批准预算的过程。预算执行过程中，如果出现《预算法》规定的下列情况之一的，应当进行预算调整：第一，需要增加或者减少预算总支出的；第二，需要调入预算稳定调节基金的；第三，需要调减预算安排的重点支出数额的；第四，需要增加举借债务数额的。根据《预算法》的要求，在…","contextPage":259},{"src":"cai-wang-3","pages":[259],"quote":"第一，需要增加或者减少预算总支出的","context":"…代表大会批准的预算，在执行中因特殊原因需要增加支出或减少收入，变更原来批准预算的过程。预算执行过程中，如果出现《预算法》规定的下列情况之一的，应当进行预算调整：第一，需要增加或者减少预算总支出的；第二，需要调入预算稳定调节基金的；第三，需要调减预算安排的重点支出数额的；第四，需要增加举借债务数额的。根据《预算法》的要求，在预算执行中，各级政府一般不制定新的增加财政收入或者支出的政策和措施，也不制定减少财政收入的政策和措施；必须做出…","contextPage":259},{"src":"cai-wang-3","pages":[262],"quote":"没有预算的政府是看不见的政府，看不见的政府是不负责的政府","context":"技术环节的内容进行审查。7.3立法机关预算审查监督克利夫兰认为，没有预算的政府是看不见的政府，看不见的政府是不负责的政府。在现代社会，建立责任政府主要有两个途径：一是在代议制政体下，充分发挥立法机关的作用，赋予立法机关审查监督预算的权力；二是建立公民参与的预算模式。二者比较起来，前者的模式比较传统，发挥的作用也更大。从世界各国的实践来看，赋予立法机关审查批准…","contextPage":262},{"src":"cai-wang-3","pages":[262],"quote":"审查、批准政府预算并监督其执行，是宪法和法律赋予各级人大及其常委会的一项重要职责","context":"…其常委会成为全面担负起宪法法律赋予的各项职责的工作机关，成为同人民群众保持密切联系的代表机关。完善人大专门委员会设置，优化人大常委会和专门委员会组成人员结构。”审查、批准政府预算并监督其执行，是宪法和法律赋予各级人大及其常委会的一项重要职责。深化预算管理制度改革，需要充分发挥各级人大及其常委会在预算过程中的职权。《中华人民共和国宪法》规定全国人大“审查和批准国家的预算和预算执行情况的报告”；全国人大常委会“在全国人民代表大会闭会期间，审查和批准国民经济和社会发展计划、国家预算…","contextPage":262},{"src":"chen-2","pages":[303],"quote":"虽然2014年修订的《预算法》加强了人大对政府预算监督方面的规定","note":"陈对人大监督的判断更直接：法条加强了，但预算权力的实际分配仍待规范。","context":"三是我国公共预算权力分配不合理。虽然2014年修订的《预算法》加强了人大对政府预算监督方面的规定，但是中国预算过程政治的核心仍然是以党委和政府（包括两大系统中的各个领导）为核心的行政预算体制。对于党委、政府及各个领导应该具有何种预算权力、多大的预算权力，应该如何行使预算权力以及承担何种责任，现行的预算制度并没有进行规定，也没有相应地进…","contextPage":303}],"moduleId":"m7","order":2},"l8-1":{"id":"l8-1","title":"政务信息公开：六条原则撑起一道题","goal":"能给出政务信息公开的定义，并按顺序说出六条原则，用「利益平衡」解释公开与保密为什么不是对立关系。","minutes":15,"tag":"第8章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2020 年简答考「政府信息公开的原则」，2021 年又考「政务信息资源公开的原则」。同一道题连着两年出现，说明它是稳拿分的地方。"},{"t":"p","h":"先给定义，再给主体","text":"**政务信息资源公开**（也称开放）是指政务部门以及法律法规授权的具有管理公共事务职能的公共组织，**主动或根据公众的申请**公开政务信息，并方便社会公众获取和使用政务信息的各种活动与制度的总称。\n\n注意两个词：一是「主动」与「依申请」两条渠道并存；二是落点不在「公布」，而在「方便获取和使用」——公开了但拿不到、看不懂，不算完成公开。"},{"t":"p","h":"制度是怎么长出来的","text":"1766 年瑞典《出版自由法案》规定行政信息的公共存取原则，是世界上最早的信息公开法；1967 年美国《信息自由法案》被认为是世界上第一部现代意义上的信息公开法规，规定联邦政府有向公众公开信息的义务。此后从「公开」走到「开放数据」：2009 年美国 data.gov 上线，2013 年行政命令进一步规定「政府信息的默认形式就是开放并且机器可读」。\n\n我国 2007 年颁布《政府信息公开条例》，2017 年通过《关于推进公共信息资源开放的若干意见》。这条线索在论述题里很好用：信息公开的演进方向是「从可以查到可以计算」。"},{"t":"p","h":"六条原则（这道题的骨架）","text":"**一、合法性原则**：公开的范围、内容、程序、途径都必须有法可依、有章可循；加强公开立法、健全公开制度是法制条件。\n**二、及时性原则**：公众要的不只是真实可靠，还要快，否则信息闲置浪费，价值不能实现。\n**三、真实性原则**：公开的信息必须真实可靠，虚假信息会误导公众，甚至引发混乱。\n**四、利益平衡原则**：公开不得侵犯个人隐私、商业秘密等合法权益，也不得损害国家秘密和社会公共利益，要处理公开与保护的关系。\n**五、不收费原则**：公开一般不收费，以不收费为原则、以收费为例外；例外情形只能收取预先确定标准的检索、复制等成本费用，标准由物价部门核准，经济特别困难的申请人还可减免。\n**六、责任原则**：公开是公共部门的一种责任，要有考核、评议、监察、举报、行政复议、行政诉讼等督促、监督与保障措施。"},{"t":"ask","q":"「利益平衡」是不是给了政府一个「不公开」的口子？","a":"设计上是，实践中容易变成。教材点出了这个风险：我国不少地方政府的规定虽然列举了不予公开的信息，却没有明确除外事项和配套制度，于是「以保护国家秘密为由拒绝提供信息」就成了常规操作。俄罗斯的做法值得借鉴——用列举方式明确「禁止列入限制获取的信息」，把不可公开的范围反向锁死。答题时写出「例外必须被列举限定，否则原则会被例外吞掉」，就是有判断力的答案。"},{"t":"tip","text":"六条原则的记忆钩子：合法（能不能公开）→ 及时（快不快）→ 真实（真不真）→ 利益平衡（该不该全公开）→ 不收费（要不要钱）→ 责任（不公开怎么办）。六问对应六条，不容易漏。"}],"concepts":[{"term":"政务信息资源公开","def":"政务部门及法律法规授权的公共组织主动或依申请公开政务信息，并方便公众获取和使用的活动与制度的总称。","points":["两条渠道：主动公开与依申请公开","六条原则：合法性、及时性、真实性、利益平衡、不收费、责任","落点是「方便获取和使用」，不只是发布"],"exam":"2020、2021 连续两年考它的原则，答题时先报「六条」再逐条展开。"},{"term":"利益平衡原则","def":"实施公开时不得侵犯个人隐私、商业秘密等合法权益及国家秘密与社会公共利益，须处理公开与保护的关系。","points":["例外范围应被列举明确，否则会成为拒绝公开的理由","公开与保密不是对立，而是边界问题"],"exam":"答「如何推进政务公开」时，用来说明「不是公开得越多越好，而是边界要清楚」。"}],"exercises":[{"t":"multi","q":"政务信息资源公开的原则包括：","opts":["合法性、及时性、真实性","利益平衡","不收费","责任"],"a":[0,1,2,3],"why":"六条原则是合法性、及时性、真实性、利益平衡、不收费、责任。前三条常被合并记忆，后三条最容易被漏掉。"},{"t":"choice","q":"按教材，政务信息公开在收费上的原则是：","opts":["按市场价收费","以不收费为原则、以收费为例外","一律不得收费","由公开部门自行决定"],"a":1,"why":"例外只能收取预先确定标准的检索、复制等成本费用，且标准需物价部门核准，困难申请人可减免。"},{"t":"judge","q":"政务信息只要公布了就算完成了公开。","a":false,"why":"定义明确要求「方便社会公众获取和使用」。公布了却搜不到、读不懂、下载不了，都不算完成公开。"},{"t":"choice","q":"世界上第一部现代意义上的信息公开法规是：","opts":["瑞典《出版自由法案》","美国《信息自由法案》","英国《信息自由法》","中国《政府信息公开条例》"],"a":1,"why":"瑞典 1766 年的法案是世界上最早的信息公开法；1967 年美国《信息自由法案》才是第一部现代意义上的信息公开法规。两个「第一」不要混。"},{"t":"order","q":"把「公开与保密的关系」这条推理排好顺序。","items":["公开是原则，不公开是例外","例外情形必须由法律列举明确","否则「限制获取」会成为拒绝公开的理由","因此要同时规定公开范围与除外事项的配套制度"],"a":[0,1,2,3],"why":"这条链直接对应教材对我国实践的批评，是答「如何完善政务公开」时最有分量的部分。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「政务信息资源公开的原则」（10 分）。","minutes":12,"points":["总述：政务信息公开的原则是公共部门必须遵守的准则，效力上高于具体操作规则","合法性原则：范围、内容、程序、途径有法可依","及时性原则：及时迅速，否则信息闲置浪费","真实性原则：信息必须真实可靠，虚假信息会误导公众","利益平衡原则：不得侵犯隐私、商业秘密、国家秘密与社会公共利益","不收费原则：以不收费为原则、收费为例外，只收成本费用","责任原则：要有考核、评议、监察、复议与诉讼等保障措施"],"sample":"政务信息资源公开的原则是公共部门在公共管理过程中必须遵守的准则，在效力上高于具体的公开操作规则，并对操作规则起宏观指导作用。其内容包括六条：一是合法性原则，公开的范围、内容、程序和途径都必须有法可依、有章可循，加强公开立法与健全公开制度是法制条件；二是及时性原则，公开要及时迅速，否则会造成信息闲置与浪费，无法实现信息价值；三是真实性原则，公开的信息必须真实可靠，虚假信息会误导公众甚至引发社会动荡；四是利益平衡原则，公开不得侵犯个人隐私、商业秘密等合法权益，也不得损害国家秘密和社会公共利益，须处理好公开与保护的关系；五是不收费原则，公开以不收费为原则、以收费为例外，例外情形只能收取经物价部门核准的检索、复制等成本费用，困难申请人可减免；六是责任原则，公开是公共部门的一种责任，须有考核、评议、监察、举报、行政复议和行政诉讼等督促监督与保障措施。","tip":"六条每条一句解释即可，不要在某一条上写太长——10 分题按点给分，六条写全比三条写深更划算。"},"evidence":[{"src":"cai-wang-3","pages":[295],"quote":"政务信息资源公开也称政务信息资源开放","context":"…功能服务的特点。（4）资源形态类政务信息资源。这是以信息的存在形式为依据而形成的政务信息资源类别。8.2.5政务信息资源公开8.2.5.1政务信息资源公开的含义政务信息资源公开也称政务信息资源开放，是指政务部门以及法律法规授权的具有管理公共事务职能的公共组织主动或根据公众的申请公开政务信息，并方便社会公众获取和使用政务信息的各种活动与制度的总称。由法律确定的、现代意义的信息公开制度，产生于18世纪的欧洲。1766年，瑞典①俄罗斯《联…","contextPage":295},{"src":"cai-wang-3","pages":[297],"quote":"政务信息资源公开原则包括以下方面","context":"门在公共管理过程中必须遵守的准则，在效力上它高于具体的政务信息资源公开操作规则，并对具体的政务信息资源公开操作规则起着宏观指导和控制作用。概括起来，政务信息资源公开原则包括以下方面：1.合法性原则合法性原则是指政务信息资源必须是依法公开，包括政务信息公开的范围、内容、程序和途径等，都必须有法可依、有章可循，即通过具体的法律、法规、制度和规范等，对政务信息资源公开做出明确规定，并在实践中贯彻执行。加强政务信息资源公开立…","contextPage":297},{"src":"cai-wang-3","pages":[297],"quote":"公共部门公开政务信息资源，应当以不收费为原则、以收费为例外","context":"…益，以及国家秘密和社会公共利益，要有效处理公开与保护的关系。5.不收费原则政务信息资源作为社会公共资源，它的公开，一般不收取费用。这是世界各国和地区通行的做法。公共部门公开政务信息资源，应当以不收费为原则、以收费为例外。所谓例外，是指公共部门根据有关规定提供政务信息资源只能向申请人收取预先确定标准的检索、复制等成本费用，不得收取其他费用，并且各种成本费用的收取标准要由物价部门核准。对于经济特别困难的申请人，还可以减免收费。6.责任原则公开政务信息资源是公…","contextPage":297}],"moduleId":"m8","order":1},"l8-2":{"id":"l8-2","title":"交换共享：数据怎么从部门流向部门","goal":"能说出交换共享的定义与两个阶段，并从目录体系、标准规范、管理制度三方面说明管理措施。","minutes":15,"tag":"第8章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2026 年简答考「政务信息资源交换共享管理的措施」，2025 年案例考「公共数据开发利用」。部门之间的数据为什么老是共享不了，答案就在这一节。"},{"t":"p","h":"定义里有三个限制","text":"**政务信息资源交换共享**是指一个部门为其他部门履行公共管理职能的需要而提供政务信息资源，以及为履行职能需要从其他部门获取政务信息资源的行为。\n\n定义里藏着三条纪律：**一、**获取的信息只能用于本部门履行职能，**不得转给第三方、不得用于商业目的**；**二、**要避免过度、不合理的共享要求；**三、**共享是为了履职，不是为了「数据越多越好」。"},{"t":"p","h":"两个阶段","text":"**第一阶段：数据抽取汇集。** 先掌握各部门现有数据情况，明确数据格式、业务表结构、字典表；再按需求与格式制定抽取规则，从业务系统中抽取，形成部门可供交换共享的源数据库；最后通过数据交换汇集到数据交换共享中心，形成汇集库。\n\n**第二阶段：数据整合共享。** 通过共享中心对汇集库数据做清洗、整合，形成共享应用数据库；在此基础上编制共享数据目录，注册后通过共享平台提供目录查询、数据共享等服务。\n\n两个阶段的分界很清楚：**先解决「有没有」，再解决「好不好用」**。"},{"t":"p","h":"三条管理措施","text":"**一、编制政务信息资源交换共享目录体系。** 因为信息产生于各环节各部门、分权管理、存储分散、搜寻不易，需要一种「可分可合的工具」来管理——这就是目录体系。它以**元数据**为核心，以政务分类表和主题词表为控制词表，通过 XML 与 RDF 对信息资源做网状组织，实现从分类、主题、应用等角度对信息的识别、定位、发现、评估与选择。\n\n**二、健全与完善交换共享标准规范。** 标准规范为信息资源一致性和技术平台的互联、互通、互操作提供基本保证，要围绕采集、组织、分类、保存、发布与使用等生命周期环节建立规范，包括信息资源相关规范、技术平台对外服务接口规范、前置交换环境规范、交换中心环境规范、内部模块接口规范和编码规范。\n\n**三、健全与完善交换共享管理制度。** 涉及提供方、管理方、使用方、平台运维方与建设方，管理对象包括信息资源与技术平台。要树立「政务信息资源属于公共资源」「信息越流通，大家都受益」的观念，形成管理维护制度、平台管理维护制度和分级管理制度。"},{"t":"ask","q":"为什么「信息越流通大家都受益」这句话要写进制度文件？","a":"因为共享的收益是分散的，成本是集中的。提供数据的部门承担了采集、清洗、维护的成本，收益却落在使用部门和社会身上，于是「多一事不如少一事」成了理性选择。写进制度，是在用组织观念对抗部门理性：把共享从「帮别人的忙」改写成「履行自己的职责」。答「为什么共享难」这类题，从成本—收益错配切入，比说「观念落后」深刻得多。"},{"t":"tip","text":"三条措施的记忆顺序就是问题顺序：找不到（编目录）→ 对不上（定标准）→ 不愿给（立制度）。按「发现—互通—激励」三层记，答题时不乱。"}],"concepts":[{"term":"政务信息资源交换共享","def":"一个部门为其他部门履行公共管理职能提供政务信息资源，以及为履职需要从其他部门获取信息的行为。","points":["两个阶段：数据抽取汇集、数据整合共享","三条限制：仅用于履职、不得转第三方或商用、避免过度共享","意义：是充分开发利用政务信息资源的有效途径"],"exam":"常与「信息孤岛」「一网通办」一起考，答题时点出两阶段最得分。"},{"term":"政务信息资源目录体系","def":"以元数据为核心、以政务分类表和主题词表为控制词表，通过 XML 与 RDF 对政务信息资源作网状组织的管理工具。","points":["作用：从分类、主题、应用等角度实现识别、定位、发现、评估与选择","框架四层：资源层、目录层、服务层、应用层","是共享与服务的基础设施"],"exam":"答「如何打破信息孤岛」的第一条措施。"}],"exercises":[{"t":"choice","q":"政务信息资源交换共享的两个阶段是：","opts":["采集与公开","数据抽取汇集与数据整合共享","编目与检索","审批与发布"],"a":1,"why":"先抽取汇集形成汇集库，再清洗整合形成共享应用数据库。顺序颠倒就会出现「先整合后汇集」的返工。"},{"t":"multi","q":"按教材，实现交换共享的管理措施包括：","opts":["编制政务信息资源交换共享目录体系","健全与完善交换共享标准规范","健全与完善交换共享管理制度","要求各部门无条件公开全部数据"],"a":[0,1,2],"why":"D 与教材相反：共享要避免过度、不合理的要求，且获取的信息只能用于履职，不得转第三方或商用。"},{"t":"judge","q":"一个部门从其他部门获取的政务信息资源，可以转给第三方用于商业开发。","a":false,"why":"教材明确规定：只能用于本部门履行职能的需要，不得转给第三方和用于商业目的。这是共享纪律的底线。"},{"t":"choice","q":"政务信息资源目录体系的核心是：","opts":["数据库","元数据","门户网站","交换平台"],"a":1,"why":"原话是「以元数据为核心，以政务分类表和主题词表为控制词表」。元数据就是「关于数据的数据」，用来描述、定位与发现资源。"},{"t":"order","q":"按数据流动的顺序，把交换共享的环节排好。","items":["各部门业务库按规则抽取形成源数据库","汇集到数据交换共享中心形成汇集库","清洗整合形成共享应用数据库","编制共享数据目录并提供查询与共享服务"],"a":[0,1,2,3],"why":"这条链同时说明了两阶段的边界：前三步是抽取汇集，后两步是整合共享。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「政务信息资源交换共享管理的措施」（10 分）。","minutes":12,"points":["先给定义：部门之间为履职需要提供与获取政务信息资源的行为","指出难点：信息产生分散、分权管理、存储分散、搜寻不易","措施一：编制交换共享目录体系（以元数据为核心，实现识别定位发现）","说明目录体系框架的层次：资源层、目录层、服务层、应用层","措施二：健全标准规范，保证一致性与互联互通互操作","措施三：健全管理制度，包括管理维护制度、平台维护制度与分级管理制度","补一句纪律：仅用于履职、不得转第三方或商用，避免过度共享"],"sample":"政务信息资源交换共享是指一个部门为其他部门履行公共管理职能的需要而提供政务信息资源，以及为履行职能需要从其他部门获取政务信息资源的行为，是充分开发利用政务信息资源的有效途径。由于政务信息产生于公共管理各环节各部门，分权管理、存储分散、搜寻不易，需要通过管理措施加以保障。主要措施有三：第一，编制政务信息资源交换共享目录体系。目录体系以元数据为核心，以政务分类表和主题词表为控制词表，通过 XML 与资源描述框架对信息资源作网状组织，实现从分类、主题、应用等角度对信息的识别、定位、发现、评估与选择；其框架包括资源层、目录层、服务层和应用层。第二，健全与完善交换共享标准规范，围绕采集、组织、分类、保存、发布与使用等环节建立规范，为一致性和技术平台的互联、互通、互操作提供保证。第三，健全与完善交换共享管理制度，明确提供方、管理方、使用方与平台运维方的责任，形成管理维护制度、平台管理维护制度和分级管理制度，树立信息属于公共资源、越流通越受益的观念。同时须遵守共享纪律：获取的信息只能用于本部门履职，不得转给第三方或用于商业目的，并避免过度、不合理的共享要求。","tip":"这道题最容易写成「要加强共享」。三条措施各说一句具体的机制（元数据、标准、制度），比反复强调重要性得分高得多。"},"evidence":[{"src":"cai-wang-3","pages":[299],"quote":"政务信息资源交换共享是指一个部门为其他部门履行公共管理职能的需要而提供政务信息资源","context":"…息资源交换共享的含义政务信息资源交换共享包括全社会交换共享和各公共部门之间的交换共享。本章所研究的政务信息资源交换共享是指各公共部门之间的政务信息资源交换共享。政务信息资源交换共享是指一个部门为其他部门履行公共管理职能的需要而提供政务信息资源，以及为履行公共管理职能的需要从其他部门获取政务信息资源的行为。实现政务信息资源交换共享是充分开发利用政务信息资源的有效途径。一个部门从另一个部门获取的政务信息资源，只能用于本部门履行职能的需要，不得转给第三方和用于商业目的。政务信息资源交…","contextPage":299},{"src":"cai-wang-3","pages":[300],"quote":"政务信息资源目录体系是以元数据为核心","context":"源。这个工具就是政务信息资源目录体系。政务信息资源目录体系是以元数据为核心，以政务分类表和主题词表为控制词表，通过规范的元数据与政务分类表和主题词表，运用XML标识语言以及资源描述框架RDF，对政务信息资源进行网状组织，实现从分类、主题、应用等多个角度对政务信息资源进行管理、识别、定位、发现、评估与选择的工具。政…","contextPage":300},{"src":"cai-wang-3","pages":[301],"quote":"标准规范为信息资源一致性和技术平台的互联、互通、互操作提供了基本的保证","context":"…息资源交换共享目录的具体内容，包括：政务基础信息共享目录、应用信息共享目录、数据库管理目录与政务信息采集责任公开目录。2.健全与完善政务信息资源交换共享标准规范标准规范为信息资源一致性和技术平台的互联、互通、互操作提供了基本的保证，是实现政务信息资源交换共享和规范化运行的有力支撑和可靠保障。促进政务信息资源交换共享，应围绕信息采集、组织、分类、保存、发布与使用等信息生命周期各环节建立规范和标准。政务信息资源交换共享标准规范具体包括：信息资源相关规范、技术平台对外服务…","contextPage":301}],"moduleId":"m8","order":2},"l9-1":{"id":"l9-1","title":"四个概念一条链：风险、突发事件、公共危机、应急管理","goal":"能用一条链说清四个概念的关系，按四类划分突发事件，并说明应急管理生命周期的四个阶段。","minutes":15,"tag":"第9章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"第 9 章是 618 出现频率最高的章节。它最容易失分的地方不是不知道内容，而是四个概念混着用——把风险当危机、把应急管理当救援。"},{"t":"p","h":"一条链，四个位置","text":"教材把它们串成一条因果链：\n\n**风险**是突发事件爆发前生成和发展阶段上的一种状态和可能性；\n**突发事件**是突然发生、给人们生命财产造成或可能造成危害的事件，它的生成和发展阶段一般称为风险状态；\n突发事件爆发并造成危害、使生产生活进入非常态，这个**非常态状态就是公共危机**；\n摆脱危机的各种活动就是**应急处置**，也称狭义的应急管理。\n\n所以：风险是「可能」，突发事件是「事件」，公共危机是「状态」，应急管理是「行动」。**风险与突发事件是应急管理的对象。**"},{"t":"p","h":"风险 = 概率 × 后果","text":"风险由两个因素组合而成：突发事件发生的可能性（风险概率），以及发生后产生危害后果的可能性。风险管理因此分四步：\n\n**风险识别**——查找、认识、记录风险源，输出风险源清单与风险事件情景；\n**风险分析**——分析发生的可能性与影响后果，弄清每个风险源的性质与水平；\n**风险评估**——把风险水平与预先设定的风险准则比较，确定等级与可接受程度，并综合排序；\n**风险管控**——采取措施消灭或减少风险发生的可能性，或减少损失，基本方法有风险回避、损失控制、风险转移和风险保留。"},{"t":"p","h":"突发事件分四类","text":"按发生过程、性质和机理，《突发事件应对法》把突发事件分为：**自然灾害**（水旱、气象、地震、地质、海洋、生物灾害与森林草原火灾）、**事故灾难**（工矿商贸与交通运输事故、公共设施设备事故、核与辐射事故、重大环境污染与生态破坏）、**公共卫生事件**（重大传染病疫情、群体性不明原因疾病、食品安全与动物疫情）、**社会安全事件**（重大刑事案件、恐怖事件、经济安全事件、群体性事件）。\n\n这四类正好对应应急管理体制里的「分类管理」：每一大类由相应部门负责。"},{"t":"p","h":"生命周期四阶段","text":"任何突发事件都有生成、发展、演化、爆发、衰退的过程，这构成应急管理的生命周期。按教材的划分，应急管理活动相应分为四个阶段：**突发事件爆发前**（预防准备、监测预警）、**爆发时**（应急处置与救援）、**爆发后**（善后与恢复）、**事态控制后**（调查评估与改进）。\n\n答 2026 年那道「结合生命周期分析应急管理活动」的案例题，就是把这四段各写两条具体动作，并说明阶段之间怎么传导：预警决定响应速度，处置记录又为恢复与下一轮预防提供依据。"},{"t":"ask","q":"为什么把「风险」也算作应急管理的对象，而不是只管「已经发生的事件」？","a":"因为应对的成本结构与阶段高度相关。事件爆发后，可用的时间和资源都被压缩，决策被迫变成非程序化决策；而在风险阶段，成本最低、可选方案最多。把风险纳入对象，等于把应急管理的重心前移——这也解释了为什么教材把监测预警放在机制的第一位。答题时点出「关口前移」，比罗列职能更能体现理解。"},{"t":"tip","text":"四个概念的关系是本章的「地基题」。写清楚「可能—事件—状态—行动」这一列，后面所有关于体制、机制、过程的题都能接上。"}],"concepts":[{"term":"风险","def":"突发事件发生的可能性，以及突发事件发生后造成危害结果的可能性，是两者的组合。","points":["两个因素：风险概率与危害后果可能性","风险管理四步：识别、分析、评估、管控","管控基本方法：风险回避、损失控制、风险转移、风险保留"],"exam":"「风险」本身常作背景概念，但风险管理四步是答「如何做好预防」的骨架。"},{"term":"公共危机","def":"突发事件爆发后造成一定危害、使生产生活进入的非常态状态。","points":["是状态而非事件，由突发事件诱发","与风险的差别：风险是可能性，危机是已发生的非常态","摆脱危机的活动即应急处置（狭义应急管理）"],"exam":"「公共危机管理」名解的关键，是把「非常态」三个字写出来。"}],"exercises":[{"t":"choice","q":"按教材，公共危机指的是：","opts":["突发事件发生的可能性","突发事件爆发后使生产和生活进入的非常态状态","应急处置的全过程","风险管理的结果"],"a":1,"why":"公共危机是「状态」。可能性是风险，事件是突发事件，摆脱危机的活动才是应急处置。"},{"t":"multi","q":"风险管理包括的环节有：","opts":["风险识别","风险分析","风险评估","风险管控"],"a":[0,1,2,3],"why":"四步是识别、分析、评估、管控。识别输出风险源清单，评估输出等级与优先顺序，管控才是采取动作。"},{"t":"multi","q":"按《突发事件应对法》，突发事件分为：","opts":["自然灾害","事故灾难","公共卫生事件","社会安全事件"],"a":[0,1,2,3],"why":"四类划分对应体制中的「分类管理」：每一大类由相应部门负责，重大决策仍由主要领导作出。"},{"t":"judge","q":"风险管控的基本方法包括风险回避、损失控制、风险转移和风险保留。","a":true,"why":"四种方法各有适用条件：回避最彻底但可能放弃收益，转移（如保险）不消除风险，保留适用于低概率低损失。"},{"t":"order","q":"按因果顺序排列四个概念。","items":["风险：突发事件发生与造成危害的可能性","突发事件：突然发生并造成危害的事件","公共危机：生产生活进入的非常态状态","应急处置：摆脱危机的各种活动"],"a":[0,1,2,3],"why":"这条链就是「可能—事件—状态—行动」。答概念辨析题时照这个顺序写，四个词一次说清。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「公共危机管理」的名词解释（5 分）。","minutes":6,"points":["先界定公共危机：突发事件爆发后造成危害、使生产生活进入的非常态状态","说明公共危机管理是围绕这一非常态状态开展的预防、处置、恢复等活动","点出对象包括风险与突发事件两个层面（关口前移）","写出其覆盖的阶段：爆发前、爆发时、爆发后与事态控制后","有一句边界：它不等于应急处置，后者只是狭义的理解"],"sample":"公共危机是突发事件爆发后造成一定危害、使生产和生活进入的一种非常态状态；公共危机管理则是对这一非常态状态进行预防、处置、恢复与改进的各种活动与制度的总称。其对象既包括已爆发的突发事件，也包括事件生成与发展阶段的风险，因而强调关口前移。就过程而言，它覆盖突发事件爆发前的预防准备与监测预警、爆发时的应急处置与救援、爆发后的善后恢复、事态控制后的调查评估与改进。需要注意，公共危机管理不等于应急处置，后者是摆脱危机的具体活动，属于狭义的理解。","tip":"名解里务必写「非常态状态」。只写「突发事件」会与「突发事件应对」混同，这是这道题最常见的失分点。"},"evidence":[{"src":"cai-wang-3","pages":[322],"quote":"这种非常态的状态就是公共危机","context":"…生、给人们的生命和财产造成或者可能造成一定危害的事件，突发事件的生成和发展阶段一般称为风险状态；突发事件爆发后造成了一定危害，使生产和生活进入一种非常态的状态，这种非常态的状态就是公共危机；风险、突发事件是应急管理的对象。任何突发事件都有生成、发展、演化、爆发、衰退的过程，这构成了应急管理的生命周期。风险反应的是突发事件生成和发展阶段的一种状态，突发事件爆发后，使社会进入紧急状态或非常态的状态，从而诱发公共危机。采取措施摆脱…","contextPage":322},{"src":"cai-wang-3","pages":[322],"quote":"这构成了应急管理的生命周期","context":"…了一定危害，使生产和生活进入一种非常态的状态，这种非常态的状态就是公共危机；风险、突发事件是应急管理的对象。任何突发事件都有生成、发展、演化、爆发、衰退的过程，这构成了应急管理的生命周期。风险反应的是突发事件生成和发展阶段的一种状态，突发事件爆发后，使社会进入紧急状态或非常态的状态，从而诱发公共危机。采取措施摆脱危机的各种活动就是应急处置，也称为狭义的应急管理。","contextPage":322},{"src":"cai-wang-3","pages":[323],"quote":"风险是指突发事件发生的可能性，以及突发事件发生后造成危害结果的可能性","context":"1.风险风险是指突发事件发生的可能性，以及突发事件发生后造成危害结果的可能性，是这两个方面的组合。因此，风险是由两个因素共同作用组合而成的：一是突发事件发生的可能性，即风险概率；二是突发事件发生后所产生危害后果的可能性。风险管理就包括了风险识别、风险分析、风险评估和风险管控四个方面的内容。（1）风险识别。风险识别是…","contextPage":323},{"src":"cai-wang-3","pages":[323],"quote":"突发事件是指突然发生，造成或者可能造成重大人员伤亡、财产损失、生态环境破坏和严重社会危害","context":"…控制在正常生产和生活秩序范围内的管理活动。风险管控的基本方法有：风险回避、损失控制、风险转移和风险保留。2.突发事件根据《中华人民共和国突发事件应对法》的规定，突发事件是指突然发生，造成或者可能造成重大人员伤亡、财产损失、生态环境破坏和严重社会危害，危及公共安全和社会秩序的紧急事件。按照发生过程、性质和机理，突发事件可分为以下四类，如图9-1所示：图9-1突发事件类型（1）自然灾害类突发事件：主要包括水旱灾害、气象灾害、地震灾害、地质灾害、海洋灾害、生物灾害和森林草原火灾等。（2）事…","contextPage":323}],"moduleId":"m9","order":1},"l9-2":{"id":"l9-2","title":"应急管理体制：二十个字怎么落地","goal":"能背出应急管理体制的二十字原则，逐条解释其理由，并说出体制建设要解决的三个核心问题。","minutes":16,"tag":"第9章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「统一领导、综合协调、分类管理、分级负责、属地管理为主」——这二十个字，2020、2022、2024 三年以不同问法考过。会背只是及格线，能解释每一条为什么存在才是高分。"},{"t":"p","h":"先给体制下定义","text":"**应急管理体制**是国家党政机关、企事业单位、社会组织、公众等各类主体在从事应急管理时，在机构设置、领导隶属关系、管理权限划分和运行程序等方面的职责划分、制度、方法、形式等的总称。\n\n《突发事件应对法》第四条规定：国家建立**统一领导、综合协调、分类管理、分级负责、属地管理为主**的应急管理体制。这二十个字不是口号，每一条都在解决一个具体的失灵。"},{"t":"p","h":"五条原则，五道止血","text":"**统一领导**——突发事件应对必须成立应急指挥机构统一领导。纵向实行垂直领导、下级服从上级；横向同级部门互相配合、共同服务于指挥中枢。它解决的是多头指挥。\n**综合协调**——参与主体多样（党政机关、社会组织、企事业单位、基层自治组织、公民甚至国际援助），必须综合协调人力物力财力技术信息，形成统一的信息系统、指挥系统、救援队伍系统、物资储备系统。它解决的是力量分散。\n**分类管理**——突发事件有不同类型，每一大类由相应部门管理，但重大决策必须由主要领导作出。它解决的是专业性与统一性的矛盾。\n**分级负责**——不同级别事件动用的资源不同，各级政府都要做好预警监测、信息报告、预案编制与演练。它解决的是责任不清。\n**属地管理为主**——事发地政府的迅速反应是遏制事态的关键。教材给了一个很硬的数据：**大量事故灾难类突发事件中，80% 死亡人员发生在事发最初 2 小时内**。所以地方政府是发现苗头、先行应对、防止扩散的第一责任人，必要时可越级报告。"},{"t":"cmp","h":"属地管理为主 ≠ 上级不管","head":["容易误解","准确理解"],"rows":[["属地管理为主就是把责任全压给地方","并不排斥上级政府及其有关部门的指导，也不免除发生地其他部门和单位的协同义务"],["分级负责就是级别低的不用管","各级政府都有预警监测、信息报告、预案编制与演练的义务，只是资源调配规模不同"],["分类管理就是各管一摊、互不通气","分类管理是在集中统一指挥体制之下实行的，重大决策仍由主要领导作出"]]},{"t":"p","h":"体制建设要解决三个核心问题","text":"**一、明确指挥关系**：建立规格高、有权威的应急管理指挥机构，划清各机构职责，明确纵向与横向关系。\n**二、明确管理流程**：设定一整套响应程序，形成运转高效、反应快速、规范有序的处置行动管理。\n**三、明确管理责任**：通过组织、资源、信息、业务与行动五个整合，形成统一的责任体系。\n\n为适应这些要求，体制应包括监测预警体制、信息管理体制、决策指挥体制、组织协调体制、行动响应体制、处置救援体制、社会动员体制等。"},{"t":"ask","q":"为什么要强调「属地管理为主」，而不是「分级管理为主」？","a":"因为时间不站在上级这边。事件发生的最初两小时是伤亡最集中的窗口，等上级判断、批示、派人，窗口已经过去。属地管理为主把「第一反应权」和「第一责任」同时交给事发地，让它不必等指令就能处置。而分级负责解决的是「资源规模」——大事件才需要更高层级的力量。两者一个是时间逻辑，一个是能力逻辑，不能互相替代。"},{"t":"tip","text":"答「公共危机管理体制的内容」时，按「定义 + 二十字 + 每条一句理由 + 三个核心问题」写，10 分能拿满；只写二十字不解释，通常只有 5—6 分。"}],"concepts":[{"term":"应急管理体制","def":"各类主体在应急管理时于机构设置、领导隶属关系、管理权限划分和运行程序等方面的职责划分、制度、方法、形式的总称。","points":["二十字原则：统一领导、综合协调、分类管理、分级负责、属地管理为主","三个核心问题：明确指挥关系、管理流程、管理责任","体制构成：监测预警、信息管理、决策指挥、组织协调、行动响应、处置救援、社会动员"],"exam":"2020、2022、2024 三年反复考。二十字必须一字不差。"},{"term":"属地管理为主","def":"以突发事件发生地政府为发现苗头、预防发生、先行应对、防止扩散的第一责任人，并赋予其统一实施应急处置的权力。","points":["依据：大量事故中 80% 死亡人员发生在事发最初 2 小时内","地方须及时如实上报，必要时可越级报告","不排斥上级指导，也不免除其他单位的协同义务"],"exam":"论述题里用来解释「为什么要给基层授权」。"}],"exercises":[{"t":"choice","q":"我国应急管理体制的二十字原则是：","opts":["统一领导、综合协调、分类管理、分级负责、属地管理为主","统一指挥、分级负责、条块结合、以块为主、社会参与","党委领导、政府负责、社会协同、公众参与、法治保障","集中领导、统一调度、专业处置、社会动员、属地负责"],"a":0,"why":"B、C 是其他语境下的表述（C 是社会治理体制），容易混。应急管理体制的二十字必须记准。"},{"t":"choice","q":"强调「属地管理为主」的直接依据是：","opts":["地方政府人员更多","事发最初 2 小时内伤亡最集中，需要事发地政府迅速反应","上级政府不熟悉情况","便于追究地方责任"],"a":1,"why":"教材给出的数据是「80% 死亡人员发生在事发最初 2 小时内」。这是时间逻辑，不是权力逻辑。"},{"t":"multi","q":"应急管理体制建设所要解决的核心问题包括：","opts":["明确指挥关系","明确管理流程","明确管理责任","明确突发事件的媒体口径"],"a":[0,1,2],"why":"三个核心问题是指挥关系、管理流程、管理责任。媒体应对属于机制层面的信息发布与沟通，不在体制的核心问题之列。"},{"t":"judge","q":"实行属地管理为主，就意味着上级政府不再对事发地应对工作作出指导。","a":false,"why":"教材明确：属地管理为主并不排斥上级政府及其有关部门的指导，也不能免除发生地其他部门和单位的协同义务。"},{"t":"order","q":"把「突发事件发生后为什么必须统一指挥」的推理排好。","items":["突发事件涉及不同部门与不同行政区域","分散的、部门化的管理难以适应应急要求","统一指挥便于快速决策与调动资源、减少推诿","因此要建立规格高、有权威的指挥机构"],"a":[0,1,2,3],"why":"这条链来自教材对「建立统一指挥体制」的论述，是答「为什么要统一领导」的标准展开。"}],"write":{"type":"简答题","prompt":"用 13 分钟写「我国公共危机管理体制的内容」（10 分）。","minutes":13,"points":["给出定义：各类主体在机构设置、领导隶属、权限划分与运行程序上的职责划分与制度总称","写出二十字原则，一字不差","统一领导：成立指挥机构，纵向垂直领导、横向协同服务指挥中枢","综合协调：整合人力物力财力技术信息，形成统一的系统","分类管理：按四类突发事件由相应部门负责，重大决策由主要领导作出","分级负责：各级都有预警监测、报告、预案与演练义务；属地管理为主：事发地是第一责任人","收束：体制要解决明确指挥关系、管理流程、管理责任三个核心问题"],"sample":"应急管理体制是国家党政机关、企事业单位、社会组织、公众等各类主体在从事应急管理时，在机构设置、领导隶属关系、管理权限划分和运行程序等方面的职责划分、制度、方法、形式等的总称。我国建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制。统一领导要求成立应急指挥机构统一领导，纵向垂直领导、下级服从上级，横向各部门互相配合、共同服务于指挥中枢；综合协调要求在统一领导下整合人力、物力、财力、技术与信息，形成统一的信息系统、指挥系统、救援队伍系统与物资储备系统；分类管理要求按自然灾害、事故灾难、公共卫生事件、社会安全事件四类分别由相应部门管理，重大决策由主要领导作出；分级负责要求各级政府履行预警监测、信息报告、预案编制与演练等义务；属地管理为主则明确事发地政府是发现苗头、先行应对、防止扩散的第一责任人，必要时可越级报告。体制建设还要解决三个核心问题：明确指挥关系、明确管理流程、明确管理责任。","tip":"二十字之后，每条至少配一句「它解决什么问题」。只把二十字拆成五段重复，拿不到解释分。"},"evidence":[{"src":"cai-wang-3","pages":[328],"quote":"国家建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制","context":"…各类主体在从事应急管理时在机构设置、领导隶属关系、管理权限划分和运行程序等方面的职责划分、制度、方法、形式等的总称。《中华人民共和国突发事件应对法》第四条规定：国家建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制，如图9-4所示。图9-4应急管理体制结构图应急管理体制的确立涉及一个国家或地区的政治、经济、自然、社会等多方面因素，而且随着人类社会的进步和应对突发事件能力的提高而不断变化和调整。在我国，应急","contextPage":328},{"src":"cai-wang-3","pages":[329],"quote":"必须明确地方政府是发现突发事件苗头、预防发生、先行应对、防止扩散","context":"…突发事件发生、发展的关键。大量的事故灾难类突发事件统计表明，80\\%死亡人员发生在事发最初2小时内，是否在第一时间实施有效救援，决定着突发事件应对的关键。因此，必须明确地方政府是发现突发事件苗头、预防发生、先行应对、防止扩散（引发、衍生新的突发事件）的第一责任人，赋予其统一实施应急处置的权力。出现重大突发事件，地方政府必须及时、如实向上级报告，必要时可以越级报告。实行属地管理为主，让地方政府能迅速反应、及时处理，是适应反应灵敏的应急管理机制的必然要求。当然，属…","contextPage":329},{"src":"cai-wang-3","pages":[330],"quote":"应急管理体制建设所要解决的核心问题是","context":"参与和相互合作，形成统一指挥、分工协作的应急管理组织结构，是建立高度组织化的应急管理体系、加强应急管理的需要。应急管理体制建设所要解决的核心问题是：第一，明确指挥关系，按照统一指挥、分工协作、协调行动的要求，建立一个规格高、有权威的应急管理指挥机构，合理划分各相关机构的职责，明确指挥机构和应急管理各相关机构之间的纵向关系，以及各机构之间的横向关系；第二，明确管理流程，合理设定一整套应…","contextPage":330}],"moduleId":"m9","order":2},"l9-3":{"id":"l9-3","title":"预警与法制：把危机挡在爆发之前","goal":"能说出监测预警的五个环节与四个组成部分，解释「预警为什么必须是可行动的」，并复述应急管理法制的五个特点。","minutes":16,"tag":"第9章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2021 年名解考「公共危机预警」，2023 年论述考「公共危机预警机制的主体系统」。预警是这一章最容易被写成「发个警报」的考点。"},{"t":"p","h":"预警不只是「发警报」","text":"监测预警机制包含五个环节：**信息收集与分析**（建立可靠的信息基础）、**风险预报**（研判风险类型、等级、范围与危害程度，必要时建议发出警报）、**风险监测**（确认事件发生后严密监测特征性信息与演化趋势）、**信息发布与媒体管理**（及时、准确、全面、客观发布，减少流言）、**信息沟通**（与利益相关者和相关部门沟通，对抗性事件中还要建立谈判渠道）。\n\n教材有一句判断标准特别值得记：**只有当危机反应者和潜在受害者在接到警报后、在事件发生之前做出有效的预防和准备，预警才是有效的。** 也就是说，预警的效果不取决于发没发，取决于收没收到、动没动。"},{"t":"p","h":"一个完整的预警机制有四块","text":"**一、监测系统**：目的是及时发现征兆、把握诱因与趋势。预警流程是「收集分析信息 → 与临界点比较 → 决定是否报警 → 发出警报」，下设信息收集、信息加工、决策、警报四个子系统。\n**二、咨询系统**：定期沟通信息、提供研究报告、提出处置建议。专家与智囊团的作用在复杂专业领域难以替代，是决策民主化科学化的重要条件。\n**三、组织网络**：专门的机构与人员、规范化的监测防范体系、畅通准确的信息沟通渠道。\n**四、法规体系**：规定预警机构有获取信息的权利，相关部门有提供真实信息的义务，并体现激励奖惩作用。"},{"t":"p","h":"应急管理法制：非常态下的法治","text":"**应急管理法制**属于非常态法制，是针对突发事件引起的公共紧急情况制定或认可的处理国家权力之间、国家权力与公民权利之间、公民权利之间各种社会关系的法律规范与原则的总和。它的基本功能是在危机状态下保障社会恢复正常秩序，维护和平衡社会公共利益与公民合法权益。\n\n五个特点是简答的骨架：**内容与对象上的综合性、边缘性**（危机成因多样、形式多样、性质各异）；**适用上的临时性和预备性**（调整的是社会非常态）；**实施过程具有很强的行政紧急性**（行政紧急权力具有优先性，可限制或中止某些法定公民权利）；**立法目的上更强调对权利的保障**（紧急状态下权力更易滥用，公民权利更易受侵害）；**法律制裁具有更大的严苛性**（危机情形下违法后果更严重，处罚须更重）。"},{"t":"ask","q":"行政紧急权力可以限制公民权利，那它凭什么不算「法治的例外」？","a":"因为它本身就是法律授予的，而且要接受法律的约束：权力来源法定、行使条件法定、程序法定、事后可救济。教材的表述是——现代政府需要依法授予「紧急权力」，但紧急权力同样受到紧急状态法的严格制约。同时正因为紧急权力有侵害性，应急法制才更强调对公民权利的保障。答这类题时把这四点（来源、条件、程序、救济）写出来，就不会停留在「特殊情况特殊处理」的层面。"},{"t":"tip","text":"「公共危机预警机制的主体系统」这类题，按「谁监测—谁咨询—谁决策—谁发布—谁行动」列主体，再说明主体之间的信息流，比抽象谈「完善机制」实在。"}],"concepts":[{"term":"公共危机预警","def":"通过监测、预报、信息发布与沟通等环节，在事件发生前识别风险并向反应者与潜在受害者发出警报的活动。","points":["五个环节：信息收集与分析、风险预报、风险监测、信息发布与媒体管理、信息沟通","四个组成部分：监测系统、咨询系统、组织网络、法规体系","有效性标准：接收者能在事件发生前做出预防与准备"],"exam":"2021 年名解原题；2023 年论述考其主体系统。"},{"term":"应急管理法制","def":"针对突发事件引起的公共紧急情况，处理国家权力之间、国家权力与公民权利之间、公民权利之间各种社会关系的法律规范与原则的总和。","points":["属于非常态法制，是国家法律体系的重要组成部分","五特点：综合性与边缘性、临时性与预备性、行政紧急性、更强调权利保障、制裁更严苛","功能：恢复正常秩序，平衡公共利益与公民合法权益"],"exam":"答「应急管理法制与常态法制有何不同」时，五个特点逐条对照写。"}],"exercises":[{"t":"multi","q":"监测预警机制主要包括：","opts":["监测系统","咨询系统","组织网络","法规体系"],"a":[0,1,2,3],"why":"四块缺一不可：监测负责发现，咨询负责判断，组织网络负责落地，法规体系负责授权与约束。"},{"t":"choice","q":"判断预警是否有效，教材给出的标准是：","opts":["是否及时发布了警报","警报是否覆盖全部人口","反应者与潜在受害者是否在事件发生前做出有效的预防和准备","是否使用了大数据技术"],"a":2,"why":"预警的效果不取决于发出，而取决于接收与行动。这一条也是批评「形式主义预警」最有力的依据。"},{"t":"judge","q":"应急管理法制属于非常态法制，其立法目的更强调对公民权利的保障。","a":true,"why":"因为在紧急状态下权力更易被滥用、公民权利更易受侵害，所以应急法制反而要更强调权利保障——这与「紧急状态可以牺牲权利」的直觉相反。"},{"t":"multi","q":"应急管理法制的特点包括：","opts":["内容和对象上的综合性、边缘性","适用上的临时性和预备性","实施过程具有很强的行政紧急性","法律制裁具有更大的严苛性"],"a":[0,1,2,3],"why":"四个都在，第五条是「立法目的上更强调对权利的保障」。五个特点正好拼成一道 10 分简答。"},{"t":"order","q":"按预警流程排列四个环节。","items":["收集与分析监测信息","与风险预警临界点比较","决策是否发出警报及级别","向反应者与潜在受害者发出警报"],"a":[0,1,2,3],"why":"这条流程对应监测系统的四个子系统：信息收集、信息加工、决策、警报。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「公共危机预警机制的主要内容」（10 分）。","minutes":12,"points":["先界定预警：在事件发生前识别风险并发出警报，使反应者能预防准备","写出五个环节（信息收集与分析、风险预报、风险监测、信息发布与媒体管理、信息沟通）","写出监测系统：预警流程与四个子系统（收集、加工、决策、警报）","写出咨询系统：专家与智囊团提供研判与建议","写出组织网络：专门机构与人员、规范化监测体系、畅通的信息渠道","写出法规体系：信息获取权利与提供义务、激励奖惩","收束：预警是否有效，取决于接收者能否在事件发生前行动"],"sample":"公共危机预警是指通过监测、预报、信息发布与沟通等环节，在事件发生之前识别风险并向危机反应者和潜在受害者发出警报的活动。其内容包括五个环节：信息收集与分析、风险预报（研判风险类型、等级、范围与危害程度）、风险监测（监测特征性信息与演化趋势）、信息发布与媒体管理（及时准确全面客观发布，减少流言）、信息沟通（与利益相关者和相关部门沟通，对抗性事件中建立谈判渠道）。完善的预警机制包括四个部分：一是监测系统，按收集分析信息、与临界点比较、决策报警、发出警报的流程运行，下设信息收集、信息加工、决策与警报四个子系统；二是咨询系统，由专家与智囊团提供研究报告与处置建议；三是组织网络，包括专门机构与人员、规范化的监测防范体系、畅通准确的信息渠道；四是法规体系，规定预警机构获取信息的权利与相关部门提供真实信息的义务，并体现激励奖惩作用。预警是否有效，取决于反应者是否能在事件发生前做出有效的预防和准备。","tip":"「五个环节 + 四个组成部分」是这道题的双层结构，两层都要写。只写四块会缺过程，只写环节会缺支撑。"},"evidence":[{"src":"cai-wang-3","pages":[334],"quote":"完善的监测预警机制主要包括：监测系统、咨询系统、组织网络和法规体系","context":"…件的处理中，信息沟通包括两个方面：一是建立冲突双方之间的谈判沟通渠道，增进交流沟通，减少误解；二是洞悉对方的动机、实力和决心，有针对性地拟订有效的危机处理方案。完善的监测预警机制主要包括：监测系统、咨询系统、组织网络和法规体系。（1）监测预警的监测系统。建立监测系统的主要目的是及时发现危机征兆，准确把握危机诱因、未来发展趋势和演变规律。应用大数据等现代科学技术，实现监测的科学性、精准性非常重要。公共危机预警流程如图9-7所示。图9-7监测预警流程监测预警流程包括…","contextPage":334},{"src":"cai-wang-3","pages":[335],"quote":"只有当危机反应者和潜在受害者在接到警报信息后，在事件发生之前做出有效的预防和准备，预警才是有效的","context":"…子系统发出指令。第四，警报子系统。该系统的任务是当监测结果显示社会中有冲突或危机的征兆时，立即向危机反应者和潜在受害者发出明确无误的警报，使他们采取正确的措施。只有当危机反应者和潜在受害者在接到警报信息后，在事件发生之前做出有效的预防和准备，预警才是有效的。在大数据时代，为了提高公共危机监测预警的精准性，应采用大数据技术与方法，通过强化数据之间的内在关联来提高预警决策的能力。（2）监测预警的咨询系统。公共危机预警的咨询系统主要承担的功能是定期沟通信息，提供与危机有关的研究报告，提出危机处置的…","contextPage":335},{"src":"cai-wang-3","pages":[343],"quote":"应急管理法制属于非常态法制","context":"…制是事发、事中和事后的突发事件应对全过程涉及的法律、行政法规及相关制度，各领域的应急管理法制如图9-8所示。图9-8应急管理相关法制1.应急管理法制的含义和特点应急管理法制属于非常态法制，是针对突发事件引起的公共紧急情况制定或认可的处理国家权力之间、国家权力与公民权利之间、公民权利之间的各种社会关系的法律规范和原则的总和。作为预防、控制、处置危机的法律手段，应急管理法制是整个国家法律体系的重要组成部分，是一个国家或地区在非…","contextPage":343},{"src":"cai-wang-3","pages":[344],"quote":"常态法制要保护权利，应急管理法制更需要强调对公民权利的保障","context":"政令、措施和决策。这一特性，不言而喻地存在着对公民权利造成严重伤害的可能性①。（4）立法目的上更强调对权利的保障。常态法制要保护权利，应急管理法制更需要强调对公民权利的保障。因为，在紧急状态下比在常态下权力更容易被滥用，公民权利更容易受到紧急权力的侵害。因此，各国的应急法律都强调对公民权利的保障。（5）法律制裁具有更大的严苛性。应急管理法律是针对突发事件对社会的高度破坏性和对公众利益的严重损害性而制定的，它调…","contextPage":344}],"moduleId":"m9","order":3},"l10-1":{"id":"l10-1","title":"政府工具箱：市场化工具与工商管理技术","goal":"能解释民营化、用者付费、合同外包、内部市场、放松管制、产权交易各自解决什么问题，并说出全面质量管理与 PDCA 的四阶段。","minutes":17,"tag":"第10章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"近四年的名解几乎全从这一节出：2021「内部市场」、2022「用者付费」、2024「凭单制」、2025「特许经营」、2026「全面质量管理」。这些词看着散，其实是一套工具箱。"},{"t":"p","h":"总纲：民营化及其两种方式","text":"**民营化**是这一整套工具的母题，指把国有企业和垄断行业向私人部门开放。它有两种方式：一是**向公众出售股份**，实现国有企业撤资；二是通过**特许投标、合同承包**，鼓励私人部门提供可市场化的公共产品与公共服务。\n\n民营化的好处是缩小公共部门规模、短期减轻财政支出、放松管制、把竞争机制引入公共部门。但它有制约条件：要选准可民营化的领域，不能盲目推行；还要加强对民营化之后经营行为的监督，以维护公共秩序和社会公平。\n\n教材引萨瓦斯的分类，把民营化形式分为**委托授权、政府撤资、政府淡出**三类。合同承包、特许经营、补助、凭单、法令委托都属于「委托授权」——这就是为什么凭单制和特许经营在名解里总被放在一起。"},{"t":"cmp","h":"五个工具，各治一种病","head":["工具","做法","它治什么病"],"rows":[["用者付费","把价格机制引入公共服务，对部分服务收费","免费导致的需求虚高、资源浪费与无目的补贴"],["合同外包","把民事合同引入公共管理，政府定需求、按合同监督绩效","政府自办成本高、服务水平低、规模过大"],["内部市场","把提供服务的公共部门人为划为生产者与购买者，形成「公对公的竞争」","内部缺乏竞争、效率越高越亏损"],["放松管制","在市场机制可发挥作用的行业，完全或部分取消价格与市场进入管制","管制过度束缚企业活力、管制成本上升"],["产权交易","明晰与重组产权（使用权、收益权、占有权、处分权），允许交易","过度使用与外部性，如过度捕捞、排污"]]},{"t":"p","h":"内部市场的一个经典例子","text":"英国公费医疗拨款制度改革：政府把原来给医院的大部分款项拨给家庭医生；医院的手术与住院服务明码标价；家庭医生与病人协商选择医院，再从自己的预算中向医院付费。\n\n结果是：在不影响公众免费医疗权利的前提下，彻底改变了「医院效率越高越容易亏损」的局面，迫使医院提高质量、降低价格来争取「顾客」。这个例子说明内部市场的关键在于**让付钱的一方与用服务的一方对上**。"},{"t":"p","h":"工商管理技术：全面质量管理","text":"**全面质量管理（TQM）**是以质量为中心、以全员参与为基础，通过让顾客满意和让本组织所有成员及社会受益而达到长期成功的管理途径。它的特点是：**对象的全面管理、全过程的管理、全员的管理、全面运用各种管理方法、提高全社会的效益**。\n\n落地方法是戴明提出的 **PDCA 循环**：**P** 计划（分析质量现状、找出问题与主因、拟订措施）；**D** 执行（按计划完成作业）；**C** 检查（对比计划检查结果、确定问题）；**A** 处理（剖析原因、采取措施）。任何部门、任何阶段都存在 PDCA，不断循环就是质量上升的过程。"},{"t":"ask","q":"合同外包和内部市场都在讲「竞争」，差别在哪？","a":"竞争发生在哪儿不同。合同外包是把服务交给**外部**市场主体，通过竞争性招标选择承包方，政府从「生产者」变成「购买者与监督者」；内部市场是在**公共部门内部**人为切出生产者与购买者两方，形成「公对公的竞争」，服务的公共属性与免费权利不变。前者动的是边界，后者动的是内部激励。答题时点出「边界 vs 内部」，两个概念就不会混。"},{"t":"tip","text":"名解这类工具，写三件事就够：一句定义、一句它解决什么问题、一句它的局限。例如用者付费要补一句「对基本权利类服务可能排斥低收入者」。"}],"concepts":[{"term":"用者付费","def":"把价格机制引入公共服务，对一些公共服务采取收费方式的管理工具。","points":["优点：显示真实需求、抑制浪费、纠正无目的补贴、让价格起信号作用、增加财政收入","风险：对基本服务收费可能排斥低收入者","应用：自来水、电力、垃圾收集、道路桥梁等"],"exam":"2022 年简答原题问「什么是用者付费？该工具优点？」——优点要写足三条以上。"},{"term":"内部市场","def":"把提供公共服务的公共部门人为划分为生产者与购买者两方，形成「公对公的竞争」。","points":["应用范围在市场化工具中较窄","典型例：英国公费医疗拨款改革","改变「效率越高越亏损」的局面，倒逼质量与价格"],"exam":"2021 年名解原题。关键是「公对公」三个字。"},{"term":"全面质量管理","def":"以质量为中心、以全员参与为基础，通过让顾客满意并使组织成员与社会受益而达到长期成功的管理途径。","points":["五个特点：对象全面、全过程、全员、全面方法、全社会效益","方法：戴明 PDCA 循环（计划、执行、检查、处理）","作用：改进公共管理、提高服务质量、改善部门形象"],"exam":"2026 年名解原题。写「定义 + 五特点 + PDCA」即可满分。"}],"exercises":[{"t":"multi","q":"按萨瓦斯的分类，下列属于「委托授权」类民营化形式的有：","opts":["合同承包","特许经营","凭单","出售股份"],"a":[0,1,2],"why":"合同承包、特许经营、补助、凭单、法令委托都属于委托授权；出售股份属于政府撤资。"},{"t":"choice","q":"内部市场与合同外包的关键区别是：","opts":["是否收费","竞争发生在公共部门内部还是外部市场","是否涉及公共服务","是否需要政府监督"],"a":1,"why":"内部市场是「公对公」的内部竞争，服务的公共属性不变；合同外包是把服务交给外部主体，政府转为购买者与监督者。"},{"t":"multi","q":"用者付费的优点包括：","opts":["有利于公众显示对公共服务的真实需求","克服免费提供导致的不合理配置与浪费","使价格起到信号灯作用，让市场机制在公共服务领域应用","增加公共财政收入，缓和财政危机"],"a":[0,1,2,3],"why":"四条都在教材列举的优点里（第五条是纠正无目的的补贴与资助）。答这道题按点写即可。"},{"t":"choice","q":"PDCA 循环中「C」指的是：","opts":["计划制订","计划执行","执行结果检查","问题处理"],"a":2,"why":"P 计划、D 执行、C 检查、A 处理。四个阶段的顺序与含义都要记准，考名解时常被追问。"},{"t":"judge","q":"民营化可以无条件推行，只要能减轻财政负担。","a":false,"why":"教材强调要注重民营化的制约因素、选准可民营化的领域，并加强对民营化之后经营行为的监督，以维护公共秩序与社会公平。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「用者付费」的名词解释（5 分）。","minutes":6,"points":["定义：把价格机制引入公共服务，对部分公共服务采取收费方式","说明它改变的是需求表达与资源配置，而不只是增加收入","写出至少三条优点（显示真实需求、抑制浪费、纠正无目的补贴、价格信号、增加财政收入）","指出适用条件：受益者较明确、使用可计量、可排他","补一句局限：对基本权利类服务可能排斥低收入者"],"sample":"用者付费是指通过把价格机制引入公共服务之中，对一些公共服务采取收费方式的管理工具。其优点在于：有利于公众显示对公共产品和服务的真实需求，有效配置资源并提高服务质量；能够克服免费提供公共服务所导致的对资源的不合理配置与浪费；避免无偿提供带来的无目的补贴与资助，减少对社会公平的损害；使价格真正起到信号灯作用，让市场机制在公共服务领域得到有效应用；还可以增加公共财政收入，缓和财政危机。它适用于受益者较明确、使用可计量且可排他的服务；对基本权利类服务则需设置减免，避免排斥低收入者。","tip":"2022 年这道题问的是「优点」，所以优点必须写足。只写定义不展开优点，5 分里最多拿 2 分。"},"evidence":[{"src":"cai-wang-3","pages":[371],"quote":"用者付费就是通过把价格机制引入公共服务之中，对一些公共服务采取收费的方式","context":"10.2.1.2用者付费用者付费就是通过把价格机制引入公共服务之中，对一些公共服务采取收费的方式。用者付费工具有如下优点：一是有利于公众显示对公共产品和服务的真实需求，有效配置资源和提高服务质量；二是能够克服免费提供公共服务所导致的对资源的不合理配置和浪费；三是无偿提供公共服务将导致无目的的补贴和资助，对社会公平造成损害；四是可以使价…","contextPage":371},{"src":"cai-wang-3","pages":[371],"quote":"合同外包把民事行为中的合同引入公共管理的领域中来","context":"…务领域得到广泛应用。在法国，城市间的公路由私人投资、建造、拥有、管理和保养，向使用者收费。在我国，许多公共服务领域也推行了用者付费制度。10.2.1.3合同外包合同外包把民事行为中的合同引入公共管理的领域中来，它以合同双方当事人协商一致为前提，变过去单方面的强制行为为一种双方合意的行为。政府与其他组织一样都以平等主体的身份进入市场。政府的职责是确定需要什么，然后依照所签订的合同监督绩效。合同外包被认为既能提高服务水平又能缩小政府规模，是降低成本…","contextPage":371},{"src":"cai-wang-3","pages":[374],"quote":"内部市场是将提供公共服务的公共部门人为地划分为生产者和购买者两方","context":"…修正的《清洁空气法》允许每一个企业排放不超过一定量的二氧化硫，但该法案允许一个排放量少于许可限度的公司出售未用完的许可限度给另一家公司。10.2.1.9内部市场内部市场是将提供公共服务的公共部门人为地划分为生产者和购买者两方以形成“公对公的竞争”，这在政府组织内部便产生了“生产者”和“消费者”两个角色，促使内部组织之间进行竞争，达到提高服务质量的目的。英国、新西兰、瑞典等是应用这种","contextPage":374},{"src":"cai-wang-3","pages":[375],"quote":"就是以质量为中心、以全员参与为基础","context":"…系中通过诸如质量策划、质量控制、质量保证和质量改进，使组织实施其全部管理职能的所有活动”②。全面质量管理（totalqualitymanagement，TQM）就是以质量为中心、以全员参与为基础，通过让顾客满意和本组织所有成员及社会受益而达到长期成功的管理途径③。全面质量管理的特点是：对象的全面管理、全过程的管理、全员的管理、全面运用各种管理方法和提高全社会的效益④。全面质量管理有助于改进公共管理、提高服务质量和改善公共部门的形象…","contextPage":375},{"src":"chen-2","pages":[204],"quote":"可以粗略地将当代政府治理中常用的工具分为市场化工具、工商管理技术和社会化手段三类","note":"两书的三分法完全一致；陈把每类工具逐个讲了市场逻辑，案例题给建议时用它的细节。","context":"…具及工商管理技术。凡是那些在某一方面具有明显市场特征（如价格、利润、私有产权、金钱诱因、自由化等）的方式、方法和手段，都是市场机制的反映，都可以称为市场化工具。可以粗略地将当代政府治理中常用的工具分为市场化工具、工商管理技术和社会化手段三类。6.3.1市场化工具1.民营化民营化有时被用作市场化的同义语。民营化是指将原先由政府控制或拥有的职能交由企业私方承包或出售给私方，通过市场的作用，依靠市场的力量来提高生产力，搞活国营企业。其中最典型的做法是将国营公司一半以上的股票出售给私…","contextPage":204}],"moduleId":"m10","order":1},"l10-2":{"id":"l10-2","title":"战略管理：公共部门的战略为什么不能照搬企业","goal":"能列出公共部门与私人部门战略管理的主要差异，并解释「公共性」为什么是根本性质。","minutes":15,"tag":"第10章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2025 年简答考「结合实际论述公共部门战略管理的性质」。这道题的答案不在「战略」两个字上，而在公共部门与私人部门的差别上。"},{"t":"p","h":"先给结论：性质是公共性","text":"教材的推理很短也很硬：公共部门引入战略管理的实践只是**管理方式上的变革**，并没有影响公共部门的性质；而公共部门与私人部门战略管理之所以存在一系列差异，最主要的原因在于**公共管理是运用公共权力进行的管理**。所以——**公共部门战略管理的性质是公共性的。**\n\n反过来看：**私人部门战略的性质是自利性的**，其产生与存在的目的是追求自身利益最大化；公共部门战略的性质是公共性的，其产生与存在是为了公共利益、公共目标、公共服务以及创造具有公益精神的意识形态。"},{"t":"cmp","h":"八个差异（论述的肉）","head":["因素","私人部门","公共部门"],"rows":[["制约","自主、灵活，只受法律与内部多数人意见限制","授权与义务限制自主性，还要维持资金来源渠道"],["所有权","属于股东，利益相关者很少","利益相关者众多，每个公民都可能是"],["公众审查","可隐蔽进行、保密","要受公众审查，并寻找让外界参与和检查的途径"],["目标","清楚、上下一致，最关注效率与利润","长短期目标不断变化且难界定，关注效率但更关注公平"],["行动空间","战略管理者控制资源，行动限制少","受机构管理与有限权力约束，要辨明和管理所需资源"],["绩效期望","目标清楚稳定，带来紧迫感","目标模糊且不断变化，受政治影响大，要主动创造紧迫感"],["激励","以金钱激励为主","难以实施个人成就激励，靠稳定工作、角色与战略参与"],["影响范围","社会影响范围较小","社会影响范围广泛"]]},{"t":"p","h":"另外两条性质","text":"教材还给了两条展开：**一是追求的目标是创造公共价值、实现公共利益**——所以战略的成败不能只用效率衡量，要看是否增进了公共价值；**二是内容和过程与其特殊的背景结合在一起**——公共部门的战略议程受政治周期、法律授权、预算周期与舆论环境共同塑造，不能脱离背景谈最优方案。\n\n把这三条连起来，就是这道论述题的完整骨架：根本性质（公共性）→ 追求目标（公共价值）→ 内容与过程（嵌入特殊背景）。"},{"t":"ask","q":"既然是「战略管理」，为什么公共部门的目标反而更模糊？","a":"因为目标的确定权被分散了。企业的目标由所有者设定，可以写成利润；公共部门的目标要经过政治过程形成，多个利益相关者同时在场，每个公民都可能是利益相关者，于是目标必然是多重的、含混的、随政治周期变化的。这不是管理能力差，而是公共性的必然结果。所以教材说公共部门战略管理要「创造紧迫感、明确绩效目标」——那是在对抗这种结构性模糊。"},{"t":"tip","text":"「性质」类论述题，最忌讳只写「公共性」三个字。写成「性质是公共性 → 因为在用公共权力 → 所以八个方面都不同 → 因此目标与评价标准也不同」，才是论述。"}],"concepts":[{"term":"公共部门战略管理的性质","def":"公共部门战略管理在性质上是公共性的：它以公共权力为基础，为公共利益、公共目标与公共服务而存在。","points":["根本性质是公共性；私人部门战略是自利性的","追求目标是创造公共价值、实现公共利益","内容和过程与特殊背景（政治、法律、预算、舆论）结合"],"exam":"2025 年简答原题。三条分述 + 与私人部门的对比 = 满分。"},{"term":"战略管理","def":"围绕组织长期方向与目标，对环境的判断、战略选择与实施进行系统管理的活动。","points":["特征：关注长期、整体与环境适应","公共部门应用战略管理只是管理方式的变革","难点：目标模糊、利益相关者众多、行动空间受限"],"exam":"常与「公共部门战略管理的现实价值」一起考。"}],"exercises":[{"t":"choice","q":"教材认为公共部门战略管理的根本性质是：","opts":["效率性","公共性","竞争性","自利性"],"a":1,"why":"私人部门战略的性质是自利性的，公共部门是公共性的。这一句是整道论述题的题眼。"},{"t":"multi","q":"公共部门与私人部门战略管理的差异体现在：","opts":["利益相关者众多，每个公民都可能是","要受公众审查，需寻找外界参与和检查的途径","目标长短期不断变化、难以界定，更关注公平","绩效目标清楚稳定，因而天然具有紧迫感"],"a":[0,1,2],"why":"D 说反了：公共部门绩效目标模糊且不断变化、受政治影响大，所以战略管理要主动「创造紧迫感」。"},{"t":"judge","q":"公共部门引入战略管理改变了公共部门的性质。","a":false,"why":"教材明确：公共部门引入战略管理的实践只是管理方式上的变革，并没有影响到公共部门的性质。"},{"t":"choice","q":"公共部门与私人部门战略管理存在差异，最主要的原因是：","opts":["公共部门人员素质不同","公共管理是运用公共权力进行的管理","公共部门预算更少","私人部门不重视战略"],"a":1,"why":"教材把根本原因归到「公共管理是运用公共权力进行的管理」。答题时先给这条原因，再展开差异，逻辑才完整。"},{"t":"order","q":"把「公共部门为什么要单独讲战略管理」的论证排好。","items":["公共部门与私人部门在授权、审查、目标、激励等方面存在系统差异","差异的根本原因是公共管理运用公共权力","因此公共部门战略管理的性质是公共性的","所以其目标与评价标准不能照搬企业"],"a":[0,1,2,3],"why":"这条链正是论述题的标准推进方式：先摆差异，再给原因，最后落到性质与评价标准。"}],"write":{"type":"论述题","prompt":"用 18 分钟写「公共部门战略管理的性质」（20 分）。要求：结论 → 根本性质 → 目标 → 内容与过程 → 评价。","minutes":18,"points":["先给结论：性质是公共性的，引入战略管理只是管理方式的变革","给出原因：公共管理是运用公共权力进行的管理","对比：私人部门战略的性质是自利性的，追求自身利益最大化","展开差异：制约、所有权与利益相关者、公众审查、目标、行动空间、绩效期望、激励等","第二条：追求目标是创造公共价值、实现公共利益","第三条：内容和过程与特殊的政治、法律、预算、舆论背景结合","评价：因此不能照搬企业战略，衡量标准也不能只看效率"],"sample":"公共部门战略管理的性质是公共性的。公共部门引入战略管理的实践只是管理方式上的变革，并没有改变公共部门的性质；而公共部门与私人部门战略管理之所以存在一系列差异，最主要的原因在于公共管理是运用公共权力进行的管理。相比之下，私人部门战略的性质是自利性的，其产生和存在是为了追求自身利益最大化。具体差异表现在：公共部门受到授权与义务的制约，自主性与灵活性较小；利益相关者众多，每个公民都可能是；战略的制订与实施要接受公众审查并主动开放参与渠道；目标长短期不断变化且难以界定，关注效率但更关注公平；战略管理者行动空间有限，需辨明和管理所需资源；绩效目标模糊且受政治影响大，因而要主动创造紧迫感；难以实施基于个人成就的激励。由此，公共部门战略管理追求的目标是创造公共价值、实现公共利益，其内容和过程也与特殊的政治、法律与预算背景结合在一起。因此，公共部门战略管理不能照搬企业模式，衡量其成败的标准也不能只是效率。","tip":"20 分要写得「有对比」。只讲公共部门如何，阅卷看不到差异；把私人部门那一列也写出来，性质才立得住。"},"evidence":[{"src":"cai-wang-3","pages":[384],"quote":"公共部门战略管理的性质是公共性的","context":"…所以存在着这些差异，最主要的原因就在于公共管理是运用公共权力进行的管理。从现实来看，公共部门引入战略管理的实践只是管理方式上的变革，并没有影响到公共部门的性质。公共部门战略管理的性质是公共性的。10.3.2.1公共部门战略管理的根本性质是公共性私人部门战略的性质是自利性的，即其产生、存在的目的是追求合理的自身利益的最大化。公共部门战略的性质是公共性的，即其产生、存在是为了公共利益、公共目标、公共服务以及创造具有公益精神的意识形态…","contextPage":384},{"src":"cai-wang-3","pages":[384],"quote":"私人部门战略的性质是自利性的","context":"…公共部门引入战略管理的实践只是管理方式上的变革，并没有影响到公共部门的性质。公共部门战略管理的性质是公共性的。10.3.2.1公共部门战略管理的根本性质是公共性私人部门战略的性质是自利性的，即其产生、存在的目的是追求合理的自身利益的最大化。公共部门战略的性质是公共性的，即其产生、存在是为了公共利益、公共目标、公共服务以及创造具有公益精神的意识形态等。政府在其公共战略中从来不会公然宣布自己丧失公共目的而沦为私人机构。政府必须保…","contextPage":384},{"src":"cai-wang-3","pages":[384],"quote":"最主要的原因就在于公共管理是运用公共权力进行的管理","context":"…施基于个人成就的激励机制,通过稳定的工作、角色和任务以及战略参与使员工得到激励并获得工作动力。公共部门战略管理和私人部门战略管理在需要方面之所以存在着这些差异，最主要的原因就在于公共管理是运用公共权力进行的管理。从现实来看，公共部门引入战略管理的实践只是管理方式上的变革，并没有影响到公共部门的性质。公共部门战略管理的性质是公共性的。10.3.2.1公共部门战略管理的根本性质是公共性私人部门战略的性质是自利性的，即其产生、存在的目的是追求合理的自身…","contextPage":384},{"src":"chen-2","pages":[357],"quote":"公共部门引入战略管理具有重大意义，但也存在不同意见和引起了许多争论。","note":"战略管理的评价题，陈给的是「意义＋争论」两面，比只写好处更像论述。","context":"11.2.3公共部门战略管理的评价公共部门引入战略管理具有重大意义，但也存在不同意见和引起了许多争论。在当前我国，借鉴西方公共部门战略管理具有重要的理论和实践意义。1.公共部门战略管理的成就公共部门战略管理是作为克服传统公共行政过分关注内部问题及由此产生短视行为的良方而引入的。它着重考察组织的内外环境，清晰描述组织目标和使命；它试图脱离常规…","contextPage":357}],"moduleId":"m10","order":2},"l11-1":{"id":"l11-1","title":"公共管理伦理：三个构成要素与一条实质","goal":"能背出公共管理伦理的定义与三个构成要素，并解释为什么自由裁量权会让伦理成为必需品。","minutes":15,"tag":"第11章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2023 年名解考「公共管理伦理」，2024 年简答考「公共管理伦理的构成要素」，2026 年简答又考「加强公共管理伦理建设的途径」。这一节是全书性价比最高的地方之一。"},{"t":"p","h":"一句定义，三个限定","text":"**公共管理伦理是公共管理领域的规范体系**，它针对的基本对象是公共管理行为——虽然会涉及管理者与管理对象的关系，但公民、社会群体自身的道德行为不是它的主要问题。\n\n教材的完整表述是：公共管理伦理是**以「责、权、利」的统一为基础，以协调个人、公共部门与社会的关系为核心**的公共管理领域的基本伦理维度、基本道德规范和公共伦理精神。\n\n它包含三方面：范围是公共管理领域；规范主要针对公共管理行为，以公共管理系统或公共管理者为主体；既是道德规范的集合，也是社会基本伦理精神与普遍价值的体现。"},{"t":"p","h":"为什么公共行政离不开伦理","text":"欧美曾长期把「事实领域」（行政）与「价值领域」（伦理）对立起来，把技术管理与效率视为最终目标。这种分离有三条被打破的理由：\n\n**一、**公共管理伦理是现代公共管理理论与实践催生的产物，是公共管理本身的内在组成部分——效率至上的技术化组织方式已满足不了公众日益高涨的价值诉求。\n**二、自由裁量权强化了伦理诉求**——政府事务越来越多样复杂，立法机关不可能制定包罗万象的法规，行政主体必须在法定范围内自行判断、选择和决定，而裁量是否公正有效，往往取决于行使者的能力、学识与**道德素质**。\n**三、**公共管理内在包含对伦理的诉求——它的合法性与合理性就在于对公共利益的保护和促进。"},{"t":"p","h":"三个构成要素","text":"教材说公共管理伦理「是一个有机联系的整体，由诸多层面的要素所构成」，具体是三个形态：\n\n**一、观念形态（伦理意识）**：指导管理者做出行为选择的价值观，包含**伦理准则意识**（对公共管理所持的原则立场与根本态度）、**伦理责任意识**（关于责、权、利的系统认识，是公共管理伦理的**核心**）、**伦理目标意识**（对公共管理理想的追求，起激励与导向作用）。\n**二、实践形态**：以一定伦理规范为指导的公共管理行为，把价值规范、义务与义务所导向的最终目标统一起来；它通过活动过程中形成的各种关系、态度、作风、效果表现出来，并要求行为与地位、职责、权利、义务相一致。\n**三、准则评估形态**：观念与实践的结合形态，依据历史标准与公共管理伦理标准，通过**社会舆论、传统习惯和内心信念**（道德评价的三种主要形式）对行为与系统现状作价值判断，目的是检测实际活动的正确性、公平性与合理性。"},{"t":"ask","q":"为什么说「伦理责任意识」是三个意识里的核心？","a":"因为准则意识回答「按什么原则做」，目标意识回答「为什么做」，只有责任意识回答「做错了谁承担、承担什么」。公共管理的特殊性正在于它握有公共权力，权力必须对应责任——这也解释了教材为什么单列一节说「公共责任是公共管理伦理的具体化」。答构成要素题时，把责任意识标成核心，是体现理解的一句话。"},{"t":"tip","text":"记三个形态用一条线：想什么（观念）→ 做什么（实践）→ 做得对不对（评估）。三者是「内—外—反观」的关系，答题时按这条线写，不会只堆名词。"}],"concepts":[{"term":"公共管理伦理","def":"以责、权、利的统一为基础，以协调个人、公共部门与社会关系为核心的公共管理领域的基本伦理维度、基本道德规范和公共伦理精神。","points":["对象是公共管理行为，范围是公共管理领域","三个构成要素：观念形态、实践形态、准则评估形态","实质是公共利益，具体化是公共责任"],"exam":"2023 名解、2024 简答「构成要素」。名解写「定义 + 三要素 + 一句实质」。"},{"term":"公共责任","def":"公共部门依法应履行的职责，以及未履行、不完全履行或违法履行时应承担的后果；是公共管理伦理的具体化。","points":["两个层次：应履行的职责 + 不履行时的后果","三个特征：普遍的义务、一种任务、监督控制与制裁的方式","分类：主观责任（良知与价值观）与客观责任"],"exam":"答「伦理与责任的关系」时的关键句：公共责任是公共管理伦理的具体化、契约化。"}],"exercises":[{"t":"multi","q":"公共管理伦理的构成要素包括：","opts":["观念形态（伦理意识）","实践形态","准则评估形态","法律制裁形态"],"a":[0,1,2],"why":"三个形态是观念、实践、准则评估。法律制裁是法律途径的手段，不属于伦理的构成要素——这正是「伦理」与「法律」两条规范路径的分界。"},{"t":"choice","q":"公共管理伦理的核心是：","opts":["伦理准则意识","伦理责任意识","伦理目标意识","伦理评估意识"],"a":1,"why":"教材明确「责任意识是关于公共管理责、权、利的系统认识，是公共管理伦理的核心」。其他两个意识分别解决原则与方向。"},{"t":"multi","q":"道德评价的三种主要形式是：","opts":["社会舆论","传统习惯","内心信念","行政处罚"],"a":[0,1,2],"why":"三者属于准则评估形态的作用方式。行政处罚属于法律与行政监督，不是道德评价。"},{"t":"judge","q":"公共管理伦理主要研究公民和社会群体的道德行为。","a":false,"why":"教材明确指出：公共管理伦理针对的基本对象是公共管理行为；作为管理对象的公民、社会群体自身的道德行为不是它要考虑的主要问题。"},{"t":"choice","q":"公共行政与伦理长期被视为两个对立领域，打破这种对立的关键现实因素是：","opts":["政府规模缩小","行政自由裁量权的存在与扩大","公务员考试制度建立","信息技术普及"],"a":1,"why":"立法不可能包罗万象，行政主体必须自行判断与选择，裁量是否公正取决于行使者的道德素质——所以伦理不是外挂，而是行政的内在需要。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「公共管理伦理的构成要素」（10 分）。","minutes":12,"points":["总述：公共管理伦理是有机联系的整体，由三个层面的要素构成","观念形态即伦理意识，包含准则意识、责任意识、目标意识","点明责任意识是公共管理伦理的核心（责、权、利的系统认识）","实践形态：以伦理规范为指导的行为，行为须与地位、职责、权利义务一致","准则评估形态：依据标准作价值判断，检测正确性、公平性与合理性","写出道德评价的三种形式：社会舆论、传统习惯、内心信念"],"sample":"公共管理伦理是一个有机联系的整体，由三个层面的要素构成。第一，观念形态，即伦理意识，是用来指导公共管理者做出行为选择的价值观，包含伦理准则意识、伦理责任意识和伦理目标意识：准则意识是对公共管理所持的原则立场和根本态度；责任意识是关于公共管理责、权、利的系统认识，是公共管理伦理的核心；目标意识是对公共管理理想的追求，起激励与导向作用。第二，实践形态，即以一定伦理规范为指导的公共管理行为，它把价值规范、义务与最终目标统一起来，通过活动中的关系、态度、作风与效果表现出来，并要求行为与地位、职责、权利和义务相一致。第三，准则评估形态，是观念与实践的结合形态，依据历史标准和公共管理伦理标准，通过社会舆论、传统习惯和内心信念三种主要形式，对公共管理者行为及整个公共管理系统的现状作价值判断，以检测实际活动的正确性、公平性和合理性。","tip":"三个形态各占 3 分左右，最后一个形态里的「三种道德评价形式」是第 9、10 分。只写「观念、实践、评估」六个字不展开，最多 4 分。"},"evidence":[{"src":"cai-wang-3","pages":[394],"quote":"公共管理伦理是公共管理领域的规范体系","context":"…“道德科学”。一般来说，伦理有其普适性，但不同领域有着不同的伦理，如经济伦理、行政伦理、私人部门的伦理、公共部门的伦理、企业管理伦理和公共管理伦理等。就此而论，公共管理伦理是公共管理领域的规范体系，它所针对的基本对象是公共管理行为，虽然它不可避免地涉及管理者与管理对象之间的关系，但作为公共管理对象的公民、社会群体和公共场所的道德行为或伦理关系不是公共管理伦理所要考虑的主要问题。公共管理伦理通过赋予公共管理行为的价值规范体系，引导、规…","contextPage":394},{"src":"cai-wang-3","pages":[396],"quote":"公共管理伦理是一个有机联系的整体，由诸多层面的要素所构成","context":"…就理所当然地成为判断公共管理行为是否正当的价值标准，成为公共权力运行的价值基石和道德基础。11.1.1.3公共管理伦理的构成与思考方式1.公共管理伦理的构成要素公共管理伦理是一个有机联系的整体，由诸多层面的要素所构成。（1）观念形态。观念形态就是伦理意识，是用来指导公共管理者做出行为选择的价值观，包含伦理准则意识、伦理责任意识和伦理目标意识。准则意识是对公共管理所持的原则立场和根本态度，通过对伦理主体的调控实现由内及外的统一；责任意识是关于公共管理责、…","contextPage":396},{"src":"cai-wang-3","pages":[396],"quote":"观念形态就是伦理意识","context":"…基石和道德基础。11.1.1.3公共管理伦理的构成与思考方式1.公共管理伦理的构成要素公共管理伦理是一个有机联系的整体，由诸多层面的要素所构成。（1）观念形态。观念形态就是伦理意识，是用来指导公共管理者做出行为选择的价值观，包含伦理准则意识、伦理责任意识和伦理目标意识。准则意识是对公共管理所持的原则立场和根本态度，通过对伦理主体的调控实现由内及外的统一；责任意识是关于公共管理责、权、利的系统认识，是公共管理伦理的核心…","contextPage":396},{"src":"cai-wang-3","pages":[400],"quote":"公共责任是公共管理伦理的具体化","context":"…为公共行政理论的核心原则之一，强调“公共行政人员必须建立一种集体的、共同的公共利益观念”①。这也同时使公共伦理将公共利益纳为它的基本准则和价值追求。11.1.3公共责任是公共管理伦理的具体化11.1.3.1公共责任的含义公共管理伦理与公共责任（publicaccountability）是紧密联系、内在统一的，从某种意义上说，公共责任是公共管理伦理的具体化。为了实现公共管理的目标，必须具有为之服务的公共责任制度。现代公共责任在整…","contextPage":400},{"src":"chen-2","pages":[399],"quote":"公共管理伦理是指公共管理领域基本伦理维度、公共管理行为的基本道德规范","note":"陈的伦理定义直接扣「公共性」，与蔡王「观念形态—实践形态—伦理关系」三要素互补。","context":"…问题。13.1公共管理伦理概述公共管理伦理或行政道德是以“责、权、利”的统一为基础，以协调个人、组织与社会的关系为核心的公共管理行为准则和规范系统。也有学者认为公共管理伦理是指公共管理领域基本伦理维度、公共管理行为的基本道德规范，以及通过公共管理行为与公共事务所集中体现出来的社会公共伦理精神，是为了维持公共管理之“公共性”而必须坚持的伦理标准和要求。②没有相应的公共管理伦理，公共管理就不能担负起它的应有作用。①例如，张康之在《公共管理伦理学（修订版）》（中国人民大…","contextPage":399}],"moduleId":"m11","order":1},"l11-2":{"id":"l11-2","title":"公共管理监督：内部三类，外部四种","goal":"能区分内部监督与外部监督，说出各自的构成，并指出我国监督机制的问题与完善方向。","minutes":15,"tag":"第11章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2020 年论述考「公共权力监督的理论依据及完善措施」。这道题的两个半场：为什么权力必须被监督，以及监督体系怎么补齐。"},{"t":"p","h":"三类理论依据，三条制约路径","text":"教材按「用什么制约权力」列了三条理论：**分权制衡理论——以权力制约权力**；**人民主权理论——以权利制约权力**；**社会契约论——以道德制约权力**。\n\n三种路径的差别很好用：以权力制约权力靠制度设计（如三权分立、监察机关）；以权利制约权力靠公民的知情、参与、申诉与诉讼；以道德制约权力靠公职人员的自律与职业伦理。答「完善监督」时按这三条各给一条措施，答案天然成体系。"},{"t":"p","h":"内部监督：三类","text":"**一般监督**：上级对下级、下级对上级的日常监督，以及行政复议等制度化渠道。\n**专门监督**：公共管理主体内部设置的专门监察机关实行的监察活动。我国最主要的是行政监察——县级以上各级政府均设立，实行**双重领导体制**（对本级政府与上一级监察机关负责，业务上以上级领导为主），形式有检查执法情况、受理控告检举、调查处理违纪、受理申诉。\n**特种监督**：针对某种专门活动的专业性监督，如审计监督、物价监督。审计机关也实行双重领导，权限包括调查权、强制权、建议权、出具审计意见与作出审计决定权。"},{"t":"p","h":"外部监督：四种","text":"**公共管理外部监督**是公共管理组织以外的各种监督主体对公共组织及其人员管理活动进行的多渠道、多种形式的**异体监督**，包括：\n\n**权力机关监督**：立法机关对公共管理机构及其活动实施的、具有法律效力的最高层次异体监督。我国人大及其常委会的方式有：听取和审议政府工作报告；审查并撤销本级行政机关不适当的法规、规章、命令和决议；提出质询和询问；视察检查政府工作、处理公民申诉控告检举；罢免政府组成人员（最严厉的惩戒方式）。\n**司法机关监督**：通过行政诉讼、司法审查等途径。\n**政党监督**：执政党与民主党派的监督。\n**社会监督**：公民、媒体、社会组织的监督。"},{"t":"p","h":"怎么补","text":"我国监督机制的问题集中在几处：监督主体多但合力不足，专门监督机关的独立性受同级政府制约，事前事中监督弱、事后追责多，社会监督渠道不畅、反馈不足。\n\n完善方向可以按三条理论对应写：**以权力制约权力**——保障监察与审计的独立性，强化人大对预算与重大决策的实质审查；**以权利制约权力**——推进政务公开、畅通举报与申诉、落实行政复议与行政诉讼；**以道德制约权力**——把伦理规范纳入考核与培训，建立利益冲突回避与财产申报制度。"},{"t":"ask","q":"为什么「以权力制约权力」之外，还必须要有「以权利制约权力」？","a":"因为内部监督存在信息与激励的双重盲区：监督者与被监督者同属一个体系，信息由被监督者掌握，激励也容易被共同利益软化。公民的知情、申诉与诉讼把监督的启动权交给利益相关者——他们最有动力发现问题，也最难被收买。所以两种路径不是替代关系，而是互补：权力制约解决「谁来查」，权利制约解决「谁知道、谁去告」。"},{"t":"tip","text":"「公共权力监督」类论述的骨架：三条理论 → 内部三类 → 外部四种 → 三条对应改进。四段写完，20 分基本稳了。"}],"concepts":[{"term":"公共管理监督","def":"对公共管理主体及其活动进行的监察、督促与控制，分为内部监督与外部监督两大体系。","points":["内部：一般监督、专门监督、特种监督","外部：权力机关、司法机关、政党、社会监督","理论依据：分权制衡、人民主权、社会契约"],"exam":"2020 年论述「公共权力监督的理论依据及完善措施」的核心框架。"},{"term":"专门监督","def":"公共管理主体内部设置的专门监察机关实行的监察活动，我国主要是行政监察。","points":["双重领导体制：对本级政府与上一级监察机关负责，业务以上级领导为主","形式：检查执法、受理控告检举、调查处理违纪、受理申诉","地位具有公正性与权威性"],"exam":"常与「审计监督」一起作为「内部监督」的举例出现，注意别与外部监督混。"}],"exercises":[{"t":"multi","q":"公共管理内部监督包括：","opts":["一般监督","专门监督","特种监督","社会监督"],"a":[0,1,2],"why":"社会监督属于外部监督。内部三类是一般、专门、特种；外部四种是权力机关、司法、政党、社会。"},{"t":"choice","q":"我国权力机关监督中最为严厉的惩戒方式是：","opts":["质询","询问","罢免政府组成人员","听取工作报告"],"a":2,"why":"教材明确「罢免是最为严厉的惩戒方式」。质询、询问、审议报告属于常规监督手段。"},{"t":"judge","q":"公共管理外部监督是异体监督，权力机关监督是其中层次最高、具有法律效力的监督。","a":true,"why":"教材的表述正是：权力机关监督是具有法律效力的最高层次的异体监督。我国人大监督是最高层次、最具权威、享有最高法律效力的监督。"},{"t":"choice","q":"「以权利制约权力」对应的理论是：","opts":["分权制衡理论","人民主权理论","社会契约论","委托代理理论"],"a":1,"why":"三条对应关系要记准：分权制衡—以权力制约权力；人民主权—以权利制约权力；社会契约—以道德制约权力。"},{"t":"order","q":"把「为什么要完善监督」的推理排好。","items":["公共权力能影响他人权益，必须受约束","内部监督存在信息与激励的盲区","因此既要以权力制约权力，也要以权利制约权力","最终形成内外结合、事前事中事后贯通的监督体系"],"a":[0,1,2,3],"why":"这条链把三种理论解释成互补关系，而不是三种并列口号，论述里很加分。"}],"write":{"type":"论述题","prompt":"用 18 分钟写「公共权力监督的理论依据及完善措施」（20 分）。","minutes":18,"points":["先点明公共权力为何必须受监督：它来自公共授权并能影响他人权益","理论一：分权制衡——以权力制约权力","理论二：人民主权——以权利制约权力","理论三：社会契约论——以道德制约权力","写出我国监督体系：内部（一般、专门、特种）与外部（权力机关、司法、政党、社会）","指出问题：合力不足、专门监督独立性受限、重事后、社会监督渠道不畅","改进：保障监察审计独立性、强化人大实质审查、推进政务公开与救济、把伦理纳入考核"],"sample":"公共权力来自公共授权、能够影响他人权益，因而必须受到约束。其理论依据主要有三：一是分权制衡理论，主张以权力制约权力，通过权力分立与相互监督防止权力集中；二是人民主权理论，主张以权利制约权力，公民有权知情、参与、表达与监督受托权力；三是社会契约论，主张以道德制约权力，通过职业伦理与责任意识约束掌权者。我国的公共管理监督体系分为内部与外部两部分：内部包括一般监督、专门监督（行政监察，实行双重领导体制）与特种监督（审计、物价等）；外部包括权力机关监督、司法机关监督、政党监督与社会监督，其中人大监督是最高层次、最具权威并享有最高法律效力的异体监督，罢免是最严厉的惩戒方式。当前监督机制仍存在监督合力不足、专门监督独立性受限、重事后追责而轻事前事中、社会监督渠道不畅等问题。完善措施应与三种理论对应：以权力制约权力，保障监察与审计的独立性，强化人大对预算和重大决策的实质审查；以权利制约权力，推进政务公开、畅通举报申诉、落实行政复议与行政诉讼；以道德制约权力，把伦理规范纳入考核培训，建立利益冲突回避与财产申报制度。","tip":"这道题的关键是「一一对应」：三条理论各配一条改进措施。理论写完就跳到空泛建议，是这类论述最常见的结构失分。"},"evidence":[{"src":"cai-wang-3","pages":[419],"quote":"专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动","context":"提高行政复议总体水平；6）必须不断完善行政复议制度和机制，进一步规范行政复议行为①。（2）专门监督。专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动。目前，我国公共管理专门监督中，最为核心、常用、有效的是国家行政监督机关实行的行政监察活动。国家行政监察机关以宪法和法律为依据，在我国县级以上各级政府中都有设立。它在上级行政监督机关和所属人民政府的领导下，独立地行使监察权，只服从国家有关法…","contextPage":419},{"src":"cai-wang-3","pages":[420],"quote":"公共管理外部监督是指公共管理组织以外的各种监督主体对公共组织及其人员的管理活动所进行的多渠道的、多种形式的异体监督","context":"…行为，需要依法进行处理的，除对审计事项做出评价、出具审计意见书外，还可以对违法的财政财务收支行为在法定职权范围内做出处理①。11.3.2.3公共管理外部监督体系公共管理外部监督是指公共管理组织以外的各种监督主体对公共组织及其人员的管理活动所进行的多渠道的、多种形式的异体监督。外部监督体系主要包括权力机关监督、司法机关监督、政党监督、社会监督等形式。1.权力机关监督权力机关监督是指国家立法机关对公共管理机构及其活动实施的监督，是具有法律效力的最高层次的异体监督。由于世界各国的政体和国体不同，国家权力机关的监督内…","contextPage":420},{"src":"cai-wang-3","pages":[420],"quote":"人民代表大会的监督既是代表人民意志和国家利益的监督，也是最高层次、最具权威以及享有最高法律效力的监督","context":"…公共管理监督中，人民代表大会是通过中央和地方各级人民代表大会及其常务委员会来实施监督权。各级人民政府、人民法院和人民检察院都由人大产生，并对人大负责和报告工作。人民代表大会的监督既是代表人民意志和国家利益的监督，也是最高层次、最具权威以及享有最高法律效力的监督。我国由人民代表大会及其常务委员会对政府进行监督的主要方式有：（1）听取和审议同级人民政府的工作报告，其中包括年度报告、财政预算报告、各项重大措施和政策报告、政府各部门负责人工作活动报告等。（2）审查并撤销本级行政机关发布的不适当的法规、规…","contextPage":420},{"src":"chen-2","pages":[410],"quote":"我国还处于实施官员问责制的适应期，还处在对责任体系的理论与实践的探索期","note":"写「监督机制存在的问题」时，可用陈对问责制阶段的判断做一条论据。","context":"…所以维持公正的立场，维护普遍的公共利益是行政人员的基本立场。①库珀对客观责任在行政组织领域的特殊背景下的分析为我们厘清现阶段公共领域的责任关系提供了借鉴，尤其是我国还处于实施官员问责制的适应期，还处在对责任体系的理论与实践的探索期，正确地分析现阶段中国政治和行政体系中的责任关系是我们正确认识和实施官员问责制的必要环节。综上所述，“责任”一词的词源久远，来自不同学科领域的解释更增加了其含义的多样性。“责任”在汉语中的丰富含义使它既有责任主体（responsibilit…","contextPage":410}],"moduleId":"m11","order":2},"l12-1":{"id":"l12-1","title":"绩效不等于产出：公共部门绩效评估的内涵","goal":"能说清绩效与产出的区别，背出公共部门绩效评估的定义，并解释从 3E 到 4E 为什么必须加「公平」。","minutes":15,"tag":"第12章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2025 年简答考「公共部门绩效评估的问题」。答这道题之前，得先知道「绩效」到底指什么——多数人把绩效当成产出，一步就错。"},{"t":"p","h":"绩效的四个规定性","text":"教材从四个方面界定绩效：\n\n**一、内容与外延**：绩效反映公共部门及其人员在履行职能或岗位职责过程中，在一定时间内以某种方式实现某种结果的过程——**在职责履行以外产生的结果不能视为绩效**。\n**二、主体**：包括公共部门整体绩效、公共管理人员个人绩效和项目绩效。\n**三、质与量**：绩效**既不等于产出本身，也不等于任务或产品本身**，而是投入所获得的产出及其产生的社会效果，既有量的规定性，也有质的规定性。\n**四、过程**：绩效有周期，从投入 → 中期结果 → 最终结果，时间对绩效形成有影响。"},{"t":"p","h":"一句定义","text":"**公共部门绩效**是公共部门在依法履行职能过程中投入所获得的初期和最终结果及其所产生的社会效果。它包含四层：是履行职能过程中取得的；范围不仅是「做了什么」，还包括行为产生的效果与影响；不仅有数量（做了什么、做了多少），还有质量（做得怎么样）；不仅表现为初期结果，还有最终结果，具有绩效周期。\n\n**公共部门绩效评估**则是：根据绩效目标，运用综合的评估指标体系和科学的评估方法，按照严格的评估程序，对公共部门履行职能所产生的结果及其社会效果进行**测量、划分绩效等级、提出绩效改进计划和运用评估结果改进绩效**的活动。注意最后两项——评估不止于打分，还要形成改进。"},{"t":"p","h":"3E 为什么不够","text":"20 世纪 60 年代美国会计总署提出「3E」评价法，把审计重心从经济审计转向**经济（economic）、效率（efficiency）、效益（effectiveness）**并重，这是公共部门绩效评估在方法探索上的开端。\n\n但 3E 只强调经济效率，与政府追求的价值理念存在冲突：一项服务可能成本低、效率高，却把最需要它的人排除在外。所以后来增加了第 4 个 E——**公平（equity）**，关注接受服务的团体或个人是否都受到公平待遇、弱势群体能否获得更多照顾。这就是从 3E 到 4E 的逻辑。"},{"t":"ask","q":"为什么说「绩效不等于产出」这一条能解释绩效评估的很多难题？","a":"因为产出是自己报的，效果是别人感受到的。把绩效等同于产出，考核就变成数件数：办了多少件、开了多少会、花了多少钱。而公共部门真正要的是社会效果——问题有没有缓解、服务对象的处境有没有改善。一旦承认绩效包含社会效果，就必然要引入外部评价、长期跟踪与归因分析，也就必然遇到「目标模糊、效果滞后、难以归因」这三大难题。第 12.4 节的七个问题，几乎都能从这里长出来。"},{"t":"tip","text":"名解「公共部门绩效评估」写四件事：依据（绩效目标）、工具（综合指标体系与科学方法）、程序（严格程序）、动作（测量、划分等级、提出改进计划、运用结果）。少了「改进」环节，就写成了一次打分。"}],"concepts":[{"term":"公共部门绩效","def":"公共部门在依法履行职能过程中投入所获得的初期和最终结果及其所产生的社会效果。","points":["四层含义：履职过程中取得、含效果与影响、有量与质、有周期","不等于产出本身，也不是任务或产品本身","包括部门整体绩效、个人绩效与项目绩效"],"exam":"名解的高频起点；答评估类题目时先把它与「产出」切开。"},{"term":"公共部门绩效评估","def":"根据绩效目标，运用综合评估指标体系与科学方法，按严格程序对履职结果及其社会效果进行测量、划分等级、提出改进计划并运用结果改进绩效的活动。","points":["产生背景：新公共管理运动，是公共责任实现机制","四个动作：测量、分级、改进计划、结果运用","三种界定：学者界定、政府法案界定、绩效预算与审计界定"],"exam":"2025 简答与 2026 简答都要以它为前提。"},{"term":"4E 评价法","def":"在 3E（经济、效率、效益）基础上增加公平（equity）的绩效评价方法。","points":["3E 由美国会计总署于 20 世纪 60 年代提出，是方法探索的开端","公平关注服务是否平等、弱势群体是否获得更多照顾","从 3E 到 4E 反映公共价值对单纯效率的修正"],"exam":"答「为什么不能只用效率指标」时最标准的论据。"}],"exercises":[{"t":"choice","q":"按教材，绩效与产出的关系是：","opts":["绩效就是产出","绩效是投入所获得的产出及其社会效果","绩效是任务本身","绩效等于预算执行率"],"a":1,"why":"教材明确：绩效既不等于产出本身，也不等于任务或产品本身，而是投入所获得的产出及其所产生的社会效果。"},{"t":"multi","q":"公共部门绩效评估的活动包括：","opts":["测量履职结果及其社会效果","划分绩效等级","提出绩效改进计划","运用评估结果改进绩效"],"a":[0,1,2,3],"why":"四个动作齐全才是「评估」。只测量分级、不改进，就退化成排名与奖惩。"},{"t":"choice","q":"在 3E 基础上增加的第 4 个 E 是：","opts":["economy","efficiency","effectiveness","equity"],"a":3,"why":"第 4 个 E 是公平（equity）。它修正的是 3E 单纯强调经济效率、忽视服务均等与弱势群体的缺陷。"},{"t":"judge","q":"公共部门在岗位职责以外产生的结果也可以计入该部门的绩效。","a":false,"why":"教材的规定是：绩效反映的是履行职能或岗位职责过程中实现结果的过程，职责履行以外产生的结果不能视为绩效。"},{"t":"order","q":"按绩效形成的周期排列。","items":["投入资源","获得中期结果","获得最终结果","产生社会效果"],"a":[0,1,2,3],"why":"绩效有周期性，时间对绩效形成有影响。这也是为什么评估不能只看当年产出。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「公共部门绩效评估」的名词解释（5 分）。","minutes":6,"points":["给出定义：依据绩效目标，用综合指标体系与科学方法、按严格程序进行的评估活动","写出四个动作：测量结果与社会效果、划分绩效等级、提出改进计划、运用结果改进绩效","点明它是在新公共管理运动中形成的公共管理方法与公共责任实现机制","指出评估对象是履职结果及其社会效果，而非单纯的产出","补一句边界或方法：常用 3E／4E 等评价方法，须兼顾效率与公平"],"sample":"公共部门绩效评估是在西方新公共管理运动中孕育和发展起来的一种新的公共管理方法和公共责任实现机制。它是指根据绩效目标，运用综合的评估指标体系和科学的评估方法，按照严格的评估程序，对公共部门履行职能所产生的结果及其社会效果进行测量、划分绩效等级、提出绩效改进计划并运用评估结果改进绩效的活动。其评估对象是公共部门履职的结果及其社会效果，而不只是产出本身；在方法上经历了从 3E（经济、效率、效益）到 4E（增加公平）的发展，强调效率与公平并重。","tip":"「测量、分级、改进计划、结果运用」四个动作是这道题的核心分。只写「对绩效进行评价」，阅卷无法判断你是否理解评估是一个闭环。"},"evidence":[{"src":"cai-wang-3","pages":[432],"quote":"绩效既不等于产出本身，也不等于任务或产品本身","context":"…职责履行以外所产生的结果不能视为绩效。第二，从绩效产生的主体来看，绩效包括了公共部门整体绩效、公共管理人员个人绩效和项目绩效。第三，从绩效质与量的本质属性来看，绩效既不等于产出本身，也不等于任务或产品本身，绩效是投入所获得的产出及其所产生的社会效果，不仅有量的规定性，","contextPage":432},{"src":"cai-wang-3","pages":[433],"quote":"公共部门在依法履行职能过程中投入所获得的初期和最终结果及其所产生的社会效果","context":"…第四，从绩效形成的过程来看，绩效具有一定的周期，具有从投入—获得中期结果—获得最终结果的周期性发展过程，时间对绩效形成具有影响作用。因此，公共部门绩效的概念是：公共部门在依法履行职能过程中投入所获得的初期和最终结果及其所产生的社会效果。其含义具体包括：公共部门绩效是公共部门履行职能过程中取得的；公共部门绩效的范围，不仅包括做了什么本身，还包括了行为所产生的效果与影响；公共部门绩效不仅有数量（做了什么、做了多少），而且还有质量（做得怎么样）；公共部门绩效，不仅表现为初期结…","contextPage":433},{"src":"cai-wang-3","pages":[433],"quote":"公共部门绩效评估就是根据绩效目标，运用综合的评估指标体系和科学的评估方法","context":"…①我国关于公共部门绩效评估的研究，具有起步晚、研究热情高的特点。学者们从不同的角度对公共部门绩效评估的含义进行了讨论，但至今还没有形成一个统一的概念。我们认为，公共部门绩效评估就是根据绩效目标，运用综合的评估指标体系和科学的评估方法，按照严格的评估程序对公共部门履行职能所产生的结果及其社会效果进行测量（evaluating）、划分绩效等级（grading）、提出绩效改进计划和运用评估结果改进绩效的活动。因此，公共部门绩效评估就是要对公共部门做了什么——业绩，做得怎么样…","contextPage":433},{"src":"chen-2","pages":[378],"quote":"公共部门绩效评估的要素包括绩效评估的目标、途径、制度安排和信息系统","note":"四要素是陈书绩效章的骨架句；蔡王讲指标体系，两者不冲突，可合用。","context":"…改进和发展，促使倾听顾客声音、提高服务质量、项目评估、管理信息系统、电子政务等公共管理方法应运而生，为政府公共管理开拓了新的视野。12.2公共部门绩效评估的要素公共部门绩效评估的要素包括绩效评估的目标、途径、制度安排和信息系统。要进行绩效评估，就首先要确定评估的目标。由于绩效改进的目标不同，评估的目标也不同。绩效评估可以通过不同的途径来实现：自上而下与自下而上的途径、激进式与渐进式的途径、个别与系统的途径等。绩效评估的制度安排主要涉及的是确定由哪一个部门负责绩效…","contextPage":378}],"moduleId":"m12","order":1},"l12-2":{"id":"l12-2","title":"七个问题：绩效评估为什么容易跑偏","goal":"能按「制度—主体—指标—程序—方法—运用—导向」七条列出我国绩效评估的问题，并针对每条给出改进方向。","minutes":16,"tag":"第12章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2025 年简答「结合实际论述公共部门绩效评估的问题」，2026 年简答「科学推进我国绩效评估的措施」。一题问病，一题问药——病答不准，药就一定开错。"},{"t":"p","h":"七条问题，按制度到导向排列","text":"**一、状态自发、半自发**：缺乏全国统一的相应制度与法律保障，缺乏系统理论指导，照搬西方国家或企业做法的现象普遍。\n**二、评估主体缺乏具体制度建构**：党委组织部门、政府人事部门、国有资产管理部门在评估公务员绩效时彼此分割，专门负责绩效评估的机构还没有真正建立。\n**三、内容不全面、指标不科学**：片面地把经济业绩等同于政绩，或把公众满意度等同于评估全部；指标不区分部门职责与岗位差别，导致评估与职能脱节；公共部门绩效一般未进入市场交换领域，难以用市场价格直接标示公共管理成本。\n**四、程序不规范**：随意性大，过程封闭、神秘，缺乏透明度与监督。\n**五、方法单一**：定性定量没有有机结合，忽视时间因素，多采取「运动式」「评比式」「突击式」，忽视持续性评估。\n**六、结果运用错位**：不是把评估作为提高行政水平、规范行为的正面措施，而把它当作消极防御、事后监督与制裁的手段，因而总是陷于被动。\n**七、导向扭曲**：在科学的政绩观与绩效标准未确立的前提下，表面化评估助长把主要精力放在见效快、表面化程度高的事务上，挥霍公共财政，刻意制造「政绩工程」。"},{"t":"ask","q":"这七条里，哪一条最能解释「数字出官、官出数字」？","a":"第七条与第三条的叠加。第三条让它只用经济指标，第七条让被评估者围着指标做表演——只要指标能反映政绩，就会有主体去制造指标而不是制造效果。所以治本不是换更细的指标，而是先把「评估结果怎么用」改掉：用来改进服务，而不是只用来排名与问责。这也正是第六条的问题所在。"},{"t":"p","h":"对应的改进方向","text":"教材推进途径的第一条是**促进公共部门绩效评估理论研究科学化**：结合公共管理特征改造企业绩效评估理论与方法，而不是机械照搬；把西方措施本土化，而不是简单移植；并且要注重公共部门与企业绩效评估的差异——公共部门不仅有民主价值与效率价值的冲突，还有公共部门、公众、企业之间价值目标的冲突。\n\n其余各条与前面七个问题一一对应，可以这样组织：**建制度**（统一规范与法律保障）、**定主体**（建立专门的评估机构，明确分工）、**改指标**（分部门分岗位设置，质量与公平并重）、**立程序**（公开透明、可申诉）、**精方法**（定性与定量结合、持续跟踪而非突击评比）、**正运用**（用于改进而非只用于追责）、**树导向**（以公共价值而非「政绩工程」为尺度）。"},{"t":"tip","text":"两问其实是一问：问题与措施按下标对齐，答一道题就等于准备好了另一道。考场上先写七个问题，再用「针对第 N 条，应……」起头写对策，结构一目了然。"}],"concepts":[{"term":"政绩工程","def":"在科学的政绩观与绩效标准未确立时，被表面化评估诱导出的、追求见效快与表面化程度的事务而忽视经济社会效益的行为。","points":["成因：指标单一 + 结果用于排名问责","表现：挥霍公共财政、制造可见成果","治理：改变评估结果运用方式与指标结构"],"exam":"案例题里解释「为什么地方热衷形象工程」的最短路径。"},{"term":"评估结果运用","def":"把评估结论用于预算、流程、培训与政策调整，而非仅用于奖惩。","points":["正确运用：改进绩效的正面措施","错误运用：消极防御、事后监督与制裁","判断标准：是否带来服务改进"],"exam":"答「如何完善绩效评估」的收尾分。"}],"exercises":[{"t":"multi","q":"我国公共部门绩效评估存在的问题包括：","opts":["处于自发、半自发状态，缺乏统一制度与法律保障","缺乏评估主体的具体制度建构，专门机构尚未真正建立","指标不全面，片面将经济业绩等同于政绩","评估程序不规范，过程封闭、缺乏透明度"],"a":[0,1,2,3],"why":"四条都在教材列举的七个问题里（其余三条是方法单一、结果运用错位、导向扭曲）。"},{"t":"choice","q":"教材提出的推进途径中，第一条是：","opts":["扩大评估主体范围","促进公共部门绩效评估理论研究科学化","增加评估频次","引入第三方评估"],"a":1,"why":"第一条是理论研究科学化：改造而非照搬企业方法、本土化而非移植西方措施，并注重公共部门与企业的差异。"},{"t":"judge","q":"把绩效评估作为事后监督与制裁的手段，是教材认可的做法。","a":false,"why":"教材把它列为第六条问题：评估应作为提高行政水平、规范行为的正面措施，而非消极防御与事后制裁。"},{"t":"choice","q":"「运动式」「评比式」「突击式」评估反映的问题是：","opts":["评估主体不清","评估方法单一、忽视持续性评估","指标过于复杂","缺乏法律保障"],"a":1,"why":"这属于方法问题：忽视时间因素对绩效的影响，缺少持续跟踪，只能靠集中行动制造数字。"},{"t":"order","q":"把「问题—对策」按同一顺序配对书写，先排问题链。","items":["评估缺乏制度与法律保障","评估主体分割、专门机构缺位","指标不全面、与职能脱节","程序不规范、结果运用错位"],"a":[0,1,2,3],"why":"按「制度—主体—指标—程序」排列，对策自然按同一顺序落地，不会写乱。"}],"write":{"type":"简答题","prompt":"用 13 分钟写「我国公共部门绩效评估存在的主要问题」（10 分）。","minutes":13,"points":["总述：我国绩效评估起步晚、发展快，但整体仍不成熟","问题一：处于自发、半自发状态，缺乏统一制度与法律保障、缺乏系统理论指导","问题二：评估主体缺乏制度建构，相关部门分割、专门机构缺位","问题三：内容不全面、指标不科学，片面以经济业绩代政绩，与职能脱节","问题四：程序不规范、过程封闭，缺乏透明度与监督","问题五：方法单一，定性定量脱节、忽视持续性，多为运动式评比","问题六与七：结果运用错位（当制裁手段），并助长表面化与政绩工程"],"sample":"我国公共部门绩效评估起步较晚但发展较快，当前仍不成熟，主要问题有七：一是处于自发、半自发状态，缺乏全国统一的制度与法律保障，也缺乏系统的理论指导，照搬西方国家或企业做法的现象普遍；二是评估主体缺乏具体制度建构，党委组织部门、政府人事部门、国有资产管理部门在评估公务员绩效时彼此分割，专门负责评估的机构尚未真正建立；三是评估内容不全面，没有建立科学综合的指标体系，片面将经济业绩等同于政绩，或把公众满意度等同于评估全部，指标不区分部门职责与岗位差别，且公共部门绩效未进入市场交换领域，难以用市场价格标示管理成本；四是程序不规范，随意性大，过程封闭、缺乏透明度与监督；五是方法单一，定性与定量未有机结合，忽视时间因素，多为运动式、评比式、突击式评估；六是结果运用错位，把评估当作消极防御与事后制裁手段；七是在科学的政绩观未确立时，表面化评估助长政绩工程。","tip":"七个问题不必字字对应教材，但要「按层排」：制度—主体—指标—程序—方法—运用—导向。有层次的七条比零散的十条更像高分答案。"},"evidence":[{"src":"cai-wang-3","pages":[466],"quote":"我国当前施行公共部门绩效评估还处于自发、半自发状态","context":"…，从舆论、操作层面开始走向体制、制度层面。12.4.2.2我国公共部门绩效评估过程中存在的问题客观地说，当前我国公共部门绩效评估还很不成熟，其主要问题是：(1)我国当前施行公共部门绩效评估还处于自发、半自发状态，缺乏全国统一的、①中国地方政府绩效评估体系研究课题组．中国政府绩效评估报告．北京：中共中央党校出版社，2009.②刘晓洋，谭海波．政府绩效管理：权力配置与模式选择：基于“控权论”的理论视角．学术研究，2013(5).","contextPage":466},{"src":"cai-wang-3","pages":[467],"quote":"片面地将经济业绩等同于政绩","context":"…国有资产管理部门在评估公务员的绩效时彼此分割，负责公务员绩效评估的专门机构还没有真正建立。（3）公共部门绩效评估的内容不全面，没有建立科学、综合的评估指标体系，片面地将经济业绩等同于政绩，或者将公众的满意度评估等同于公共部门绩效评估的全部；评估指标的建立没有考虑在满足共同指标的同时，根据部门职责或岗位的不同科学区分不同的指标，导致绩效评估与政府职能或岗位职责的行使严重脱节。公共部门绩效一般还没有进入市场交换领域，导致公共部…","contextPage":467},{"src":"cai-wang-3","pages":[467],"quote":"评估方法单一，没有实现定性方法与定量方法的有机结合","context":"…场价格来直接标示必要的公共管理成本。（4）评估程序没有规范化、程序化，存在着很大的随意性；评估过程具有封闭性、神秘性，缺乏透明度与公开性，缺乏应有的监督。（5）评估方法单一，没有实现定性方法与定量方法的有机结合，或者只有定性而没有定量，或者没有定性而只有定量；评估方法不科学，忽视了时间因素对绩效产生的影响，评估大多采取“运动式”“评比式”“突击式”，忽视了公共部门绩效的持续性评估。（6）绩效评估的应用没有注重通过科学合理的绩效目标、绩效标准来规范…","contextPage":467},{"src":"cai-wang-3","pages":[467],"quote":"促进公共部门绩效评估理论研究科学化","context":"…评估发展的方向并使之有效地发挥作用，具有重要的借鉴与启发作用。我们应在借鉴西方发达国家公共部门绩效评估经验的基础上，完善我国公共部门绩效评估，具体措施包括：1.促进公共部门绩效评估理论研究科学化构建适合我国国情的、科学化的绩效评估理论体系，对有效推行公共部门绩效评估起着关键性的作用。公共部门绩效评估理论研究科学性的具体体现就是：结合公共管理的特征把企业绩效评估的理论与方法加以改造，形成有效的公共部门绩效评估理论与方法，而不是机械照…","contextPage":467},{"src":"chen-2","pages":[395],"quote":"与发达国家的实践相比，我国公共组织绩效评估的规范化程度明显不足，缺乏统一规划和指导","note":"「评估为什么跑偏」这一问，陈引周志忍的判断：规范化不足、标准不统一。","context":"…操作方面都还需要不断完善。绩效评估在公共管理过程中具有重要地位，客观、系统、全面的评估是公共管理不可缺少的基本环节。在谈到我国绩效评估存在的问题时，周志忍说：“与发达国家的实践相比，我国公共组织绩效评估的规范化程度明显不足，缺乏统一规划和指导，评估活动分散在多种管理机制中，由此带来了评估内容和侧重点上差别大、评估标准不统一、评估程序和方法不一致等问题，影响了评估在实践中的效果。”②作为首个“中国政府绩效评估报告”课题主持人的桑助来认为，中国目前的各种政府绩效评估体系的运行存在五…","contextPage":395}],"moduleId":"m12","order":2},"l13-1":{"id":"l13-1","title":"西方公共部门改革：三个方向","goal":"能按「职能—服务方式—内部管理」三层复述西方改革内容，并说出私有化、合同出租与社会化各自改变了什么。","minutes":15,"tag":"第13章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2022 年简答考「当代西方国家公共部门改革的内容」，2020 年案例直接用英国改革做材料。这一节的结构非常清楚，就是三个方向。"},{"t":"p","h":"方向一：重新界定和优化政府职能","text":"20 世纪 70 年代西方国家公共管理陷入困境，一个重要原因就是**政府职能扩张**。所以改革的**第一要务是重新界定和优化政府职能**，回答政府该管什么、不该管什么、怎么管。\n\n具体两条路：一是在政府部门内部实行**大部制**，把相近职能集中到一个部门，精简机构、减少横向协调困难；二是政府从大量社会事务中解脱出来，交给或归还给社会经济组织、中介组织，政府转而制定规则、执行法律、监督这些组织。\n\n基本途径是**非国有化（公有企业和公用事业的产权转移或私有化）、自由化、压缩式管理**。经过调整，西方政府的经济社会管理职能基本只剩三项：建立经济立法体系、加强宏观调控、提供公共物品与公共服务。"},{"t":"p","h":"方向二：公共服务市场化与社会化","text":"**市场化**通过市场工具实现，教材列了八种：**私有化、使用者付费、合同外包、招标投标、委托代理、分散决策、产权的交易和内部市场**。\n\n**社会化**通过政府与社会构建伙伴关系、把部分服务交由社区或非政府组织实现，四种实践形式：\n**一是政府业务合同出租**——招标投放、签订合同、按标准验收付费；范围已从机关后勤扩到环境保护、公用设施维护、决策咨询与政策设计、项目影响评价、绩效评估等。其实质是政府通过合同在公共领域引入市场机制，完成公共服务提供的「准市场化」。\n**二是以私补公、打破政府垄断**——用说服、表彰、政策优惠吸引私人资本投入教育、社会保险、退休保障、廉价住宅、医疗服务等。\n**三是建立政府部门与私营企业的伙伴关系**——固定伙伴承担特定管理职能并获优惠，非固定合作则通过许可证附加条件要求企业提供特定社会服务。\n**四是公共服务社区化**——鼓励社区办养老、残疾人福利，政府机构出面组织邻里互助、街道联防。"},{"t":"cmp","h":"三个易混概念的分界","head":["做法","改变了什么","还留下什么"],"rows":[["私有化（非国有化）","产权：公有企业产权转移给私人","监管责任仍在政府"],["合同外包","生产：政府仍是购买者与监督者","政府保留标准制定与验收权"],["公共服务社区化","供给主体：交给社区与非政府组织","政府维持职能与服务水平，机构人员可精简"]]},{"t":"p","h":"方向三：政府部门内部的管理体制改革","text":"内部改革包括**组织机构改革、权责关系调整、人事制度改革、管理方法和技术改革**，目的是提高效率与服务质量。两个抓手：\n\n**一是利用信息技术建立公共行政信息系统。** 引进私人部门的管理技术改造政府，如美国 1993 年《运用信息技术改造政府》提出 13 项建议、英国《政府现代化》白皮书与部长管理信息系统。这里的电子政务不是单纯技术概念，而是以信息技术为基础的政府治理新模式。\n**二是实行分权与权力下放。** 既涉及中央与地方，也涉及政府内部上下级。英国《下一步行动方案》、新西兰公司化改革把中下层组织转为独立单位、实行经理负责制；效果是上下级由**直接隶属转为合同关系**，上级控制由**着眼于过程转为着眼于结果**，体现决策与执行分离与分权制度化。"},{"t":"ask","q":"为什么西方改革几乎都从「重新界定职能」开始，而不是先改内部管理？","a":"因为职能是分母。职能不减，机构就减不掉，人也就减不掉；只改内部流程，等于用更高效的方式做本不该由政府做的事。教材把职能扩张认定为 70 年代困境的重要原因，所以改革的第一刀切在「政府该管什么」上，之后的私有化、合同外包、社区化才有可能。答中国改革题时同理——1988 年那次之所以被记住，就是因为它第一次明确了「以转变政府职能为中心」。"},{"t":"tip","text":"答「西方改革内容」时按三层写：职能（大部制+移交社会+非国有化）、服务（市场化八工具+社会化四形式）、内部（电子政务+分权）。三层各有一个小标题，10 分就很稳。"}],"concepts":[{"term":"压缩式管理","def":"通过压缩政府规模与支出、把公共企业交给市场和社会、放松管制来实现政府从社会部分撤退的管理方式。","points":["是非国有化、自由化之外优化职能的第三条途径","与私有化不同：它强调规模与支出的压缩","常与「小政府」主张一起出现"],"exam":"答「西方国家如何优化政府职能」时的第三个得分点。"},{"term":"政府业务合同出租","def":"政府将需要或适合出租的公共项目向私营企业与社会中介招标，中标者按合同标准完成服务，政府按约付费。","points":["实质：通过合同在公共领域引入市场机制，实现「准市场化」","范围已从后勤事务扩展到政策设计、项目评价、绩效评估等","关键：政府保留标准与验收，而非放弃责任"],"exam":"案例题里判断「这属于哪种工具」的高频选项。"}],"exercises":[{"t":"multi","q":"当代西方国家公共部门改革的主要内容包括：","opts":["重新界定和优化政府职能","利用市场和社会力量实行公共服务社会化、市场化","政府部门内部的管理体制改革","扩大政府直接生产的范围"],"a":[0,1,2],"why":"D 与改革方向相反：改革是减少政府直接生产而增加购买、监管与合作。"},{"t":"multi","q":"教材列出的市场化工具包括：","opts":["私有化、使用者付费","合同外包、招标投标","委托代理、分散决策","产权交易、内部市场"],"a":[0,1,2,3],"why":"八种市场化工具全在选项里。答「公共服务市场化怎么实现」时按这八种列。"},{"t":"choice","q":"经过职能优化调整后，西方国家政府的经济社会管理职能主要限于：","opts":["直接经营国有企业、管理市场价格、分配社会资源","建立经济立法体系、加强宏观调控、提供公共物品与公共服务","审批企业投资、管理人事、组织生产","维护社会治安、征收税收、兴办公用事业"],"a":1,"why":"教材把调整后的职能归为三类：经济立法、宏观调控、提供公共物品与公共服务。这是「职能收缩」的具体刻度。"},{"t":"judge","q":"西方改革中，上下级关系由直接隶属转变为合同关系，上级控制由着眼于过程转为着眼于结果。","a":true,"why":"这是分权与权力下放改革的核心效果，也体现了决策与执行分离、分权制度化的趋势。"},{"t":"order","q":"把公共服务市场化的实现链条排好。","items":["政府确定服务标准与可出租项目","向私营企业与社会中介招标投放","中标者按合同标准提供服务","政府按合同验收并支付报酬"],"a":[0,1,2,3],"why":"这条链说明合同出租不是「甩包袱」：标准、验收、付费三个环节仍由政府掌握。"}],"write":{"type":"简答题","prompt":"用 13 分钟写「当代西方国家公共部门改革的主要内容」（10 分）。","minutes":13,"points":["总述：改革涉及公共部门自身以及它与社会、市场、企业的关系，具有普遍性与广泛性","内容一：重新界定和优化政府职能（大部制、职能移交社会、非国有化与自由化、压缩式管理）","点明职能调整后的三项：经济立法、宏观调控、提供公共物品与公共服务","内容二：公共服务市场化（私有化、使用者付费、合同外包、招标投标等八种工具）","内容三：公共服务社会化（合同出租、以私补公、公私伙伴关系、公共服务社区化）","内容四：内部管理体制改革（电子政务与信息系统、分权与权力下放、人事与管理方法改革）"],"sample":"当代西方国家公共部门改革涉及公共部门自身以及公共部门与社会、市场、企业关系的多方面，具有普遍性和范围广泛性的特点。其主要内容有三：第一，重新界定和优化政府职能，解决政府应该管什么、不应该管什么和怎么管的问题，一方面在政府内部实行大部制、精简机构，另一方面把大量社会事务交给或归还给社会经济组织与中介组织，基本途径是非国有化、自由化和压缩式管理，调整后政府的经济社会管理职能限于建立经济立法体系、加强宏观调控、提供公共物品与公共服务。第二，利用市场和社会力量实行公共服务社会化、市场化：市场化通过私有化、使用者付费、合同外包、招标投标、委托代理、分散决策、产权交易和内部市场等工具实现；社会化则通过政府与社会构建伙伴关系、把部分服务交由社区或非政府组织实现，具体形式包括政府业务合同出租、以私补公打破垄断、建立政府部门与私营企业的伙伴关系以及公共服务社区化。第三，推进政府部门内部的管理体制改革，包括组织机构改革、权责关系调整、人事制度改革与管理方法技术改革，典型做法是利用信息技术建立公共行政信息系统，以及实行分权与权力下放，使上下级由直接隶属转为合同关系、控制由着眼于过程转为着眼于结果。","tip":"三层各写一句「改革什么」＋一句「怎么做」，比只罗列名词强。结尾带上「决策与执行分离、分权制度化」这一句判断，是 10 分答案的标志。"},"evidence":[{"src":"cai-wang-3","pages":[489],"quote":"公共部门改革的第一要务就是重新界定和优化政府职能","context":"…方国家公共部门改革的内容进行如下概括。13.2.2.1重新界定和优化政府职能20世纪70年代，导致西方国家公共管理面临困境的一个重要原因就是政府职能扩张。因此，公共部门改革的第一要务就是重新界定和优化政府职能，解决政府应该管什么、不应该管什么和怎么管的问题。一是在政府部门内部实行大部制，将相近的职能尽可能集中到一个部门，精简政府机构，减少横向协调的困难；二是政府从大量社会事务中解脱出来，将这些职能交给或归还给社会，由社会经济组织或中介组织去承担…","contextPage":489},{"src":"cai-wang-3","pages":[490],"quote":"主要运用的市场化工具有：私有化、使用者付费、合同外包、招标投标、委托代理、分散决策、产权的交易和内部市场","context":"…段是西方各国公共部门改革的重要举措，我们把那些在某一方面具有明显市场特征（如价格、利润、私有产权、金钱诱因、自由化等）的方式、方法和手段，都称为市场机制的表现。主要运用的市场化工具有：私有化、使用者付费、合同外包、招标投标、委托代理、分散决策、产权的交易和内部市场。2.公共服务社会化的实践形式（1）政府业务合同出租。利用合同承包的方式把政府的一些工作任务推向市场，其基本运作方式是政府将需要或者适合出租的公共项目向私营企业以及社会中介组织招标投放，由竞争获胜的私营企业与政府主管部门签订合同，企业完成任…","contextPage":490},{"src":"cai-wang-3","pages":[491],"quote":"政府部门内部的管理体制改革包括组织机构改革、权责关系调整、人事制度改革、管理方法和技术改革等方面","context":"…府机构和人员消减的有效途径，对提高行政效率、降低财政支出、利用市场对公共机构形成竞争压力等方面具有十分重要的积极意义。13.2.2.3政府部门内部的管理体制改革政府部门内部的管理体制改革包括组织机构改革、权责关系调整、人事制度改革、管理方法和技术改革等方面，其目的是提高政府工作效率和服务质量。改革内容主要有：1.利用信息技术革命新成果，建立公共行政信息系统当代西方国家政府部门内部管理体制改革的一个显著特征就是充分体现了管理主义倾向，即引进现代化管理技术尤其是私人部门的管理技术、管理理论、原则…","contextPage":491},{"src":"chen-2","pages":[80],"quote":"统治是政府垄断公共事务管理的活动，而治理是政府、企业、社会团体和个人等公共行动者共同处理公共事务的活动","note":"陈的治理—统治对比是三条（主体、客体、机制），蔡王讲改革方向，两边正好接上。","context":"…的目标相通，都需要借助公共权力维持社会秩序和处理公共事务，以促进公共利益的最大化，但二者在实现公共利益的过程中又具有明显的区别，这表现在：（1）管理的主体不同。统治是政府垄断公共事务管理的活动，而治理是政府、企业、社会团体和个人等公共行动者共同处理公共事务的活动。（2）管理的客体不同。与统治相比，治理的对象更多、范围更广。治理除了要处理公共问题、管理公共资源（与统治一样）外，还要解决涉及人群较少的集体事务（如公共池塘资源）。（3）管理的机制不同。统治主要依靠政府的权威，由科层官僚制组织对公共事务进…","contextPage":80}],"moduleId":"m13","order":1},"l13-2":{"id":"l13-2","title":"中国行政体制改革：八轮改革与一条主线","goal":"能说出我国行政体制改革的三个阶段与关键节点，并解释「以转变政府职能为中心」为什么是主线。","minutes":15,"tag":"第13章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"这一节看似是历史，其实是答题素材库。2025 年名解「公共部门改革」、2022 年简答「事业单位改革」都要用它做背景。"},{"t":"p","h":"五个坚持：改革积累的经验","text":"教材把我国行政体制改革的经验概括为五条：坚持**以科学理论为指导**；坚持**从中国国情和实际出发**；坚持**以人民为中心、执政为民**；坚持**统筹规划、协调推进**；坚持**提高改革决策的科学性**。\n\n这五条本身就是答「我国改革的特点」或「为什么改革能持续推进」的骨架，比只写「坚持党的领导」更具体。"},{"t":"p","h":"两个大阶段，三小步","text":"**第一阶段（1949—1978）**：中国特色社会主义行政体制的创立与奠基期。建立了各级政权与各项行政管理制度，先后经历 1951、1954、1960、1968 年四次调整，形成与计划经济体制相适应的行政体制。\n\n**第二阶段（1978 至今）**：不断改革与完善期，大体三步——十一届三中全会到十四大之前，主要是**冲破**高度集中的计划经济体制与行政管理模式；十四大到十七大，按发展社会主义市场经济的要求**全面推进行政体制改革**；党的十八大以来，主要是完善和发展中国特色社会主义制度、**推进国家治理体系和治理能力现代化**，推进服务型政府与法治政府建设。\n\n这个时期为建立办事高效、运转协调、行为规范的行政体制，共进行了**八轮改革**。"},{"t":"cmp","h":"四个关键节点","head":["年份","重点","为什么值得记"],"rows":[["1982","撤并机构、裁减人员，解决副职过多与干部老化","改革开放后第一次，重点是「机构」"],["1988","以转变政府职能为关键、以经济管理部门为重点，实行「三定」","第一次明确提出以转变政府职能为中心"],["1993","围绕建立社会主义市场经济体制调整职能配置、理顺关系、划分权限","目标是建立适应市场经济的行政体制"],["1998","把政府职能界定为宏观调控、社会管理和公共服务；政企分开突破；启动行政审批制度改革","新中国成立以来规模最大的一次"]]},{"t":"ask","q":"为什么说「转变政府职能」是这八轮改革的主线，而不是精简机构？","a":"因为机构是职能的影子。1982 年先动机构，减了人但职能没变，机构很快又长回来；1988 年第一次把「转变职能」摆到中心，先回答政府该做什么，再决定设哪些机构、配多少人，精简才稳得住。教材把「以转变政府职能为中心」这句话记在 1988 年那次，正是这个转折。答中国改革题时，用这条主线解释「为什么有的改革反复、有的改革有效」，比按年份罗列更有说服力。"},{"t":"tip","text":"年份不需要全部背。记住四个节点（1982 机构、1988 职能、1998 规模最大、十八大以来治理现代化）＋一条主线（转变政府职能），已经够答绝大多数题。"}],"concepts":[{"term":"中国行政体制改革","def":"新中国成立以来，为与政治、经济和社会实际相适应而对行政体制进行的持续调整，改革开放后共进行八轮改革。","points":["两个阶段：1949—1978 创立奠基；1978 至今改革完善（三小步）","主线和关键：以转变政府职能为中心（1988 年首次明确）","十八大以来：推进国家治理体系和治理能力现代化，建设服务型与法治政府"],"exam":"案例题的背景段，以及「我国改革的特点」类简答。"},{"term":"三定","def":"定职能、定机构、定编制的机构编制管理方式，1988 年改革起实行。","points":["先定职能，再定机构与编制","强化了机构编制管理、促进机构精简","体现「职能决定机构」的逻辑"],"exam":"解释「为什么 1988 年改革被称为转折」的关键细节。"}],"exercises":[{"t":"choice","q":"第一次明确提出政府机构改革以转变政府职能为中心的是：","opts":["1982 年改革","1988 年改革","1993 年改革","1998 年改革"],"a":1,"why":"1988 年改革以转变政府职能为关键、以经济管理部门为重点，并实行「三定」，是这条主线的起点。"},{"t":"choice","q":"新中国成立以来规模最大的一次行政体制改革是：","opts":["1982 年","1988 年","1998 年","2003 年"],"a":2,"why":"1998 年改革明确把政府职能界定为宏观调控、社会管理和公共服务，政企分开有新突破，机构和人员大幅减少。"},{"t":"multi","q":"我国行政体制改革积累的经验包括：","opts":["坚持以科学理论为指导，坚持从中国国情和实际出发","坚持以人民为中心和执政为民","坚持统筹规划、协调推进","坚持提高改革决策的科学性"],"a":[0,1,2,3],"why":"五条经验全在选项里（第五条的表述即「提高改革决策的科学性」）。"},{"t":"judge","q":"改革开放以来的行政体制改革大体经历了「冲破计划经济体制—全面推进行政体制改革—推进国家治理现代化」三个阶段。","a":true,"why":"分别对应十一届三中全会到十四大之前、十四大到十七大、党的十八大以来。"},{"t":"order","q":"按时间排列四个关键节点。","items":["1982 年：撤并机构、裁减人员","1988 年：以转变政府职能为中心、实行三定","1998 年：界定三项职能、政企分开、启动行政审批制度改革","党的十八大以来：推进国家治理体系和治理能力现代化"],"a":[0,1,2,3],"why":"这条顺序也展示了主线：从动机构，到动职能，再到动治理方式。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「我国行政体制改革的历史进程与主线」（10 分）。","minutes":12,"points":["先写五条经验：科学理论、国情实际、以人民为中心、统筹协调、决策科学性","第一阶段 1949—1978：创立奠基，四次调整，与计划经济体制相适应","第二阶段 1978 至今三小步：冲破旧体制、全面推进行政体制改革、推进国家治理现代化","关键节点一：1982 年撤并机构裁减人员","关键节点二：1988 年首次以转变政府职能为中心，实行三定","关键节点三：1998 年明确三项职能、政企分开、启动行政审批制度改革","收束：主线是转变政府职能，机构与人员随之调整"],"sample":"我国行政体制改革积累了五条经验：坚持以科学理论为指导，坚持从中国国情和实际出发，坚持以人民为中心和执政为民，坚持统筹规划、协调推进，坚持提高改革决策的科学性。其历史进程分两大阶段：1949 年到 1978 年是中国特色社会主义行政体制的创立与奠基期，先后经历 1951、1954、1960、1968 年四次调整，形成与计划经济体制相适应的行政体制；1978 年以来是不断改革与完善期，大体三步——十一届三中全会到十四大之前主要是冲破高度集中的计划经济体制和行政管理模式，十四大到十七大按发展社会主义市场经济要求全面推进行政体制改革，党的十八大以来主要是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化、建设服务型与法治政府。其间共进行八轮改革，关键节点有：1982 年撤并机构、裁减人员；1988 年第一次明确以转变政府职能为中心，实行「三定」；1993 年围绕建立社会主义市场经济体制调整职能配置；1998 年把政府职能界定为宏观调控、社会管理和公共服务，政企分开取得突破，并启动行政审批制度改革。贯穿其中的主线是以转变政府职能为中心，机构设置与人员编制随之调整。","tip":"年份写错不可怕，主线写丢才致命。哪怕只写「1982 动机构、1988 动职能、1998 定三项职能、十八大以来治理现代化」，只要把主线点透，分数就不会低。"},"evidence":[{"src":"cai-wang-3","pages":[504],"quote":"坚持以科学理论为指导，坚持从中国国情和实际出发","context":"…体制改革的历史进程与我国政治、经济和社会客观实际的变化相联系，新中国成立以来的行政体制改革也经历了不同的发展阶段。我国行政体制改革积累的丰富经验，概括起来包括：坚持以科学理论为指导，坚持从中国国情和实际出发，坚持以人民为中心和执政为民，坚持统筹规划、协调推进，坚持提高改革决策的科学性。13.3.2.11949年新中国成立到1978年实行改革开放从1949年新中国成立到1978年实行改革开放，是中国特色社会主义行政体制创立和奠基的时期。这一历史…","contextPage":504},{"src":"cai-wang-3","pages":[505],"quote":"我国进行了八轮改革","context":"…来的行政体制改革也不断深化，与社会主义市场经济体制和社会主义民主政治建设相适应的行政体制不断完善。在这个时期，为建立一个办事高效、运转协调、行为规范的行政体制，我国进行了八轮改革。1.1982年改革1982年改革是改革开放后的第一次行政体制改革。改革的重点在行政机构方面，改革的主要内容是撤并机构、裁减人员，以解决干部副职过多和干部老化等问题。2.1988年改革1988年的行政体制改革是在政治体制改革的大背景下进行的…","contextPage":505},{"src":"cai-wang-3","pages":[505],"quote":"1988年改革第一次明确提出了政府机构改革以转变政府职能为中心这个问题","context":"…革以转变政府职能为关键、以经济管理部门为重点，改革内容包括理顺职能关系、转变职能、精简机构、改革管理权限关系。同时，各地还普遍进行了转换企业经营机制的改革试点。1988年改革第一次明确提出了政府机构改革以转变政府职能为中心这个问题，强化了宏观管理职能、行业管理与监督职能；在增强机构活力、提高行政效率方面迈出了重要一步；实行“三定”，严格了机构编制管理，促进了机构精简。3.1993年改革1993年改革是围绕建立社会主义市场经济体制的目标来进行的，其方向与目标是建立适应…","contextPage":505},{"src":"cai-wang-3","pages":[505],"quote":"1998年改革是新中国成立以来规模最大的一次行政体制改革","context":"…标是建立适应社会主义市场经济体制需要的行政体制。改革内容包括调整职能配置、理顺各部门间的关系、合理划分权限、调整机构设置、精简机构和人员编制。4.1998年改革1998年改革是新中国成立以来规模最大的一次行政体制改革，明确把政府职能界定为宏观调控、社会管理和公共服务；政企分开有了新的突破，党政机关与所办的经济实体和所管理的直属企业脱钩；中央各部门的部分审批权和具体事务性工作下放给地方政府，国务院机构和人员大幅减少。1999年底，我国启动了又一个重大行政…","contextPage":505},{"src":"chen-2","pages":[109],"quote":"这次改革的突破口和切入点，就是建设服务型政府","note":"陈把中国行政体制改革的落点定在服务型政府，答「改革方向」时比只写「转变职能」更具体。","context":"…实施的战略。“前者反映了行政管理体制必须要有长期目标和总体规划，以明确改革的路径与方向。后者说明一个时期有一个时期的改革重点，一个阶段有一个阶段的改革任务。”①这次改革的突破口和切入点，就是建设服务型政府，按照服务型政府的要求来总体规划行政体制改革。实际上，改革开放以来的几次政府机构改革，都没有很好地解决改革的定位问题，对于改革往哪里走、去往何方，都没有清楚的认识。改革往往成为“拆庙赶和尚”的代名词，很容易走上“放乱收死”的老路。因此，行政…","contextPage":109}],"moduleId":"m13","order":2},"l3-5":{"id":"l3-5","title":"政府间关系：中央与地方之间那张网","goal":"能说出政府间关系的定义与四个特征、三种研究途径、拉焦尔三种分权类型，并按「问题—原因—措施」答我国政府间关系改革。","minutes":17,"tag":"陈书","reviewStatus":"reviewed","dual":{"cai":"第3章 §3.1–3.5（几乎无对应内容）","chen":"第4章 政府间关系","diff":"蔡王只在导论把「联邦与政府间关系理论」列为理论之一，正文没有展开；陈振明第4章是专章——定义与特征、三种研究途径、拉焦尔模式、我国改革。这一课全部按陈书学。"},"blocks":[{"t":"lead","text":"618 考过「我国政府间关系改革的必要性和措施」。这一题在蔡王版里几乎找不到落点——它只在导论里被列成一个理论名；真正成章讲的是陈振明第4章。这一课只能按陈书学。"},{"t":"p","h":"定义先立住","text":"政府间关系不是「中央和地方谁大」的争论，而是一张网：纵向的中央与地方、地方与地方，横向的同级政府之间、政府部门之间，都在里面。定义里同时给了四个特征——**多层次、多主体、网络状、动态性**。答题第一句把定义和特征一起写出来，后面才有得展开。"},{"t":"quote","text":"政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。","cite":"陈振明《公共管理学》第二版 · OCR 第 126 页"},{"t":"p","h":"三种研究途径，对应三个时期","text":"陈书把研究途径归成三类：**中央控制模式**（单一制传统，强调命令与服从）、**地方自治模式**（分权改革，强调地方选举与财政自主）、**网络模式**（跨域协作，强调多中心、相互依存、协商）。三种途径不是三选一的对错题，而是「用哪副眼镜看」的问题；答「我国改革」时，落点通常在从第一种走向第三种。"},{"t":"cmp","h":"三种途径的差别（简答可直接照此分点）","head":["途径","分析对象","关系特征","常用手段"],"rows":[["中央控制模式","中央政府与地方政府的层级链条","命令与服从、上级主导","行政控制、人事与财政集中"],["地方自治模式","地方政府的自主权与选举责任","自治与认同、地方优先","地方选举、财政自主、法定分权"],["网络模式","多中心的公共行动者","相互依存、协商合作","跨域协议、伙伴关系、共同规划"]]},{"t":"p","h":"拉焦尔：按分权程度分三类","text":"拉焦尔模式是名解题的常客。它按**分权程度**把政府间关系分成**政治性分权、行政性分权、行政权转让**三类：政治性分权下地方政府有宪法地位、与中央对等；行政性分权下地方有部分财政自主，但仍从属于中央；行政权转让下地方完全从属于中央，权限由中央让渡。判断一道材料题属于哪一类，先看「地方的钱和权从哪来」。"},{"t":"quote","text":"拉焦尔根据分权的程度将政府间关系的类型分为三种","cite":"陈振明《公共管理学》第二版 · OCR 第 132 页"},{"t":"p","h":"我国的问题：四个症状，一个病根","text":"陈书把我国政府间关系的缺陷概括成四条：**地方政府权力膨胀、中央集权权威弱化、中央地方「讨价还价」、地方分割与条块矛盾加剧**。病根是 20 世纪 90 年代中期以来的「选择性集权」——中央通过垂直管理收回控制权，地方立法权受限，结果是**地方财权与事权脱节**，地方对中央产生抵触。"},{"t":"quote","text":"目前我国政府间关系中还存在地方政府权力的膨胀、中央集权权威的弱化、中央地方之间“讨价还价”、地方政府间的分割和条块矛盾的加剧等问题。","cite":"陈振明《公共管理学》第二版 · OCR 第 151 页"},{"t":"p","h":"改革怎么走：三条建议","text":"世界银行 1995 年给深化分权的三条建议，被陈书用来收束这一节：**明确划分各级政府职能并给地方相应的管理权与财权；改革财税制度，给地方更大的财政自主权；在中央规制与地方自治之间找平衡**。这三条正好对应上面四个症状：职能、钱、平衡。"},{"t":"quote","text":"一是明确划分各级政府的职能，给予地方政府更多的管理权和财权，以使之与其承担的职能匹配；二是改革财政税收制度，使地方政府有更大的财政自主权以便行使其职能；三是在中央规制和地方自治之间寻求平衡","cite":"陈振明《公共管理学》第二版 · OCR 第 152 页"},{"t":"ask","q":"为什么「选择性集权」反而造成地方财权与事权脱节？","a":"集权收回的是控制权（审批、垂直管理、立法限制），但地方承担的事权并没有减少；财权上收、事权下沉，两端不对等，地方只能用「讨价还价」、土地财政等方式补缺口，条块矛盾随之加剧。所以改革不是简单「再分权」，而是先把职能和财权对应起来。"},{"t":"tip","text":"论述题按四段写：定义与特征 → 四个问题 → 选择性集权这个原因 → 职能／财税／平衡三条措施。每段开头一句是判分点，别把四段揉成一大段。"}],"concepts":[{"term":"政府间关系","def":"中央政府与各级地方政府之间纵横交错的网络关系，包括纵向的央地关系、地方间关系，以及同级政府与政府部门之间的互动关系。","points":["四个特征：多层次、多主体、网络状、动态性","三种研究途径：中央控制、地方自治、网络","我国问题集中在财权事权不匹配与条块矛盾"],"exam":"名解先写定义＋四特征；论述按「问题—原因—措施」三段展开。"},{"term":"拉焦尔模式","def":"按分权程度把政府间关系分为政治性分权、行政性分权、行政权转让三类。","points":["政治性分权：地方有宪法地位，与中央对等","行政性分权：地方有部分财政自主，仍从属中央","行政权转让：地方完全从属，权限由中央让渡"],"exam":"常以名解或材料判断题出现，判断依据是「地方的权与钱从哪来」。"},{"term":"网络模式","def":"把政府间关系看作多中心行动者相互依存、协商合作的网络，而非单一中心的等级控制。","points":["强调跨域、跨部门的伙伴关系","对应区域协作、城市群治理等实践","与中央控制、地方自治并列为第三种途径"],"exam":"答「改革方向」时用来收束：从等级控制走向网络协作。"}],"exercises":[{"t":"choice","q":"下面哪一项不属于陈书概括的政府间关系特征？","opts":["多层次","多主体","网络状","单向命令"],"a":3,"why":"四个特征是多层次、多主体、网络状、动态性。「单向命令」是中央控制模式的手段特征，不是政府间关系本身的特征。"},{"t":"multi","q":"拉焦尔按分权程度划分的三种类型包括：","opts":["政治性分权","行政性分权","行政权转让","司法性分权"],"a":[0,1,2],"why":"拉焦尔的三类是政治性分权、行政性分权、行政权转让。没有「司法性分权」这一类，这是常见干扰项。"},{"t":"judge","q":"网络途径把政府间关系理解为单一中心、自上而下的等级控制。","a":false,"why":"恰好相反。网络途径强调多中心、相互依存与协商合作；单一中心、等级控制是中央控制模式的假设。"},{"t":"choice","q":"按陈书，我国地方政府「财权与事权脱节」的直接制度原因是：","opts":["地方选举制度不完善","选择性集权：控制权上收而事权仍留在地方","地方政府没有立法权","中央不再对地方转移支付"],"a":1,"why":"陈书的判断是：90 年代中期以来的选择性集权，通过垂直管理与收权强化中央控制，但地方承担的事权没有同步减少，于是财权与事权脱节。"},{"t":"order","q":"把「我国政府间关系改革」的作答顺序排好（问：改革措施）。","items":["明确各级政府职能，给地方与职能匹配的管理权和财权","改革财税制度，扩大地方财政自主权","在中央规制与地方自治之间寻求平衡"],"a":[0,1,2],"why":"世界银行三条建议的顺序就是「职能—钱—平衡」：先定事，再配钱，最后调关系。按这个顺序写，阅卷一眼看到结构。"}],"write":{"type":"简答/论述","prompt":"用 14 分钟写「我国政府间关系改革的必要性和措施」（10 分）。要求：定义一句 + 问题两条以上 + 原因一句 + 措施两条以上。","minutes":14,"points":["给出定义并点到多层次、多主体、网络状、动态性","写出我国的问题：地方权力膨胀、中央权威弱化、讨价还价、条块分割","点出原因：选择性集权导致财权与事权脱节","给出措施：明确职能、改革财税、中央规制与地方自治平衡","结尾有一句方向判断（从等级控制走向网络协作）"],"sample":"政府间关系是中央政府与各级地方政府之间纵横交错的网络关系，具有多层次、多主体、网络状和动态性。我国当前的主要问题是：地方政府权力膨胀与中央权威弱化并存、中央地方之间讨价还价、地方分割与条块矛盾加剧。其制度原因在于 20 世纪 90 年代中期以来的选择性集权：控制权上收而事权仍留在地方，造成财权与事权脱节。改革应从三方面推进：一是明确划分各级政府职能，给予地方与职能匹配的管理权和财权；二是改革财税制度，扩大地方财政自主权；三是在中央规制与地方自治之间寻求平衡，推动政府间关系从等级控制走向网络协作。","tip":"这题最容易只写「要分权」三个字。分权不是目的，职能、财权、事权三者匹配才是——把「匹配」写出来，分数才稳。"},"evidence":[{"src":"chen-2","pages":[126],"quote":"政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。","context":"…，反过来又对政府间的纵向关系产生了深刻影响，大大改变了旧体制下的政府间关系的原有格局，使政府间关系超出了纵向与横向的简单脉络，朝向复杂的网络体系发展。综上所述，政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。4.1.2政府间关系研究的进展1.国外的政府间关系研究在国外，政府间关系一直以来都是公共行政与公共政策领域的重要研究课题。与政府间关系演变的实践相呼应，政府间关系的研究也经历了一个发展的过程。20世纪80年代以前的研究主要关注中央与地方的关…","contextPage":126},{"src":"chen-2","pages":[129],"quote":"包括传统的中央控制模式、地方自治模式和网络模式等","context":"…科、跨学科或交叉学科的领域，有不同的学科视角和研究途径。有政治学、行政学（公共管理学）、经济学、法学、史学和博弈论等不同的学科视角，也形成了多种研究途径或模式，包括传统的中央控制模式、地方自治模式和网络模式等。①这三种分析途径各自反映了不同时期政府间关系的主要特征。中央政府的控制在等级制的政府体系中十分明显。在中央控制模式中，中央政府掌控一切，它从等级制的顶端对政府体系进行管理，而不是着眼于整个体系。地方政府在等级制体系中是被控制的，而不是自控…","contextPage":129},{"src":"chen-2","pages":[132],"quote":"拉焦尔根据分权的程度将政府间关系的类型分为三种","context":"…都将政府间关系作为改革的重点，从而使政府间关系发生了较大的变化。西方学者在对各国实践进行考察的基础上，将不同时期的政府间关系概括成若干类型的模式。1.拉焦尔模式拉焦尔根据分权的程度将政府间关系的类型分为三种：一是政治性分权，二是行政性①参见薄贵利：《集权分权与国家兴衰》，98～126页，北京，经济科学出版社，2001。②参见林涛：《国民经济区域调控：中心城市调控模式研究》，29页，上海，复旦大学出版社，2000。","contextPage":132},{"src":"chen-2","pages":[151],"quote":"我国政府间关系中还存在地方政府权力的膨胀、中央集权权威的弱化、中央地方之间“讨价还价”、地方政府间的分割和条块矛盾的加剧等问题。","context":"…国性的项目也有赖于各级地方政府联合执行，而每个地方政府仅是整个地理拼图的一小块。（4）我国政府间关系存在的缺陷与不足使得政府间关系的进一步调整显得更加迫切。目前我国政府间关系中还存在地方政府权力的膨胀、中央集权权威的弱化、中央地方之间“讨价还价”、地方政府间的分割和条块矛盾的加剧等问题。有分析指出，20世纪90年代中期以来，为了强化中央政府的整合能力和提升国家权威，选择性集权化趋势开始出现。进入21世纪，中央政府通过加强垂直管理、收归控制权以维护中央政令畅通，地方立法权也开始受到限制。这种选择性集权的制度安排导致的后果是地…","contextPage":151},{"src":"chen-2","pages":[152],"quote":"一是明确划分各级政府的职能，给予地方政府更多的管理权和财权，以使之与其承担的职能匹配；二是改革财政税收制度，使地方政府有更大的财政自主权以便行使其职能；三是在中央规制和地方自治之间寻求平衡","context":"…新、更有效的激励制度以及各级政府之间相互支持与合作的机制，这些比简单的放手放权更重要。1995年，世界银行曾对深化分权以更好地发挥地方政府的功能提出了三个建议：一是明确划分各级政府的职能，给予地方政府更多的管理权和财权，以使之与其承担的职能匹配；二是改革财政税收制度，使地方政府有更大的财政自主权以便行使其职能；三是在中央规制和地方自治之间寻求平衡。①这些建议对各国的改革都具有普遍的指导意义。对我国地方分权的具体改革而言，仍有许多需要大力推进的地方。在事务管理权限的划分中，关键性的问题是地方性“公共事务”的最终决策权问题。地方性“公共事务”应主要由地方政府做出最终决策，这是衡量政府体…","contextPage":152},{"src":"cai-wang-3","pages":[30],"quote":"联邦与政府间关系理论","note":"蔡王版只在导论把它列为公共行政学理论之一，没有展开。","context":"…》（HandbookofPublicAdministration）一书中，把公共行政学的基本理论概括为：公共组织理论、公共预算与财政管理理论、公共人事行政理论、联邦与政府间关系理论、公共政策与分析理论、公共决策理论、比较公共行政理论、公共行政的法律规则理论、公共行政教育理论、司法行政理论、行政发展理论、行政环境理论等②。美国詹姆斯·佩里教授在他1996年撰写的《公共行政手册》（HandbookofPublicAdmi…","contextPage":30}],"moduleId":"m3","order":5},"l3-6":{"id":"l3-6","title":"第三部门：政府与市场之外的第三只手","goal":"能界定第三部门并说清它与非营利组织、NGO 的名称差别，用政府失败、契约失灵与第三部门理论解释公共服务供给，答出第三部门的作用与我国发展路径。","minutes":16,"tag":"陈书","reviewStatus":"reviewed","dual":{"cai":"第3章 §3.3（非营利组织与第三部门）","chen":"第10章 第三部门管理","diff":"蔡王把第三部门当作公共组织的一类，几笔带过；陈书专章讲兴起原因（政府失败、契约失灵与第三部门理论）、志愿失灵、作用与我国路径。作用题与兴起原因题都按这一课答。"},"blocks":[{"t":"lead","text":"618 考过「第三部门的作用」和「非营利组织的兴起原因」。蔡王版把第三部门当作公共组织的一类，几句话带过；陈振明给了整章：兴起原因、志愿失灵、作用、我国路径。这一课按陈书补。"},{"t":"p","h":"先分清四个名字","text":"第三部门、非营利组织、非政府组织（NGO）、志愿组织，说的是同一类组织，差别在强调什么：强调**不以营利为目的**就叫非营利组织，强调**相对政府独立**就叫非政府组织，强调**志愿参与**就叫志愿组织。非营利不等于没有收入或结余，关键在于非分配约束；这些名称的具体使用还受国家惯例影响。"},{"t":"quote","text":"强调组织的存在不是为了营利或是强调组织与企业之间的区别时，就应选择“非营利组织”","cite":"陈振明《公共管理学》第二版 · OCR 第 306 页"},{"t":"p","h":"三种理论：为什么需要非营利供给","text":"陈书在解释非营利部门介入公共服务时列出三种理论。**政府失败理论**：政府供给难以满足异质性需求，非营利组织补充供给。**契约失灵理论**：信息不对称使消费者难以约束营利机构，非营利组织的非分配约束可减少逐利动机。**第三部门理论（第三方管理理论）**：从交易成本与志愿失灵出发，说明政府和非营利组织为什么需要互补。市场失灵是讨论的背景；志愿失灵是第三部门自身的局限，不能把它当作组织兴起的唯一原因。"},{"t"

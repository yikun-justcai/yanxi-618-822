d":"p0","order":1},"p1-1":{"id":"p1-1","module":"p1","title":"研究、分析、政策群与政策链","goal":"能区分理论研究与决策服务，并准确解释政策群、政策链。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"学科不是政策文件汇编","text":"政策研究偏重解释政策及其过程、建构和检验理论；政策分析偏重为具体公共问题提供可供决策的知识。公共政策学研究公共政策及政策过程的规律，不只是替某一个部门拟一份方案。两类活动可以互相支持。"},{"t":"p","h":"横向看群，衔接看链","text":"**政策群**是较长时期内理念同源、导向相近而内容不同的政策聚合。**政策链**围绕同一政策问题，由先后形成、相互衔接补充且形态与功能有区别的政策组成。链不等于任意按时间排列的文件。"},{"t":"p","h":"教学情境","text":"某地围绕养老服务先提出基本方针，再制定设施、人员、支付和监管安排。若突出围绕同一问题的衔接，可以从政策链分析；若比较多个领域共同体现的民生理念，则可从政策群分析。写答案时要说明采用哪一个观察角度。"}],"concepts":[{"term":"研究、分析、政策群与政策链","def":"政策研究偏重解释政策及其过程、建构和检验理论；政策分析偏重为具体公共问题提供可供决策的知识。公共政策学研究公共政策及政策过程的规律，不只是替某一个部门拟一份方案。两类活动可以互相支持。","points":["区分研究与分析的侧重点","写清政策群的共同理念与导向","写清政策链的同一问题与衔接关系"]}],"exercises":[{"t":"choice","q":"“解释议程为何改变”与“向决策者推荐方案”主要分别侧重什么？","opts":["政策分析、政策研究","政策研究、政策分析","政策执行、政策废止","两者都只是文件整理"],"a":1,"why":"前者重解释与理论，后者重面向具体决策的应用；不能说二者毫无联系。"},{"t":"judge","q":"政策链只要求文件发布时间先后相接，不要求解决同一问题。","a":false,"why":"围绕同一问题并在内容与功能上衔接，是政策链的关键限定。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「研究、分析、政策群与政策链」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["区分研究与分析的侧重点","写清政策群的共同理念与导向","写清政策链的同一问题与衔接关系"],"sample":"政策研究主要解释政策及其过程并发展理论；政策分析主要提供面向具体决策的知识。政策群强调多项政策在理念和导向上的聚合，政策链强调围绕同一问题的连续衔接。研究养老政策时，应先说明是在分析共同理念，还是分析方案之间的配合关系，不能只凭文件数量作判断。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[18],"quote":"研究的目的或目标是建构政策理论","context":"…活动关注的重点和研究范围是政策内容、政策过程和政策产出，发现和验证政策与其主体和客体之间、与有关社会和自然环境诸因素之间的因果联系。因此，政策研究是一门科学。③研究的目的或目标是建构政策理论，创设研究方法，推动学科发展。④对研究成果的社会反响的期待是获得学术界同僚的肯定。关于政策分析或公共政策分析。“政策分析”作为学术术语是由美国耶鲁大学教授林德布洛姆（CharlesLindblom）于1956年出版的《政策分析》一书中首先提…","contextPage":18},{"src":"ning-3","pages":[23],"quote":"内容各异但理念同源、导向相近的政策的聚合体","context":"…公共政策学不仅研究具体的个别的政策，而且把政策群和政策链纳入自己的研究视野。所谓政策群，是指国家、政府和一定类型的政治体制中的执政党在某一较长时间内制定和实施的内容各异但理念同源、导向相近的政策的聚合体。^{⑤}如自1978年党的十一届三中全会以来中国实行的改革开放政策，涵盖了各个阶段、各个领域、各个方面的成千上万项政策（包括党章、党的历次代表大会的报告决议、党中央历次全会的决议和公报、历次全国人大通过的政府工作报告和其他报告、宪法、法律…","contextPage":23},{"src":"ning-3","pages":[23],"quote":"在形态和功能上具有差别性的一系列政策","context":"…因此，我们就可以把所有这些政策视作“改革开放政策群”。所谓政策链，是指国家、政府和一定类型的政治体制中的执政党为解决同一政策问题而先后制定的在内容上具有一致性、在形态和功能上具有差别性的一系列政策。同一系列的决策相互衔接、相互补充，但其中一、二项政策在形态上更具有完整性，在内容和功能上更具有全面性和系统性，起着统摄全系列的政策的作用，从而使得同一系列的政策环环相扣，如同一个链条。政策链这一概念源于列宁，他在1921年写的一篇文章①李…","contextPage":23}],"moduleId":"p1","order":1},"p1-2":{"id":"p1-2","module":"p1","title":"集体行动困境：公地悲剧与搭便车","goal":"能解释个体理性与集体结果的冲突，并比较两种困境。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"共同获益为何仍不合作","text":"集体行动困境是指成员虽有共同利益，却可能因个体成本收益结构而缺乏合作激励。**公地悲剧**突出有限共享资源的过度使用；**搭便车**突出享受共同收益却回避付费或贡献。不能将二者仅写成“自私”。"},{"t":"p","h":"把机制写出来","text":"共享牧场中，多养一头牲畜的收益由自己取得，而资源耗损由大家承担，过度放牧因而可能扩散。公共照明中，未出资者仍能获益，个体便可能等待别人支付，最终供给不足。前者偏向过度使用，后者偏向贡献不足。"},{"t":"p","h":"解决办法要对准激励","text":"可考虑明确使用边界、设置可执行的使用规则、监督和惩罚、费用分担以及参与协商。规则需要成本与合法性支持；不能断言“私有化”或“政府接管”在任何情形都最优。"}],"concepts":[{"term":"集体行动困境","def":"集体行动困境是指成员虽有共同利益，却可能因个体成本收益结构而缺乏合作激励。**公地悲剧**突出有限共享资源的过度使用；**搭便车**突出享受共同收益却回避付费或贡献。不能将二者仅写成“自私”。","points":["给出集体行动困境的含义","比较过度使用与贡献不足","提出针对激励和执行条件的办法"]}],"exercises":[{"t":"choice","q":"所有居民都希望有路灯，却都等别人付款，最直接体现什么？","opts":["政策终结","搭便车导致供给不足","资源过度放牧","政策已合法化"],"a":1,"why":"收益难排他而贡献有成本，使个体等待他人供给。"},{"t":"judge","q":"个体选择看起来有利，仍可能形成对所有人不利的集体结果。","a":true,"why":"这是解释困境的核心，必须结合外部成本或非排他收益说明。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「集体行动困境：公地悲剧与搭便车」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["给出集体行动困境的含义","比较过度使用与贡献不足","提出针对激励和执行条件的办法"],"sample":"集体行动困境源于共同利益与个体激励之间的矛盾。公地使用者获得私人增益而分摊资源损耗，可能造成过度使用；搭便车者不承担费用仍享受收益，可能造成供给不足。治理应设计使用或缴费规则，配合监督、制裁及协商，并检查规则能否执行，而不能只作道德劝告。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"xie-intro-5","pages":[31],"quote":"如果一种资源没有排他性的所有权，就会导致这种资源的过度使用","context":"1.3公共与私人——从公共角度理解公共政策专栏公地悲剧公地悲剧（tragedyofcommons）是指如果一种资源没有排他性的所有权，就会导致这种资源的过度使用。公地悲剧是哈丁（GarrettHardin）于1968年在《科学》杂志上发表的文章《公地悲剧》（TragedyofCommons）中提出的。哈丁说：“在共享公有物的社会中，每个人，也就是所有人都追求各自的最大利益。这就是悲剧的所在。每个人…","contextPage":31},{"src":"xie-intro-5","pages":[33],"quote":"得到一种物品的收益却避开了为此支付费用","context":"…场晚会的门票时遇到麻烦，因为他的潜在顾客很快就会想到，他们即使不买票也能够看到烟火表演。烟火表演没有排他性，因此，人们会受到“搭便车”的激励。所谓“搭便车”就是得到一种物品的收益却避开了为此支付费用。说明这种市场失灵的一种方法是，它的产生是由于外部性。如果艾伦举行烟火表演，他就给那些不交钱看表演的人提供了一种外在收益。然而，当艾伦决定是否举行烟火表演时，他并不会考虑这种外在收益。尽管从社会角度来看烟火表演是合意的，但从私人角度来看无利…","contextPage":33}],"dual":{"primary":"第5章 非政府政策行为者；第6章 公共选择视角","secondary":"第1章 公地悲剧与搭便车","diff":"本课主要据谢书解释集体行动机制，宁书提供行为者与公共选择的相关背景；不将两书说法拼成同一定义。"},"moduleId":"p1","order":2},"p2-1":{"id":"p2-1","module":"p2","title":"系统、历史与制度：怎样找政策原因","goal":"能用不同视角分析同一问题，并解释路径依赖。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"系统分析看相互作用","text":"系统分析把政策放在相互联系的整体中考察，关注目标、要素、结构、环境和反馈。分析交通拥堵，不能只看道路宽度，还要看出行需求、用地、公共交通和价格机制。"},{"t":"p","h":"历史比较看条件","text":"历史分析追问制度如何形成，比较分析在不同时间或地区之间寻找异同。比较必须说明背景、尺度和可比条件，不能看到甲地效果好，就认为乙地照搬一定有效。"},{"t":"p","h":"路径依赖不等于永不改变","text":"先前的制度选择会通过成本、惯例、组织利益和学习过程影响后续选择，这就是理解路径依赖的入口。既有道路可能产生自我强化，也可能因环境变化、危机或改革而转向。答题要说明延续的机制，不能只写“受历史影响”。"}],"concepts":[{"term":"系统、历史与制度","def":"系统分析把政策放在相互联系的整体中考察，关注目标、要素、结构、环境和反馈。分析交通拥堵，不能只看道路宽度，还要看出行需求、用地、公共交通和价格机制。","points":["列出系统的要素与关联","说明历史或制度如何影响选择","交代比较与移植的条件"]}],"exercises":[{"t":"choice","q":"某地沿用旧审批流程，原因包括培训成本和部门既得利益，适合优先用什么解释？","opts":["路径依赖","完全随机","政策已终结","所有人偏好一致"],"a":0,"why":"旧制度形成的成本和利益结构会强化继续使用旧流程的倾向。"},{"t":"judge","q":"只要甲地政策成功，乙地复制相同文本就能得到相同结果。","a":false,"why":"制度、资源、对象和环境可能不同，比较不能抹去实施条件。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「系统、历史与制度：怎样找政策原因」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["列出系统的要素与关联","说明历史或制度如何影响选择","交代比较与移植的条件"],"sample":"可先把拥堵看作交通、用地与出行需求共同作用的结果，再考察既有道路投资和部门分工如何形成路径依赖。比较其他城市经验时，应控制人口、公交供给和财政能力等差异。政策建议应针对本地的关键关联，而不是直接复制一项成功措施。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[63,64,65],"quote":"系统分析","context":"…于理解不同公共政策的效果及公共政策制定者和执行者的行为。社会学对公共政策研究的另一大贡献在于微观的实证研究方法，这一点将在本书第三章作具体介绍。第二节公共政策的系统分析和矛盾分析一、公共政策的系统分析系统分析已经成为公共政策研究尤其是公共政策分析的基础性方法。有人认为政策研究就是“政策科学和系统分析两者交叉的产物”。①阔德则把公共政策分析看成是运筹学和系统分析的进一步发展，他认为：“运筹学想要帮助人们把事…","contextPage":63},{"src":"ning-3","pages":[79,80],"quote":"路径依赖","context":"…的观点，认为社会力量作用的结果还受到源自过去的特定情势的某些因素的影响，而制度正是该特定情势中最重要的因素。保罗·皮尔逊（PaulPierson）在《回报递增、路径依赖和政治学研究》一文中，依据在开放系统的运动中，在系统的分叉点或临界点上的微小的涨落都可能对系统造成巨大变化的理论，并吸收了新制度主义经济学所揭示的在制度变迁过程中易于形成一种自我强化的路径依赖的观点，提出了自己的路径依赖观。^{③}广义的路…","contextPage":79}],"moduleId":"p2","order":1},"p2-2":{"id":"p2-2","module":"p2","title":"价值分析：有效之外还要问是否值得","goal":"能区分事实判断与价值判断，并写出价值分析的意义。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"事实回答怎样，价值回答应当","text":"事实分析研究发生了什么、可能产生什么后果；价值分析判断目的是否值得、手段是否可接受、结果是否良好。效率数据不能直接代替公平判断；价值立场也不能替代对事实的调查。"},{"t":"p","h":"意义与做法","text":"价值分析帮助确立评价方案的准则、把握社会需求和价值变化，并为政策选择提供方向。实作时先识别利益相关者及其需求，再列出公平、效率、自由、安全等可能冲突的准则，说明优先次序及理由。这里是对教材方法的应用归纳。"},{"t":"p","h":"教学情境：提高公园票价","text":"收入增加是可观察后果；低收入者能否进入涉及分配与机会。即使涨价有助于维护设施，也要比较减免、预约、财政支持等办法，说明谁承担成本、谁获得收益。"}],"concepts":[{"term":"价值分析","def":"事实分析研究发生了什么、可能产生什么后果；价值分析判断目的是否值得、手段是否可接受、结果是否良好。效率数据不能直接代替公平判断；价值立场也不能替代对事实的调查。","points":["区分事实与价值","说明评价准则及利益冲突","给出有理由的取舍"]}],"exercises":[{"t":"choice","q":"哪一句主要是价值判断？","opts":["票价提高了10元","入园人数比去年少","低收入者应享有基本游览机会","维护费为调查记录中的某金额"],"a":2,"why":"“应享有”表达规范主张；其他句子需用证据验证。"},{"t":"judge","q":"一项政策效率高，就无需再讨论公平。","a":false,"why":"效率与公平是不同评价维度，前者不能自动推出后者。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「价值分析：有效之外还要问是否值得」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["区分事实与价值","说明评价准则及利益冲突","给出有理由的取舍"],"sample":"价值分析考察政策目的、手段和结果是否值得认可。其意义在于提供评价准则、识别价值变化并指导选择。公园涨价不能只看收入，应同时分析维护收益、低收入者的机会和替代方案；在说明证据后公开取舍标准，才能形成可以讨论的政策判断。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[83],"quote":"采取的手段是否能被接受以及改进系统的结果是否“良好”","context":"…，渗透到政策过程的各个环节。通过政策主体的政策实践活动，观念形态的价值观转化为现实的政策力量。公共政策的价值分析就是考察公共政策过程中某种目的是否值得为之争取、采取的手段是否能被接受以及改进系统的结果是否“良好”。价值分析力求回答的问题是：喜欢什么？因为什么？为了什么目的？多大风险？应当优先考虑什么？等等。价值分析在公共政策研究中有着极其重要的意义与作用。这主要表现在：①价值规范是由一定社会的政治、经济、历史、地理、文化、心理等诸因素所决定的既成力…","contextPage":83}],"moduleId":"p2","order":2},"p3-1":{"id":"p3-1","module":"p3","title":"抽样与访谈：资料怎样才有代表性","goal":"能辨认概率与非概率抽样，说明资料收集的边界。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"先说明要研究谁","text":"总体是希望解释的对象集合，样本是实际调查的部分。概率抽样依据随机机制，使抽中机会可计算；非概率抽样依据便利、判断等方式选择。后者可以用于探索，但不能不加限制地推论总体。"},{"t":"p","h":"分清常见方法","text":"偶遇抽样重便利；判断抽样挑选符合研究目的的对象；雪球抽样由受访者介绍下一位；配额抽样按既定类别数量收集。PPS属于按规模大小成比例的概率抽样，不能因概率不相等就归入非概率抽样。"},{"t":"p","h":"访谈与问卷相互补充","text":"问卷有利于统一提问与比较，深度访谈有助于理解理由和过程。焦点团体需要明确主题和主持，群体互动能提供线索，也可能压低少数意见。样本量大并不能自动消除自愿参与带来的选择偏差。"}],"concepts":[{"term":"抽样与访谈","def":"总体是希望解释的对象集合，样本是实际调查的部分。概率抽样依据随机机制，使抽中机会可计算；非概率抽样依据便利、判断等方式选择。后者可以用于探索，但不能不加限制地推论总体。","points":["说明总体、样本和抽样方式","比较方法的适用情境","指出代表性与推论限制"]}],"exercises":[{"t":"choice","q":"通过一位受访者逐步介绍其他难以接触的对象，属于什么？","opts":["简单随机抽样","雪球抽样","PPS抽样","普查"],"a":1,"why":"雪球抽样沿关系网络扩展，适合探索难接触群体，但代表性受到网络结构限制。"},{"t":"judge","q":"只要网络问卷收回一万份，就可以代表全体居民。","a":false,"why":"大样本仍可能有覆盖与自选择偏差，必须检查抽样框和回应情况。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「抽样与访谈：资料怎样才有代表性」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["说明总体、样本和抽样方式","比较方法的适用情境","指出代表性与推论限制"],"sample":"调查就业困难群体时，应先界定总体和抽样框。无法获得完整名单时，可用雪球访谈寻找机制线索，但应说明样本受关系网络限制。若要估计全体比例，应尽量采用可计算抽中概率的抽样设计，并记录未回应情况，不能把访谈所得直接当作总体比例。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[91],"quote":"非概率抽样又称非随机抽样","context":"…上述研究在已确定的5类期刊中，又按照期刊的学术水平和地域分布状况采用判断抽样的方法选取若干种期刊，在样本选取方面有效地保证了研究结果的可靠性。二、非概率抽样调查非概率抽样又称非随机抽样，是指抽样时不遵循随机原则，而是按照政策研究人员的主观判断或仅仅按照方便的原则抽选样本。在与政策过程有关的调查中，采用非概率抽样通常是出于下述原因：受客观条件限制，无法进行严格的概率抽样；为了快速获得调查结果；在调查对象不确定或无法确定时，…","contextPage":91},{"src":"ning-3","pages":[93],"quote":"雪球抽样","context":"（四）雪球抽样雪球抽样的基本步骤为：首先，找出少数样本单位；其次，通过这些样本单位了解更多的样本单位；再次，通过更多的样本单位去了解更多一些的样本单位。这种方法好像滚雪球一样，使调查结果越来越接近总体。例如，某政策研究部门在调查某市劳务市场中的保姆问题时…","contextPage":93}],"moduleId":"p3","order":1},"p3-2":{"id":"p3-2","module":"p3","title":"准实验与方案论证：相关不等于因果","goal":"能解释准实验、成本收益比较与专家方法的用途和限制。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"政策后好转，不等于政策造成","text":"准实验在缺少某些严格实验条件时研究政策影响。比较实施前后，还应检查同期趋势、样本组成和其他措施。尽量寻找可比对象或更长时间序列，以减少替代解释，但不能凭“有对照”就宣布因果已经证明。"},{"t":"p","h":"数量方法不能替代价值选择","text":"成本—效益分析把可比较的成本和收益尽量纳入同一衡量框架，用来比较不同方案；无法合理货币化的公平、尊严等影响需要单列解释，不能因为难计算就删去。"},{"t":"p","h":"专家意见如何产生","text":"头脑风暴先鼓励提出不同想法，避免过早批评压制方案；德尔菲法通过匿名、反复征询及反馈汇聚专家判断。专家意见仍可能有偏差，不能代替真实资料和公众需求。"}],"concepts":[{"term":"准实验与方案论证","def":"准实验在缺少某些严格实验条件时研究政策影响。比较实施前后，还应检查同期趋势、样本组成和其他措施。尽量寻找可比对象或更长时间序列，以减少替代解释，但不能凭“有对照”就宣布因果已经证明。","points":["说明准实验条件不完全","提出比较和排除替代原因的方法","交代方法及价值上的局限"]}],"exercises":[{"t":"choice","q":"培训后就业率上升，下一步最需要什么？","opts":["直接归功于培训","检查同期经济变化与可比群体","删除未就业者","把全部效益写成零"],"a":1,"why":"必须排除景气回升等可能原因，避免把前后变化全归于政策。"},{"t":"judge","q":"德尔菲法的关键就是让专家当面服从资历最高者。","a":false,"why":"其重要特点是匿名、多轮征询和反馈，以减少权威与从众压力。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「准实验与方案论证：相关不等于因果」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["说明准实验条件不完全","提出比较和排除替代原因的方法","交代方法及价值上的局限"],"sample":"对培训政策可记录实施前后的就业状况，并选择条件接近的未实施群体比较变化。还要检查行业景气、人员流动等因素，避免混淆政策效果与外部趋势。方案比较可计算单位持续就业成本，同时报告公平和参与门槛；专家预测只能作为证据之一。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[100],"quote":"准实验研究有与实验研究相似的地方，但不等同于实验研究","context":"…成的安全文化的必然反映，因此保证了观察结果具有较高的生态效度。经过专家分析所得到的55类行为规范，对于安全生产方面政策的制定具有较高的参考价值。三、准实验研究法准实验研究有与实验研究相似的地方，但不等同于实验研究。实验研究通常是标准化的、各项实验条件完全具备的。而准实验研究则是在缺乏某个实验条件或者实验环节，或者对某个变量不能完全有效地控制等不完备条件下的实验。由于实验要素很难在严格的意义上进行完善，所以准实验研究适合对一些量化程度要求不高的公共政…","contextPage":100},{"src":"ning-3","pages":[98],"quote":"德尔菲","context":"…易受权威及潮流的影响；容易忽略少数人的意见；有些专家易于固执己见等。但总的看，利用头脑风暴法进行政策分析，有可能在较短的时间里获得富有成果的政策方案或设想。3.德尔菲函询法德尔菲函询法是一种直觉预测技术。它是1948年由兰德公司的研究人员首先发明的。兰德公司在20世纪40年代曾以古希腊神话中可预卜未来的阿波罗神庙地址“德尔菲”（Delphi）为代号，研究如何通过有控制反馈更为可靠地收集专家意见，德尔菲函…","contextPage":98}],"moduleId":"p3","order":2},"p4-1":{"id":"p4-1","module":"p4","title":"公共政策：定义、类型与四项功能","goal":"能按宁书定义作答，并区分类别与功能。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"定义有明确主体和目的","text":"按宁书，公共政策是公共权力机关经由政治过程选择和制定的，旨在解决公共问题、达成公共目标、实现公共利益的方案。它体现权威性的价值分配；政府经过选择作出的不行动，也可能属于政策。"},{"t":"p","h":"分类先写依据","text":"按层次可讨论元政策、基本政策与部门政策；按内容性质可区分物质性与符号性等。元政策关心如何制定政策的规则和原则，不是“最早出台的政策”。不同分类轴可交叉使用，不能把它们放成互斥的一组。"},{"t":"p","h":"宁书的四项基本功能","text":"**管制**约束行为；**引导**指示方向、改变行为倾向；**调控**协调矛盾和关系；**分配**安排利益与资源。某一措施可能同时发挥多种功能。补贴是工具名称，引导和分配是它可能产生的功能，层次不同。"}],"concepts":[{"term":"公共政策","def":"按宁书，公共政策是公共权力机关经由政治过程选择和制定的，旨在解决公共问题、达成公共目标、实现公共利益的方案。它体现权威性的价值分配；政府经过选择作出的不行动，也可能属于政策。","points":["定义包含主体、政治过程和公共目的","按依据区分政策类型","解释管制、引导、调控、分配"]}],"exercises":[{"t":"choice","q":"“补贴鼓励节能设备使用”中，“鼓励行为方向”主要说明什么？","opts":["政策引导功能","元政策的定义","政策已经终结","研究抽样方法"],"a":0,"why":"补贴是手段，引导是功能；不要用工具名替代功能解释。"},{"t":"judge","q":"政府对公共问题经权衡决定暂不行动，绝不属于公共政策。","a":false,"why":"政策可以表现为积极行动，也可表现为经选择的不行动，但不能把所有疏忽都当政策。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「公共政策：定义、类型与四项功能」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["定义包含主体、政治过程和公共目的","按依据区分政策类型","解释管制、引导、调控、分配"],"sample":"公共政策是公共权力机关经由政治过程，为解决公共问题、达成公共目标和实现公共利益所选择和制定的方案。其基本功能包括管制行为、引导方向、调控关系和分配利益。例如节能补贴既通过经济激励引导行为，又涉及财政资源分配，应区分工具形式与功能效果。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[129],"quote":"公共政策是公共权力机关经由政治过程所选择和制定的为解决公共问题、达成公共目标、实现公共利益的方案","context":"…体和个人行动的准则或指南。其表达形式有法律规章、行政命令、政府首脑的书面或口头声明和指示以及行动计划与策略等。”②综合上述各种界定，我们对公共政策给出如下定义：公共政策是公共权力机关经由政治过程所选择和制定的为解决公共问题、达成公共目标、实现公共利益的方案。③这个定义所揭示的公共政策的内涵有如下几点：第一，公共政策是决定、决策、对策、政策的一种特殊形态，它具有决定、决策、对策、政策的一般特征。第二，公共政策是公共权力机关的基本的活动方式或活动过程，是公共权力机关权力意志的表现。第三，公共政策…","contextPage":129},{"src":"ning-3","pages":[149],"quote":"公共政策的基本功能有四种","context":"…全年PM2.5一级优天数达93天，同比增加22天，增幅31\\%。虽然这是多部门多方面同时发力、综合治理的结果，但购车政策有收有放显然对这一效果的呈现做出了贡献。公共政策的基本功能有四种。1.管制功能政策问题的解决，可以通过政策对象不做什么来达成政策目标。政策主体要制约、禁止政策对象不做什么，或者说要使政策对象不发生政策主体不愿见的行为，就必须使政策对政策对象的行为具有管制功能。这种功能一般是通过政策的条文规定表现出来的。…","contextPage":149}],"moduleId":"p4","order":1},"p4-2":{"id":"p4-2","module":"p4","title":"政策工具：为什么不能只选最强硬的办法","goal":"能按问题、目标、能力和对象解释工具选择。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"目标是要去哪，工具是怎么去","text":"政策工具是被设定用来实现政策目标的措施、方法、机制与资源等手段。既可以在制定阶段选择，也可在执行中调整；“被设定有效”不等于实际必然有效。"},{"t":"p","h":"一套分类要用同一标准","text":"按强制程度，可区分自愿性工具、混合性工具与强制性工具。家庭、社区和志愿组织靠自愿参与；补贴、信息规劝等可置于混合工具讨论；管制、公共企业和直接提供属强制程度较高的工具。分类应说明采用的学者或标准。"},{"t":"p","h":"选择因素与配置","text":"宁书从政策主体、政策问题、政策目标、目标人群、工具特性以及工具实施的环境等方面展开。主体的制度环境、能力与惯例影响选择；问题性质决定需要解决什么；对象的资源与接受度影响能否响应；工具还要考虑成本、风险与操作复杂性。"},{"t":"p","h":"教学情境：垃圾分类","text":"只加处罚可能无法解决投放点不足或居民不知道如何分类的问题。可把设施供给、信息指引、便利服务和必要的规则配合使用，并检验成本与执行能力；不是工具越多越好。"}],"concepts":[{"term":"政策工具","def":"政策工具是被设定用来实现政策目标的措施、方法、机制与资源等手段。既可以在制定阶段选择，也可在执行中调整；“被设定有效”不等于实际必然有效。","points":["定义工具并区别于目标","至少分析主体、问题、目标、对象、工具特性","说明组合的互补与代价"]}],"exercises":[{"t":"choice","q":"居民愿意分类但附近没有回收设施，最应优先补什么？","opts":["无限加罚款","设施与服务能力","仅更换口号","取消目标"],"a":1,"why":"问题出在行动条件，工具应针对资源与可及性不足。"},{"t":"judge","q":"政策工具只在执行阶段选择，制定阶段不涉及。","a":false,"why":"宁书认为主要在制定阶段选择，执行中还存在调整和再选择。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「政策工具：为什么不能只选最强硬的办法」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["定义工具并区别于目标","至少分析主体、问题、目标、对象、工具特性","说明组合的互补与代价"],"sample":"政策工具是实现目标的手段。选择时应分析主体能力和制度环境、问题性质、目标、目标人群以及工具成本与风险。对垃圾分类，设施不足需补服务能力，知识不足需提供信息，违规行为可辅以合理约束。组合应相互支持，并评估执行资源和对象负担。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[159],"quote":"所谓政策工具，指的是被设定为旨在实现一定政策目标","context":"综上所述，侧重于从手段与目标实现的关系上去界定政策工具，在公共政策学界几成共识。因此，我们也从这一视角去界定政策工具，认为：所谓政策工具，指的是被设定为旨在实现一定政策目标的各种措施、策略、方法、技术、机制、行动、作为以及配置的人力、资金、设备、资源等手段。这里的“被设定”，既包括在政策制定阶段决策者针对政策目标配置的政策手段，也包括在政策执行阶段执行者采取的超出政策方案的政策手段；它的基本含义是政策的制定者…","contextPage":159},{"src":"ning-3","pages":[163],"quote":"政策工具的选择主要发生在政策制定阶段","context":"…定政策目标选择适当的政策工具；在政策抉择的过程中，政策方案之间的竞争主要是经过选择而被设定的政策工具，对于实现政策目标的可行性和有效性的竞争。因此，我们可以认定政策工具的选择主要发生在政策制定阶段。当然，在政策合法化并予以宣示之后，在政策执行过程中还存在着政策工具的调整或者政策工具的再选择、再设定的问题。林水波认为，政策工具的选择有偏差，在政策执行中暴露出来其不当性，可吸取过往的教训，对工具重新选择。④工具选择的程序论者（proce…","contextPage":163},{"src":"ning-3","pages":[167],"quote":"政策工具选择的根本诉求是“对症下药”","context":"…的政策工具有不同的反应。政策工具的选择必须注意这种反应的强度和范围。目标人群对特定政策工具的可接受性，显然是衡量政策可行性的一个重要方面。其五，政策工具的特性。政策工具选择的根本诉求是“对症下药”。在这里，“症”是政策问题，“治好病”是政策目标，“药”是政策工具；而熟悉“药”性，则是“开处方”即进行工具选择的关键。每种政策工具都有其特性或属性。认定和归纳政策工具的属性，对工具选择来说是十分必要的。那么，在进行工具选择时必须注意政策工…","contextPage":167}],"moduleId":"p4","order":2},"p5-1":{"id":"p5-1","module":"p5","title":"主体、客体与政策网络","goal":"能解释政策网络的含义、形成原因和边界。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"谁参与，谁受到作用","text":"政策主体包括直接或间接参与制定、实施、评估和监控的行为者；政策客体包括政策要处理的问题和受到作用的对象。某群体既可能是受政策影响的对象，也可能通过表达诉求成为参与者，身份不是永久固定的。"},{"t":"p","h":"网络如何形成","text":"政策网络是行为者围绕特定议题，基于不断协商的信念和利益形成的正式与非正式联系。权威、资金、信息、技术与知识分散在不同主体手中，资源相互依赖使协作必要；环境的不确定性、模糊性、关联性与动态性加深这种需要。"},{"t":"p","h":"网络不是没有政府","text":"政府仍有法定职责，参与主体也不是天然平等。网络可汇集知识、协调资源，但也可能排斥弱势群体、模糊责任或被少数组织控制。答“形成原因”要解释资源和环境，答“特点”再写依赖、互动与联系。"}],"concepts":[{"term":"主体、客体与政策网络","def":"政策主体包括直接或间接参与制定、实施、评估和监控的行为者；政策客体包括政策要处理的问题和受到作用的对象。某群体既可能是受政策影响的对象，也可能通过表达诉求成为参与者，身份不是永久固定的。","points":["定义主体与客体","解释网络的议题联系和资源依赖","指出协作收益及责任风险"]}],"exercises":[{"t":"choice","q":"政府有法定权限，社区有信息，机构有服务能力，需要持续协商，体现什么？","opts":["单一主体独立决策","资源依赖推动政策网络","所有成员权力相同","政策必然失败"],"a":1,"why":"不同资源分散在不同主体手里，形成相互依赖与持续互动。"},{"t":"judge","q":"某群体是政策目标群体，就不可能参与政策制定。","a":false,"why":"受影响与参与是不同维度，同一群体可以兼具两种身份。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「主体、客体与政策网络」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["定义主体与客体","解释网络的议题联系和资源依赖","指出协作收益及责任风险"],"sample":"政策网络是围绕特定政策议题形成的正式或非正式联系。复杂问题所需的权威、信息与服务资源分散，任何单一主体难以独立处理，因而推动协商合作。网络有助于整合知识，但需明确责任并保障弱势群体表达，不能把多主体参与等同于公共利益自动实现。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[172],"quote":"直接或间接地参与公共政策制定、实施、评估、监控的行为者","context":"…能体现为政策的创新和扩散，而从长期来看则体现为政策变迁。二、公共政策的主体与主体系统（一）政策主体公共政策主体是相对于政策客体而言的。它是指那些在特定政策环境中直接或间接地参与公共政策制定、实施、评估、监控的行为者。美国公共政策学者安德森认为，在西方，政府立法机关、行政机关、行政管理机构、法院以及利益团体、政党、作为个人的公民都是公共决策过程的参与者，前四个是“官方的政策制定者”，后三个是“非官方的参与者”。②查尔斯·琼斯（CharlesO.Jone…","contextPage":172},{"src":"ning-3","pages":[174],"quote":"政策网络的兴起源于政策环境的快速变化","context":"…体等与某项政策有利益关系的个人或团体，这些个别行动者或团体因为法定权威、资金、信息、专业技术与知识等资源的相互依赖，或者因共同价值、共同话语，而结合成行动联盟。政策网络的兴起源于政策环境的快速变化。随着信息技术革命、全球化程度的提高，价值多元化趋势日益显著，公共政策的环境变得更为复杂和动荡，主要表现为：①不确定性——其主要特征是无法对未来或将要发生的事情做出预测，极端的例子是各类危机事件或紧急状态的出现；②模糊性——表现为政策问题所…","contextPage":174},{"src":"ning-3","pages":[174],"quote":"政策行为者围绕特定的议题，基于共同的、实际上是不断协商的信念和利益而结成的正式的（制度性的）和非正式的联系","context":"…响，开始受到人们越来越多的关注。公共政策学者逐渐倾向于以“政策网络”（policynetwork）来描述和界定这种组合。所谓政策网络是指在政策系统和政策过程中，政策行为者围绕特定的议题，基于共同的、实际上是不断协商的信念和利益而结成的正式的（制度性的）和非正式的联系。^{①}这些行为者相互依赖，而政策就是从它们的互动中产生出来的。^{②}在这个概念中，政策网络内的行为者包括行政官员、国会议员、学者专家、商会、工会、专业协会和公共利益团体等与某项政策有利益关系的个人或团体，这些个别行动者或团体因为法定权…","contextPage":174}],"moduleId":"p5","order":1},"p5-2":{"id":"p5-2","module":"p5","title":"公共权力与决策规则：谁能作决定","goal":"能区别参与影响与法定决定，比较一致同意和多数规则。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"参与不等于有最后决定权","text":"公共权力为公共决策提供权威基础，也必须受到规则和监督约束。专家可提供知识、利益集团可表达要求，是否有法定决定权还要看制度安排。公共利益也不能简单等同于某个部门或集团的偏好。"},{"t":"p","h":"两种规则的代价","text":"全体一致规则要求每个参与者同意，能降低被强加决定的风险，但人数增加或偏好差异扩大时协商成本很高。多数规则降低达成决定的门槛，却需要防止多数损害少数，并明确多数的计算方式。"},{"t":"p","h":"利益表达与利益综合","text":"利益集团可能提供信息、组织表达、推动议程，也可能通过资源优势放大局部诉求。公共决策需要比较不同群体所获利益与所付代价，特别检查组织能力弱者是否被遗漏。"}],"concepts":[{"term":"公共权力与决策规则","def":"公共权力为公共决策提供权威基础，也必须受到规则和监督约束。专家可提供知识、利益集团可表达要求，是否有法定决定权还要看制度安排。公共利益也不能简单等同于某个部门或集团的偏好。","points":["区分参与影响与法定权限","比较两种规则的收益和成本","说明公共利益与少数保护"]}],"exercises":[{"t":"choice","q":"专家提出建议后，建议能否自动成为有约束力的政策？","opts":["能，专家知识等于法定权力","不能，还要经有权限的主体和程序作出决定","只有全体居民签字才可能","公开报道就自动生效"],"a":1,"why":"知识支持、社会影响和正式决定权限需要区分。"},{"t":"judge","q":"多数规则提高决策效率，因此无需保护少数权利。","a":false,"why":"达成多数不代表任何内容都正当，还要受权利保障和程序规则约束。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「公共权力与决策规则：谁能作决定」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["区分参与影响与法定权限","比较两种规则的收益和成本","说明公共利益与少数保护"],"sample":"公共权力使政策决定具有权威，但决策仍须受权限、程序与监督约束。一致同意有利于避免强加决定，却可能产生高昂协商成本；多数规则便于形成决定，但不能免除保护少数权利的责任。利益表达应进入综合权衡，而不是把最有组织的群体利益直接当作公共利益。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[186],"quote":"全体一致规则","context":"…价，为某一政策方案的通过而付出的时间、精力、物质消耗等决策成本可能远远超过由此得到的收益，因此就会导致许多“无奈的选择”或决策中的“策略性行为”。也正因为如此，全体一致规则适应的对象是对某些重大政策问题的决策。2.多数规则既然全体一致规则因决策成本过高，在很多情况下难以实施，那么就只能退而求其次，采取多数规则以最大限度地照顾多数的利益。所谓多数规则（majorityrule），就是采取少数服从多数的原则，以得…","contextPage":186},{"src":"ning-3","pages":[188],"quote":"多数规则","context":"…政府的决策有决定性的作用，或者说政府的决策最终取决于议会的决策。因此，议会多数的支持是这种公共决策体制得以运行的关键。而无论是在议会还是内阁，决策的基本规则都是多数规则。国家元首（君主、总统、主席等）是虚位的，不拥有实质意义的决策权。（3）半总统半议会制，又称双首长制。这种公共决策体制同时兼具总统制和议会制这两种体制的特点，首创而且至今仍在实行这一体制的是法国。在法国以及其他实行法国式的双首长制国家里，既…","contextPage":188}],"moduleId":"p5","order":2},"p6-1":{"id":"p6-1","module":"p6","title":"广博理性与有限理性：最优还是满意","goal":"能写出有限理性的约束来源与满意决策机制。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"广博理性的要求","text":"理性决策模型要求明确目标和价值顺序，列出备选方案，预测后果并选择最优方案。这提供比较方案的规范，但现实中信息、认知与资源并不充分。"},{"t":"p","h":"西蒙为什么改用满意","text":"有限理性承认主观知识能力、多元价值、组织结构、成本和情景等约束。决策者往往只搜索部分备选方案，以可接受的标准选择满意方案。满意不是随便挑选，而是在约束下进行有规则的搜索与判断。"},{"t":"p","h":"评价要有两面","text":"模型更贴近现实，提醒我们改善信息与组织程序；但满意标准如何确定、如何避免过低的目标，仍需解释。它不意味着放弃提高决策质量，也不能当作资料不充分的借口。"}],"concepts":[{"term":"广博理性与有限理性","def":"理性决策模型要求明确目标和价值顺序，列出备选方案，预测后果并选择最优方案。这提供比较方案的规范，但现实中信息、认知与资源并不充分。","points":["说明完全理性假设及现实约束","解释有限搜索与满意标准","评价现实性和可能不足"]}],"exercises":[{"t":"choice","q":"时间有限时，按事先设定的可接受标准筛选方案，符合什么？","opts":["满意决策","无标准的任性选择","假定全部信息已知","只有一个方案才叫理性"],"a":0,"why":"满意决策承认约束，同时保留搜索、比较与标准。"},{"t":"judge","q":"有限理性就是说人完全没有理性，无法比较方案。","a":false,"why":"有限是理性的条件与能力受限制，并非取消理性分析。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「广博理性与有限理性：最优还是满意」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["说明完全理性假设及现实约束","解释有限搜索与满意标准","评价现实性和可能不足"],"sample":"有限理性模型以西蒙的行政人为基础。受知识、价值、组织、成本和情景约束，决策者难以遍历所有方案和后果，只能寻找达到可接受标准的满意方案。该模型提高了现实解释力，但需说明满意标准并防止过早停止搜索，通过改进信息和程序持续提高决策质量。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[216],"quote":"这一模型也被称作满意决策模型","context":"行的政策分析方法。2.有限理性模型这一模型也被称作满意决策模型。西蒙认为组织的中心任务是决策，但广博理性模型强调的完全理性是不切实际的。西蒙提出了决策者有限理性（boundedrationality）命题。他认为：“理性指的是一种行为方式，是指在给定条件和约束的程度内适于达到给定目标的行为方式。”①有…","contextPage":216},{"src":"ning-3","pages":[216],"quote":"行政人面对种种条件和约束","context":"…行为方案中很少的几个。^{③}因此，西蒙认为决策者在现实生活的决策中是不可能达到最佳程度的。西蒙把决策者设定为“行政人”（administrativeman）。行政人面对种种条件和约束，只能是追求一种近似的优化途径，即寻求令人满意的决策和结果。最佳决策的前提是决策者的行为完全理性化，而满意决策的前提是决策者的行为有限理性化，后者才是现实的。因此，“理性就是要用评价行为后果的某个价值体系，去选择令人满意的备选行为方案”，^…","contextPage":216}],"moduleId":"p6","order":1},"p6-2":{"id":"p6-2","module":"p6","title":"渐进主义：小步调整为什么可能有效","goal":"能说明渐进决策的机制、适用条件与保守倾向。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"从既有政策出发","text":"渐进主义以现行政策为起点，只比较有限的边际改动，通过持续调整和各方相互适应推进。它减少信息处理与协调负担，让利益冲突有机会在较小范围内逐步解决。"},{"t":"p","h":"别把小步等同于没有变化","text":"连续的小变化可能累积为显著转变。教学例子：分期调整公交服务，先试行部分线路，再根据反馈修改班次和覆盖面。重点是既有基础、有限比较、协商和连续反馈，不是简单“每年加一点”。"},{"t":"p","h":"什么情况下不够用","text":"当原有制度本身就是问题、危机需要快速改变、弱势诉求长期被排除时，渐进调整可能延续失衡。论述题应先解释其现实性，再说明保守性，不能只写“风险小所以最好”。"}],"concepts":[{"term":"渐进主义","def":"渐进主义以现行政策为起点，只比较有限的边际改动，通过持续调整和各方相互适应推进。它减少信息处理与协调负担，让利益冲突有机会在较小范围内逐步解决。","points":["说明既有政策基础和边际调整","解释有限比较与相互调适","用情境说明适用性和局限"]}],"exercises":[{"t":"choice","q":"下列哪种情境最需要警惕渐进主义的局限？","opts":["基于稳定制度微调服务","原有制度持续排斥弱势群体且须根本改革","需要吸收试点反馈","既有政策总体有效"],"a":1,"why":"以旧政策为基准可能延续结构性问题，无法满足根本改变的要求。"},{"t":"judge","q":"渐进主义必然意味着永远没有重大变化。","a":false,"why":"小变化可以累积，但模型的保守倾向仍应评价。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「渐进主义：小步调整为什么可能有效」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["说明既有政策基础和边际调整","解释有限比较与相互调适","用情境说明适用性和局限"],"sample":"渐进主义主张在既有政策基础上进行有限比较和边际调整，通过协商与连续反馈降低信息和政治成本。公交服务可先试行再修订，以减少一次性改革的不确定性。但当旧制度造成根本性不公时，持续微调可能固化问题，需要与更大范围的改革相结合。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[217],"quote":"大大减少所探索的不同政策的数目","context":"…者各自行使权力，互相影响和互相作用的动态均衡过程；将直接决策者的决策战略设定为“只专注于政策的逐步或微小改变”，其政策分析“集中于熟悉的、较为人知的经验上”，“大大减少所探索的不同政策的数目”，“大大减少必须分析的因素及复杂性”；⑤把政策结果设定为看上去似乎行动缓慢，但积小变为大变，其实际速度要大于一次大的变革，如图6-6所示。图6-6渐进主义政策过程模型渐进主义模型所对应的原型，显然是西方国家特别是美国。事实上，林德布洛姆构…","contextPage":217},{"src":"ning-3","pages":[218],"quote":"它具有显而易见的保守性","context":"归结为一点，就是认为它具有显而易见的保守性：朝着保守的方向来阐释人的主观能动性和有限理性；只注重现行政策的延续；对新政策关注的焦点仅限于原有政策的改进，以及看起来微不足道的政策目标的制定及其实现；压制政策创新和具有根本意义的社会变革。^{①}（三）规范最佳模型与混合扫描模型在克服广…","contextPage":218}],"moduleId":"p6","order":2},"p6-3":{"id":"p6-3","module":"p6","title":"混合扫描与规范最佳：怎样综合不同模型","goal":"能区分宏观扫描、局部调整与决策系统改进。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"混合扫描的两种尺度","text":"埃齐奥尼把基本决策和渐进决策结合起来：先广泛扫描以确定方向，再对选中的重点进行细致分析和局部调适。广角与细看服务不同层次，不是每个方案都做无限精细分析。"},{"t":"p","h":"规范最佳的重点","text":"德洛尔强调改进决策系统、认同并增加理性，同时对有益的分析方法保持开放。其过程包括决策前、决策中、决策后三大阶段，涉及价值、环境、资源、方案与执行评估。不要把它缩写成“有最优答案的理性模型”。"},{"t":"p","h":"综合并不自动解决矛盾","text":"何时全面扫描、何时局部分析，以及如何分配时间和资源，仍需判断。模型的价值在于提醒决策者同时看方向和细部；其困难是操作边界和标准仍可能不清。"}],"concepts":[{"term":"混合扫描与规范最佳","def":"埃齐奥尼把基本决策和渐进决策结合起来：先广泛扫描以确定方向，再对选中的重点进行细致分析和局部调适。广角与细看服务不同层次，不是每个方案都做无限精细分析。","points":["说明两种扫描对应不同层次","说明规范最佳改进决策系统","指出综合所需的操作判断"]}],"exercises":[{"t":"choice","q":"先选择城市交通发展的总体方向，再精细调整几条线路，最符合什么？","opts":["混合扫描","所有细节同时穷尽","仅凭直觉","否定任何渐进变化"],"a":0,"why":"它把基本决策的广泛观察与渐进决策的局部改进结合。"},{"t":"judge","q":"规范最佳模型拒绝使用任何理性分析之外的有益方法。","a":false,"why":"教材强调开放性和包容性，是否采用取决于问题及方法的可行性与兼容性。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「混合扫描与规范最佳：怎样综合不同模型」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["说明两种扫描对应不同层次","说明规范最佳改进决策系统","指出综合所需的操作判断"],"sample":"混合扫描以宏观扫描确定基本方向，再以细致分析进行局部调整，兼顾整体视野和可操作性。规范最佳则强调通过价值澄清、资源配置和决策系统改进提高决策质量。两者都试图克服完全理性与渐进模型的局限，但何时采用何种方法仍需要明确标准。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[218],"quote":"政策过程划分为三大阶段和17个小阶段","context":"…多种途径和方法使认同理性、增加理性的过程得以实现；现代政府同时面对要求稳定的政策诉求与要求变革的政策诉求，而在一定时期内则以其中的一种诉求为主。②规范最佳模型把政策过程划分为三大阶段和17个小阶段：第一阶段：决策前。内含：①处理价值问题：确认重要的政策目的、决策标准和基本的价值判断标准；②认识现实环境；③认识问题；④调查、处理与开发资源；⑤设计、评估与重新设计决策系统：切实改进政策制定系统，包括提高政策人员的个人素质与整体素质，优化…","contextPage":218},{"src":"ning-3","pages":[219],"quote":"基本决策决定下来以后","context":"…针对社会基本问题而指明解决的基本方向的宏观决策，需要运用第一种摄像机或者广博理性模型，作全面的观察与分析；②渐进决策（incrementaldecision），基本决策决定下来以后，需要使用第二种摄像机或者渐进调适的方法，作细致观察和局部改进，以加强和修补基本决策，见图6-7。①图6-7混合扫描政策过程模型混合扫描模型主要来自气象预测，兼采广博理性模型和渐进主义模型之长，把大规模改革创新和渐进改良两种政策过程整合进一…","contextPage":219}],"moduleId":"p6","order":3},"p6-4":{"id":"p6-4","module":"p6","title":"垃圾桶、小组意识与组织过程","goal":"能辨认偶然耦合、从众压力和标准程序三种机制。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"垃圾桶：四条流未必整齐相接","text":"垃圾桶模型关注决策的模糊状态：决策者无法明确界定问题和目标的偏好，只能以试错方式学习，参与者还会在不同时间、不同问题上流动。问题、解决方案、参与者、抉择机会四要素彼此独立，决策来自它们在某个时点的遇合；不能把这个名称理解为“所有决策都没有价值”。"},{"t":"p","h":"小组意识：一致压倒审慎","text":"小组成员过度追求一致，可能压制不同意见、低估风险、不充分比较方案。集体讨论本来可整合知识，只有当一致压力妨碍独立判断时，才是这里批评的现象。谢明第5版列出九项预防措施，可按“降低权威压力—引入外部意见—复查一致结论”三组理解，但答枚举题时仍须展开九项。"},{"t":"list","h":"小组意识：九项预防措施","items":["领导鼓励怀疑和反对意见，为意见交锋创造气氛。","领导不先表明倾向，减少权威对成员的心理影响。","建立独立的政策计划与评估小组。","分成若干小组讨论，再汇总意见。","成员征询信得过的组外人士，并把意见带回。","邀请专家及有关人士挑战核心成员的意见。","指定唱反调的“魔鬼”角色，主动寻找反例。","涉及敌对国家或组织时，调查其意图，从对方立场分析，避免情绪化。","达成一致后再开会质疑和复查，不轻易满足于一致。"]},{"t":"p","h":"组织过程：程序塑造输出","text":"组织过程模型强调：决策按标准的运作程序完成，输入决策系统的信息被分解为不同门类，由专门组织在各自层次按预置程序加工；标准程序未必体现国家利益。与小组意识相比，它分析的是组织程序，不能都归因于领导者性格。"}],"concepts":[{"term":"垃圾桶、小组意识与组织过程","def":"垃圾桶模型关注决策的模糊状态：决策者无法明确界定问题和目标的偏好，只能以试错方式学习，参与者还会在不同时间、不同问题上流动。问题、解决方案、参与者、抉择机会四要素彼此独立，决策来自它们在某个时点的遇合；不能把这个名称理解为“所有决策都没有价值”。","points":["准确区分三种模型机制","将材料现象与具体机制对应","遇到小组意识时提出外部挑战与再次复查等针对性措施","说明适用情境而非贴标签"]}],"exercises":[{"t":"choice","q":"会上成员明知有风险，却怕破坏团结而保持沉默，最直接对应什么？","opts":["小组意识","政策废止","分层随机抽样","工具光谱"],"a":0,"why":"关键是追求一致压倒独立评价，不是任何集体会议都属于小组意识。"},{"t":"judge","q":"垃圾桶模型中的四要素是问题、解决方案、参与者和抉择机会。","a":true,"why":"其重点是这些要素并非始终按线性理性顺序联系。"},{"t":"multi","q":"一场会议已经全体赞成方案，哪些做法有助于预防小组意识？","opts":["再开一次会，专门讨论疑问","让领导先宣布偏好的方案","邀请外部专家挑战核心意见","为维护团结不再记录反对意见"],"a":[0,2],"why":"谢明第5版 PDF 第121页第6、9项支持外部挑战与一致后的复查；领导先表态、压制异议会强化一致压力。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「垃圾桶、小组意识与组织过程」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["准确区分三种模型机制","将材料现象与具体机制对应","遇到小组意识时提出外部挑战与再次复查等针对性措施","说明适用情境而非贴标签"],"sample":"若方案先于问题出现并等待合适会议机会，可用垃圾桶模型分析要素的偶然结合；若会议中异议被一致压力压制，可用小组意识解释；若决定由各部门既定操作程序塑造，则应使用组织过程视角。三者解释层次不同，需要由材料决定采用哪种机制。对于一致压力，可让领导暂缓表态、邀请外部专家挑战意见，并在达成一致后再次开会质疑；涉及敌对组织时，还应从对方立场分析意图，避免情绪化。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[219],"quote":"四要素指的是问题、解决方案、参与者和抉择机会","context":"…问题这些人的参与也因时而异、因地而异，从而造成政策过程的不连贯、不一致。接着，垃圾桶模型认定政策过程的四要素之间并无一致的逻辑演绎关系，决策的形成只是机会使然。四要素指的是问题、解决方案、参与者和抉择机会，它们彼此独立、互不关联。而组织就像是一个垃圾桶，四要素被分别随意地丢进桶里并相互混合在一起。决策者做出决策的机会在于：“一个被参与者倾倒了各种各样的问题及其解决方案的垃圾桶，每个桶里所装的混合垃圾是什么，部分地取决于桶上贴的标签，同时也取…","contextPage":219},{"src":"ning-3","pages":[219],"quote":"呈现出模糊状态，即决策者无法明确界定政策问题和目标的偏好","context":"…条件入手：理性过程诸模型预设决策的意愿程度、问题的理解程度是已知的，行为主体之间的关系是可预测的。但是，垃圾桶模型认为现实的决策是一个很不明确、难以预测的过程，呈现出模糊状态，即决策者无法明确界定政策问题和目标的偏好，因为与目标相关的各种偏好是相互矛盾和冲突的；决策者只能以试错的方式，从经验中学习决策的技能，不可能事先洞悉整体的决策过程；决策者具有流动性，不同机构的人在不同的时间对不同的政策问题有不同程度的参与，即使同一政策问题这些人的参与也因时而异、…","contextPage":219},{"src":"xie-intro-5","pages":[120],"quote":"把保持群体一致和创造和谐氛围作为目的","context":"…roupthink）一书，提出了一种关于群体不良决策的理论模型。詹尼斯在分析了大量美国政府决策层所做的政治和军事决策后发现，由于参与决策的群体成员自觉或不自觉地把保持群体一致和创造和谐氛围作为目的，所以往往不能理智地分析各种备选方案，造成决策的失误。詹尼斯认为，在决策小组中存在着一种寻求一致的行为模式，这种现象在面对面进行问题讨论的时候表现得更为明显。小组成员趋向于怎样更好地达成一致，注意力完全集中在这方面了，从而忽略了如何去寻求更…","contextPage":120},{"src":"xie-intro-5","pages":[121],"quote":"不要轻易满足于简单的一致","context":"…的时间去调查和分析敌对势力的迹象和意图。可采用“角色扮演”的方法，从对方的立场和观点去分析和思考问题，做到“知己知彼”。在敌对状态下，人是最容易情绪化的。（9）不要轻易满足于简单的一致，在成员意见完全一致后，应该再开一次会，专门提出疑问，并加以认真研究。小组意识的理论模型见图4-2。","contextPage":121},{"src":"xie-intro-5","pages":[121],"quote":"从对方的立场和观点去分析和思考问题","context":"…体压力所引起的从众效应。（8）如果政策涉及一个敌对国家或组织，就要警惕情绪化的过激行为，用足够的时间去调查和分析敌对势力的迹象和意图。可采用“角色扮演”的方法，从对方的立场和观点去分析和思考问题，做到“知己知彼”。在敌对状态下，人是最容易情绪化的。（9）不要轻易满足于简单的一致，在成员意见完全一致后，应该再开一次会，专门提出疑问，并加以认真研究。小组意识的理论模型见图4-2。","contextPage":121},{"src":"xie-intro-5","pages":[126],"quote":"决策是按照其标准的运作程序完成的","context":"…动？阿利森给出了三种解释模型：理性决策模型、组织过程模型、官僚政治模型。其中的组织过程模型集中于决策组织运作过程的研究，拓展了制度理论的研究视野。这个模型认为，决策是按照其标准的运作程序完成的。输入决策系统的信息被分解为不同的门类，在不同的层次上由专门组织进行加工整理，这个加工整理过程是按照预置的决策程序运行的。由于标准运作程序可能是有逻辑和明确的，所以谁也无法保证它所产生的决策是国家利益的体现。4.2.7博弈理论：政策是竞争环…","contextPage":126}],"moduleId":"p6","order":4},"p6-5":{"id":"p6-5","module":"p6","title":"集团、精英、公共选择与倡导联盟","goal":"能用行为者、资源、信念和制度解释政策竞争。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"谁在影响决定","text":"集团理论突出有组织利益之间的竞争与均衡；精英视角关注少数优势者对政策方向的影响；多元主义讨论分散权力和多方竞争；组合主义更关注特定组织通过制度化安排参与协调。不要仅凭“有多个部门”就认定符合多元主义。"},{"t":"p","h":"自利与策略互动","text":"公共选择把政治行为者的激励与约束纳入分析，不预设公共部门人员天然无私；博弈视角强调每方选择取决于对其他参与者行为的预期。囚徒困境说明个体理性可能导致共同不利，但并非所有竞争都是零和。"},{"t":"p","h":"信念如何形成联盟","text":"倡导联盟框架关注政策子系统中共享信念的行为者、联盟竞争、政策学习和外部事件。深层核心、政策核心、次要层面并不具有同样的稳定程度。政治系统模型则以输入、转换、输出和反馈说明环境与政策的关系。"}],"concepts":[{"term":"集团、精英、公共选择与倡导联盟","def":"集团理论突出有组织利益之间的竞争与均衡；精英视角关注少数优势者对政策方向的影响；多元主义讨论分散权力和多方竞争；组合主义更关注特定组织通过制度化安排参与协调。不要仅凭“有多个部门”就认定符合多元主义。","points":["区分集团、精英和激励视角","说明联盟的共享信念与跨组织联系","解释学习、资源或外部事件的影响"]}],"exercises":[{"t":"choice","q":"来自不同组织的人因共同政策信念而持续合作，最贴近什么？","opts":["倡导联盟","同一行政部门的层级命令","所有人利益完全一致","随机抽样"],"a":0,"why":"联盟可以跨组织边界，关键是共享信念、协调行动及所在政策子系统。"},{"t":"judge","q":"公共选择理论意味着每名公务人员在任何情境下都会腐败。","a":false,"why":"模型分析激励与制度约束，不能把行为假设变成对所有个体的事实断言。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「集团、精英、公共选择与倡导联盟」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["区分集团、精英和激励视角","说明联盟的共享信念与跨组织联系","解释学习、资源或外部事件的影响"],"sample":"分析政策争议可先辨认行为者掌握的资源及制度位置，再判断是利益集团竞争、精英主导还是自利激励问题。若不同组织长期因共同信念协作，可用倡导联盟框架解释，并考察学习与外部事件如何推动变化。模型是有条件的解释工具，不能用一个标签代替证据。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[222],"quote":"集团理论","context":"（一）多元主义与集团理论模型公共政策学者通常把多元主义模型（pluralistmodel）和集团理论模型（grouptheorymodel）视作同一模型，有些学者以前者命名，如克鲁斯克和杰克逊的《公共政策词典》、希尔的《现代国家的政策过程》、豪利特和拉米什的《公共…","contextPage":222},{"src":"ning-3","pages":[230],"quote":"公共选择","context":"特别是公共决策运用经济学方法进行的分析。公共选择理论政策过程模型所要回答的中心问题是：如何通过多数决的机制，将个人的理性选择转换成集体的选择？公共选择理论政策过程模型展示的基本思路包括以下几点：（1）该模型以个人为分析单位，而个人被假定为自利的和追求效用最大化的理性行动者。个人为了各自的…","contextPage":230},{"src":"ning-3","pages":[234],"quote":"各联盟内的政策行为者共享着一系列基本价值","context":"…ker）通过寻找合理的解决方案以减少竞争所引起的冲突的结果。③政策子系统中诸政策行为者结成不同的政策倡导联盟（policyadvocacycoalition），各联盟内的政策行为者共享着一系列基本价值（basicvalue）、因果信念（casualbelief）和问题认知（problemperception），并产生一致性行为。PACF认为由于同一联盟的政策行为者对信息有类似的筛选过滤模式，彼此之间更容易建立起一种信任感，进而有助于采取…","contextPage":234}],"moduleId":"p6","order":5},"p6-6":{"id":"p6-6","module":"p6","title":"上下来去：认识与操作的双重循环","goal":"能讲清哲学基础、两种过程及群众与领导的互动。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"认识过程回答怎样获得和检验知识","text":"宁书的“上下来去”模型以辩证唯物论和历史唯物论为基础。社会认识过程经历从实践到认识、再从认识到实践：制定政策要从实际中形成判断，执行政策又把判断放回实践中检验。"},{"t":"p","h":"操作过程回答怎样组织行动","text":"社会操作过程强调从群众中来、到群众中去，将民主与集中相联系。调查研究、形成决策、试点总结、推广反馈不是单向命令，而包含领导与群众、点与面的反复互动。"},{"t":"p","h":"答题不要只写四个字","text":"先写哲学基础，再写认识过程与操作过程的区别和联系，最后说明循环反馈。教学情境：社区服务试点先收集需求，集中形成安排，再试行并根据居民反馈修订。若不吸收真实反馈，就不能仅凭“有试点”宣称完整体现模型。"}],"concepts":[{"term":"上下来去","def":"宁书的“上下来去”模型以辩证唯物论和历史唯物论为基础。社会认识过程经历从实践到认识、再从认识到实践：制定政策要从实际中形成判断，执行政策又把判断放回实践中检验。","points":["交代哲学基础","区分社会认识和社会操作过程","用案例说明循环与反馈"]}],"exercises":[{"t":"choice","q":"“从群众中来、到群众中去”主要对应哪一层？","opts":["社会操作过程","只对应样本量计算","政策已完全终结","不需要认识过程"],"a":0,"why":"它说明政策如何在群众与领导之间组织形成和落实。"},{"t":"judge","q":"上下来去只表示上级命令下级执行，过程到此结束。","a":false,"why":"它包含认识与实践、民主与集中之间的反复互动和检验。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「上下来去：认识与操作的双重循环」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["交代哲学基础","区分社会认识和社会操作过程","用案例说明循环与反馈"],"sample":"“上下来去”模型以辩证唯物论和历史唯物论为基础。在社会认识上，政策由实践形成认识，再回到实践检验；在社会操作上，通过从群众中来、到群众中去联结民主与集中。社区服务先调查需求、集中决策，再试点反馈与修订，体现两个过程相互联系，而非单纯上令下行。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[239],"quote":"社会认识过程","context":"（二）政策的社会认识过程与政策的社会操作过程及其相互关系政策主体不管是个人还是组织，认识政策问题、制定和执行政策的行为都属于社会行为。政策主体对政策问题的认识经由社会实践而把握其因果关系的脉络，据此形成应对的行动方针；进而经由社会实践，将观念形态的政策思维转变成社…","contextPage":239},{"src":"ning-3","pages":[238],"quote":"从群众中来，到群众中去","context":"…点与归宿，在制定和执行政策的过程中切实做到集思广益、凝聚共识，充分体现人民群众的共同意愿。在政策的社会操作层面上，“上下来去”模型将这些理论内容归结为两句话：“从群众中来，到群众中去”。①《毛泽东选集》第3卷，北京：人民出版社1991年版，第801页。②③《邓小平文选》第2卷，北京：人民出版社1994年版，第126、143页。④《邓小平文选》第2卷，北京：人民出版社1994年版，第143页。","contextPage":238}],"moduleId":"p6","order":6},"p7-1":{"id":"p7-1","module":"p7","title":"问题认定：不要认真解决了错误的问题","goal":"能区分公共问题与政策问题，并写出可检验的问题陈述。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"从差距到公共关注","text":"公共问题涉及一定数量的社会成员感知现实与期望之间的显著差距，并将缩小差距的要求公开表达。进入政府考虑和处理范围的政策问题，不能直接等同于所有个人不满。问题认定既需要事实，也包含价值与利益判断。"},{"t":"p","h":"问题结构不同，分析方法不同","text":"问题可能相互依存、具有主观认定和动态变化等属性。结构良好的问题通常目标、方案和后果较清楚；结构不良的问题参与者多、价值冲突大、后果不确定，不能假装只有一个技术答案。"},{"t":"p","h":"教学情境：办事慢","text":"“工作人员不努力”只是一个原因假设。应先界定谁、在哪里、等待多久，再查材料重复、系统不通、需求高峰等可能机制。把“增设窗口”直接当问题，会在诊断前就锁定手段；正确陈述应给备选方案留下空间。"}],"concepts":[{"term":"问题认定","def":"公共问题涉及一定数量的社会成员感知现实与期望之间的显著差距，并将缩小差距的要求公开表达。进入政府考虑和处理范围的政策问题，不能直接等同于所有个人不满。问题认定既需要事实，也包含价值与利益判断。","points":["区分公共问题和政策问题","给出对象、差距及证据需求","避免把原因假设或方案当成问题"]}],"exercises":[{"t":"choice","q":"哪一种问题陈述更适合继续分析？","opts":["必须立即采购某软件","某类申请在高峰期等待明显延长，需要查明环节和原因","所有员工都不负责","唯一问题就是缺宣传"],"a":1,"why":"它界定对象与现象，保留原因检验和方案比较的空间。"},{"t":"judge","q":"问题认定只是客观数据统计，与价值判断无关。","a":false,"why":"什么差距值得解决、谁的需求优先，本身包含价值选择。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「问题认定：不要认真解决了错误的问题」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["区分公共问题和政策问题","给出对象、差距及证据需求","避免把原因假设或方案当成问题"],"sample":"问题认定应先界定受影响群体、现实与期望的差距及其公共性，再检验原因。办事慢可能来自程序重复、系统衔接或高峰需求，不能在调查前就归责于人员态度。对结构复杂的问题，还要公开不同群体的价值分歧，并随着新资料修订问题边界。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[250],"quote":"因而通过各种方式将其缩小差距的要求公之于众","context":"…把社会问题与公共问题看作在外延和内涵上相同的概念。而所谓公共问题，是指一定数量的社会成员感知其期望的目标、价值或景况，与现实获得的价值、利益或景况存在显著差距，因而通过各种方式将其缩小差距的要求公之于众，以争取社会同情与支持，或谋求引起政府关注和予以解决的一种情境。对于政策问题的含义，学术界也有不同的看法。美国学者安德森认为，从政策意图的角度来看，政策问题可以被定义为引起社会上某一部分人的需要或不满足的某种条件或环境，并为此寻求援助和补偿…","contextPage":250},{"src":"ning-3","pages":[254],"quote":"结构","context":"…地方性政策问题的意识也越强。因此，国家既存在统一性的全国政策问题，又存在具有差异性的区域性和地方性的政策问题，它们构成了整个国家的政策问题体系。邓恩从政策问题的结构角度，把政策问题划分为结构优良、结构适度和结构不良三种类型，见表7-1。①表7-1政策问题的结构类型要素问题的结构结构优良结构适度结构不良决策者一人或数人一人或少数人许多备选方案有限有限无限效用(价值)一致一致冲突结果确定性或风险性不确定未…","contextPage":254}],"moduleId":"p7","order":1},"p7-2":{"id":"p7-2","module":"p7","title":"议程设定：公众关注怎样进入政府讨论","goal":"能比较公众与政府议程，运用三源流解释议程变化。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"关注不等于已经决定","text":"公众或系统议程包含被社会成员共同认为值得关注、属于政府职责范围的问题；政府或制度议程意味着进入有权机构正式讨论。进入政府议程不代表已通过方案，更不保证按最初诉求实施。"},{"t":"p","h":"三种议程进入路径","text":"外在创始模型从政府外部提出要求，扩散到公众再进入政府议程；动员模型由政府提出并争取公众支持；内在创始模型由内部提出，主要在体制内推动。三者的区别在起点和扩散方向。"},{"t":"p","h":"三源流如何汇合","text":"金登的框架包括问题流、政策流和政治流。指标或焦点事件使问题受注意，政策共同体准备方案，政治环境影响接受程度；政策窗口提供耦合机会，政策经营者推动连接。利益集团可以影响表达与议程，但不是唯一决定因素。"}],"concepts":[{"term":"议程设定","def":"公众或系统议程包含被社会成员共同认为值得关注、属于政府职责范围的问题；政府或制度议程意味着进入有权机构正式讨论。进入政府议程不代表已通过方案，更不保证按最初诉求实施。","points":["区分公众和政府议程","解释三源流与窗口","指出参与者作用和非自动转化"]}],"exercises":[{"t":"choice","q":"某议题热度很高，却尚未进入政府正式讨论，应如何判断？","opts":["方案已经合法化","可能进入公众议程，但不能据此认定已进入政府议程","已经完成执行","公众议程与政府议程完全相同"],"a":1,"why":"社会关注、正式讨论、方案通过是不同阶段。"},{"t":"judge","q":"三源流中的政策流主要指备选方案及其可接受性，而不是政策执行的流水账。","a":true,"why":"政策流涉及建议、方案、技术可行性和价值适合程度等。"},{"t":"multi","q":"以下哪些属于三源流模型的源流？","opts":["问题流","政策流","政治流","财政报销流"],"a":[0,1,2],"why":"三源流是问题、政策与政治，资金约束可以影响过程，但不是第四条源流。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「议程设定：公众关注怎样进入政府讨论」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["区分公众和政府议程","解释三源流与窗口","指出参与者作用和非自动转化"],"sample":"公众关注不必然转化为政府议程。三源流框架认为，问题受到认知、可行方案获得准备以及政治条件变化，在政策窗口出现时可能由政策经营者联结起来。利益集团可提供资料、组织表达和施加压力，但正式议程还受制度权限、竞争议题和资源约束影响。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[265],"quote":"系统议程（system agenda）或称公众议程","context":"…织的高度重视并被正式纳入其政策讨论和被确定为应予以解决的政策问题的过程。在现代民主国家中，存在多种不同的议程，一般将议程通常分为如下两大类。^{③}1.系统议程系统议程（systemagenda）或称公众议程，它指的是由政治共同体的成员共同认为值得公众关注并且处于政府管辖范围之内的所有问题构成，政治系统讨论和认定有关公共问题的过程。由于政治系统本身有层级和区域以及行业等区分，因此系统议程就既可以是一定层级的，如国家、省、县、乡等，也可以是一定区…","contextPage":265},{"src":"ning-3","pages":[268],"quote":"提出三种模型：外在创始模型","context":"…题并不必然要经过系统议程。之后，科珀等学者对该模型进行了修正，根据政府在议程建立中所起的不同作用（即直接提出或间接提出政策问题）以及创始者扩散问题的程度和方向，提出三种模型：外在创始模型（outsideinitiationmodel）、动员模型（mobilizationmodel）和内在创始模型（insideinitiationmodel）。^{①}1.外在创始模型这是非政府团体创始政策问题的过程，通常先散布到系统议程，再…","contextPage":268},{"src":"ning-3","pages":[269],"quote":"他的模型建立在三种源流的基础上","context":"…，在议程建立过程中，各种因素的相互作用及其对于公共问题进入政府议程的影响。对议程确立过程研究颇有影响的还有约翰·金登（JohnW.Kingdon）的三源流模型。他的模型建立在三种源流的基础上：问题流（problemstream）；政策流（policystream）；政治流（politicalstream）。①图7-2显示了该模型的基本架构。图7-2约翰·金登的议程确立过程模型问题流主要关注问题的定义。它包括问题是如何被认知的，…","contextPage":269}],"moduleId":"p7","order":2},"p8-1":{"id":"p8-1","module":"p8","title":"政策目标：针对性、预期性与多元性","goal":"能区分目标和措施，并为冲突目标安排评价依据。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"目标不是工作清单","text":"政策目标是公共组织为解决政策问题而采取行动所要达到的目的、指标标的和效果。宁书概括三项特征：问题的针对性、未来的预期性、目的的多元性。开会、发文件、办培训是行动，不等于问题已解决。"},{"t":"p","h":"目标为什么会冲突","text":"一项政策可能同时追求效率、公平、安全等目标。不能只列多个好词而不说明优先关系。明确对象、期限和可观察结果，有助于比较方案；对不适合量化的目标，应说明定性评价依据。"},{"t":"p","h":"教学情境：就业服务","text":"“办20场培训”是产出安排；“提升目标群体持续就业能力”接近结果目标。前者可用于管理，但不能替代后者。目标还应兼顾资源可行性、政策协调和对象需求，避免为容易计数而改掉真正目的。"}],"concepts":[{"term":"政策目标","def":"政策目标是公共组织为解决政策问题而采取行动所要达到的目的、指标标的和效果。宁书概括三项特征：问题的针对性、未来的预期性、目的的多元性。开会、发文件、办培训是行动，不等于问题已解决。","points":["定义目标并区别于行动","准确写出三项特征","说明评价及权衡依据"]}],"exercises":[{"t":"choice","q":"哪项最直接描述政策结果目标？","opts":["印发宣传册","召开协调会","改善目标群体的持续就业状况","新增汇报表格"],"a":2,"why":"它关注受益群体的状态变化，其他主要是活动或行政产出。"},{"t":"judge","q":"政策目标具有多元性，因此目标之间永远没有冲突。","a":false,"why":"多元目标可能相互支持，也可能冲突，需要权衡和优先排序。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「政策目标：针对性、预期性与多元性」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["定义目标并区别于行动","准确写出三项特征","说明评价及权衡依据"],"sample":"政策目标指为解决问题而预期达到的目的与效果，具有针对性、预期性和多元性。就业政策不能只以培训场次代替就业改善，应说明目标群体和预期状态，并结合资源设置可行标准。面对覆盖广度、服务质量和财政成本的冲突，需要说明优先次序和评价理由。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[275],"quote":"政策目标一般主要具有如下三大特征","context":"…规划问题。政策目标（policygoals）就是有关公共组织特别是政府为了解决有关政策问题而采取的行动所要达到的目的、指标标的和效果。根据这一定义，我们不难看出政策目标一般主要具有如下三大特征：（1）问题的针对性。任何政策目标都不是凭空产生的，几乎都建立在对一定的社会问题的关注、关怀和认识之上。当然，这并不是说政策目标仅仅针对过去或现实已经存在的重大问题，实际上许多政策目标还要关心未来可能出现的重大问题。（2）未来的预期性。政策…","contextPage":275},{"src":"ning-3","pages":[278],"quote":"它能为制定政策方案提供方向性指导","context":"…们只能渐进地明确有关目标，但这一事实并不能否定我们在政策制定中有关政策目标的确定对政策制定过程的意义。一般而言，确定政策目标的价值意义主要体现为如下两点：（1）它能为制定政策方案提供方向性指导。政策目标就是政策方案所要遵循的方向。如果没有目标或者目标模糊，不仅不利于政策方案的规划和抉择，更不利于政策方案的贯彻，最终不利于有关政策问题的解决。（2）它能为政策方案的规划和实施提供核心的评估标准。政策评估的最核心的标准是把方案的可能后…","contextPage":278}],"moduleId":"p8","order":1},"p8-2":{"id":"p8-2","module":"p8","title":"方案规划、抉择与合法化","goal":"能比较备选方案，区分技术可行与正式合法化。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"规划与设计","text":"政策规划围绕既定问题和目标寻找、比较行动方案；政策设计更集中于方案内部的目标、对象、工具和组织安排。应当保留真正不同的备选方案，不能先决定唯一措施，再把比较写成装饰。"},{"t":"p","h":"比较不只看便宜","text":"方案需从效果、成本、技术、政治、行政、法律与社会接受条件等方面考察。可采用统一标准逐项比较，也要呈现不确定性。政策学习和移植应检验本地条件；相同文本可能因组织和资源不同产生不同结果。"},{"t":"p","h":"合法化是必要环节","text":"专家认为可行、社会讨论热烈，均不等于方案已具有正式效力。方案要由有权主体依适当程序作出决定，必要时完成相应法定程序。科学论证、民主参与和法治要求应相互支持。"}],"concepts":[{"term":"方案规划、抉择与合法化","def":"政策规划围绕既定问题和目标寻找、比较行动方案；政策设计更集中于方案内部的目标、对象、工具和组织安排。应当保留真正不同的备选方案，不能先决定唯一措施，再把比较写成装饰。","points":["说明备选方案和共同评价标准","分析可行性及不确定性","说明有权主体与适当程序"]}],"exercises":[{"t":"choice","q":"备选方案经济成本最低，但实施机关无相应权限，最恰当的结论是？","opts":["成本最低即可直接实施","仍需解决权限与程序问题，不能据成本直接通过","合法化只适用于国外","删除其他方案即可"],"a":1,"why":"技术经济评价与权限程序不能相互替代。"},{"t":"judge","q":"政策移植只要照抄成功地区的条文，不需要适应本地条件。","a":false,"why":"资源、制度、目标群体和环境均可能不同，移植需要比较与调适。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「方案规划、抉择与合法化」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["说明备选方案和共同评价标准","分析可行性及不确定性","说明有权主体与适当程序"],"sample":"政策规划应提出多个可选择的方案，并按效果、成本、公平与实施条件比较。选定方案需说明为何优于其他方案及结论的不确定性。技术可行并不意味着可立即执行，还要由有权主体依程序完成抉择与合法化；移植经验也须检验当地条件。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[280],"quote":"政策规划","context":"些重要问题，如政策规划与政策设计的概念界定、政策规划的主体与原则、政策学习与移植等。一、政策规划与政策设计的区别与联系（一）政策规划的含义及其特点政策规划（policyplan），也称政策构建（policyformulation）。有的学者认为，它是“发展一套处…","contextPage":280},{"src":"ning-3","pages":[296],"quote":"合法化","context":"…关活动。因此，政策采纳乃是决策者对于解决列在议程中的问题之备选方案，表示正式同意的意思”。这一界定的基本意涵是与我们的上述界定一致的。这个意义上的政策采纳与政策合法化或抉择合法化基本上是相同的。另外，还有一些公共政策学者对政策采纳从政策创新及扩散的视角进行观察。例如国外有学者专门研究州级行政机构环保政策创新采纳问题，认为影响创新政策采纳的主要因素有：问题的严重性，制度的重要性，利益集团的作用和情景性因素…","contextPage":296}],"moduleId":"p8","order":2},"p9-1":{"id":"p9-1","module":"p9","title":"史密斯模型：四个变量之间的张力","goal":"能准确列出四变量，并把模型描述与自己的评价分开。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"四个变量不是四个步骤","text":"史密斯模型包括理想化的政策、执行机关、目标群体和环境因素。理想化政策指合法、合理、可行的方案，不是“绝对完美的政策”。四要素相互影响，形成紧张、处理和反馈，而不是依次完成的流水线。"},{"t":"p","h":"教学情境：补贴执行不顺","text":"资格条件不清属于政策设计问题；机构人手和协调不足属于执行机关；对象不了解申请方式涉及目标群体；市场价格与社会习惯属于环境。更深一层要写相互作用，例如复杂申请条件如何增加机构成本并降低对象参与。"},{"t":"p","h":"怎样评价模型的缺陷","text":"以下是教学分析，不是教材逐字结论：模型覆盖因素广，但变量如何测量、权重如何比较、何种条件下关系改变，需要进一步操作化；对长期制度变化与跨层级互动也可补充分析。不能批评它“完全没有环境”或“完全没有反馈”，因为模型已有这些内容。"}],"concepts":[{"term":"史密斯模型","def":"史密斯模型包括理想化的政策、执行机关、目标群体和环境因素。理想化政策指合法、合理、可行的方案，不是“绝对完美的政策”。四要素相互影响，形成紧张、处理和反馈，而不是依次完成的流水线。","points":["准确列出四个变量","解释张力、处理与反馈","提出不曲解模型的局限与补充"]}],"exercises":[{"t":"choice","q":"批评史密斯模型时，下列哪项明显失当？","opts":["需要进一步说明变量权重","变量应转成可观察指标","模型完全没有考虑目标群体和环境","应用需结合具体制度"],"a":2,"why":"目标群体与环境本来就是四个核心变量中的两个。"},{"t":"judge","q":"史密斯四变量应按“政策—机关—群体—环境”顺序依次完成。","a":false,"why":"它们是相互关联的解释变量，不是固定操作步骤。"},{"t":"multi","q":"史密斯模型的核心变量包括哪些？","opts":["理想化的政策","执行机关","目标群体","环境因素","教材出版年份"],"a":[0,1,2,3],"why":"前四项是核心变量，出版年份不是该模型的解释变量。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「史密斯模型：四个变量之间的张力」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["准确列出四个变量","解释张力、处理与反馈","提出不曲解模型的局限与补充"],"sample":"史密斯模型从理想化政策、执行机关、目标群体与环境因素的互动解释执行过程。补贴申请条件、机构能力和对象反应可能形成张力，需要协调处理及反馈。模型有助于全面诊断，但应用时还应明确指标、关系与制度条件，不能把变量清单本身当作已经验证的因果解释。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[311],"quote":"理想化的政策，即合法、合理、可行的政策方案","context":"…过程》一文中，首次提出的一个分析政策执行因素及其生态关系的理论模型，因而又可称为“史密斯模型”。史密斯认为政策执行所涉及的因素很多，但有如下四个主要变量：（1）理想化的政策，即合法、合理、可行的政策方案。具体包括政策的形式、类型、渊源、范围以及社会对政策的认识。（2）执行机关，通常指政府中具体负责政策执行的机构。这包括执行机构的权力结构、人事配备及其工作态度、领导模式和技巧以及执行人员的情况等。（3）目标群体，即政策对象，泛指由于特定的政…","contextPage":311},{"src":"ning-3","pages":[311],"quote":"目标群体，即政策对象，泛指由于特定的政策决定而必须调整其行为的群体","context":"…社会对政策的认识。（2）执行机关，通常指政府中具体负责政策执行的机构。这包括执行机构的权力结构、人事配备及其工作态度、领导模式和技巧以及执行人员的情况等。（3）目标群体，即政策对象，泛指由于特定的政策决定而必须调整其行为的群体。这包括他们的组织或制度化程度、对领导的认知程度以及先前的政策经验。（4）环境因素，即与政策生存空间相关联的因素，包括政治环境、经济环境、文化环境、历史环境等。它是政策执行的路径依赖和影响因素。图9-3描述了在政策执行过程中这四个主要变量及…","contextPage":311}],"moduleId":"p9","order":1},"p9-2":{"id":"p9-2","module":"p9","title":"行动学派、组织学派与互适模型","goal":"能按共同点和不同解释重点比较执行理论。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"行动学派看怎样做","text":"谢书介绍行动学派时，突出把政策付诸实施的活动，尤其是解释、组织和实施。政策需要转成对象可理解的语言，建立执行安排并实际提供服务；强调行动有力与方法可行。"},{"t":"p","h":"组织学派看依靠什么做","text":"组织理论学派强调执行机构、组织原则、资源与能力。共同点是都关注政策如何有效落地；区别是前者突出行动过程，后者突出组织条件。不能把两者说成完全互斥，也不能把组织学派等同于“机构越多越好”。"},{"t":"p","h":"从上下命令到双向适应","text":"互适模型（麦克拉夫林，1976）把执行视为执行者与受影响者就目标或手段相互调适的过程，是一种动态平衡，执行是否有效取决于双方互适的程度。自上而下关注目标传递与控制，自下而上关注基层和对象的现实行为；互适视角把两端接起来。调适应当有边界，不能成为违法变更政策或只满足执行者利益的理由。"}],"concepts":[{"term":"行动学派、组织学派与互适模型","def":"谢书介绍行动学派时，突出把政策付诸实施的活动，尤其是解释、组织和实施。政策需要转成对象可理解的语言，建立执行安排并实际提供服务；强调行动有力与方法可行。","points":["先写共同关注有效执行","分别说明行动过程和组织条件","说明互补或双向调适的边界"]}],"exercises":[{"t":"choice","q":"比较两学派，哪一组重点最合适？","opts":["行动活动与组织条件","一个主张执行，一个反对执行","一个无需资源，一个无需行动","两者完全没有共同点"],"a":0,"why":"差别在解释重点，二者都关心有效执行，也可以相互补充。"},{"t":"judge","q":"互适模型只要求目标群体单向服从执行机关。","a":false,"why":"互适强调沟通与双向调整，但应在合法权限与公共目标约束下进行。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「行动学派、组织学派与互适模型」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["先写共同关注有效执行","分别说明行动过程和组织条件","说明互补或双向调适的边界"],"sample":"行动学派重视解释、组织与实际实施，强调执行活动和方法；组织理论学派强调机构、资源与能力是政策落地的依托。二者共同关注有效执行，只是观察重心不同。结合互适视角，还应考察执行者和对象如何沟通调整，但不能以调适为名背离政策目标和合法程序。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"xie-intro-5","pages":[236],"quote":"行动学派和组织理论学派","context":"…、政策影响的大小、政策成功的程度都有着非常重要的影响。毫无疑问，如果执行失败了，那么先前所做的一切就没有任何意义了。关于政策执行的理论界定，长期以来学术界形成了行动学派和组织理论学派两大流派，它们分别从两个不同角度和侧面对政策执行进行了描述。行动学派的主要代表人物查尔斯·琼斯认为：“政策执行是将一项政策付诸实施的各项活动，在诸多活动中，尤以解释了组织和实施二者最为重要。所谓解释就是将政策的内容转化为民众所能接受和理解的…","contextPage":236},{"src":"ning-3","pages":[311],"quote":"政策执行是执行者（组织或人员）与受影响者之间就目标或手段相互调适的一个过程","context":"…Mclanghin），其代表作是写于1976年的《互相调适的政策实施》。麦克拉夫林在对美国当时教育结构改革问题进行个案研究的基础上，通过由具体到抽象的方法，说明政策执行是执行者（组织或人员）与受影响者之间就目标或手段相互调适的一个过程，他认为这应是一个动态平衡的过程，政策执行是否有效取决于二者互适的程度。图9-4就展示了一定环境下二者的互适过程及与政策的关系，②从中也可看出麦克拉夫林的相互调适模型至少包含如下四项逻辑认定：图9-4政策执行互适过程模型（1）政策执行者与受…","contextPage":311},{"src":"ning-3","pages":[311],"quote":"政策执行是否有效取决于二者互适的程度","context":"…题进行个案研究的基础上，通过由具体到抽象的方法，说明政策执行是执行者（组织或人员）与受影响者之间就目标或手段相互调适的一个过程，他认为这应是一个动态平衡的过程，政策执行是否有效取决于二者互适的程度。图9-4就展示了一定环境下二者的互适过程及与政策的关系，②从中也可看出麦克拉夫林的相互调适模型至少包含如下四项逻辑认定：图9-4政策执行互适过程模型（1）政策执行者与受影响者之间的需求和观点并不完全一致，基于双方在政策上的共同利益，彼此必…","contextPage":311}],"moduleId":"p9","order":2},"p9-3":{"id":"p9-3","module":"p9","title":"执行偏差：表现、原因与矫正对应起来","goal":"能辨认执行偏差，并针对原因提出措施。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"偏差是什么","text":"执行偏差指执行过程中偏离政策原定目标或要求，造成内容和效果走样。合法且服务于原目标的因地制宜，不应一概被视为偏差；判断要回到目标、权限、程序和实际后果。"},{"t":"p","h":"用行为辨认形式","text":"宁书列举象征式、附加式、残缺式、替代式、观望式、照搬式和规避式等表现。只做宣传不落实是象征式；擅加不合理条件是附加式；只挑部分内容落实是残缺式；以自己的措施取代原意是替代式。形式可重叠，不宜机械单选归因。"},{"t":"p","h":"原因与办法成对写","text":"主观方面包括利益动机、素质、管理和宣传缺陷；客观方面包括政策本身（目标错位、政策打架、不可行、缺乏稳定性）、政策环境变化、目标人群压力和监督乏力。利益扭曲需纠正激励并监督，能力不足需培训和资源，目标模糊需明确标准，沟通困难需建立协调与反馈。"}],"concepts":[{"term":"执行偏差","def":"执行偏差指执行过程中偏离政策原定目标或要求，造成内容和效果走样。合法且服务于原目标的因地制宜，不应一概被视为偏差；判断要回到目标、权限、程序和实际后果。","points":["定义并区分合理调适","按材料辨认具体表现","将原因与矫正措施一一对应"]}],"exercises":[{"t":"choice","q":"规定不收费的服务，在执行中被额外要求缴纳不合理费用，主要属于什么？","opts":["附加式执行","目标完整实现","随机抽样","政策评估"],"a":0,"why":"执行者在原政策之外附加背离目标的内容。"},{"t":"judge","q":"执行偏差只能归因于基层人员态度差，制度与资源无需分析。","a":false,"why":"需要同时检查激励、管理、政策质量、环境和资源，不能用道德标签代替诊断。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「执行偏差：表现、原因与矫正对应起来」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["定义并区分合理调适","按材料辨认具体表现","将原因与矫正措施一一对应"],"sample":"执行偏差表现为政策目标或内容在落实中走样。对额外收费，应识别附加式执行，再调查部门利益、监督缺位和经费安排等原因。矫正应取消违规条件、明确责任与流程、完善经费保障和申诉监督，而不是只喊加强重视；必要的调适仍应保持合法并服务于政策目标。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[330],"quote":"象征式政策执行","context":"…示了政策执行偏差的一种表现形式，但是在一定程度上表明了政策执行偏差的共同原因，即政策执行者有着不同于政策制定者的特殊动机。政策执行偏差有如下一些表现形式：（1）象征式政策执行，即在执行公共政策的过程中，只重视表面文章和形象包装，而忽视了深层问题的解决。政策执行成为一面到处挥舞的旗帜，政策目标则没有落到实处。（2）附加式政策执行，即在执行公共政策的过程中，人为地附加了与政策目标背离的其他内容，使政策执行超出了政策…","contextPage":330},{"src":"ning-3","pages":[331],"quote":"可以分为两大方面","context":"…以产生，最为直接的原因是原有政策的目标缺乏约束力以及附加的政策功能吸引力过于强大。^{②}综合各种执行偏差产生的各种原因，我们可以梳理出执行偏差产生的共同原因，可以分为两大方面。（一）主观原因作为一种普遍现象，政策执行者的自身利益和需求影响着政策的有效执行。公共选择学派认为，政府内部的官僚集团也会有自己的利益，也是一个经济人，也会追求自身利益的最大化，由此甚至会导致公共权力的异化，如大量滋生寻租与腐败现象等，使政…","contextPage":331}],"moduleId":"p9","order":3},"p10-1":{"id":"p10-1","module":"p10","title":"评估内容与标准：有效、效率和公平分开写","goal":"能区分评估对象、内容和判断标准。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"先问评什么","text":"政策评估根据一定标准考察政策及其实施结果。谢书从对目标群体、非目标群体的影响，当前和未来影响，以及直接和间接成本等方面展开内容。不能只写活动次数或预算完成率。"},{"t":"p","h":"再问按什么判断","text":"宁书区分事实标准与价值标准。事实标准包括政策效率、效益、充分性和适当性：效率看投入与产出，效益关注目标实现程度，充分性追问满足需要的程度，适当性追问目标和方案是否合适。价值标准还需讨论回应性、公平等；成本低、速度快，并不自动意味着服务合理。"},{"t":"p","h":"教学情境：培训计划","text":"培训人数是产出，持续就业改善才更接近效果；单位效果所需成本涉及效率。还应看未参与者是否受排挤、不同群体机会是否公平、效果能否持续。评价需要呈现预期与非预期、正面与负面后果。"}],"concepts":[{"term":"评估内容与标准","def":"政策评估根据一定标准考察政策及其实施结果。谢书从对目标群体、非目标群体的影响，当前和未来影响，以及直接和间接成本等方面展开内容。不能只写活动次数或预算完成率。","points":["区分产出、结果和影响范围","区分效率、效益与价值标准","兼顾外溢、时间与成本"]}],"exercises":[{"t":"choice","q":"“每增加一名持续就业者需要多少投入”主要考察什么？","opts":["效率","只是政策名称","是否召开过会议","终结的法律程序"],"a":0,"why":"它把效果与投入联系起来，但还需单独分析公平与其他影响。"},{"t":"judge","q":"培训人次达到计划值，就能证明就业问题已经解决。","a":false,"why":"活动产出不等于最终效果，必须调查对象状态变化及政策贡献。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「评估内容与标准：有效、效率和公平分开写」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["区分产出、结果和影响范围","区分效率、效益与价值标准","兼顾外溢、时间与成本"],"sample":"政策评估既要看目标群体的预期和非预期变化，也要检查非目标群体、长期影响及成本。事实标准可考察效率和目标实现程度，价值标准则考察公平与回应性。就业培训不能只统计参加人数，还需追踪持续就业、单位效果成本和弱势群体可及性。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"xie-intro-5","pages":[278],"quote":"对目标群体以外的群体产生的影响","context":"…的过量生产；某一福利计划确实改变了受益群体的收入状况，却削弱了他们就业的主动性；廉租房计划可以有效改善贫困人员的居住状况，但可能会产生由贫富隔离引发的问题。2.对目标群体以外的群体产生的影响一项政策不仅会对目标群体产生影响，而且还会对一些非目标群体产生影响。这种影响被称为第三方影响（third-partyeffects）或溢出效应。因为它通常会增加第三方的收益或成本。比如，廉租房等公共住宅项目不仅惠及低收入阶层，而且会给建筑企…","contextPage":278},{"src":"ning-3","pages":[347],"quote":"事实标准主要包括政策效率、政策效益、政策充分性和政策适当性","context":"…状况。事实标准要尽可能具有可测量的客观指标。在政策评估活动中，通过事实标准来体现公共政策及其运行到底在实际上对政策对象和政策环境施加了什么影响或产生了什么作用。事实标准主要包括政策效率、政策效益、政策充分性和政策适当性这几个方面。","contextPage":347},{"src":"ning-3","pages":[348],"quote":"政策效率是指政策的产出与投入之间的比例关系","context":"（1）政策效率。政策效率是指政策的产出与投入之间的比例关系，效率高是指以尽可能少的投入获得尽可能多的产出。政策的投入包括政策活动所投入的人力、物力、财力、信息和时间，政策的产出是政策执行过程中直接产生的结果。投入与产出之比可以通过设定具体指标和运用通行的计量方法计算出来。政策效率高低可以细化为三对…","contextPage":348},{"src":"ning-3","pages":[349],"quote":"政策公平性","context":"…总的政策方面看，政府已经考虑到了它的回应性，那就表明政策的回应程度还是高的。因此，回应性既要考虑到单一性政策的回应性，也应更多地考虑到复合性政策的回应性。（2）政策公平性。公平性（equity）标准是指物品、资源、服务和被赋予价值的其他东西在社会个人和群体中的分配是否公正而没有偏私地考虑到了全体民众的利益。它可以指现行的分配现状，或者指拟议的政策或计划中将要实现的分配。^{①}这项标准衡量的是政策结果所表现…","contextPage":349}],"moduleId":"p10","order":1},"p10-2":{"id":"p10-2","module":"p10","title":"评估为何困难，监控如何改进","goal":"能解释评估障碍，并提出数据、制度与方法上的应对。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"不是收集一个数字就够了","text":"宁书列出六方面：信息不公开、政策主体不重视或不配合、目标多元与政治化、沉淀成本处理不当、评估方式方法不完整、经费支持不足。目标不清使“是否成功”难判断；信息缺失使外部评估难开展；既有投入可能使评价者不愿承认失败；只做内部总结会削弱评价的全面性。"},{"t":"p","h":"证据与价值同时透明","text":"改进应包括预先明确目标和标准、记录基线、保存数据口径、检查样本偏差并允许必要的独立评估。对无法排除的外部影响，要报告不确定性；对公平与效率冲突，要说明权衡依据。"},{"t":"p","h":"监控贯穿政策过程","text":"监控包括对政策活动的监督与控制，不能等一切结束才纠偏。制定时查权限与程序，执行时查合规与偏差，评估后推动反馈改进。监控有助于落实责任，但不能仅靠增加表格代替实质检查。"}],"concepts":[{"term":"评估为何困难，监控如何改进","def":"宁书列出六方面：信息不公开、政策主体不重视或不配合、目标多元与政治化、沉淀成本处理不当、评估方式方法不完整、经费支持不足。目标不清使“是否成功”难判断；信息缺失使外部评估难开展；既有投入可能使评价者不愿承认失败；只做内部总结会削弱评价的全面性。","points":["解释信息、目标和主体等障碍","提出可执行的数据与制度办法","区分评估判断和全过程监控"]}],"exercises":[{"t":"choice","q":"执行部门只提供成功案例且拒绝提供完整数据，首先影响哪一点？","opts":["评估信息基础与独立判断","证明政策绝对有效","自动消除选择偏差","只影响网页排版"],"a":0,"why":"资料选择与不配合会使评估系统性偏向，需补完整口径和取数机制。"},{"t":"judge","q":"已投入很多资金，是继续一项无效政策的充分理由。","a":false,"why":"沉淀成本不能自动证明继续投入有益，应比较未来成本收益和其他后果。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「评估为何困难，监控如何改进」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["解释信息、目标和主体等障碍","提出可执行的数据与制度办法","区分评估判断和全过程监控"],"sample":"评估困难来自信息、主体配合、目标冲突及资源等条件。应事前明确标准和基线，保证数据可获得并记录口径，鼓励适当的独立评价，同时说明因果识别的限制。监控则应贯穿制定、执行与反馈，发现偏差后明确责任和整改，而不是只形成一份总结。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[350],"quote":"政策信息不公开，使外部评估困难重重","context":"…策评估的因素有许多，人们往往以影响幅度大小、影响时间长短、影响效力高低，作为划分重要因素和次要因素的主要标准。影响公共政策评估的重要因素主要有以下几方面：（一）政策信息不公开，使外部评估困难重重政策评估的基础是掌握相关的政策信息和资料。准确的政策信息资源是高质量评估工作的前提。但在实际生活中，“准确而相关的统计数据及其他信息的缺少可能会妨碍政策评价者。”①政府往往以保密为由拒绝发布应该发布的政策信息和相关资料。而对于评估者来说，由…","contextPage":350},{"src":"ning-3","pages":[364],"quote":"政策监控","context":"…只眼闭一只眼；当有人举报时敷衍塞责，打马虎眼。实践证明：没有监督，不对违反政令者采取惩戒措施，红头文件就会成为废纸一张。在政策过程中，往往需要对政府制定和执行的政策监控，以提高政策合法性、合理性与有效性的程度。一、政策监控的含义、类型与功能（一）公共政策监控的含义政策监控活动与政策制定、政策执行、政策评估和政策调整一样，都是完整的政策过程必不可少的组成部分。为了确保政策过程各项活动的合法性、合理性和有效性…","contextPage":364}],"moduleId":"p10","order":2},"p11-1":{"id":"p11-1","module":"p11","title":"稳定、调整、接续与创新","goal":"能按变化幅度和目的区分政策变动，并分析渐进调整的理由。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"稳定和变化都有价值","text":"政策稳定有利于预期和持续行动，但环境、对象与问题改变后，维持旧办法也可能产生新成本。政策变动是较宽的概念，不能把任何文字修订都叫根本创新。"},{"t":"p","h":"区分几种变化","text":"政策调整是在既有方向或基本框架下修订目标、工具、对象等安排；政策接续强调新旧安排在功能和过程上的衔接；政策创新强调提出或采用新的理念、工具或制度安排。要根据材料变化内容判断，不靠文件标题。"},{"t":"p","h":"案例怎么答","text":"分析生育等政策的历史变化时，可从人口与社会条件、需求、原政策效果和实施能力寻找原因，但年份和具体条文应以题目材料或核实文件为准。渐进调整可能减少预期冲击、积累反馈、协调利益；不等于任何变化都必须慢。"}],"concepts":[{"term":"稳定、调整、接续与创新","def":"政策稳定有利于预期和持续行动，但环境、对象与问题改变后，维持旧办法也可能产生新成本。政策变动是较宽的概念，不能把任何文字修订都叫根本创新。","points":["区分稳定、调整、接续与创新","从环境、需求与政策效果解释变化","分析渐进的收益和局限"]}],"exercises":[{"t":"choice","q":"基本方向不变，但根据反馈扩大服务对象并修改补贴标准，首先可从什么分析？","opts":["政策调整","政策功能全部消失","必然属于完全废止","与政策变动无关"],"a":0,"why":"调整是变动的一种常见形式，需进一步说明改的是对象、工具还是目标。"},{"t":"judge","q":"只要政策保持稳定，就不会产生负面影响。","a":false,"why":"环境或需求改变后，过度维持原安排可能延续失衡或错失改革机会。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「稳定、调整、接续与创新」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["区分稳定、调整、接续与创新","从环境、需求与政策效果解释变化","分析渐进的收益和局限"],"sample":"政策调整是政策变动中的常见形式。环境与需求变化、既有目标实现程度和执行反馈，都可能推动修订。渐进调整有助于协调利益、减轻冲击并逐步积累经验，但应防止拖延必要改革。分析具体案例时，要指出变了哪些对象、目标或工具，并说明未变的基本方向。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[383],"quote":"政策调整是公共政策变动当中最常见的一种形式","context":"…，并努力从中寻找适合自己的经验，规避可能的教训。因此，不同层次、不同领域政策创新活动产生的示范效应，将在一定程度上成为政策创新的重要动力。第二节政策的调整与接续政策调整是公共政策变动当中最常见的一种形式，西方的公共政策学者一般很少把政策调整作为一个专门的论题来进行研究，而只是把它当作渐进决策的一个结果或者是政策部分终结的一种表现。这或许是由于在西方民主体制下，轮番执政的各党派为了彰显自己政纲的特色，总是抨击对手所采用的政策措施，因而更关注…","contextPage":383},{"src":"ning-3","pages":[390],"quote":"政策接续","context":"间、层次间各自为政、各行其是，降低政策合法性和有效性，乃至执政的合法性。因此，政策接续在政策过程中具有重要的意义。首先，政策接续有利于保持政策的稳定。政策接续就是保持政策目标的延续性，这与衡量政策是否稳定的标准是一致的。看政策是否稳定，除了看政策系统和政策过程是否稳定之外，更重要的是看政策目标是否具有稳定性。只有政策目标稳定…","contextPage":390}],"moduleId":"p11","order":1},"p11-2":{"id":"p11-2","module":"p11","title":"政策终结：五种方式与六类障碍","goal":"能区别终结对象、方式与障碍，并提出相应策略。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"结束什么，怎样结束","text":"政策终结不一定意味着所有公共服务停止。宁书把终结对象分为四种：功能、组织、政策本身和政策工具，需看问题是否仍存在。终结方式有五种：政策废止、替代、分解、合并和缩减；对象与方式不是同一分类。"},{"t":"p","h":"五种方式的区别","text":"废止直接停止政策效力；替代以新政策接续旧政策；分解将旧内容拆为多项；合并把仍有用部分重新组合；缩减以逐步减少投入或范围等方式推进。替代、分解与合并可能保留功能，因此不等于公共需求消失。"},{"t":"p","h":"为何失效了仍难结束","text":"谢书介绍六类障碍：心理抵触、机构持续性、机构动态适应性、反终结联盟、法律程序障碍、高昂终结成本。策略应针对原因：公开证据、沟通利益、设计过渡与必要补偿、依法处理组织和预算，而非只宣布停止。"}],"concepts":[{"term":"政策终结","def":"政策终结不一定意味着所有公共服务停止。宁书把终结对象分为四种：功能、组织、政策本身和政策工具，需看问题是否仍存在。终结方式有五种：政策废止、替代、分解、合并和缩减；对象与方式不是同一分类。","points":["准确列出五种方式并区分对象","说明六类障碍的机制","将策略与具体障碍对应"]}],"exercises":[{"t":"choice","q":"几项内容重复的计划停止单独运行，保留有效部分组成新政策，属于什么？","opts":["政策合并","所有功能废除","政策完全不变","政策抽样"],"a":0,"why":"旧政策形式终结但有效内容重新组合，属于合并。"},{"t":"judge","q":"政策终结只能发生在政策失败之后。","a":false,"why":"目标已经实现、问题已经解决，也可能使政策没有继续存在的必要。"},{"t":"multi","q":"下列哪些是宁书列出的政策终结方式？","opts":["政策替代","政策分解","政策合并","政策缩减","政策抽样"],"a":[0,1,2,3],"why":"还有政策废止；抽样是研究方法，不是终结方式。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「政策终结：五种方式与六类障碍」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["准确列出五种方式并区分对象","说明六类障碍的机制","将策略与具体障碍对应"],"sample":"政策终结可采取废止、替代、分解、合并和缩减。终结政策形式不必然取消公共功能。其阻力可能来自相关人员抵触、组织生存和适应、反终结联盟、法律程序及成本。应依据评估区分保留与退出部分，设计依法可行的过渡，公开说明理由并处理利益影响。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[393],"quote":"一般说来，政策终结的对象有四种类型","context":"…益者、政策制定者和政策执行机构的负责人，更是与之有着切身的利害关系。如果处理不当就会阻碍政策的终结。因此，为了顺利实现政策的终结，就必须首先明确政策终结的对象。一般说来，政策终结的对象有四种类型。1.功能终结功能是政府为了满足民众的需要而提供的能够产生一定作用的服务，它代表着政府活动的基本方向，政策的效果就是通过具体的功能来体现的。所谓功能的终结，就是终止由政策执行而带来的某种或某些服务。在政策终结的所有对象中，以功能的终结最难，…","contextPage":393},{"src":"ning-3","pages":[393],"quote":"政策终结的方式有五种","context":"…们的终结不会引起太大的震动。（三）公共政策终结的方式公共政策的终结应当由公共权力机关通过合法的程序做出决定，并以文件、公告等形式向社会宣布终结的指令。一般说来，政策终结的方式有五种。1.政策废止政策废止是政策终结的一种最直接、最彻底的方式。废止一项政策就是宣告该政策在规定的时间和范围内停止实施，不再对社会产生效力。政策废止一般针对那些经评估认定已经完全过时或完全失效的政策。这样有利于防止那些反对政策终结的组织和人员继…","contextPage":393},{"src":"ning-3","pages":[394],"quote":"5.政策缩减","context":"…后以一项新政策的面貌出现。这样的合并通常有两种形式：一种是将被终止的政策的内容合并到一项已有的政策当中，另一种是把两项或两项以上被终止的政策合并为一项新的政策。5.政策缩减政策缩减指的是采用渐进的方式对政策进行终结，以缓冲终结所带来的巨大冲击，逐步协调好各方面的关系，减少损失。一般说来，政策缩减是通过逐步减少对政策的投入，缩小政策实施范围，放松对政策执行的控制等措施，来达到最终完全终止政策的目的。比如我国的物…","contextPage":394},{"src":"xie-intro-5","pages":[315],"quote":"它包括六种障碍","context":"….3政策终结的障碍与措施8.3.1政策终结的障碍彼得·德利昂提出了一个关于政策终结障碍的理论框架（terminationobstaclesframework）。它包括六种障碍：（1）心理上的抵触；（2）机构的持续性；（3）机构的动态适应性；（4）反终结的联盟；（5）法律程序上的障碍；（6）高昂的终结成本。1.心理上的抵触“那些与政策相关的人员都愿意看到政策继续存在下去，却很少有人喜欢听到计划失败或计划改变。”这…","contextPage":315}],"moduleId":"p11","order":2},"p12-1":{"id":"p12-1","module":"p12","title":"完整案例：用六步框架提出建议","goal":"能从问题出发写出有比较、有实施和反馈的政策建议。","minutes":18,"tag":"基础精讲","reviewStatus":"reviewed","blocks":[{"t":"p","h":"六步不是六个空标题","text":"帕顿和沙维奇的框架包括认定和细化问题、建立评估标准、确认备选政策、评估备选政策、展示和区分备选政策、监督和评估政策实施。后续证据可能要求回到前面重新界定问题，不能理解成绝不回头的流程。"},{"t":"p","h":"教学材料：社区养老服务","text":"某社区反映服务站使用率低，但工作人员认为床位和活动室充足。这里尚未给出真实调查数据。应调查潜在使用者、服务需求、开放时间、距离、收费和信任，而不是直接认定宣传不够。"},{"t":"p","h":"把学过的知识放在同一条论证上","text":"标准可包括可及性、服务效果、公平与成本；备选方案可包括延长开放、上门服务或与现有机构合作。比较时说明不同对象受益和资源需求；确定责任、试点与反馈指标。智库或专家提供知识和建议，不替代有权机关的决定。"},{"t":"p","h":"收束答案","text":"先用材料界定问题，再说明理论为何适用，给出至少两个方案的取舍及实施条件，最后留下评估与修正机制。材料没有给出的数量和效果不要编造，建议也不要写成已经发生的事实。"}],"concepts":[{"term":"完整案例","def":"帕顿和沙维奇的框架包括认定和细化问题、建立评估标准、确认备选政策、评估备选政策、展示和区分备选政策、监督和评估政策实施。后续证据可能要求回到前面重新界定问题，不能理解成绝不回头的流程。","points":["根据材料界定问题，不编造数据","设置标准并比较真实不同的方案","交代实施责任和反馈指标"]}],"exercises":[{"t":"choice","q":"使用率低，最合理的起步是什么？","opts":["直接新建一座更大的服务站","调查对象需求与使用障碍，重新界定问题","编造满意度证明成功","只增加汇报次数"],"a":1,"why":"政策分析从问题认定开始，不能在证据不足时锁定措施。"},{"t":"judge","q":"分析中发现问题边界错了，应回到问题认定并修改标准。","a":true,"why":"框架支持反馈与修正，不是只许前进的机械步骤。"},{"t":"order","q":"按帕顿和沙维奇框架排列分析步骤。","items":["建立评估标准","监督和评估政策实施","认定和细化问题","评估备选政策","确认备选政策","展示和区分备选政策"],"a":[2,0,4,3,5,1],"why":"先问题与标准，再生成、评价和展示方案，最后监督评估；实作中允许反馈回前一步。"}],"write":{"type":"简答 / 材料分析","prompt":"围绕「完整案例：用六步框架提出建议」写一段有定义、有解释、有应用的答案。","minutes":8,"points":["根据材料界定问题，不编造数据","设置标准并比较真实不同的方案","交代实施责任和反馈指标"],"sample":"使用率低可能反映服务供给与需求错配，应先调查人群、时间、距离、费用和信任等障碍。以可及性、效果、公平和成本为标准，比较延长开放、上门服务及机构合作。再根据证据选择可行组合，明确职责与试点安排，持续记录服务对象覆盖和实际改善，并据反馈修订。","tip":"本课范答和要点用于自评，不是官方评分细则；先独立作答，再对照漏项。"},"evidence":[{"src":"ning-3","pages":[410],"quote":"认定和不断地重新界定问题是非常重要的工作","context":"…为具体的组成部分。这些分析步骤构成了一个分析模型，见图12-2，现在简单介绍政策分析的基本过程。①图12-2帕顿和沙维奇的政策分析基本过程（1）认定和细化问题：认定和不断地重新界定问题是非常重要的工作。政策分析者通过这个过程要达到有意义地陈述政策问题、集中于中心问题和关键要素的目的。（2）建立评估标准：为了在备选方案之间进行比较、衡量和选择，必须建立评估标准。基本的评估标准包括成本、效益、效用、效率、平等以及政治可行性等。（3）确认备选…","contextPage":410},{"src":"ning-3","pages":[410],"quote":"展示和区分备选政策","context":"…法对备选方案进行评估，选择最满足主要标准的方案。有时候，在对政策进行确认和评估的过程中会发现政策问题的新内容，这就需要重新进行问题的界定并且修改评估标准。（5）展示和区分备选政策：经过对备选政策的评估，决策者或者政策分析人员能够提出关于一系列备选方案、具体标准和每种备选方案符合标准程度的报告。备选政策的展示可通过各种技术手段进行，表现出各备选方案的优缺点、技术可行性以及政治可行性等。（6）监督和评估政策实施：在一个…","contextPage":410}],"moduleId":"p12","order":1}},"framework":{"question":"公共问题如何转化为政策，政策又怎样影响问题？","groups":[{"title":"先学会提出问题与使用证据","text":"分清研究、分析、价值判断和资料能够支持的结论。","modules":["p1","p2","p3"]},{"title":"认清政策、工具与参与者","text":"区别目的与手段，辨认主体、对象和环境。","modules":["p4","p5"]},{"title":"选择解释政策的模型","text":"比较假设、机制和适用情境。","modules":["p6"]},{"title":"让问题进入议程并形成方案","text":"从问题认定到目标、备选方案和抉择。","modules":["p7","p8"]},{"title":"理解执行中的变化","text":"考察组织、目标群体与环境如何影响实施。","modules":["p9"]},{"title":"评估结果并反馈调整","text":"评估与监控可以推动调整、终结或重新界定问题。","modules":["p10","p11"]},{"title":"综合形成分析建议","text":"在同一问题中运用前面的概念、证据与方法。","modules":["p12"]}],"threads":["政策过程允许反馈、反复与重叠，不是固定的单向流水线。","主体、环境与价值选择贯穿各环节。","对每个判断追问：证据是什么，还有什么替代解释？"],"guides":{"p4":{"question":"政策想改变什么，又通过什么手段产生影响？","position":"在“认清政策、工具与参与者”这一层，把概念、分类、功能与工具分开，再连接起来。","prerequisites":["p1-1"],"before":"“发放补贴”和“改善服务可及性”是在回答同一个问题吗？先分清手段与希望实现的变化。","branches":[{"title":"概念与分类","question":"什么是公共政策，按什么标准分类？","lessons":["p4-1"]},{"title":"政策的功能","question":"政策怎样管制、引导、调控与分配？","lessons":["p4-1"]},{"title":"工具及其选择","question":"用什么手段，选择受哪些条件影响？","lessons":["p4-2"]}],"relations":[{"label":"区别：目标、功能与工具","text":"目标说明希望实现的状态，工具说明采用的手段，功能说明政策发挥的作用；答题时先辨认题目问的是哪个层次。","lessons":["p4-1","p4-2","p8-1"]},{"label":"条件：工具选择与主体能力","text":"同一手段在不同组织能力、目标群体和环境中可能产生不同结果，不能只比较工具的强制程度。","lessons":["p4-2","p5-1","p9-1"]},{"label":"反馈：工具实施与评估","text":"实施后要检查目标是否实现及其他影响；使用了某种工具，并不能证明它有效。","lessons":["p4-2","p10-1"]}],"hint":"把“是什么、怎样分类”“发挥什么作用”“用什么手段、为何选择它”分开。再连接到后面的目标、执行与评估。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，列出本章的主要层次，说明每一层回答什么问题。","reference":"可以分为概念与分类、政策功能、工具及选择。概念界定研究对象；分类须说明标准；管制、引导、调控、分配说明作用；工具是实现目标的手段，其选择还需分析问题、能力、对象与环境。不同排法也可，只要不混淆层次。","check":"我区分了概念分类、功能、工具选择，而不只是列名词。"},{"id":"relation","label":"解释一条知识联系","prompt":"选择“目标、功能、工具”中的两个，说明它们的区别，并用一个例子连接起来。","reference":"例如希望改善养老服务可及性是目标，补贴是可考虑的工具，而引导参与、分配资源是可能发挥的功能。目标不能直接当工具名，工具是否有效仍需结合条件判断。也可用别的合理例子说明。","check":"我解释了两个层次的区别，并用例子说明它们如何相连。"},{"id":"application","label":"用框架解释案例","prompt":"针对下面的养老案例，比较两种可考虑的政策手段，说明选择条件与需要收集的证据。","reference":"可比较直接组织服务、购买服务或面向对象的补贴等备选手段。选择需考虑出行障碍、服务供给能力、经费和监督成本，并调查不同老人实际需求。评估应关注是否真正获得适合的服务，不能只数发放次数；材料不足时应列待核实信息。","check":"我比较了手段及选择条件，说明需要什么证据，而没有直接断言某方案最好。"}],"evidenceLessons":["p4-1","p4-2","p8-1","p9-1","p10-1"],"bridge":{"subject":"618","module":"m3","text":"换到组织视角：谁有能力实施这些手段，怎样分工？"},"evidence":[{"src":"ning-3","pages":[18],"quote":"研究的目的或目标是建构政策理论","context":"…活动关注的重点和研究范围是政策内容、政策过程和政策产出，发现和验证政策与其主体和客体之间、与有关社会和自然环境诸因素之间的因果联系。因此，政策研究是一门科学。③研究的目的或目标是建构政策理论，创设研究方法，推动学科发展。④对研究成果的社会反响的期待是获得学术界同僚的肯定。关于政策分析或公共政策分析。“政策分析”作为学术术语是由美国耶鲁大学教授林德布洛姆（CharlesLindblom）于1956年出版的《政策分析》一书中首先提…","contextPage":18,"lessonId":"p1-1"},{"src":"ning-3","pages":[129],"quote":"公共政策是公共权力机关经由政治过程所选择和制定的为解决公共问题、达成公共目标、实现公共利益的方案","context":"…体和个人行动的准则或指南。其表达形式有法律规章、行政命令、政府首脑的书面或口头声明和指示以及行动计划与策略等。”②综合上述各种界定，我们对公共政策给出如下定义：公共政策是公共权力机关经由政治过程所选择和制定的为解决公共问题、达成公共目标、实现公共利益的方案。③这个定义所揭示的公共政策的内涵有如下几点：第一，公共政策是决定、决策、对策、政策的一种特殊形态，它具有决定、决策、对策、政策的一般特征。第二，公共政策是公共权力机关的基本的活动方式或活动过程，是公共权力机关权力意志的表现。第三，公共政策…","contextPage":129,"lessonId":"p4-1"},{"src":"ning-3","pages":[159],"quote":"所谓政策工具，指的是被设定为旨在实现一定政策目标","context":"综上所述，侧重于从手段与目标实现的关系上去界定政策工具，在公共政策学界几成共识。因此，我们也从这一视角去界定政策工具，认为：所谓政策工具，指的是被设定为旨在实现一定政策目标的各种措施、策略、方法、技术、机制、行动、作为以及配置的人力、资金、设备、资源等手段。这里的“被设定”，既包括在政策制定阶段决策者针对政策目标配置的政策手段，也包括在政策执行阶段执行者采取的超出政策方案的政策手段；它的基本含义是政策的制定者…","contextPage":159,"lessonId":"p4-2"},{"src":"ning-3","pages":[275],"quote":"政策目标一般主要具有如下三大特征","context":"…规划问题。政策目标（policygoals）就是有关公共组织特别是政府为了解决有关政策问题而采取的行动所要达到的目的、指标标的和效果。根据这一定义，我们不难看出政策目标一般主要具有如下三大特征：（1）问题的针对性。任何政策目标都不是凭空产生的，几乎都建立在对一定的社会问题的关注、关怀和认识之上。当然，这并不是说政策目标仅仅针对过去或现实已经存在的重大问题，实际上许多政策目标还要关心未来可能出现的重大问题。（2）未来的预期性。政策…","contextPage":275,"lessonId":"p8-1"},{"src":"ning-3","pages":[311],"quote":"理想化的政策，即合法、合理、可行的政策方案","context":"…过程》一文中，首次提出的一个分析政策执行因素及其生态关系的理论模型，因而又可称为“史密斯模型”。史密斯认为政策执行所涉及的因素很多，但有如下四个主要变量：（1）理想化的政策，即合法、合理、可行的政策方案。具体包括政策的形式、类型、渊源、范围以及社会对政策的认识。（2）执行机关，通常指政府中具体负责政策执行的机构。这包括执行机构的权力结构、人事配备及其工作态度、领导模式和技巧以及执行人员的情况等。（3）目标群体，即政策对象，泛指由于特定的政…","contextPage":311,"lessonId":"p9-1"},{"src":"xie-intro-5","pages":[278],"quote":"对目标群体以外的群体产生的影响","context":"…的过量生产；某一福利计划确实改变了受益群体的收入状况，却削弱了他们就业的主动性；廉租房计划可以有效改善贫困人员的居住状况，但可能会产生由贫富隔离引发的问题。2.对目标群体以外的群体产生的影响一项政策不仅会对目标群体产生影响，而且还会对一些非目标群体产生影响。这种影响被称为第三方影响（third-partyeffects）或溢出效应。因为它通常会增加第三方的收益或成本。比如，廉租房等公共住宅项目不仅惠及低收入阶层，而且会给建筑企…","contextPage":278,"lessonId":"p10-1"},{"src":"ning-3","pages":[172],"quote":"直接或间接地参与公共政策制定、实施、评估、监控的行为者","context":"…能体现为政策的创新和扩散，而从长期来看则体现为政策变迁。二、公共政策的主体与主体系统（一）政策主体公共政策主体是相对于政策客体而言的。它是指那些在特定政策环境中直接或间接地参与公共政策制定、实施、评估、监控的行为者。美国公共政策学者安德森认为，在西方，政府立法机关、行政机关、行政管理机构、法院以及利益团体、政党、作为个人的公民都是公共决策过程的参与者，前四个是“官方的政策制定者”，后三个是“非官方的参与者”。②查尔斯·琼斯（CharlesO.Jone…","contextPage":172,"lessonId":"p5-1"}]},"p1":{"question":"政策研究怎样提出问题，集体行动为什么需要政策？","position":"在“先学会提出问题与使用证据”层，先分清研究、分析与政策群链。","prerequisites":["p0-1"],"before":"研究政策就是替政府写方案吗？","branches":[{"title":"研究、分析与政策群链","question":"政策研究与政策分析差别在哪，政策群与政策链怎样区分？","lessons":["p1-1"]},{"title":"集体行动困境","question":"公地悲剧与搭便车为什么都指向合作难题？","lessons":["p1-2"]}],"relations":[{"label":"研究与分析","text":"政策研究重解释与理论，政策分析重为决策提供知识；两者可以互相支持。","lessons":["p1-1","p2-2"]},{"label":"集体行动与工具","text":"个体理性导致共同损失，是政策工具介入的理由之一。","lessons":["p1-2","p4-2"]},{"label":"政策链与议程","text":"围绕同一问题的政策衔接，会影响问题能否持续进入议程。","lessons":["p1-1","p7-2"]}],"hint":"先分“研究/分析”，再分“群/链”，最后用集体行动说明政策为何存在。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，区分政策研究与政策分析，并各举一个产出。","reference":"研究产出理论解释与检验，分析产出面向具体问题的建议；前者回答“为什么”，后者回答“怎么办”。两者不是高低关系。","check":"我区分了两者的产出与目的。"},{"id":"relation","label":"解释一条知识联系","prompt":"比 “发展一套处…","contextPage":280,"lessonId":"p8-2"},{"src":"ning-3","pages":[159],"quote":"所谓政策工具，指的是被设定为旨在实现一定政策目标","context":"综上所述，侧重于从手段与目标实现的关系上去界定政策工具，在公共政策学界几成共识。因此，我们也从这一视角去界定政策工具，认为：所谓政策工具，指的是被设定为旨在实现一定政策目标的各种措施、策略、方法、技术、机制、行动、作为以及配置的人力、资金、设备、资源等手段。这里的“被设定”，既包括在政策制定阶段决策者针对政策目标配置的政策手段，也包括在政策执行阶段执行者采取的超出政策方案的政策手段；它的基本含义是政策的制定者…","contextPage":159,"lessonId":"p4-2"},{"src":"xie-intro-5","pages":[278],"quote":"对目标群体以外的群体产生的影响","context":"…的过量生产；某一福利计划确实改变了受益群体的收入状况，却削弱了他们就业的主动性；廉租房计划可以有效改善贫困人员的居住状况，但可能会产生由贫富隔离引发的问题。2.对目标群体以外的群体产生的影响一项政策不仅会对目标群体产生影响，而且还会对一些非目标群体产生影响。这种影响被称为第三方影响（third-partyeffects）或溢出效应。因为它通常会增加第三方的收益或成本。比如，廉租房等公共住宅项目不仅惠及低收入阶层，而且会给建筑企…","contextPage":278,"lessonId":"p10-1"},{"src":"ning-3","pages":[311],"quote":"理想化的政策，即合法、合理、可行的政策方案","context":"…过程》一文中，首次提出的一个分析政策执行因素及其生态关系的理论模型，因而又可称为“史密斯模型”。史密斯认为政策执行所涉及的因素很多，但有如下四个主要变量：（1）理想化的政策，即合法、合理、可行的政策方案。具体包括政策的形式、类型、渊源、范围以及社会对政策的认识。（2）执行机关，通常指政府中具体负责政策执行的机构。这包括执行机构的权力结构、人事配备及其工作态度、领导模式和技巧以及执行人员的情况等。（3）目标群体，即政策对象，泛指由于特定的政…","contextPage":311,"lessonId":"p9-1"}]},"p9":{"question":"政策为什么走样，执行理论怎样解释偏差？","position":"在“理解执行中的变化”层，把模型、学派与偏差对应起来。","prerequisites":["p8-2"],"before":"政策文本写得很清楚，执行就不会走样吗？","branches":[{"title":"史密斯模型","question":"四个变量之间为什么会产生张力？","lessons":["p9-1"]},{"title":"学派与互适","question":"行动学派、组织学派与互适模型各看什么？","lessons":["p9-2"]},{"title":"执行偏差","question":"七种表现、主客观原因与矫正怎样对应？","lessons":["p9-3"]}],"relations":[{"label":"模型与偏差","text":"史密斯模型的张力，可以解释执行偏差从哪些环节产生。","lessons":["p9-1","p9-3"]},{"label":"互适与目标群体","text":"互适强调执行者与受影响者相互调整，目标群体不是被动对象。","lessons":["p9-2","p5-1"]},{"label":"执行与评估","text":"偏差是否发生、是否有效，要靠执行后的评估判断。","lessons":["p9-3","p10-1"]}],"hint":"按“模型—学派—偏差”三层写，最后把原因与矫正一一对应。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，写出史密斯模型的四个变量，并说明它们怎样相互影响。","reference":"理想化政策、执行机关、目标群体、环境；四者形成紧张、处理与反馈，不是流水线。要举一个变量间相互作用的例子。","check":"我写出了四变量与互动关系。"},{"id":"relation","label":"解释一条知识联系","prompt":"比较行动学派与组织学派，说明它们为什么不互斥。","reference":"行动学派重解释、组织、实施等行动；组织学派重机构、原则、资源与能力。两者都关心有效执行，只是解释重点不同。","c

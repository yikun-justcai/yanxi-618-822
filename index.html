/* ---------------- 课时交互 ---------------- */
let saveTimer=null;
$('#view').addEventListener('input',e=>{
  if(e.target.id!=='write-area')return;
  const id=location.hash.replace(/^#\/lesson\//,'');
  if(!lessons[id])return;
  const val=e.target.value;
  $('#word-count').textContent=val.length+' 字';
  const state=$('#save-state');
  if(state)state.textContent='保存中…';
  const p=P.lessons[id]=P.lessons[id]||{};
  p.text=val;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    save();
    const el=$('#save-state');
    if(el)el.textContent='已保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  },600);
});
$('#view').addEventListener('click',e=>{
  const t=e.target.closest('button')||e.target;
  const id=location.hash.replace(/^#\/lesson\//,'');
  const ex=t.closest('.ex');
  if(ex&&lessons[id]){
    const i=Number(ex.dataset.ex);
    const item=lessons[id].exercises[i];
    if(exState(id,i))return;
    if(t.dataset.opt!=null){
      const k=Number(t.dataset.opt);
      if(item.t==='multi'){t.classList.toggle('sel');return}
      answer(id,i,k===item.a,ex,[k]);return;
    }
    if(t.dataset.judge!=null){
      const k=t.dataset.judge==='1';
      answer(id,i,k===item.a,ex,[k]);return;
    }
    if(t.dataset.submit!=null){
      if(item.t==='multi'){
        const picked=[...ex.querySelectorAll('.opt.sel')].map(b=>Number(b.dataset.opt)).sort((a,b)=>a-b);
        if(!picked.length){toast('先选出你认为对的选项');return}
        const want=[...item.a].sort((a,b)=>a-b);
        answer(id,i,picked.length===want.length&&picked.every((v,n)=>v===want[n]),ex,picked);
      }else if(item.t==='order'){
        const seq=[...ex.querySelectorAll('.order-item')].map(r=>Number(r.dataset.item));
        const ok=seq.every((v,n)=>v===item.a[n]);
        answer(id,i,ok,ex,[]);
        [...ex.querySelectorAll('.order-item')].forEach((r,n)=>{r.classList.add(seq[n]===item.a[n]?'ok':'no')});
      }
      return;
    }
    if(t.dataset.move){
      const row=t.closest('.order-item'),list=row.parentNode,rows=[...list.children];
      const from=rows.indexOf(row);
      const to=t.dataset.move==='up'?from-1:from+1;
      if(to<0||to>=rows.length)return;
      if(t.dataset.move==='up')list.insertBefore(row,rows[to]);else list.insertBefore(rows[to],row);
      [...list.children].forEach((r,n)=>{r.querySelector('.idx').textContent=n+1});
      return;
    }
  }
  if(t.dataset.check!=null){
    $('#write-check').hidden=false;
    $('#btn-sample').textContent='看示范答案';
  }
  if(t.dataset.toggleSample!=null){
    const s=$('#sample');s.hidden=!s.hidden;
    t.textContent=s.hidden?'看示范答案':'收起示范答案';
  }
  if(t.dataset.point!=null){
    if($('#write-check').hidden)return;
    t.classList.toggle('hit');
    savePoints();
  }
});

function answer(id,index,ok,box,picked){
  const item=lessons[id].exercises[index];
  const p=P.lessons[id]=P.lessons[id]||{};
  p.ex=Object.assign({},p.ex);p.ex[index]=ok?'y':'n';p.at=today();
  const opts=[...box.querySelectorAll('.opt')];
  opts.forEach(b=>{
    b.disabled=true;b.classList.remove('sel');
    const k=item.t==='judge'?(b.dataset.judge==='1'):Number(b.dataset.opt);
    const right=item.t==='multi'?item.a.includes(k):k===item.a;
    const chosen=picked.some(v=>v===k);
    if(right)b.classList.add('right');
    else if(chosen)b.classList.add('wrong');
  });
  if(item.t==='order'){
    [...box.querySelectorAll('.order-item')].forEach(r=>r.querySelectorAll('.move').forEach(b=>b.disabled=true));
  }
  const why=box.querySelector('.ex-why');
  if(why){why.hidden=false;why.classList.toggle('bad',!ok)}
  const foot=box.querySelector('.ex-foot');
  if(foot)foot.innerHTML=`<span style="font-size:12px;color:${ok?'var(--green-text)':'var(--red-text)'}">${ok?'答对了':'答错了，已进入复习'}</span>`;
  if(lessonDone(id))markDone(id);
  save();refreshRail();syncShell();
}
function doneHTML(id){
  const L=lessons[id]||{},s=st(id),c=coverage(id);
  const total=(L.exercises||[]).length;
  const exDone=total>0&&c.answered>=total;
  const wDone=!!s.checked;
  const done=lessonDone(id);
  const missing=[];
  if(total>0&&c.answered<total)missing.push(`练习还差 ${total-c.answered} 题`);
  if(L.write&&!wDone)missing.push('写作要点还没对照');
  return `<div class="done-row ${exDone?'ok':''}"><span class="box">${exDone?'✓':''}</span><span>练习 ${c.answered}/${total}${c.answered?`（答对 ${c.right}）`:''}</span></div>
    ${L.write?`<div class="done-row ${wDone?'ok':''}"><span class="box">${wDone?'✓':''}</span><span>写作要点对照</span></div>`:''}
    <div class="done-hint ${done?'done':''}">${done?'已完成，按 2、4、7、15、30 天回来复习':missing.length?'还差：'+missing.join('，'):'做完练习和写作就算学完'}</div>`;
}
function refreshRail(){
  const id=location.hash.replace(/^#\/lesson\//,'');if(!lessons[id])return;
  const d=$('#rail-done');
  if(d)d.innerHTML=doneHTML(id);
  const c=coverage(id),k=$('#kicker-progress');
  if(k)k.textContent=`练习 ${c.answered}/${c.total}${st(id).checked?' · 写作✓':''}`;
}
function savePoints(){
  const id=location.hash.replace(/^#\/lesson\//,'');if(!lessons[id]||!lessons[id].write)return;
  const covered=[...document.querySelectorAll('.point.hit')].map(b=>Number(b.dataset.point)).sort((a,b)=>a-b);
  const p=P.lessons[id]=P.lessons[id]||{};
  p.covered=covered;p.checked=true;p.at=today();
  const total=lessons[id].write.points.length;
  $('#score-line').textContent=`命中 ${covered.length} / ${total} 个得分点`;
  if(covered.length<=total*0.5)toast('不到一半：先回去补要点，再重写一遍');
  else if(covered.length<total)toast('漏掉的点，就是下次复习的重点');
  else toast('要点齐了，接着比较示范答案的措辞');
  if(lessonDone(id))markDone(id);
  save();syncShell();refreshRail();
}
function markDone(id){
  const p=P.lessons[id]=P.lessons[id]||{};
  if(p.done)return;
  const n=p.reviews||0;
  p.done=true;p.at=today();
  p.next=addDays([2,4,7,15,30][Math.min(n,4)]);
  p.reviews=n+1;
  save();
}

    <div class="fld"><label for="k-book">教材</label><select id="k-book">
      <option value="all" ${kp.book==='all'?'selected':''}>两本都看</option>
      ${books.map(b=>`<option value="${esc(b.id)}" ${kp.book===b.id?'selected':''}>${esc((SRC[b.id]&&SRC[b.id].short)||b.label)}</option>`).join('')}
    </select></div>
    <div class="fld grow"><label for="k-q">搜索考点</label><input id="k-q" placeholder="${subjectCode==='822'?'如「政策工具」「政策评估」':'如「事业单位」「绩效评估」'}" value="${esc(kp.q)}"></div>
    <button class="kp-toggle ${kp.red?'on':''}" data-kp="red" aria-pressed="${kp.red}">只看考过</button>
    <button class="kp-toggle ${kp.both?'on':''}" data-kp="both" aria-pressed="${kp.both}">只看两书都有</button>
  </div>
  <p style="font-size:12px;color:#9e9688;margin:0 0 12px">当前 ${hits} 条${hits?'；点章名后的模块名可跳到对应课时':''}</p>
  <div class="kp-books">${shown.length?shown.map(pointsBook).join(''):'<div class="empty"><b>没有匹配的考点</b>换个关键词，或把筛选改回「两本都看」。</div>'}</div>`;
  $('#k-book').onchange=e=>{kp.book=e.target.value;renderPoints()};
  $('#k-q').oninput=e=>{kp.q=e.target.value.trim();const pos=e.target.selectionStart;renderPoints();const f=$('#k-q');if(f){f.focus();f.setSelectionRange(pos,pos)}};
  document.querySelectorAll('[data-kp]').forEach(b=>b.onclick=()=>{
    if(b.dataset.kp==='red')kp.red=!kp.red;else kp.both=!kp.both;renderPoints();
  });
}
function pointsBook(b){
  const label=(SRC[b.id]&&SRC[b.id].title)||b.label;
  const count=b.chapters.reduce((n,c)=>n+c.items.length,0);
  return `<section class="kp-book">
    <div class="kp-book-title"><h2>${esc(label)}</h2><span>${count} 条</span></div>
    ${b.source?`<p class="kp-note">笔记来源：${esc(b.source)}</p>`:''}
    ${b.chapters.map(c=>{
      const links=(c.modules||[]).map(id=>{
        const m=modules.find(x=>x.id===id);
        return m?`<a href="#/module/${esc(id)}" title="跳到「${esc(m.title)}」">↗ ${esc(m.chapter)} 课时</a>`:'';
      }).join('');
      return `<div class="kp-chapter">
        <div class="kp-chapter-head"><h3>${esc(c.name)}</h3>${links}</div>
        ${(c.notes||[]).map(n=>`<div class="kp-note">笔记提示：${esc(n)}</div>`).join('')}
        <ul class="kp-list">${c.items.map(itemRow).join('')}</ul>
      </div>`;
    }).join('')}
  </section>`;
}
function itemRow(it){
  return `<li class="kp-item ${it.red?'red':''}">
    <span class="kp-mark" aria-hidden="true"></span>
    <span class="kp-term">${esc(it.term)}</span>
    <span class="kp-meta">
      ${it.red?'<span class="kp-both" style="background:#ede5e3;color:#8a442f">考过</span>':''}
      ${it.also?'<span class="kp-both" title="两本教材都列了这个考点">两书都有</span>':''}
      <span class="kp-kind">${esc(it.kind)}</span>
      ${it.page?`<span class="kp-page">${esc(POINTS.pageLabel||'纸书 P')}${it.page}</span>`:''}
      ${it.ocr&&it.ocr.length?`<span class="kp-src">原文 p${it.ocr.slice(0,2).join('、')}</span>`:''}
    </span></li>`;
}

/* ---------------- 真题 ---------------- */
let filter={year:'all',type:'all',topic:'all',q:''};
function renderExam(){
  syncShell();
  $('#crumb').innerHTML='<a href="#/" style="text-decoration:none">学习地图</a><span>/</span><b>真题</b>';
  const years=[...new Set(EXAMS.map(e=>e.year))].sort((a,b)=>b-a);
  const types=[...new Set(EXAMS.map(e=>e.type))];
  const topics=[...new Set(EXAMS.map(e=>e.topic))];
  const list=EXAMS.filter(e=>
    (filter.year==='all'||String(e.year)===filter.year)&&
    (filter.type==='all'||e.type===filter.type)&&
    (filter.topic==='all'||e.topic===filter.topic)&&
    (!filter.q||(e.question+e.answer+e.topic).indexOf(filter.q)>=0));
  $('#view').innerHTML=`
  <section style="margin-bottom:22px">
    <div class="eyebrow"><i></i><span>真题 · ${EXAMS.length} 题</span></div>
    <h2 style="font:500 clamp(24px,3vw,32px)/1.3 var(--serif);margin:0">先自己写，再看提纲。</h2>
    <p style="color:var(--muted);font-size:13px;margin:10px 0 0;max-width:640px">${esc(COURSE.subject.examNote||'每道题先给「作答提纲」——骨架和要点顺序；再给参考答案。参考答案依据本地教材编写，不是官方标准答案；以蔡立辉／王乐夫版为主线，陈振明版的说法差异见对应章节课时顶部的「两书对照」。')}</p>
  </section>
  <div class="filters">
    <div class="fld"><label for="f-year">年份</label><select id="f-year"><option value="all">全部</option>${years.map(y=>`<option value="${y}" ${filter.year===String(y)?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="fld"><label for="f-type">题型</label><select id="f-type"><option value="all">全部</option>${types.map(x=>`<option ${filter.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="fld"><label for="f-topic">考点</label><select id="f-topic"><option value="all">全部</option>${topics.map(x=>`<option ${filter.topic===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="fld grow"><label for="f-q">搜索</label><input id="f-q" placeholder="搜题干、考点或答案关键词" value="${esc(filter.q)}"></div>
  </div>
  <div class="exam-list">${list.length?list.map(examCard).join(''):'<div class="empty"><b>没有匹配的真题</b>换一个关键词，或把筛选改回「全部」。</div>'}</div>`;
  $('#f-year').onchange=e=>{filter.year=e.target.value;renderExam()};
  $('#f-type').onchange=e=>{filter.type=e.target.value;renderExam()};
  $('#f-topic').onchange=e=>{filter.topic=e.target.value;renderExam()};
  $('#f-q').oninput=e=>{filter.q=e.target.value.trim();const v=e.target.value,pos=e.target.selectionStart;renderExam();const f=$('#f-q');if(f){f.focus();f.setSelectionRange(pos,pos)}};
}
function examCard(e){
  const hits=id=>{
    const m=moduleOf(id);
    const topics=((m&&m.examTopics)||[]).filter(t=>e.topic.indexOf(t)>=0||t.indexOf(e.topic)>=0);
    const title=(lessons[id]&&lessons[id].title)||'';
    return topics.length+topics.filter(t=>title.indexOf(t)>=0).length*2;
  };
  const rel=journey.filter(id=>hits(id)>0)
    .sort((a,b)=>hits(b)-hits(a))
    .slice(0,2);
  return `<details class="exam-card">
    <summary><span class="exam-year">${e.year}</span><p class="exam-q">${esc(e.question)}</p><span class="exam-tag">${esc(e.type)}</span></summary>
    <div class="exam-inner">
      <div class="exam-sec"><h5>作答提纲</h5><p>${esc(e.outline)}</p></div>
      <div class="exam-sec"><h5>参考答案 · 非官方</h5><p>${esc(e.answer)}</p>
        <div class="basis">教材依据：${esc(e.basis)}　·　题目来源：${esc(e.source)}</div></div>
      ${rel.length?`<div class="exam-sec"><h5>相关课时</h5><p>${rel.map(id=>`<a href="#/lesson/${esc(id)}" style="text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px">${esc(lessons[id].title)}</a>`).join('　·　')}</p></div>`:''}
    </div></details>`;
}

/* ---------------- 复习 ---------------- */
function renderReview(){
  syncShell();
  $('#crumb').innerHTML='<a href="#/" style="text-decoration:none">学习地图</a><span>/</span><b>复习</b>';
  const due=dueList();
  const wrong=journey.filter(id=>Object.keys(st(id).ex||{}).some(k=>st(id).ex[k]==='n'));
  const partial=journey.filter(id=>{
    const s=st(id);if(!s.covered||!lessons[id].write)return false;
    return s.covered.length<lessons[id].write.points.length;
  });
  const untouched=journey.filter(id=>!lessonStarted(id)).length;
  $('#view').innerHTML=`
  <section style="margin-bottom:24px">
    <div class="eyebrow"><i></i><span>复习 · 按遗忘规律排</span></div>
    <h2 style="font:500 clamp(24px,3vw,32px)/1.3 var(--serif);margin:0">不是重读，是重做。</h2>
    <p style="color:var(--muted);font-size:13px;margin:10px 0 0;max-width:620px">复习到期课时、错题与写作漏点；做过章节重建后，也可在这里继续对照和复写。</p>
  </section>
  <div class="review-block"><h3>到期复习 <span>${due.length} 课</span></h3>
    ${due.length?`<div class="review-list">${due.map(id=>reviewRow(id,'到期')).join('')}</div>`:'<div class="empty">还没有到期的课时。学完一课后会按 2、4、7、15、30 天安排回来。</div>'}</div>
  <div class="review-block"><h3>做错过的练习 <span>${wrong.length} 课</span></h3>
    ${wrong.length?`<div class="review-list">${wrong.map(id=>reviewRow(id,Object.keys(st(id).ex||{}).filter(k=>st(id).ex[k]==='n').length+' 题错')).join('')}</div>`:'<div class="empty">还没有做错的练习。</div>'}</div>
  <div class="review-block"><h3>写作要点没写全 <span>${partial.length} 课</span></h3>
    ${partial.length?`<div class="review-list">${partial.map(id=>reviewRow(id,'命中 '+st(id).covered.length+'/'+lessons[id].write.points.length)).join('')}</div>`:'<div class="empty">还没有漏点的写作记录。</div>'}</div>
  ${Object.keys(P.chapters).some(id=>FRAME.guides[id])?`<div class="review-block"><h3>章节重建 <span>自评记录</span></h3><div class="review-list">${Object.keys(P.chapters).filter(id=>FRAME.guides[id]).map(id=>`<a class="review-row" href="#/rebuild/${esc(id)}"><span>${esc(modules.find(m=>m.id===id).title)}</span><span class="why">${esc(chapterStatus(id))}</span></a>`).join('')}</div></div>`:''}
  ${untouched?`<p style="font-size:12px;color:#9e9688">还有 ${untouched} 课没有开始。<a href="#/" style="color:var(--ink)">回到学习地图</a></p>`:''}`;
}
function reviewRow(id,why){
  const m=moduleOf(id),M=meta[id];
  const done=lessonDone(id);
  return `<a class="review-row" href="#/lesson/${esc(id)}"><span class="lesson-state ${done?'done':'doing'}">${done?'✓':M.order}</span>
    <span>${esc(M.title)}</span><span class="why">${esc(m?m.chapter:'')} · ${esc(why)}</span></a>`;
}

/* ---------------- 站内搜索（Ctrl+K） ---------------- */
let SEARCH_INDEX=null,palIndex=0,palResults=[],palOpener=null;
function searchIndex(){
  if(SEARCH_INDEX)return SEARCH_INDEX;
  const idx=[];
  journey.forEach(id=>{
    const L=lessons[id],M=meta[id]||{};
    idx.push({kind:'课时',title:L.title,sub:`${M.chapter||''} ${M.moduleTitle||''}`.trim(),
      href:'#/lesson/'+id,
      keys:(L.title+' '+(L.goal||'')+' '+((L.concepts||[]).map(x=>x.term).join(' '))).toLowerCase()});
  });
  (POINTS.books||[]).forEach(b=>b.chapters.forEach(c=>c.items.forEach(it=>{
    idx.push({kind:'考点',title:it.term,sub:`${(SRC[b.id]&&SRC[b.id].short)||''}·${c.name}`,
      point:it.term,keys:(it.term+' '+c.name).toLowerCase()});
  })));
  EXAMS.forEach(e=>idx.push({kind:'真题',title:e.question,sub:`${e.year} ${e.type}`,exam:e.question,
    keys:(e.question+' '+e.topic+' '+e.year).toLowerCase()}));
  SEARCH_INDEX=idx;return idx;
}
function openPalette(){
  palOpener=document.activeElement;
  $('#palette').hidden=false;
  $('#palette-input').value='';
  palIndex=0;renderPalette('');
  setTimeout(()=>$('#palette-input').focus(),20);
}
function closePalette(){
  $('#palette').hidden=true;
  if(palOpener&&palOpener.focus)palOpener.focus();
}
function renderPalette(q){
  const needle=q.trim().toLowerCase();
  const all=searchIndex();
  if(needle){
    palResults=all.filter(x=>x.keys.indexOf(needle)>=0).slice(0,40);
  }else{
    const nid=nextLesson(),L=lessons[nid]||{};
    palResults=[{kind:'继续',title:L.title||'',sub:'接着上次的进度',href:'#/lesson/'+nid},
      ...all.filter(x=>x.kind==='课时')].slice(0,40);
  }
  if(palIndex>=palResults.length)palIndex=Math.max(0,palResults.length-1);
  const list=$('#palette-list');
  list.innerHTML=palResults.length?palResults.map((r,i)=>`
    <a class="pal-item" role="option" aria-selected="${i===palIndex}" data-i="${i}" href="${r.href||'#'}">
      <span class="pal-kind">${esc(r.kind)}</span>
      <span class="pal-title">${esc(r.title)}</span>
      <span class="pal-sub">${esc(r.sub||'')}</span>
    </a>`).join(''):'<div class="palette-empty">没有找到。换个关键词，或搜「政府失败」「绩效」「伦理」试试。</div>';
  const sel=list.querySelector('[aria-selected="true"]');
  if(sel)sel.scrollIntoView({block:'nearest'});
}
function goResult(r){
  if(!r)return;
  closePalette();
  if(r.href){location.hash=r.href;return}
  if(r.point){
    kp={book:'all',q:r.point,red:false,both:false};
    if(location.hash.indexOf('#/points')===0)renderPoints();else location.hash='#/points';
    return;
  }
  if(r.exam){
    filter={year:'all',type:'all',topic:'all',q:r.exam};
    if(location.hash.indexOf('#/exam')===0)renderExam();else location.hash='#/exam';
  }
}
$('#open-search').onclick=openPalette;
$('#palette').addEventListener('click',e=>{if(e.target.id==='palette')closePalette()});
$('#palette-list').addEventListener('click',e=>{
  const a=e.target.closest('.pal-item');if(!a)return;
  e.preventDefault();goResult(palResults[Number(a.dataset.i)]);
});
$('#palette-input').addEventListener('input',e=>{palIndex=0;renderPalette(e.target.value)});
document.addEventListener('keydown',e=>{
  const open=!$('#palette').hidden;
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();open?closePalette():openPalette();return}
  if(e.key==='Escape'&&open){closePalette();return}
  if(open){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      const n=palResults.length;if(!n)return;
      palIndex=(palIndex+(e.key==='ArrowDown'?1:-1)+n)%n;
      renderPalette($('#palette-input').value);
    }
    if(e.key==='Enter'){e.preventDefault();goResult(palResults[palIndex])}
    return;
  }
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();openPalette()}
});
$('#to-top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

$('#reset').onclick=()=>{
  if(!confirm('清空这台设备上的学习进度？课程内容不受影响。'))return;
  P={lessons:{},chapters:{},last:null};save();toast('进度已清空。');route();
};
route();
})();
</script>

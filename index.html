<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f2820">
<title>研习 · 618 / 822 专业课</title>
<style>
  :root{--ink:#2f2820;--ink-soft:#4a3f34;--muted:#6f675a;--red-text:#a34a2c;--green-text:#4f6b55;--muted-2:#918878;--line:#dbe1e5;--paper:#f6f2ec;--white:#fcfbfb;--lime:#e3be86;--lime-deep:#ddb16e;--blue:#dfe5ea;--red:#d4775b;--green:#7e9b77;--shadow:0 16px 44px #352c2412;--serif:"Noto Serif SC","Songti SC","STSong",serif;--sans:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.68;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit}
  button{color:inherit;cursor:pointer}
  a{color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #6d8ca2;outline-offset:2px}
  .app{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}

  aside{background:var(--ink);color:#f0f4ef;padding:26px 16px 18px;display:flex;flex-direction:column;gap:22px;min-height:100vh;position:sticky;top:0;height:100vh}
  .brand{padding:2px 10px 18px;border-bottom:1px solid #fcfbfb20}
  .brand-mark{display:grid;place-items:center;width:36px;height:36px;background:var(--lime);color:var(--ink);font-weight:900;font-size:18px;transform:rotate(-4deg);margin-bottom:13px}
  .brand h1{font:600 20px var(--serif);letter-spacing:.08em;margin:0}
  .brand p{color:#a8b4bd;margin:4px 0 0;font-size:11px;letter-spacing:.06em}
  .nav-label{font-size:10px;color:#9a9283;letter-spacing:.16em;padding:0 10px;margin-bottom:8px}
  .nav{display:grid;gap:4px}
  .nav button{width:100%;border:0;background:none;text-align:left;color:#c6ced3;border-radius:7px;padding:9px 11px;display:flex;align-items:center;gap:9px}
  .nav button .nav-name{flex:1}
  .nav button small{font-size:11px;color:#9facb5}
  .nav button:hover{background:#fcfbfb10;color:#fcfbfb}
  .nav button.active{background:#fcfbfb16;color:#fcfbfb;box-shadow:inset 3px 0 var(--lime)}
  .nav button.active small{color:var(--lime)}
  .aside-modules{flex:1;min-height:0;overflow:auto;padding-right:4px;display:grid;align-content:start;gap:1px;scrollbar-width:thin;scrollbar-color:#6a5a4b transparent}
  .aside-modules::-webkit-scrollbar{width:6px}
  .aside-modules::-webkit-scrollbar-track{background:transparent}
  .aside-modules::-webkit-scrollbar-thumb{background:#5c4d41;border-radius:999px}
  .aside-modules::-webkit-scrollbar-thumb:hover{background:#7a6757}
  .aside-modules button{border:0;background:none;text-align:left;color:#9daab3;font-size:11px;padding:6px 10px;border-radius:5px;display:flex;gap:7px;align-items:baseline}
  .aside-modules button:hover{background:#fcfbfb0e;color:#e8eee6}
  .aside-modules button b{color:#8b8272;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
  .aside-modules button.done b{color:var(--lime)}
  .aside-foot{border-top:1px solid #fcfbfb20;padding:13px 10px 0;color:#9aa7b0;font-size:11px}
  .aside-foot b{display:block;color:#ede8de;font-weight:500;margin-bottom:3px}
  .bar{height:4px;background:#fcfbfb1f;border-radius:4px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--lime);border-radius:4px;transition:width .3s}

  main{max-width:1160px;width:100%;margin:auto;padding:30px clamp(20px,4vw,56px) 64px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px;flex-wrap:wrap}
  .crumb{color:var(--muted);font-size:12.5px}
  .crumb span{color:#c2bdb4;padding:0 7px}
  .crumb b{color:var(--ink);font-weight:600}
  .subject-picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:16px}
  .subject-picker select{max-width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--white);color:var(--ink)}
  .top-actions{display:flex;gap:8px;align-items:center}
  .quiet-btn{border:1px solid var(--line);background:transparent;padding:8px 12px;border-radius:6px;color:#455663;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .quiet-btn:hover{background:#fcfbfb}
  .primary-btn{border:0;border-radius:6px;background:var(--ink);color:#fcfbfb;padding:11px 18px;font-weight:600;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
  .primary-btn:hover{background:var(--ink-soft)}
  .primary-btn.lime{background:var(--lime);color:var(--ink)}
  .primary-btn.lime:hover{background:var(--lime-deep)}

  .hero{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:26px;align-items:end;margin-bottom:30px}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:9px}
  .eyebrow i{width:7px;height:7px;background:var(--red);border-radius:50%}
  .hero h2{font:500 clamp(26px,3.6vw,40px)/1.24 var(--serif);letter-spacing:.02em;margin:0;max-width:700px}
  .hero h2 em{font-style:normal;background:linear-gradient(transparent 68%,var(--lime) 68%);padding:0 3px}
  .hero p{margin:12px 0 0;color:var(--muted);font-size:13px;max-width:560px}
  .next-card{border:1px solid var(--line);border-radius:10px;background:#fcfbfb;box-shadow:var(--shadow);padding:18px}
  .next-card small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;margin-bottom:6px}
  .next-card strong{display:block;font:500 15px/1.5 var(--serif);margin-bottom:12px}
  .next-card .primary-btn{width:100%;justify-content:center}

  .route{display:grid}
  .route-item{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px}
  .marker{position:relative;display:flex;justify-content:center;padding-top:21px}
  .marker:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:#cfd6db;transform:translateX(-50%)}
  .route-item:first-child .marker:before{top:24px}
  .route-item:last-child .marker:before{bottom:calc(100% - 46px)}
  .marker span{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font:600 12px var(--sans);color:var(--muted)}
  .route-item.open .marker span{border-color:var(--ink);color:var(--ink);background:#fcfbfb}
  .route-item.current .marker span{background:var(--lime);border-color:var(--ink)}
  .route-item.done .marker span{background:var(--ink);border-color:var(--ink);color:var(--lime)}
  .route-body{padding:16px 0 24px;border-bottom:1px solid #f0ebe2}
  .route-item:last-child .route-body{border-bottom:0}
  .route-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .route-head b{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:600}
  .route-head h3{margin:0;font:600 19px/1.4 var(--serif);letter-spacing:.01em}
  .chip{font-size:11px;padding:3px 9px;border-radius:20px;background:#f1ece4;color:#4f5f6a;white-space:nowrap}
  .chip.warm{background:var(--lime);color:#493e33;font-weight:600}
  .chip.hold{background:#f6f2ec;color:#a49c8f}
  .chip.chen{background:#ece8e1;color:#64533a;font-weight:600}
  .route-why{margin:7px 0 0;color:#5b6a75;font-size:13px;max-width:760px}
  .lesson-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:2px}
  .lesson-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;text-decoration:none;color:var(--ink);border:1px solid transparent}
  .lesson-row:hover{background:#f6f2ec;border-color:#eee8df}
  .lesson-row.active{background:#fcfbfb;border-color:var(--line);box-shadow:0 6px 18px #352c240e}
  .lesson-state{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#f2eee6;color:#9e9689;flex:none}
  .lesson-state.done{background:var(--ink);color:var(--lime)}
  .lesson-state.doing{background:var(--lime);color:var(--ink)}
  .lesson-title{flex:1;min-width:0}
  .lesson-min{font-size:12px;color:#918878;flex:none;font-variant-numeric:tabular-nums}
  .route-plan{margin:12px 0 0;font-size:12px;color:#9e9688;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .route-plan code{font-family:var(--sans);color:#82796a;background:#f6f2ec;border-radius:4px;padding:2px 7px}

  .lesson-shell{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:34px;align-items:start}
  .lesson-head{grid-column:1/-1;margin-bottom:4px}
  .lesson-kicker{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:10px}
  .lesson-head h2{font:500 clamp(25px,3.2vw,34px)/1.3 var(--serif);margin:0}
  .goal-box{border-left:3px solid var(--lime);background:#edf3eb;padding:14px 16px;border-radius:0 8px 8px 0;margin:18px 0 0;font-size:14px;line-height:1.75;color:#43382e;max-width:760px}
  .goal-box b{display:block;font-size:10px;letter-spacing:.14em;color:#8a7453;margin-bottom:4px}
  .review-note{margin:10px 0 0;font-size:12px;line-height:1.75;color:#7a584e;background:#f8f6f3;border:1px solid #ece1d0;border-radius:6px;padding:8px 11px;max-width:760px}
  .review-note.ok{color:#5e7458;background:#f0f5ef;border-color:#e6dfd5}
  .lesson-rail{position:sticky;top:24px;display:grid;gap:12px}
  .rail-card{border:1px solid var(--line);border-radius:9px;background:#fcfbfb;padding:14px}
  .rail-card h4{margin:0 0 9px;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
  .rail-card a{display:block;text-decoration:none;color:#42525d;font-size:13px;padding:11px 8px;min-height:44px}
  .rail-card a:hover{color:var(--ink)}
  .rail-num{display:flex;align-items:baseline;gap:5px;font:600 22px var(--serif)}
  .rail-num small{font:400 11px var(--sans);color:var(--muted)}
  .lesson-body{min-width:0;max-width:730px;scroll-margin-top:24px}
  .prose{font-size:16px;line-height:1.92;color:#493e32;margin:0 0 18px}
  .prose strong{color:var(--ink);font-weight:600;box-shadow:inset 0 -8px 0 #e3be8666}
  .block-h{font:600 19px/1.5 var(--serif);margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid #f1ede5;scroll-margin-top:74px}
  .lead{font:500 18px/1.8 var(--serif);color:var(--ink);margin:22px 0 8px;padding-left:15px;border-left:2px solid var(--red)}
  blockquote{margin:18px 0;padding:14px 18px;background:#f6f4f0;border-radius:0 8px 8px 0;border-left:3px solid #c9b9a2;font-size:14px;line-height:1.9;color:#4d403c}
  blockquote cite{display:block;margin-top:8px;font-size:11px;color:#8e8575;font-style:normal}
  .tip{margin:16px 0;padding:11px 15px;background:var(--blue);border-radius:8px;font-size:13px;color:#4e4236}
  .tip b{letter-spacing:.1em;font-size:10px;display:block;margin-bottom:4px;color:#586f80}
  .ask{border:1px solid var(--line);border-radius:9px;margin:18px 0;overflow:hidden;background:#fcfbfb}
  .ask summary{padding:12px 15px;cursor:pointer;font-size:13px;font-weight:600;list-style:none;display:flex;gap:9px;align-items:flex-start}
  .ask summary::-webkit-details-marker{display:none}
  .ask summary:before{content:"问";flex:none;width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--lime);font-size:11px;display:grid;place-items:center;margin-top:2px}
  .ask[open] summary{border-bottom:1px solid #f6f2ec}
  .ask div{padding:13px 15px 14px;font-size:13px;line-height:1.9;color:#42525e}
  table.cmp{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:13px;background:#fcfbfb;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  table.cmp th{background:#f6f2ec;text-align:left;font-size:11px;color:#5d6c77;font-weight:600;padding:9px 11px;border-bottom:1px solid var(--line)}
  table.cmp td{padding:10px 11px;border-bottom:1px solid #f6f2ec;vertical-align:top;line-height:1.75}
  table.cmp tr:last-child td{border-bottom:0}
  table.cmp td:first-child{color:var(--ink);font-weight:600}

  .concepts{display:grid;gap:11px;margin:14px 0 22px}
  .concept{border:1px solid #d1dae1;background:#f3f6f8;border-radius:9px;padding:15px 17px}
  .concept h4{margin:0 0 7px;font:600 15px var(--serif)}
  .concept p{margin:0;font-size:13.5px;color:#354652;line-height:1.85}
  .concept ul{margin:9px 0 0;padding-left:18px;font-size:13px;color:#3d505e;line-height:1.85}
  .concept .exam{margin-top:9px;font-size:12px;color:#5e7458;background:#e9f0e8;border-radius:6px;padding:7px 10px}

  .ex-wrap{margin:10px 0 22px;display:grid;gap:12px}
  .ex{border:1px solid var(--line);border-radius:10px;background:#fcfbfb;padding:16px 17px}
  .ex-q{font-size:15px;line-height:1.75;margin:0 0 12px;color:var(--ink)}
  .ex-no{font-size:10px;letter-spacing:.12em;color:var(--muted);display:block;margin-bottom:5px}
  .opts{display:grid;gap:6px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fcfbfb;border-radius:7px;padding:10px 12px;font-size:14px;line-height:1.7;width:100%}
  .opt:hover:not(:disabled){border-color:#b0aa9f;background:#f7f9f6}
  .opt:disabled{cursor:default}
  .opt .k{flex:none;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:#f6f2ec;color:#908777;font-size:11px;display:grid;place-items:center;margin-top:1px}
  .opt.sel{border-color:var(--ink);background:#f6f2ec}
  .opt.right{border-color:var(--green);background:#ecf2eb}
  .opt.right .k{background:var(--green);color:#fcfbfb}
  .opt.wrong{border-color:var(--red);background:#f6f2f1}
  .opt.wrong .k{background:var(--red);color:#fcfbfb}
  .ex-foot{display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .ex-why{margin-top:12px;padding:12px 14px;border-radius:7px;background:#f6f2ec;font-size:13px;line-height:1.85;color:#3a4a56;border-left:3px solid var(--green)}
  .ex-why.bad{border-left-color:var(--red);background:#f7f4f3}
  .ex-why b{color:var(--ink)}
  .order-list{display:grid;gap:6px;margin:0 0 12px}
  .order-item{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:13px;background:#fcfbfb}
  .order-item .idx{width:20px;height:20px;border-radius:50%;background:#f6f2ec;color:#908777;font-size:11px;display:grid;place-items:center;flex:none}
  .order-item span{flex:1;min-width:0}
  .order-item.ok{border-color:var(--green);background:#ecf2eb}
  .order-item.no{border-color:var(--red);background:#f6f2f1}
  .move{border:1px solid var(--line);background:#fcfbfb;border-radius:5px;width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:11px;padding:0}
  .move:hover:not(:disabled){border-color:#b0aa9f}
  .move:disabled{opacity:.3;cursor:default}

  .write{border:1px solid #e3dbcf;border-radius:11px;background:#fbfaf8;padding:18px 19px;margin:14px 0 26px}
  .write h4{margin:0 0 6px;font:600 16px var(--serif);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .write .meta{font-size:11px;color:#8f816c;background:#f1ede8;border-radius:20px;padding:3px 9px;font-weight:400}
  .write .prompt{white-space:pre-wrap;font-size:14px;line-height:1.9;color:#493e33;margin:9px 0 13px}
  .write textarea{width:100%;min-height:200px;border:1px solid #d8cfc1;border-radius:8px;padding:12px 13px;font-size:14px;line-height:1.95;background:#fcfbfb;resize:vertical;color:#332c24}
  .write textarea:focus{border-color:#b0a99e}
  .write .words{font-size:11.5px;color:#92897a;margin-top:6px;display:flex;justify-content:flex-end;gap:8px;align-items:center}
  .points{display:grid;gap:7px;margin:13px 0 0}
  .point{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.75;border:1px solid #e6dfd5;background:#fcfbfb;border-radius:7px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
  .point.hit{border-color:var(--green);background:#f0f5ef}
  .point .box{flex:none;width:16px;height:16px;border:1.5px solid #b5c8b0;border-radius:4px;margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fcfbfb}
  .point.hit .box{background:var(--green);border-color:var(--green)}
  .score-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;font-size:12px;color:#7c7465;flex-wrap:wrap}
  .sample{border-top:1px dashed #dcd2c4;margin-top:15px;padding-top:14px;font-size:13.5px;line-height:1.95;color:#4c4034;white-space:pre-wrap}
  .sample>b{display:block;font-size:10px;letter-spacing:.13em;color:#8f816c;margin-bottom:6px;white-space:normal}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#efeae1;border:1px solid #dae4d8;border-radius:9px;padding:12px 15px;margin:0 0 18px}
  .fld{min-width:118px}
  .fld label{display:block;color:#7c7466;font-size:10px;margin-bottom:4px}
  .fld select,.fld input{width:100%;background:#fcfbfb;border:1px solid #ccd4da;border-radius:5px;padding:8px 10px;font-size:12px}
  .fld.grow{flex:1;min-width:180px}
  .exam-list{display:grid;gap:9px}
  .exam-card{border:1px solid var(--line);border-radius:9px;background:#fcfbfb;overflow:hidden}
  .exam-card summary{padding:13px 15px;cursor:pointer;list-style:none;display:flex;gap:11px;align-items:flex-start}
  .exam-card summary::-webkit-details-marker{display:none}
  .exam-card summary:hover{background:#f8faf7}
  .exam-year{flex:none;font:600 12px var(--sans);color:#9e9688;padding-top:2px}
  .exam-q{flex:1;font-size:14px;line-height:1.7;color:var(--ink);margin:0}
  .exam-tag{flex:none;font-size:10px;padding:3px 7px;border-radius:4px;background:#f6f2ec;color:#5d6c77;white-space:nowrap}
  .exam-inner{padding:2px 15px 16px;border-top:1px solid #f6f2ec}
  .exam-sec{margin-top:14px}
  .exam-sec h5{margin:0 0 6px;font-size:10px;letter-spacing:.13em;color:#8f816c}
  .exam-sec p{margin:0;font-size:14px;line-height:1.9;color:#374753;white-space:pre-wrap}
  .exam-sec .basis{font-size:11.5px;color:#978e7f;margin-top:9px;padding-top:9px;border-top:1px solid #f6f2ec;white-space:normal}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}
  .empty b{display:block;color:var(--ink);font:500 19px var(--serif);margin-bottom:6px}
  .review-block{margin-bottom:26px}
  .review-block h3{font:600 16px var(--serif);margin:0 0 10px;display:flex;gap:9px;align-items:baseline}
  .review-block h3 span{font:400 11px var(--sans);color:var(--muted)}
  .review-list{display:grid;gap:7px}
  .review-row{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fcfbfb;padding:11px 13px;text-decoration:none;color:var(--ink)}
  .review-row:hover{border-color:#b6bfc6}
  .review-row .why{font-size:11px;color:#9e9688;margin-left:auto;white-space:nowrap}

  .dual{border:1px solid var(--line);background:#fcfbfb;border-radius:10px;padding:13px 16px 14px;margin:14px 0 0;max-width:760px}
  .dual-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  .dual-head b{font-size:10px;letter-spacing:.13em;color:var(--muted);font-weight:600}
  .dual-head span{font-size:11px;color:#9e9688}
  .dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dual-col{border-left:2px solid #eee8df;padding-left:10px}
  .dual-col.chen{border-left-color:#c9b9a2}
  .dual-col small{display:block;font-size:11px;color:#918878;letter-spacing:.05em;margin-bottom:3px}
  .dual-col strong{display:block;font:500 13px/1.65 var(--sans);color:var(--ink)}
  .dual-col.missing strong{color:#a7a093;font-weight:400}

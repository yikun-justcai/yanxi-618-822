务的影响"],"sample":"新公共行政学是回应 20 世纪 60 年代末西方国家社会、经济与政治危机而形成的流派，以公共行政的「公共」部分为研究重心，把社会公平作为追求目标。其基本内容有四：第一，反思和批判传统公共行政的「效率至上」观，认为公共行政不只是执行政策的工具，还担负广泛的社会责任；第二，提倡社会公平价值观，认为经济与效率是价值之一，但不是核心价值，更不是唯一准则；第三，突破「政治—行政」二分法，认为二分只是一种理论虚构，行政人员实际参与政策形成；第四，强调动态、开放的组织观，主张顾客导向与应变灵活的组织形态。它推动了后续新公共管理运动的兴起，也为新公共服务理论准备了价值资源。","tip":"四点里最容易写空的是第三、第四点。记住两句抓手：第三点抓「二分是虚构」，第四点抓「顾客导向 + 应变灵活」。"},"evidence":[{"src":"cai-wang-3","pages":[59],"quote":"新公共行政理论则强调，公共行政的核心价值在于社会公平","context":"…提出计划时，常常以牺牲社会的平等来强调效率和节约，与其说它照顾一般利益，倒不如说它照顾特殊利益，它以献身于争取公众福利和民众的面貌出现，但实际上却反其道而行之。新公共行政理论则强调，公共行政的核心价值在于社会公平，在于促进社会所拥有的、以社会公平为核心的基本价值。对于“社会公平”的含义，新公共行政学派做了更为具体的解释，并且将其视为公共行政的“公共目的”，正如弗雷德里克森所言：“社会公平包含着对包括组织设计和管理形态在内的一系列价值取向的选择。社会…","contextPage":59},{"src":"cai-wang-3","pages":[55],"quote":"这些“行政原则”并非真正的科学原则，它们只能被称为“行政谚语”","context":"…则，虽然这两条原则导致相反的意见，但是在理论上我们却不能指出哪一条原则是正确的，因此，这些原则如同一般的谚语，虽然它们相互矛盾，但是它们彼此却可以并行不悖，所以这些“行政原则”并非真正的科学原则，它们只能被称为“行政谚语”。西蒙专门以人们常常谈到的“专业分工”、“统一指挥”、“控制幅度”和“根据目标、程序、服务对象、地点划分组织”四项原则为例做了具体阐释。传统的行政学研究方法既然只能总结为谚语，而不能得出行政原则，那么在研究方法上就必须寻求新的途径，即只有提…","contextPage":55},{"src":"chen-2","pages":[26],"quote":"在这些批判者中有西蒙（HerbertA.Simon）、达尔（RobertA.Dahl）、阿普尔比（PaulH.Appleby）、朗（NortonE.Long）和沃尔多等","note":"陈把西蒙、沃尔多放在「对传统范式的批判者」名单里，答题时可以说清这是一场集体挑战，不是两个人的争论。","context":"…。公共行政学的传统由于学科本身的发展与时代的变迁必然招致批评，并促使其转变。第二次世界大战后，传统的公共行政学途径受到了来自各个方面尤其是政治学行为主义的批判。在这些批判者中有西蒙（HerbertA.Simon）、达尔（RobertA.Dahl）、阿普尔比（PaulH.Appleby）、朗（NortonE.Long）和沃尔多等。行为主义革命从对体制（官僚机构）的研究转向对政治行为的研究，使公共行政学失去了在政治学的中心地位。然而，传统行政学的根基并未真正动摇，新的范式并未确立。尽管西蒙猛烈地抨击传统行政学的政治—行政二分法和所谓的行政原则，并提出一种以决策为中心…","contextPage":26}],"moduleId":"m2","order":2},"l2-3":{"id":"l2-3","title":"公共选择：用经济学的手术刀切开官僚制","goal":"能解释经济人假设如何推出政府规模扩张与政府失败，并列出公共选择的五条出路。","minutes":16,"tag":"第2章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"帕金森定律、瓦格纳法则、内部性、政府失败——这些真题名解全在同一套逻辑里。抓住「经济人」三个字，这一整块就通了。"},{"t":"p","h":"一条假设，推出全部结论","text":"公共选择的出发点是：**人是理性的自利主义者**。无论他是消费者、生产者还是政治团体领袖，动机都是自利的，行动上又是理性的，会最充分地利用可得条件最大化自身利益——这就是「**经济人**」。\n\n顺这条假设往下推：官员追求下属数量而非对手（帕金森定律）、机构追求预算最大化、公务员逃避风险不事创新。于是政府规模持续扩张，干预未必有效——这就是「政府失败」的微观基础。"},{"t":"p","h":"政府为什么越来越大","text":"教材给了三种解释。**瓦格纳法则**（政府活动扩张法则）从三个方面说明：社会发展需要更多法律规章与秩序维护；物质生产领域需要政府介入；公共物品需求随社会发展增加。皮考克和维斯曼用英国 1890—1955 年公共支出资料验证了这条法则。\n\n**帕金森定律**揭示机构膨胀的两大动力：官员想要增加的是下属而不是对手；官员们相互之间制造工作。结论很尖锐：不管工作量是否增加，工作人员与机构数量总会按几何级数增长。\n\n**公共选择**则给出制度性解释：政府机构产出具有非市场性质、处于垄断地位且垄断信息；规章严格死板、缺乏激励；预算与效率脱钩，机构负责人视绩效为维持和扩大预算的能力。"},{"t":"p","h":"出路：把竞争引进来","text":"公共选择认为没有任何逻辑理由证明公共服务必须由政府官僚机构提供，出路是打破垄断、建立公私机构之间的竞争。具体五条：**组织类型的理性选择**（哪种组织更适合就交给谁）；**市场机制与个人选择**（用脚投票）；**分权化**（权威分割、允许职能与辖区重叠）；**公共服务组织小规模化**（便于控制、利于效率、政治代表性、地方自治）；**自由化**（放松对市场和社会的管制）。"},{"t":"ask","q":"公共选择和新公共管理都在讲市场，它们的区别在哪？","a":"公共选择关注的焦点是**政府与市场、社会的关系**，主张减少政府干预、用市场力量解决政府困境，对应「物质私有化」；新公共管理关注的重点仍是**政府公共部门内部**，主张引进市场机制来完善公共组织，对应「内部理性化」。一个向外转移，一个向内改造。"},{"t":"quote","text":"帕金森定律揭示了政府机构不断膨胀的两大动力：“一是官员想要增加的是下属而不是对手，二是官员们相互之间制造工作。”","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 63 页"}],"concepts":[{"term":"经济人","def":"公共选择理论的人性假设：在行动上理性、在动机上自利，会充分利用可得条件最大化自身利益的人。","points":["把政治市场与经济市场放在同一视角分析","由此推出官员行为、预算膨胀与政府失败"],"exam":"答公共选择、政府失败、内部性时，都要先把这个假设摆出来。"},{"term":"帕金森定律","def":"揭示政府机构不断膨胀的两大动力：官员想要增加的是下属而非对手，官员之间相互制造工作。","points":["结论：不论工作量是否增加，人员与机构数量按几何级数增长","根源：官僚机构的垄断性、缺乏竞争、鼓励浪费与低效"],"exam":"2020 年名解原题。答「两大动力 + 结论 + 根源」即可满分。"},{"term":"瓦格纳法则","def":"政府活动扩张法则：随社会发展，政府职能与公共支出呈扩张趋势。","points":["三条原因：秩序与法律规章需求增加、生产领域介入、公共物品需求增加","经皮考克和维斯曼用英国公共支出资料验证"],"exam":"2022 年名解原题。三个原因各占一分，结论一分。"}],"exercises":[{"t":"choice","q":"公共选择理论的出发点是：","opts":["人是理性的自利主义者","人是社会人","人是被规则塑造的","人是追求自我实现的"],"a":0,"why":"「经济人」假设是整块理论的起点。答公共选择类题目，第一句就该把它写出来。"},{"t":"multi","q":"按帕金森定律，机构膨胀的两大动力是：","opts":["官员想要增加的是下属而不是对手","官员们相互之间制造工作","公众对公共服务的需求不断增加","财政收入的增长"],"a":[0,1],"why":"A、B 是帕金森定律的原话。C 属于瓦格纳法则的解释路径，D 不是该定律的命题。"},{"t":"choice","q":"公共选择提出的五条出路的共同指向是：","opts":["加强政府对市场的管制","打破政府垄断、引入竞争与选择","扩大官僚机构规模","取消公共服务的政府责任"],"a":1,"why":"组织类型理性选择、市场机制与个人选择、分权化、小规模化、自由化，五条都指向打破垄断、增加公众选择机会。"},{"t":"judge","q":"公共选择关注的焦点是政府公共部门内部，主张通过引进市场机制完善公共组织。","a":false,"why":"这是新公共管理的主张。公共选择关注的是政府与市场、社会的关系，主张减少政府干预。"},{"t":"multi","q":"公共选择对「政府失败」的诊断包括：","opts":["政府机构产出的非市场性质使其免除竞争压力","产出的质与量难以测定，加上垄断信息，公众难以监督","内部规章严格死板、缺乏有效激励","政府预算未能与效率联系起来，绩效变成争取预算的能力"],"a":[0,1,2,3],"why":"四条都是教材的诊断（第五条是「理想的官僚已不复存在」）。这四条也是「政府失败的原因」类论述题的主体。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「帕金森定律」的名词解释（5 分）。","minutes":6,"points":["点明它揭示的是政府机构（官僚机构）不断膨胀的现象","写出两大动力：官员想要增加的是下属而不是对手；官员相互之间制造工作","写出结论：不论工作量是否增加，人员与机构数量按几何级数增长","点出根源：官僚机构的垄断性、缺乏竞争、鼓励浪费与低效"],"sample":"帕金森定律揭示了政府机构不断膨胀的两大动力：一是官员想要增加的是下属而不是对手；二是官员们相互之间制造工作。由此得出的结论是，不管政府机构的工作量是否增加，其工作人员和工作机构的数量总会按几何级数增长。其根源在于官僚机构具有高度垄断性、缺乏竞争，鼓励浪费与低效，同时高度分化与专业化使协调成本上升，交易成本提高。","tip":"写出「两大动力 + 结论」是 3 分，再补「根源」才够 5 分。名解的最后一句边界，往往就是第 4、5 分。"},"evidence":[{"src":"cai-wang-3","pages":[63],"quote":"一是官员想要增加的是下属而不是对手，二是官员们相互之间制造工作","context":"…些通过福利再分配的政策性支出和公共服务会大大超过其他公共支出的增长，这将促使政府职能出现结构性扩展。2.帕金森定律帕金森定律揭示了政府机构不断膨胀的两大动力：“一是官员想要增加的是下属而不是对手，二是官员们相互之间制造工作。”②从官僚体制来看，官僚机构具有高度的垄断性，缺乏竞争，鼓励浪费与低效。同时，官僚机构有高度分化与专业化趋势，一方面使组织更加庞大，另一方面协调组织内个人和分支部门的困难和代价加大，官僚机构的交易成本提高。用数学方式说明帕金森定律为：在任…","contextPage":63},{"src":"cai-wang-3","pages":[62],"quote":"公共选择理论以“自利”为出发点来解释人类的行为","context":"2.2.1公共选择理论2.2.1.1经济人的人性假设与公共选择公共选择既是一个独立的学术领域，又可以被视为公共管理中的一种思潮或学派。公共选择理论以“自利”为出发点来解释人类的行为。其分析的出发点是：人是理性的自利主义者。一方面，任何个人，不论他是购买商品的消费者，还是提供商品的生产者，或者是某一政治团体的领袖，他的行为动机都是自利的，时刻关注的是自身的利益；另一方面，在行动上，他又是理性的，能够最充分地利用他所能得…","contextPage":62},{"src":"cai-wang-3","pages":[62],"quote":"政府活动扩张法则","context":"…，西方的学者从不同的角度进行了阐述。1.瓦格纳、皮考克和维斯曼以及马斯格雷夫和罗斯托的解释德国经济学家瓦格纳在考察了当时几个先进的工业国家的公共支出后，总结出“政府活动扩张法则”。他认为政府扩张有三个方面的原因：一是随着社会的发展，为了保证市场机制发挥作用所必需的社会“环境条件”，完善法律规章以及维护社会秩序的要求也将随之递增。二是随着社会的发展，政府从事物质生产的经济活动越来越多，随着劳动生产率的提高，规模较大…","contextPage":62},{"src":"chen-2","pages":[39],"quote":"公共选择理论是20世纪70年代发展起来的一种“新政治经济学”或“政治的经济学”理论，80年代以后被广泛地应用于公共管理和公共政策领域","note":"陈把公共选择当「研究途径」讲，蔡王当「理论」讲；名解先写这句出身，再补经济人假设。","context":"…部门：概念、模型与途径》一书中认为，公共部门中的政策制定与执行的过程是通过来自公共选择、新制度经济学、政策执行、管理与评估等不同领域的模型或途径来进行研究的。①公共选择理论是20世纪70年代发展起来的一种“新政治经济学”或“政治的经济学”理论，80年代以后被广泛地应用于公共管理和公共政策领域。公共选择理论将“经济人”假说、交换范式和方法论个人主义应用到政治和公共政策领域。作为一种公共政策的研究途径，公共选择理论假定：政治行动者个人（不管是决策者还是投票者）都被自利的动机所引导而选择一项对其最有利的行动方案。新制度主义或新制度学…","contextPage":39}],"moduleId":"m2","order":3},"l2-4":{"id":"l2-4","title":"新公共管理：让管理者来管理","goal":"能说清管理主义的两大理念、胡德概括的七条特征，并区分新公共管理与公共选择。","minutes":16,"tag":"第2章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"新公共管理是新在哪儿？多数人只会答「市场化」，那只答对了一半。教材把它的理念分成两条：自由化与市场化。"},{"t":"p","h":"管理主义：「让管理者来管理」","text":"管理主义是工商企业管理领域的一套管理哲学，信条就是「**让管理者来管理**」。它认为良好的管理可以消除繁文缛节、提供激励、表明资金去向、把资源集中于最有效领域。20 世纪 80 年代以来，管理主义与公共选择理论、交易成本经济学、委托—代理理论联姻，构成「新管理主义」，其标准范本就是新公共管理理论。"},{"t":"p","h":"两大理念","text":"**管理的自由化**：公共官僚制的绩效不佳不是缺乏管理能力，而是「坏制度」的结果——烦冗的规则与约束把管理者变成了「被制度束缚的人」。所以要让管理者从繁文缛节中解放出来，解除规制、分权，使预算、人事、采购合理化。\n\n**管理的市场化**：两个基本概念是**竞争**（在公共部门创立内部市场）和**私人部门管理的普遍化**（认为私人部门的管理实践与技术优越于公共部门且可移植，即「管理就是管理」）。"},{"t":"p","h":"胡德的七条特征","text":"胡德把新公共管理的内涵与特征概括为七点：**向职业化管理的转变；标准与绩效测量；产出控制；单位的分散化；竞争；私人部门管理的风格；纪律与节约**。\n\n这七条是「新公共管理的特征」这道题最省力的答案。若题目要你「评价」，就顺着它的批评写：把公民当顾客、忽视公平与民主价值、竞争可能造成重复与浪费。"},{"t":"ask","q":"为什么说新公共管理不是「私有化」的同义词？","a":"因为新公共管理虽然也主张政府活动向外转移（如合同出租），但它更关注的是公共部门的**内部理性化**。教材把两条趋势分开：物质私有化是行动责任从国家向市场转移；内部理性化是提高公共管理活动的经济效率。新公共管理的重心在后者。"},{"t":"quote","text":"（1）向职业化管理的转变；（2）标准与绩效测量；（3）产出控制；（4）单位的分散化；（5）竞争；（6）私人部门管理的风格；（7）纪律与节约","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 67 页（引胡德）"},{"t":"cmp","h":"两张容易混的表","head":["对比项","公共选择","新公共管理"],"rows":[["关注焦点","政府与市场、社会的关系","政府公共部门内部"],["核心主张","减少政府干预，用市场力量解决困境","引进市场机制完善公共组织"],["对应趋势","物质私有化","内部理性化"]]}],"concepts":[{"term":"新公共管理","def":"以管理主义为理论基础，主张分权、绩效测量、产出控制、竞争与私人部门管理风格的公共管理理论与改革运动。","points":["两大理念：管理的自由化、管理的市场化","胡德七特征：职业化管理、绩效测量、产出控制、分散化、竞争、私人部门风格、纪律与节约","精髓是企业家政府理论"],"exam":"常与公共选择、新公共服务成对考「异同」或「评价」。"},{"term":"管理主义","def":"工商企业管理领域的一套管理哲学，信条是「让管理者来管理」，认为良好管理可移植到公共部门。","points":["核心观念：生产力增长依赖管理功能，管理者须拥有管理权限","与新公共管理的关系：前者是理论基础，后者是标准范本"],"exam":"名解或简答的背景铺垫；答「新公共管理的理论基础」时用。"}],"exercises":[{"t":"multi","q":"胡德概括的新公共管理特征包括：","opts":["向职业化管理的转变、标准与绩效测量","产出控制、单位的分散化","竞争、私人部门管理的风格","纪律与节约"],"a":[0,1,2,3],"why":"四条合起来就是胡德的七点。答题时可以合并成 4—5 点，但「绩效测量」「产出控制」「竞争」「分散化」四个关键词不能丢。"},{"t":"choice","q":"「管理的自由化」针对的是什么问题？","opts":["公共部门缺乏市场竞争","烦冗的规则与约束把管理者变成「被制度束缚的人」","公务员薪酬过低","公众参与不足"],"a":1,"why":"自由化的逻辑是「坏制度而非坏管理者」：绩效不佳源于过度的规则约束，所以要解制、分权。B 属于市场化要解决的问题。"},{"t":"judge","q":"新公共管理认为公私管理之间的区别是一种假象，「管理就是管理」。","a":true,"why":"这正是「私人部门管理的普遍化」的表述。它也是后来新公共服务批评新公共管理的重要靶子。"},{"t":"choice","q":"新公共管理与公共选择最大的不同在于：","opts":["一个主张市场，一个反对市场","公共选择重政府与市场社会的关系，新公共管理重政府内部改造","一个是理论，一个是实践","一个产生于美国，一个产生于英国"],"a":1,"why":"两者都尊崇市场机制，区别在作用对象：公共选择要减少干预（物质私有化），新公共管理要改造内部（内部理性化）。2022 年简答原题就考这个。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「新公共管理理论与公共选择理论的异同」（10 分）。要求：总述 + 相同点 + 不同点 + 收束。","minutes":12,"points":["总述：两者都尊崇市场力量、市场作用与市场机制","相同点：都以经济人假设和经济学方法为基础；都主张引入竞争、减少垄断","不同点一：公共选择关注政府与市场、社会的关系，主张减少政府干预","不同点二：新公共管理关注政府公共部门内部，主张引进市场机制完善公共组织","点出两种趋势：物质私有化与内部理性化","收束：两者共同构成当代行政改革的理论指导"],"sample":"新公共管理理论与公共选择理论都属于现代公共管理理论，二者的相同点在于：都尊崇市场力量、市场作用与市场机制，都以经济人假设和经济学分析方法为基础，主张打破政府垄断、引入竞争、减少低效。其不同点在于关注对象与改革方向：公共选择关注的焦点是政府与市场和社会的关系，主张减少政府干预，充分发挥市场力量解决政府面临的困境；新公共管理关注的重点仍然是政府公共部门内部，主张通过引进市场机制来完善政府公共组织。这两种不同反映了当代行政改革的两种趋势：一是物质私有化，即行动责任从国家向市场转移；二是内部理性化，即提高公共管理活动的经济效率。二者共同构成西方行政改革的重要理论指导。","tip":"这道题的分数全在「不同点」的精确性上。只写「都讲市场」拿不到一半分；必须写出「政府与市场的关系」对「政府内部」这一层。"},"evidence":[{"src":"cai-wang-3","pages":[67],"quote":"（1）向职业化管理的转变；（2）标准与绩效测量；（3）产出控制；（4）单位的分散化","context":"…责任制，强调产出导向和绩效评估，以准独立的行政单位为主的分权结构，采用私人部门管理、技术、工具并引入市场机制以改善竞争。为此，他将新公共管理的内涵及特征概括为：（1）向职业化管理的转变；（2）标准与绩效测量；（3）产出控制；（4）单位的分散化；（5）竞争；（6）私人部门管理的风格；（7）纪律与节约②。哈伯德（M.Hubbard）将新公共管理归纳为十大方面：（1）主管的战略角色和战略管理实践的强化；（2）从行政到管理的重点转移，即从执行规则到实现既定目标的转移；（3）人事权由中央…","contextPage":67},{"src":"cai-wang-3","pages":[66],"quote":"管理的自由化和市场化是新公共管理蕴含的两大基本理念","context":"…rationalization）——提高公共管理活动的经济效率。“尽管新公共管理也主张政府活动向外部转移，如合同出租等，但它更关注的是公共部门的内部理性化。”①管理的自由化和市场化是新公共管理蕴含的两大基本理念。第一，管理的自由化^{②}。管理主义认为，公共管理人员是高度专业化的、通晓如何管理的、掌握着信息的个人，因此，新公共管理理论倾向于认为公共官僚制的不良绩效不是缺乏管理能力和不履行职责的结果，而是“坏制度”的结果，是烦冗和不必要的规则、规制…","contextPage":66},{"src":"chen-2","pages":[30],"quote":"在这种背景下，发端于20世纪末的“公共治理”“新治理”“网络治理”和“新公共服务”一类的理论及研究视角或途径流行起来","note":"陈书里新公共管理不是终点，而是被后继理论取代的一环；写评价句时用得上这个位置感。","context":"…与信任危机以及对政府与日俱增的期望，公民对政府提出了更高的要求——要求更好更快的公共服务以及更多的公共事务参与，公共管理的实践进入了所谓“后新公共管理”的时代。在这种背景下，发端于20世纪末的“公共治理”“新治理”“网络治理”和“新公共服务”一类的理论及研究视角或途径流行起来，以至于①HalG.Rainey,UnderstandingandManagingPublicOrganizations,SanFrancisco:Jossey-BassPublishers,1991.②LaurenceE.Lynn,“Th…","contextPage":30}],"moduleId":"m2","order":4},"l2-5":{"id":"l2-5","title":"新公共服务：服务于公民，而不是顾客","goal":"能完整复述登哈特新公共服务的七个基本观点，并说清它与新公共管理的分歧所在。","minutes":15,"tag":"第2章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「当我们急于掌舵时，也许我们正在淡忘谁拥有这条船。」这句话是新公共服务全部七条主张的出发点。2026 年简答第一题就是它。"},{"t":"p","h":"七条主张，一条线索","text":"线索是**政府的所有者是公民**，公务员是受托人而非企业家。七条：\n\n1. 政府的职能是**服务**而不是掌舵；\n2. **公共利益是目标**而非副产品；\n3. 思想上要具有**战略性**，行动上要具有**民主性**；\n4. 为**公民**服务，而不是为顾客服务；\n5. **责任并不简单**；\n6. 重视**人**，而不只是重视生产率；\n7. **公民权和公共服务**比企业家精神更重要。"},{"t":"p","h":"三条最容易写错的","text":"**「服务而不是掌舵」**不是说什么都不管，而是角色从控制转为议程安排：政府与私营、非营利组织一起为社区问题寻找解决办法，官员越来越像调停者、中介人、裁判员，需要的是协商与解决冲突的新技巧。\n\n**「为公民服务而不是为顾客服务」**的关键在公平：政府服务对象不只是直接当事人，有些「顾客」凭资源和技能把需求优先于别人，所以在政府中公正与公平必须被考虑。\n\n**「责任并不简单」**针对的是两种简化：传统行政把责任简化为对政治官员负责，新公共管理简化为对市场与结果负责；新公共服务认为公务员同时受公共利益、宪法法令、其他机构、媒体、职业标准、社区价值、民主规范、公民需要等复杂因素影响。"},{"t":"quote","text":"公共管理者在其管理公共组织和执行公共政策时应该集中于承担为公民服务和向公民放权的职责，他们的工作重点既不应该是为政府航船掌舵，也不应该是为其划桨，而应该是建立一些明显具有完善整合力和回应力的公共机构。","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 69 页"},{"t":"ask","q":"新公共服务是要全盘否定新公共管理吗？","a":"不是。教材明确说它本质上是「对新公共管理理论的一种扬弃」：承认新公共管理对改进实践的价值，同时摒弃企业家政府理论的固有缺陷。登哈特本人的表述是——效率与生产力等价值观不应丧失，但应被置于民主、社区和公共利益这一更广泛的框架之中。写「全盘否定」会丢分。"}],"concepts":[{"term":"新公共服务","def":"以登哈特为代表，关于公共管理在以公民为中心的治理系统中扮演何种角色的一套理念。","points":["七条主张：服务而非掌舵、公共利益是目标、战略性与民主性、为公民服务、责任不简单、重视人、公民权优先","理论基础：对新公共管理特别是企业家政府理论的反思","定位：对新公共管理的扬弃，而非全盘否定"],"exam":"2026 年简答原题；也常在「公平取向理论」的论述里作为代表。"},{"term":"掌舵与划桨","def":"新公共管理用「掌舵」比喻政府把握方向、把执行交给别人；新公共服务认为问题不在这两者之间选择。","points":["关键隐喻：谁拥有这条船——所有者是公民","公务员角色应是负责任的参与者，而非企业家"],"exam":"论述题里用来做「评价」的一句话，很出彩。"}],"exercises":[{"t":"multi","q":"新公共服务的基本观点包括：","opts":["政府的职能是服务而不是掌舵","公共利益是目标而非副产品","为公民服务，而不是为顾客服务","重视人，而不只是重视生产率"],"a":[0,1,2,3],"why":"四条都在七条主张里。剩下三条是：战略性与民主性、责任并不简单、公民权与公共服务比企业家精神更重要。"},{"t":"choice","q":"新公共服务认为公务员的责任应当：","opts":["只对政治官员负责","只对市场与结果负责","同时受公共利益、宪法法令、职业标准、社区价值等多种因素影响","只对上级指令负责"],"a":2,"why":"「责任并不简单」是针对前两种简化提出的。答这道题时把「多种因素」列出三四个，就能拿到点。"},{"t":"judge","q":"新公共服务主张政府应当把公民当作顾客来服务。","a":false,"why":"恰恰相反。它认为政府与公民的关系不同于企业与顾客的关系：难以确定谁是顾客，且有些顾客会凭资源把需求优先于他人，因此必须考虑公正与公平。"},{"t":"choice","q":"「当我们急于掌舵时，也许我们正在淡忘谁拥有这条船」这句话要提醒的是：","opts":["政府应当更强势地掌控方向","公共权力的所有者是公民，公务员只是受托人","政府应当退出公共服务","划桨比掌舵更重要"],"a":1,"why":"这是新公共服务对企业家政府最尖锐的追问：如果政府把自己当船主，就会忘记船是公民的。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「新公共服务理论的基本观点」（10 分）。要求：一句总述交代它由谁提出、针对什么，再分点写出七条（可合并为 5—6 点），结尾一句评价。","minutes":12,"points":["总述：以登哈特为代表，基于对新公共管理尤其是企业家政府理论的反思","服务而非掌舵：角色从控制转为议程安排、协商与中介","公共利益是目标而非副产品：通过广泛对话形成共同利益","战略性与民主性：政策执行要有多方参与","为公民服务而非为顾客服务：必须考虑公正与公平","责任并不简单：受公共利益、法令、职业标准、社区价值等多重因素影响","重视人不只是生产率；公民权与公共服务比企业家精神更重要"],"sample":"新公共服务是以登哈特为代表的一批学者基于对新公共管理尤其是企业家政府理论的反思而提出的理论，其核心是公共管理在以公民为中心的治理系统中应扮演服务而非掌舵的角色。基本观点有七：一是政府的职能是服务而不是掌舵，角色从控制转为议程安排、协商与中介；二是公共利益是目标而非副产品，应通过广泛对话形成共同利益；三是思想上具有战略性、行动上具有民主性，政策执行需要多方参与；四是为公民服务而不是为顾客服务，必须关注公正与公平；五是责任并不简单，公务员受公共利益、宪法法令、职业标准、社区价值等多重因素影响；六是重视人而不只是重视生产率；七是公民权和公共服务比企业家精神更重要。它是对新公共管理的扬弃，把效率置于民主与公共利益这一更广泛的框架之中。","tip":"七条不必一字不差，但「服务而非掌舵」「公共利益是目标」「为公民而非顾客」「责任不简单」这四条的措辞是标准答案里原样出现的，尽量保留。"},"evidence":[{"src":"cai-wang-3","pages":[69],"quote":"政府的职能是服务而不是掌舵","context":"…重点既不应该是为政府航船掌舵，也不应该是为其划桨，而应该是建立一些明显具有完善整合力和回应力的公共机构。具体来说，新公共服务理论包括以下几个方面的基本观点：1.政府的职能是服务而不是掌舵“对于公务员来说，越来越重要的是要利用基于价值的共同领导来帮助公民明确表达和满足他们的共同利益，而不是试图控制或掌控社会新的发展方向。”①在新公共服务理论家看来，尽管过去政府在为“社会掌舵”方面扮演着十分重要的角色，但当今时代为社会领航的公…","contextPage":69},{"src":"cai-wang-3","pages":[71],"quote":"公民权和公共服务比企业家精神更重要","context":"…一起来行使领导权可以改变参与者，并且可以把他们的关注焦点转移到更高层次的价值观念上。在这个过程中，公民和公共雇员的公共服务动机同样可以得到承认、支持和补偿。7.公民权和公共服务比企业家精神更重要新公共服务理论认为，“致力于为社会做出有益贡献的公务员和公民要比具有企业家精神的管理者能够更好地促进公共利益，因为后一种管理者的行为似乎表明公共资金就是他们自己的财产”②。在新公共服务理论家看来，新公共管理理论鼓励公共行政官员采取企业家的行…","contextPage":71},{"src":"cai-wang-3","pages":[69],"quote":"当我们急于掌舵时，也许我们正在淡忘谁拥有这条船","context":"…，与其说公共行政官员正集中于控制官僚机构和提供服务，倒不如说他们更加关注掌舵而不是划桨的劝告，即他们更加关注成为一个更倾向于日益私有化的新政府的企业家。但是，“当我们急于掌舵时，也许我们正在淡忘谁拥有这条船”。在他们忙于掌舵的时候，他们是否忘记了是谁拥有这条船呢？在新公共服务理论家看来，公共管理者在其管理公共组织和执行公共政策时应该集中于承担为公民服务和向公民放权的职责，他们的工作重点既不应该是为政府航船掌舵，也不应该是为其划桨，而应该是建立…","contextPage":69},{"src":"cai-wang-3","pages":[72],"quote":"它本质上是对新公共管理理论的一种扬弃","context":"应当指出的是，尽管新公共服务理论是在对新公共管理理论进行反思和批判的基础上提出和建立的，但是，这并不意味着它是对新公共管理理论的全盘否定。从理论视角来看，它本质上是对新公共管理理论的一种扬弃，它试图在承认新公共管理理论对于改进当代公共管理实践所具有的重要价值并摒弃新公共管理理论特别是企业家政府理论的固有缺陷的基础上，提出和建立一种更加关注民主价值和公共利益、更加适合于现代公民社会发展和公共管理实践需要的新的理论选择。正如新公共…","contextPage":72},{"src":"chen-2","pages":[103],"quote":"新公共服务模式的基本内容及特征是：服务于公民而不是服务于顾客；追求公共利益（认为公共利益是目标而非副产品）；重视公民权胜于重视企业家精神","note":"陈把登哈特夫妇的七条压成清单，简答题可以直接照着分点。","context":"…管理”时代。例如，罗伯特·登哈特夫妇提出以民主公民权理论、社区和公民社会理论、组织人本主义和新公共行政、后现代公共行政为理论先导，建构起所谓“新公共服务”模式。新公共服务模式的基本内容及特征是：服务于公民而不是服务于顾客；追求公共利益（认为公共利益是目标而非副产品）；重视公民权胜于重视企业家精神；思考要有战略性，而行动要有民主性；承担责任并不是简单的；“服务而非掌舵”；重视人而不只是重视生产率。登哈特夫妇还用表3-2来说明传统公共行政、新公共管理与新公共服务的区别。表3-2传统公共行政、新公共管理与新公共服务的比较传统公共行政新公…","contextPage":103}],"moduleId":"m2","order":5},"l2-6":{"id":"l2-6","title":"公共治理：从「政府」到「治理」","goal":"能说出罗茨的六种治理含义、斯托克的五个论点、公共治理理论的五项内容，并解释「元治理」。","minutes":17,"tag":"第2章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2021 年考「罗兹的公共治理模式」，2025 年考「公共治理理论」，2023 年案例考「多中心治理」。治理是 618 出现频率最高的理论块，但它其实只有一个核心：政府不是唯一的中心。"},{"t":"p","h":"为什么会出现治理","text":"教材给的因果很清晰：大政府与福利国家使行政权力扩张、政府规模膨胀；到 20 世纪 70 年代末，行政效率低下、财政支出增长、公众不信任凸显。人们同时看到了**市场失效**（仅用市场手段无法达到帕累托最优）与**政府失效**（仅用计划和命令无法达到资源配置最优化）。于是提出治理，用来弥补政府与市场在调控、协调与管理社会事务中的不足。"},{"t":"p","h":"罗茨的六种含义","text":"罗茨认为治理意味着「统治的含义有了变化」，并列出六种用法：作为**最小国家**管理活动的治理（削减公共开支、以最小成本取得最大效益）；作为**公司管理**的治理（指导、控制和监督企业运行）；作为**新公共管理**的治理（把市场激励与私人部门手段引入公共服务）；作为**善治**的治理（强调效率、法治、责任的公共服务体系）；作为**社会控制体系**的治理（政府与社会、公共与私人部门的合作与互动）；作为**自组织网络**的治理（建立在信任与互利基础上的社会协调网络）。"},{"t":"p","h":"斯托克的五个论点","text":"斯托克梳理出五点：治理意味着一系列来自政府但**又不限于政府**的机构与行为者；在寻求解决方案时存在**界限和责任**的模糊性；各社会公共机构之间存在**权力依赖**；参与者最终将形成一个**自主的网络**；办好事情的能力**不限于政府的权力**，还存在其他管理方法和技术。"},{"t":"p","h":"公共治理理论的五项内容","text":"这是 2025 年简答的标准答案：\n**第一，公共治理是由多元主体组成的公共行动体系**（政府、私人部门、第三部门及三者合作）；\n**第二，公共管理的责任边界具有相当的模糊性**；\n**第三，多元主体之间存在着权力依赖和互动的伙伴关系**（伙伴关系有三种：主导者与职能单位、组织间谈判协商、系统的协作）；\n**第四，治理是多元主体基于伙伴关系进行合作的自主自治的网络管理**；\n**第五，政府在社会公共网络中扮演「元治理」角色**。"},{"t":"ask","q":"「元治理」是不是又回到政府中心论了？","a":"不完全是。元治理承认政府不具有最高的绝对权威，但强调政府承担着建立指导社会组织行为大方向的行为准则的重任，被称为「同辈中的长者」。在基础性工作中（建立法律基础、保持非扭曲的政策环境、投资基本社会服务与基础设施、保护承受力差的阶层、保护环境），政府仍是公共管理领域最重要的行为主体。所以它是「去中心化之后的再定位」，不是回到垄断。"},{"t":"quote","text":"第五，治理语境下的政府在社会公共网络管理中扮演着“元治理”角色。","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 76 页"}],"concepts":[{"term":"治理","def":"官方的或社会的公共管理组织在既定范围内运用公共权威维持秩序、实现公共利益最大化的活动、过程与方式。","points":["由共同目标支持，主体未必是政府，也无须依靠国家强制力","包括政府机制与非正式的、非政府的机制","目的：在各种制度关系中引导、控制和规范公民活动，增进公共利益"],"exam":"与「统治」成对辨析，也常考罗茨六义与斯托克五论点。"},{"term":"元治理","def":"公共治理理论对政府角色的定位：政府不具最高绝对权威，但承担确立行为准则的重任，是「同辈中的长者」。","points":["在基础性工作中政府仍是最重要的行为主体","用以回应治理理论「失灵」的质疑"],"exam":"答「公共治理理论内容」的第五点；也是评价治理理论的抓手。"},{"term":"网络治理","def":"多元主体基于权力依赖与伙伴关系形成的自主自治的公共事务管理网络。","points":["特征：不再是监督而是自主合作；不再集权而是权力纵横分散；不再追求一致而是多元化基础上的共同利益","各方须放弃部分权利：社会组织放弃部分经济自主权，政府放弃部分强制权"],"exam":"2024 年简答考过「网络治理的新特征」。"}],"exercises":[{"t":"multi","q":"罗茨列举的治理含义包括：","opts":["作为最小国家管理活动的治理","作为公司管理的治理","作为新公共管理的治理","作为自组织网络的治理"],"a":[0,1,2,3],"why":"六种含义是：最小国家、公司管理、新公共管理、善治、社会控制体系、自组织网络。A—D 全在列。"},{"t":"multi","q":"斯托克关于治理的论点包括：","opts":["治理意味着一系列来自政府但又不限于政府的社会公共机构和行为者","治理意味着界限和责任方面的模糊性","治理肯定各社会公共机构之间存在权力依赖","治理意味着办好事情的能力不限于政府的发号施令"],"a":[0,1,2,3],"why":"四点加上「参与者最终形成自主网络」，构成斯托克的五个论点。"},{"t":"choice","q":"公共治理理论主张政府在社会公共网络中扮演什么角色？","opts":["唯一权力中心","元治理角色","完全退出","企业的合伙人"],"a":1,"why":"「元治理」是公共治理理论对政府角色的定位：不具最高绝对权威，但承担确立行为准则之责，是「同辈中的长者」。"},{"t":"judge","q":"网络治理的特征之一是追求一致性和普遍性。","a":false,"why":"教材的说法相反：网络化公共管理的特征不再是追求一致性和普遍性，而是追求多元化和多样性基础上的共同利益。"},{"t":"order","q":"按教材的推理顺序排列「治理为什么出现」。","items":["政府职能扩张、规模膨胀，进入大政府与福利国家时期","行政效率低下、财政支出增长、公众不信任","同时认识到市场失效与政府失效","提出治理以弥补政府与市场在协调社会事务中的不足"],"a":[0,1,2,3],"why":"这条链条是论述题里最好用的开场：先给背景，再给双重失效，最后引出治理的补充功能，逻辑完整。"}],"write":{"type":"简答题","prompt":"用 14 分钟写「公共治理理论的主要内容」（10 分）。要求：一句总述交代它的来源与核心观点，再分五点展开。","minutes":14,"points":["总述：对传统公共行政的反思、对新公共管理与新公共服务的整合，核心是合作、协商、伙伴关系与共同目标","第一点：多元主体组成的公共行动体系（政府、私人部门、第三部门）","第二点：责任边界具有模糊性","第三点：多元主体之间存在权力依赖与互动的伙伴关系","第四点：形成自主自治的网络管理","第五点：政府扮演元治理角色"],"sample":"公共治理理论是对传统公共行政理论进行反思、并对新公共管理与新公共服务理论合理内核加以整合的结果，其核心观点是主张通过合作、协商、伙伴关系与确定共同目标来实现对公共事务的管理。主要内容有五：第一，公共治理是由多元主体组成的公共行动体系，包括政府部门、私人部门与第三部门及其多种形式的合作；第二，公共管理的责任边界具有相当的模糊性，部分公共责任转移至非政府组织与个人；第三，多元主体之间存在权力依赖与互动的伙伴关系，包括主导者与职能单位、组织间谈判协商、系统协作三种形式；第四，治理表现为多元主体基于伙伴关系合作的自主自治的网络管理，其特征是自主合作、权力纵横分散、追求多样性基础上的共同利益；第五，政府在社会公共网络中扮演「元治理」角色，承担确立行为准则之责，是「同辈中的长者」。","tip":"五点里第五点最能加分，因为它回应了「政府会不会被架空」的质疑。前四点都在讲多元，第五点把政府请回来，答案才完整。"},"evidence":[{"src":"cai-wang-3","pages":[75],"quote":"第一，公共治理是由多元的公共管理主体组成的公共行动体系","context":"…对新公共管理理论和新公共服务理论之合理内核进行整合的结果，其核心观点是主张通过合作、协商、伙伴关系、确定共同的目标等途径，实现对公共事务的管理，其主要内容包括：第一，公共治理是由多元的公共管理主体组成的公共行动体系。这些公共管理主体不仅包括几乎长期垄断公共管理主体地位的政府部门，而且还包括诸如私人部门和第三部门等非政府部门的参与者。我们知道，在现代公共管理理论兴起之前的很长一个时期，对社会公共事务的管理主要都是由政府垄断并且强制实施的，政府在公共管理…","contextPage":75},{"src":"cai-wang-3","pages":[73,74],"quote":"他还详细列举了六种关于治理的不同含义","context":"…非正式的、非政府的机制③。R.罗茨认为，治理意味着“统治的含义有了变化，意味着一种新的统治过程，意味着有序统治的条件已经不同于以前，或是以新的方法来统治社会”。他还详细列举了六种关于治理的不同含义，这六种含义是：第一，作为最小国家的管理活动的治理，它指的是国家削减公共开支，以最小的成本取得最大的效益；第二，作为公司管理的治理，它①俞可平．全球化：全球治理．北京：社会科学文献出版社，2003：2.②阿尔坎塔拉.“治理”概念的运用与滥用…","contextPage":73},{"src":"cai-wang-3","pages":[76],"quote":"治理语境下的政府在社会公共网络管理中扮演着“元治理”角色","context":"…化公共管理的特征不再是监督，而是自主合作；不再是集权，而是权力在纵向和横向上的同时分散；不再是追求一致性和普遍性，而是追求多元化和多样性基础上的共同利益。第五，治理语境下的政府在社会公共网络管理中扮演着“元治理”角色。关于政府角色和地位的研究是公共治理理论的重要内容之一。公共治理理论在关注公共管理主体","contextPage":76},{"src":"chen-2","pages":[80],"quote":"治理实质上是一种合作管理","note":"这句是陈对治理的定性，比蔡王「治理是各种公共的或私人的机构管理共同事务的诸多方式的总和」更短，适合当收束句。","context":"…到了关键但不一定是支配性的作用”②。由于该途径强调多中心的公共行动者通过制度化的合作机制，可以相互调适目标、共同解决冲突、增进彼此的利益。所以，从这一意义上讲，治理实质上是一种合作管理。这一概念也表明，治理与统治追求的目标相通，都需要借助公共权力维持社会秩序和处理公共事务，以促进公共利益的最大化，但二者在实现公共利益的过程中又具有明显的区别，这表现在：（1）管理的主体不同。统治是政府垄断公共事务管理的活动，而治理是政府、…","contextPage":80}],"moduleId":"m2","order":6},"l2-7":{"id":"l2-7","title":"理论怎么用：给一段材料，选出对的理论","goal":"拿到陌生材料时，能在 90 秒内判断该用哪个理论，并按「材料—理论—分析—建议」写出一段可得分的话。","minutes":18,"tag":"迁移","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"前面六课都在学理论，这一课把它们变成工具。案例题和论述题真正考的是选理论，而不是背理论。"},{"t":"p","h":"一个判断口诀：看材料在抱怨什么","text":"材料抱怨**效率低、成本高、人浮于事** → 公共选择、新公共管理。\n材料抱怨**不公平、弱势群体被忽略、服务态度冷** → 新公共行政、新公共服务。\n材料抱怨**部门推诿、跨界问题没人管、社会力量参与** → 公共治理、网络治理。\n材料抱怨**照章办事、反应迟钝、层级太多** → 官僚制的缺陷（韦伯）+ 组织变革。\n材料抱怨**政策执行走样、层层加码** → 政策执行偏差（822 内容，618 案例也会借）。"},{"t":"p","h":"选完理论，四步落地","text":"**第一步 提炼事实**：只写材料里能指认的（谁、做了什么、产生什么结果），一般 3 条。\n**第二步 点明理论**：一句话说清这个理论的核心命题。\n**第三步 用机制解释**：把理论的因果链套到事实上，一条事实对一条机制。\n**第四步 给建议**：按主体或阶段分，每条建议都必须指回前面的某条事实。"},{"t":"p","h":"一个示范","text":"材料：某镇垃圾分类，政府出钱招标第三方收运，村民按组轮流值守、互相监督，分类质量纳入村规民约。\n\n**提炼事实**：政府定规则与经费；第三方负责专业收运；村民参与投放与监督。\n**点明理论**：这是公共治理理论中的多中心治理。\n**机制解释**：治理理论认为政府不是唯一权力中心，多元主体基于权力依赖形成伙伴关系——政府提供合法性与资源，企业提供专业能力，社区提供日常信息与监督，三者互补。\n**给建议**：应公开收运去向与费用以便监督；在合同中写入质量标准与退出机制；给村民建立反馈与申诉渠道，避免只在投放端有效而后端混装。"},{"t":"ask","q":"如果材料里既有「效率低」又有「不公平」，该选哪个理论？","a":"选能解释主要矛盾的那个，另一个作为补充视角写在评价里。例如某地推行市场化保洁后成本下降但偏远村被放弃服务——主用新公共管理解释成本与竞争，再用新公共服务指出「把公民当顾客」会忽略公平，作为第二层评价。这比含糊地「两者都有」得分高得多。"},{"t":"tip","text":"案例题给建议时，写「政府—企业—社会」或「事前—事中—事后」两组框架之一，一定比「加强、完善、提高」三连得分高。"}],"concepts":[],"exercises":[{"t":"choice","q":"材料：某市把 20 个部门的办事窗口合并为一窗受理，结果窗口人员只负责收件，后台仍在各自审批，群众办事时间没有明显缩短。最该用哪个理论分析？","opts":["新公共服务（服务公民）","新公共管理（流程再造与结果导向）","公共选择（官员自利）","官僚制（非人格化）"],"a":1,"why":"这里的关键是「只改了界面、没改流程」，属于典型的形式性流程再造。用新公共管理的产出控制与流程再造作分析，再指出其局限，最贴材料。"},{"t":"choice","q":"材料：某县为完成减排指标，对全县企业一律停产一个月，达标企业也未能幸免。最适合的理论切口是：","opts":["公共治理（多中心）","政策执行偏差（层层加码、一刀切）与绩效评估失真","新公共服务（公民参与）","官僚制的层级节制"],"a":1,"why":"「一刀切、层层加码」是政策执行偏差的典型表现，其成因往往与单一考核指标有关，因此还要带一句绩效评估的问题。这比笼统说「政府失灵」精确。"},{"t":"multi","q":"下面的建议里，哪些属于「能指回材料事实」的可得分写法？","opts":["针对后台仍各自审批，应同步改造跨部门数据共享与并联审批流程","针对达标企业被停产，应按排污风险分级处置并公开执法标准","加强领导、提高认识、狠抓落实","营造良好氛围，形成工作合力"],"a":[0,1],"why":"A、B 都指回了材料中的具体缺陷，并指定了改哪个环节。C、D 换到任何材料都成立，属于废话。"},{"t":"order","q":"把案例题的作答顺序排好。","items":["提炼材料中的可指认事实","点明对应的理论及其核心命题","用理论机制逐条解释事实","按主体或阶段提出可核验的建议"],"a":[0,1,2,3],"why":"这个顺序保证每一条分析都能追溯回材料。反过来先想理论再找材料，就会写出「套模板」的答案。"}],"write":{"type":"案例分析","prompt":"材料：某市为解决「证明我妈是我妈」这类奇葩证明，取消了 200 多项证明事项，但群众发现有些事项仍需到原单位开证明，只是改由窗口人员代为查询。\n\n用 15 分钟写一段分析（20 分题的第一问）：要求提炼事实 3 条，点明理论，用机制解释，并给两条建议。","minutes":15,"points":["提炼出「取消证明事项」「仍需原单位开证明」「改由窗口代查」三条事实","点明理论：可从官僚制的规则僵化／内部性／新公共管理的流程再造中选一个并说明理由","用机制解释：规则以部门管理便利为中心，导致责任转移而非问题解决","指出「代查」若只换形式不改数据共享，仍是界面改造","给出两条可核验建议：明确数据共享责任、公开可免证明清单与申诉渠道"],"sample":"材料反映三件事：一是取消了 200 多项证明事项；二是部分事项仍需到原单位开证明；三是改由窗口人员代为查询。这说明改革改变了提交形式，但没有改变信息的来源与责任归属。从理论上看，这可以用官僚制的规则僵化与「内部性」来解释：证明的存在本来是为满足部门内部管理便利，取消证明若不触动数据共享，部门就仍会通过其他方式把核验成本转回群众。从新公共管理的流程再造角度看，真正的再造应以「结果」为标准——群众是否少跑腿，而不是窗口是否少收材料。建议：一是由市级层面明确各部门数据共享的责任清单与时限，把「可共享」变成「必须共享」；二是公开可免证明事项清单并设立申诉与回访渠道，让群众能指出哪些环节仍在变相要求证明。","tip":"案例题的「提炼事实」不要写成议论。一句一条，只写材料里发生的事，阅卷才好对照给分。"},"evidence":[{"src":"exam:2020年真题.pdf","quote":"试述“证明我妈是我妈”这类奇葩证明存在的原因及破解对策"},{"src":"cai-wang-3","pages":[75],"quote":"政府并非公共管理的唯一主体","context":"…现代公共管理理论兴起之前的很长一个时期，对社会公共事务的管理主要都是由政府垄断并且强制实施的，政府在公共管理领域几乎成了独一无二的管理主体。公共治理理论则认为，政府并非公共管理的唯一主体，除此之外，私人部门、第三部门等非政府组织在公共事务的管理中也扮演着重要的角色，它（他）们在介于市场经济与公共部门之间的“社会经济”领域内积极活动并且依靠自身资源参与管理共同关切的社会事务，在某些领域，非政府组织和个人甚至比政府拥有更大的优…","contextPage":75},{"src":"chen-2","pages":[36],"quote":"公共管理学将研究焦点由传统公共行政学的“内部取向”转变为“外部取向”","note":"给材料选理论时，先判断它问的是「内部管理」还是「外部结果」，这条判断线两书通用。","context":"…他们充分吸收了当代各门学科的理论和方法，特别是更多地依赖于经济学的理论和方法，并日益与工商管理学相融合。因此，它的基础更扎实，并具有更广泛的学科知识框架。第三，公共管理学将研究焦点由传统公共行政学的“内部取向”转变为“外部取向”，由重视机构、过程和程序研究转到重视项目、结果与绩效的研究，这使得战略管理、公共管理的政治环境、项目执行、绩效评估、公共责任制及公共管理伦理这样一些在传统公共行政学中没有的或被不受重视的主题成为公共管理学的核心主题。第四，公共管理学也涉及大…","contextPage":36}],"moduleId":"m2","order":7},"l3-1":{"id":"l3-1","title":"谁来管公共事务：公共组织的六个特征","goal":"能说出公共组织的定义与六个特征，并解释为什么公共组织的目标「形式清楚、实际模糊」，以及它带来的绩效评估难题。","minutes":14,"tag":"第3章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「公共组织」考过名词解释，但如果只背一句「以公共利益为目的的组织」，拿不到 5 分。真正被考的是它和私营组织的六条差别。"},{"t":"p","h":"先给一句能立住的定义","text":"教材的概括是：**公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织。** 这句话里三件事都要写到——目的（公共利益）、职能（管理公共事务、提供公共服务）、性质（社会组织）。"},{"t":"quote","text":"公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织。","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 127 页（本章小结）"},{"t":"p","h":"六个特征，一条比一条深","text":"**一、以增进公共利益为目标。** 私营组织追求个体利益、以市场价格为基本点；公共组织以全社会公平公正和行为公开为准则。\n\n**二、活动受法律明确限制并具有权威性。** 建立、撤销、职权都来自宪法和法律；同时它行使公共权力，带有强制性。\n\n**三、受到高度的公共监督。** 因为花的是公共资源、管的是公共事务。\n\n**四、活动具有政治性。** 不只是国防、民族问题，经济和社会事务因具全局性也带政治性；政策形成本身就是政治过程。\n\n**五、目标形式清楚、实际模糊，绩效评估比较困难。**\n\n**六、具有一定的独占性。** 公共物品非竞争非排他、投资规模大，私人不愿也难承担，公共组织客观上就成了独占者。"},{"t":"ask","q":"为什么说「目标形式清楚、实际模糊」解释了公共部门绩效评估为什么难？","a":"因为目标在第一层是清楚的（增进公共利益），到第二层就没法操作：公共利益是抽象的，什么是「共同利益」本身有争议。目标不可操作，就没法确定指标；没有指标，就只能用产出数量代替真实影响——这正是第 12 章要处理的问题。答题时把这两章连起来写，比单说「公共部门目标模糊」有分量。"},{"t":"cmp","h":"与私营组织的差别（可直接当简答骨架）","head":["维度","公共组织","私营组织"],"rows":[["目标","增进公共利益，追求公平公正与公开","追求个体利益，体现为利润"],["依据","建立、职权、程序都由宪法和法律限定","依法设立后在市场中自主经营"],["约束","受高度公共监督，须公开与可问责","主要对股东和消费者负责"],["绩效","目标实际模糊，结果难以量化评估","以利润和市场占有率衡量"],["竞争","在公共物品供给上具有一定独占性","面临市场竞争"]]},{"t":"tip","text":"名解写「定义 + 三到四个特征 + 一句边界」，5 分基本到手。六个特征不必全写，但「公共利益」「法律限制与权威性」「绩效评估困难」三条最能体现公共性，优先写。"}],"concepts":[{"term":"公共组织","def":"以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织。","points":["六个特征：公共利益目标、法律限制与权威性、高度公共监督、政治性、目标模糊与评估困难、独占性","按是否具有行政权分为政府组织、非营利组织、准政府组织"],"exam":"2023 年名解考过「公共组织」。答「定义 + 特征」即可，不要写成组织史。"},{"term":"公共组织的独占性","def":"公共组织在公共管理中具有一定的垄断性，尤其在公共物品生产领域。","points":["原因：公共物品非排他非竞争、私人不愿赔本生产、项目规模大","后果：缺少竞争压力，效率与质量易受损","改革方向：在公共物品生产领域引入竞争"],"exam":"常与「政府失灵」「公共选择」连考，是解释低效率的一个入口。"}],"exercises":[{"t":"multi","q":"按教材，公共组织的基本特征包括：","opts":["以增进公共利益为目标","活动受法律明确限制并具有权威性","受到高度的公共监督，活动具有政治性","目标形式清楚但实际模糊，绩效评估比较困难"],"a":[0,1,2,3],"why":"四条都在六特征之列（另外两条是「独占性」与由前四条推出的强制性）。答简答时四条写全，再补独占性。"},{"t":"choice","q":"公共组织的目标「形式清楚、实际模糊」，最主要的原因是：","opts":["组织成员不努力","公共利益本身抽象，且人们对什么是共同利益存在不同看法","法律没有规定组织目标","公众不关心公共事务"],"a":1,"why":"教材把原因落在「公共利益大多是抽象的」以及「人们对多大范围内的共同利益有不同看法」。这不是执行问题，是概念本身的争议性。"},{"t":"judge","q":"公共组织的独占性说明它天生低效，因此应当取消政府提供公共物品的职能。","a":false,"why":"独占性只说明缺少竞争压力，教材的结论是「如何在公共物品生产领域引入竞争」，而不是取消供给责任。把事实判断推成取消论，会直接丢掉评价分。"},{"t":"choice","q":"下列哪一项最能体现公共组织「受法律明确限制」？","opts":["组织可以自行决定增设部门","组织的建立、撤销、任务、权限都以宪法和法律为依据","组织可以自由定价提供服务","组织可以自行决定是否公开信息"],"a":1,"why":"教材的原意是：建立撤销以宪法法律为依据，任务责任权力由宪法法律赋予，行使职权的原则方式程序都不得超越法定范围。"},{"t":"order","q":"按「定义 → 特征 → 边界」把一段公共组织的名解排好顺序。","items":["给出公共组织的定义（目的、职能、性质）","列出二至三个核心特征","指出它与私营组织的根本差别","点明绩效评估困难这一限度"],"a":[0,1,2,3],"why":"名解的顺序就是从「是什么」到「凭什么成立」再到「它的限度」，最后一句边界往往是第 4、5 分。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「公共组织」的名词解释（5 分）。","minutes":6,"points":["给出定义：以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织","写出「以增进公共利益为目标」，并与私营组织的利润目标作对比","写出「活动受法律明确限制并具有权威性」（或「受高度公共监督」）","写出「目标形式清楚、实际模糊，绩效评估比较困难」","有一句边界或意义（如：按是否具有行政权可分为政府、非营利与准政府组织）"],"sample":"公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织。其特征有：以增进公共利益为目标，追求社会公平公正与行为公开，区别于私营组织对利润的追求；其建立、撤销与职权均以宪法和法律为依据，行使公共权力因而带有权威性与强制性；受高度公共监督并具有政治性；目标在形式上清楚但实际模糊，活动结果难以用准确量化的指标评估；在公共物品供给上还具有一定独占性。按是否具有行政权，公共组织可分为政府组织、非营利组织与准政府组织。","tip":"六个特征全写会超时。名解只写三条最贴「公共性」的（公共利益、法律与权威、目标模糊），再用一句分类收尾，比硬塞六条更像 5 分答案。"},"evidence":[{"src":"cai-wang-3","pages":[127],"quote":"公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织","context":"…着眼于组织功能的变化，区分“掌舵职能”和“划桨职能”、决策职能和执行职能，强化公共组织的社会服务职能。本章小结1.现代社会中的组织主要包括公共组织和非公共组织。公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织。为了实现组织目标和充分发挥功能，公共组织必须建立科学、合理的组织结构及其形式。2.在公共管理中，由于公共管理层次、公共事务性质的不同，政府组织、非营利组织、社会自治组织和准政府组织构成系统的公共管理主体。现代公共管理主体是以政府组织为核心…","contextPage":127},{"src":"cai-wang-3","pages":[88],"quote":"公共组织建立的目的与动机是增进公共利益","context":"者和施行者。因而，公共组织在具有社会组织的一般特征的同时，也表现出自己独具的特征。1.以增进公共利益为目标公共组织建立的目的与动机是增进公共利益，因而追求全社会的公平、公正，以及行为的公开就必然成为其一切活动和措施的基本准则。公共组织依据这一基本准则来为全体公众服务，并以服务的质量好坏来评判组织工作并取得公众的拥护和支持。私营组织的目标和动机则在于追求“个体利益”，具体体现为利润，…","contextPage":88},{"src":"cai-wang-3","pages":[89],"quote":"公共组织的独占性是指公共组织在公共管理中具有一定的垄断性","context":"恤民意等，也难以通过准确量化的指标进行评估。6.公共组织具有一定的独占性公共组织的独占性是指公共组织在公共管理中具有一定的垄断性。这一独占性主要表现在：在计划经济的条件下，公共组织可以通过政治权威或公共权力的行使来生产公共物品，不许私人加入竞争，从而形成一种独占公共物品生产的局面。在市场经济条件下，虽然政府可以放松管制，允许甚至鼓励私人企业进入公共物品生产领域，但是…","contextPage":89},{"src":"chen-2","pages":[44],"quote":"公共组织是公共事务的管理者和公共服务的提供者","note":"陈的组织定义只有这一句，和蔡王「公共组织是…正式组织」的定义可以拼成「性质＋角色」两句。","context":"公共组织现代社会是一个高度组织化的社会，组织在国家和社会生活中的作用日益突出。公共管理活动也离不开组织，公共组织是公共事务的管理者和公共服务的提供者。从某种意义上说，公共管理学就是关于公共部门的组织与管理理论。公共组织理论研究的是公共组织的性质、结构、设计方式、组织过程或组织行为、组织环境、组织变革与发展一类的组织问题。它不是关于事实的罗列与汇总，而是关于公共组织及其管理的一种思维方式…","contextPage":44}],"moduleId":"m3","order":1},"l3-2":{"id":"l3-2","title":"组织的骨架：纵向层级与横向分部","goal":"能画出公共组织的纵向三层与横向三类分工，并比较直线制、职能制、直线职能制、矩阵制四种结构形式的优缺点。","minutes":15,"tag":"第3章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「公共组织结构」很少单独出题，但机构改革、扁平化、部门推诿这些高频考点，全部要从这张骨架图上找位置。"},{"t":"p","h":"结构就是排列组合方式","text":"**公共组织结构**是指公共组织各要素的一种特定安排，即各要素的排列组合方式。它分两条线：**纵向结构**形成层级制，**横向结构**形成职能制。两者「各有优缺点，互相制约，互相补充，缺一不可」，所以各国都采取层级制与职能制结合的方式。"},{"t":"p","h":"纵向三层，各自角色不同","text":"**最高层级是决策层**：定总目标、总方针、总政策与总方案，负责人财物的总分配，是开放、面向社会的组织。\n**中层是协调指挥层**：把上级的总决策结合本单位对象转化为具体目标与方案，属半封闭半开放系统。\n**基层是技术操作层**：执行实施方案，做具体技术操作性工作，基本是封闭型。"},{"t":"cmp","h":"层级制的两面（简答可直接照抄）","head":["优点","缺点"],"rows":[["分层负责，事权集中、统一指挥","各层级首长管辖事务过多，责重事繁，难事事精通"],["行动迅速，可就地决策、就地实施与监督","容易形成地方的块块分割，不利于经济文化交流"],["发挥各层级积极性、创造性，因地制宜","容易犯地方主义错误，不利于中央宏观控制"],["首长负责全面管理，利于培养全面型管理人才","层级过多会削弱上级对下级的控制、降低效率"]]},{"t":"p","h":"横向按什么分","text":"横向分工常用三种：**按业务性质分工**（如财政、外交各设部门，是最基本的方式）、**按管理程序分工**、**按管理对象分工**。按业务性质分工的优点是符合专业化、便于统一方针政策、事权一致便于协调；缺点是事权过于集中易形成条条分割、分工过细易造成部门林立。"},{"t":"p","h":"四种具体形式","text":"**直线制**：上下垂直领导，结构简单、命令统一，但要求首长通晓全部业务。\n**职能制**（参谋型）：按专业分工设职能部门，能解决专业指挥难题，但各职能部门都有指挥权，易政出多门、多头领导。\n**直线职能制**：以直线制为基础、设职能部门作参谋，参谋只当助手不发号施令；兼有统一指挥与专业分工之长，是运用最广的形式，缺点是直线系统与职能系统易生矛盾、横向联系差。\n**矩阵制**：纵向职能与横向项目交叉，反应快、可共享稀缺资源、利于横向联系；缺点是成员受两个方向指挥、职权关系模糊，对协调沟通能力要求高。"},{"t":"ask","q":"为什么矩阵制适合「环境变化大、目标有双重要求」的组织，而政府部门极少整体采用？","a":"矩阵制的优势来自双重指挥：项目组能快速调动不同专业的人，所以适应变化；两条汇报线同时服务产品与职能两类目标。但政府部门强调命令统一与责任明确，双重指挥会与「统一领导」「权责相符」冲突，所以通常只在专项任务（如重大工程、跨部门行动）里临时采用，作为补充结构。"}],"concepts":[{"term":"公共组织结构","def":"公共组织各要素的特定安排，即各要素的排列组合方式。","points":["纵向结构形成层级制，横向结构形成职能制","合理的结构要求设置与职能任务相平衡、比例协调、有弹性","良好的结构是提高行政效率的物质基础"],"exam":"常以「如何理解公共组织纵向结构与横向结构的基本特点」出现在简答或复习思考题里。"},{"term":"直线职能制","def":"以直线制为基础、在首长之下设职能部门作参谋的组织形式，参谋部门无决策权、不对下级发号施令。","points":["兼有直线制统一指挥与职能制专业分工的优点，集权度较高","缺点：直线与职能系统易生矛盾，横向联系差","是最被广泛采用的结构形式"],"exam":"名解或比较题里出现，关键点是「参谋只当助手」。"}],"exercises":[{"t":"choice","q":"公共组织的纵向结构形成的是：","opts":["职能制","层级制","矩阵制","直线职能制"],"a":1,"why":"纵向结构形成层级制（决策层—协调指挥层—技术操作层），横向结构形成职能制。这一句是本章最常被直接考的原话。"},{"t":"multi","q":"按教材，层级制的缺点包括：","opts":["各层级首长管辖事务过多，责重事繁，难以事事精通","容易形成地方的块块分割，不利于各地经济文化交流","容易犯地方主义错误，不利于中央对地方的宏观控制","行动迟缓，无法就地决策"],"a":[0,1,2],"why":"D 说反了：「行动迅速、能就地决策」恰恰是层级制的优点之一。答优缺点题时方向颠倒是最常见的失分点。"},{"t":"choice","q":"直线职能制中，参谋部门的正确角色是：","opts":["对下级直接发号施令","充当助手，没有决策权，也不对下级发号施令","取代行政首长决策","只负责财务审计"],"a":1,"why":"教材明确：参谋部门只充当助手，对下级不能发号施令，没有决策权。这与职能制「各职能部门都有指挥权」形成对照，是两者的分界。"},{"t":"judge","q":"矩阵制的主要缺点是组织成员同时接受两个方向的指挥，职权关系模糊。","a":true,"why":"这正是教材列出的两个缺点之一，另一个是对管理者协调沟通能力和成员人际交往技能要求高。"},{"t":"order","q":"把公共组织纵向三个层级，按从上到下的顺序排列。","items":["决策层：定总目标、总方针、总政策与总方案","协调指挥层：把总决策转化为本单位具体目标与方案","技术操作层：执行实施方案，做具体技术操作性工作"],"a":[0,1,2],"why":"三层对应「开放—半封闭半开放—封闭」，答题时把这一列特征带上，就不只是背名词。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「公共组织纵向结构和横向结构的基本特点」（10 分）。要求：总述一句 + 纵向特点（含优缺点）+ 横向三种分工 + 收束。","minutes":12,"points":["总述：结构是各要素的排列组合方式，纵向成层级制、横向成职能制，两者缺一不可","纵向三层：决策层、协调指挥层、技术操作层，各自职责与开放程度","纵向优点：分层负责、事权集中、行动迅速、因地制宜、利于培养全面型人才","纵向缺点：首长责重事繁、块块分割、地方主义、不利于宏观控制","横向三种分工：按业务性质、按管理程序、按管理对象","收束：各国都采取层级制与职能制结合，以取长补短"],"sample":"公共组织结构是公共组织各要素的一种特定安排，即各要素的排列组合方式。纵向结构形成层级制，横向结构形成职能制，两者各有优缺点、互相补充，缺一不可。纵向结构分三层：最高层为决策层，制定总目标、总方针、总政策并负责人财物总分配，是开放的组织；中层为协调指挥层，把总决策转化为本单位的具体目标与方案，属半封闭半开放系统；基层为技术操作层，负责具体技术操作性工作，基本为封闭型。层级制的优点是分层负责、事权集中统一指挥，行动迅速可就地决策与监督，能发挥各层级积极性，并有利于培养全面型管理人才；缺点是首长责重事繁难以事事精通，容易形成块块分割和地方主义，也不利于中央宏观控制。横向分工一般有按业务性质、按管理程序和按管理对象三种，其中按业务性质分工是最基本的方式。因此各国都把层级制与职能制结合起来，取长补短。","tip":"这道题的分几乎全在「纵向优缺点」的对称上。优点写四条、缺点写四条，成对写不容易漏；只写优点会直接掉一半分。"},"evidence":[{"src":"cai-wang-3","pages":[89],"quote":"公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式","context":"…质量和服务水平，正是当代各国政府在着力探索和解决的问题。3.1.2公共组织的结构“结构”一词是生物学上的名词，是指一个生物体对所具有的各种要素的科学的特定安排。公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式。良好的公共组织结构是完成公共组织目标、提高行政效率的物质基础，具有重要的功能。合理的组织结构能有效地满足公共组织目标的需要；有利于稳定工作人员的情绪，调动工作人员的积极性；能使组织保持良好的沟通关系；是提高微观和宏观行政效率的前提条件。为…","contextPage":89},{"src":"cai-wang-3","pages":[90],"quote":"第一，分层负责，使各级政府在各自管辖地域范围内，能做到事权集中，统一指挥","context":"…，采用什么技术方法执行任务，纯属公共组织内部问题（见图3-1）。图3-1层级领导关系公共组织纵向结构形成的公共组织层级制，在公共组织运行中有其优缺点。其优点是：第一，分层负责，使各级政府在各自管辖地域范围内，能做到事权集中，统一指挥；第二，行动迅速，能及时地根据本地情况做出决策，就地组织实施，并有利于就地监督、控制；第三，能发挥各个层级公共组织的积极性、创造性，使其根据本地实际情况主动开展工作；第四，各层级行政首长负责全面管理工作，有利于培养全面型的管理人才。但是，层…","contextPage":90},{"src":"cai-wang-3","pages":[92],"quote":"直线职能制组织是以直线制为基础，在行政首长领导之下设立相应的职能部门","context":"…缺点是：各职能部门都有指挥权，易造成多头领导或多头指导，出现政出多门或者相互推诿、扯皮的现象，妨碍统一指挥，增加协调的困难，造成管理上的混乱。(3)直线职能制。直线职能制组织是以直线制为基础，在行政首长领导之下设立相应的职能部门，分别从事专业管理，作为该级领导的参谋的组织形式。这种组织形式的运行机制由职能专业化程度决定，是一种集权度较高的组织形式。参谋部门只充当助手，对下级不能发号施令，没有决策权。直线职能制组织结构是一种以直线结构形式为主、以职能结构形式为辅的较…","contextPage":92},{"src":"chen-2","pages":[56],"quote":"管理层次与管理幅度在一定规模的组织内成反比例关系。管理层次越多，管理幅度越小；管理层次越少，管理幅度越大","note":"层次与幅度的反比关系是结构题的固定得分点，陈书给了「尖形结构／扁平结构」的对照。","context":"幅度多宽为宜并没有一个普遍适用的标准，只能因人、因事而定。研究表明，管理层次与管理幅度在一定规模的组织内成反比例关系。管理层次越多，管理幅度越小；管理层次越少，管理幅度越大。管理层次多、管理幅度小的组织结构，其形态类似底宽上窄的“金字塔”，因此这种形态的组织结构被称为“尖形结构”，尖形结构中管理层次分明，上级对下级控制严格、影响力强。其优点是权力集中，分工明确，便于统一行动，但因其层次多，信息传递途径长，容易…","contextPage":56}],"moduleId":"m3","order":2},"l3-3":{"id":"l3-3","title":"政府之外：非营利组织、准政府组织与事业单位","goal":"能用萨拉蒙的六个特征判断一个组织是否属于非营利组织，并说清准政府组织与事业单位在中国的特殊性。","minutes":16,"tag":"第3章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「第三部门」「准政府组织」「事业单位」三个名词解释都出自这一片，而且互相咬合。分不清它们的边界，三道题会一起丢分。"},{"t":"p","h":"按「有没有行政权」分三类","text":"划分公共组织的标准很多，教材选了最能反映本质的一条：**是否拥有行政权力以及权力的大小**。按此划分，公共组织主要分为**政府组织、非营利组织、准政府组织**。三者协调发展，才构成完备的公共管理体系。"},{"t":"p","h":"萨拉蒙的六个特征","text":"判断一个组织是不是非营利组织，最常被引用的是萨拉蒙与安黑尔的「六特征法」：\n\n**正式组织性**——正式设立、达到一定规模，一般有法人资格；\n**非政府性**——从政府中脱离出来的民间组织，政府官员不能左右其理事会；\n**非利润分配性**——可以营利，但剩余额不在成员与理事会之间分配，而是继续用于组织使命；\n**自主管理性**——内部自主管理，不受控于外部组织；\n**自愿性**——成员自愿、无偿参与领导、计划、经营、管理；\n**公共性**——不为某些特定对象服务，而为公共利益服务。"},{"t":"p","h":"准政府组织：介于两者之间","text":"**准政府组织**是介于政府组织和非营利组织之间的**过渡型**公共组织：以增进公共利益为目标，通过授权等行使一定的行政权力，或凭借公共权威管理公共事务，对公共事务的管理具有**一定强制性**，同时又是非营利的。\n\n在我国，准政府组织包括工会、妇联、共青团、科协、工商联、青联、侨联、台联等群众团体，以及**事业单位**、村民自治组织和居民自治组织。它们在人员构成、组织管理和运行方式上都带有政府性质，行政色彩很强。"},{"t":"p","h":"事业单位：中国特有的一类","text":"**事业单位**是随我国计划经济体制建立而出现的、我国特有的公共事务管理承担者，指受国家行政机关领导、没有生产收入、所需经费由国库支出、不实行经济核算、主要提供非物质生产与劳务服务的社会组织，主要分布在科学、教育、文化、卫生、体育领域。\n\n它的基本特征是**活动的非经济性与政治性**，以及**由政府主办并主管**（政府办事业、管事业、养事业）。这也是它被归入准政府组织的原因。\n\n改革方向在小结里写得很清楚：以**社会化**和运行**法制化、民主化**为目标，以**政事分开**为原则，根据事业单位的不同特点推进**分类改革**。"},{"t":"ask","q":"既然事业单位不以营利为目的，为什么不算非营利组织？","a":"卡在「非政府性」与「自主管理性」这两条上。我国事业单位由政府主办并主管，人权、物权、财权都在政府体系内，理事会与内部治理的自主程度达不到萨拉蒙的标准。所以教材把它归入准政府组织——具有公共性、非营利性，但行使部分政府职能、行政色彩强。按萨拉蒙的严格标准，我国真正意义上的非营利组织几乎不存在，这也正是国内学者倾向于放宽界定的原因。"},{"t":"tip","text":"三个概念的边界记一句话：非营利组织＝非政府的公益组织；准政府组织＝有授权、带强制性、非营利的过渡型组织；事业单位＝中国特有的、由政府主办主管的准政府组织。「第三部门」在教材里与非营利组织基本同义，可在答题时并提。"}],"concepts":[{"term":"非营利组织","def":"以增进社会公共利益为组织目标、本身不具有行政权力的公共组织。","points":["萨拉蒙六特征：正式组织性、非政府性、非利润分配性、自主管理性、自愿性、公共性","与政府组织相比，最大特点是非强制性和服务性","对基层公共事务的管理常能比政府组织更具效率"],"exam":"2023、2026 年简答考过「第三部门的作用」。答作用前先把定义与特征交代清楚，才好往下推。"},{"term":"准政府组织","def":"介于政府组织与非营利组织之间的过渡型公共组织，经授权行使一定行政权力，对公共事务管理具有一定强制性。","points":["我国实例：工会、妇联、共青团等群众团体，事业单位，村民与居民自治组织","特征：非营利、但行政色彩强，行使部分政府职能"],"exam":"2022、2025 年名解考过。答「过渡型 + 授权 + 一定强制性 + 我国实例」四点即满分。"},{"term":"事业单位","def":"受国家行政机关领导、经费由国库支出、不实行经济核算、主要提供非物质生产与劳务服务的社会组织。","points":["分布：科、教、文、卫、体","基本特征：活动的非经济性与政治性、由政府主办并主管","改革：以社会化与运行法制化民主化为目标，以政事分开为原则，分类改革"],"exam":"2021 年名解考过「事业单位」，2022 年简答考「事业单位改革发展的目标取向」。"}],"exercises":[{"t":"multi","q":"萨拉蒙提出的非营利组织六特征包括：","opts":["正式组织性、非政府性","非利润分配性、自主管理性","自愿性、公共性","营利性与市场竞争性"],"a":[0,1,2],"why":"六特征是：正式组织性、非政府性、非利润分配性、自主管理性、自愿性、公共性。非营利组织可以营利，但剩余不分配——所以「营利性」不是它的特征。"},{"t":"choice","q":"准政府组织与一般非营利组织最关键的区别是：","opts":["是否以公共利益为目标","是否通过授权行使一定行政权力、管理具有强制性","是否接受捐赠","是否由志愿者组成"],"a":1,"why":"两者都以公共利益为目标、都可接受捐赠。分界在「授权 + 一定强制性」：准政府组织行使部分政府职能，因而带有行政色彩。"},{"t":"judge","q":"事业单位属于非营利组织，因为它不以营利为目的。","a":false,"why":"事业单位在我国被归入准政府组织。不以营利只是必要条件之一，它卡在「非政府性」与「自主管理性」上——由政府主办并主管，行政色彩强。"},{"t":"choice","q":"按教材，我国事业单位改革的原则是：","opts":["政企分开","政事分开","党政分开","管办合一"],"a":1,"why":"小结的表述是「以事业单位社会化以及运行法制化和民主化为目标，以政事分开为原则」。政企分开是国有企业改革的提法，不要混用。"},{"t":"order","q":"按教材的推理顺序，把「非营利组织为什么能补政府的不足」排好。","items":["政府难以独自满足多样、细分的公共需求","非营利组织贴近基层、按社会规律管理社会","在基层公共事务管理上常比政府更具效率","因此成为公共管理的重要主体"],"a":[0,1,2,3],"why":"这条链是「第三部门作用」类简答的底层逻辑：先有需求缺口，再有组织特性，最后落到效率与主体地位。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「准政府组织」的名词解释（5 分）。","minutes":6,"points":["点明它是介于政府组织与非营利组织之间的过渡型公共组织","写出目标：以增进公共利益为目标、非营利","写出关键区别：通过授权行使一定行政权力或凭借公共权威管理公共事务，具有一定强制性","举出我国实例：工会、妇联、共青团等群众团体，事业单位，村民与居民自治组织","有一句意义或问题（如：行政色彩强，需规范管理与改革）"],"sample":"准政府组织是介于政府组织与非营利组织之间的一种过渡型公共组织，即以增进公共利益为组织目标，通过授权等行使一定的行政权力，或凭借所具有的公共权威管理公共事务，对公共事务的管理具有一定强制性的非营利的公共组织。在我国，准政府组织包括工会、妇联、共青团、科协、工商联等群众团体，事业单位，以及村民自治组织和居民自治组织。它们在人员构成、组织管理与运行方式上带有政府组织性质，行使着一部分政府职能，行政色彩较强，因而既要发挥其作用，也要强化规范管理。","tip":"这道题最容易被扣的是「一定强制性」四个字。只写「非营利的公共组织」，就和一般非营利组织没区别了；正是授权与强制性把它和政府、非营利组织区分开。"},"evidence":[{"src":"cai-wang-3","pages":[93],"quote":"按此标准进行划分，公共组织主要可以分为政府组织、非营利组织和准政府组织","context":"…共权力的支持才能完成管理。相对其他标准而言，按公共组织是否拥有行政权力以及这一权力的大小来进行划分，更能反映出公共组织的本质特征以及不同类型公共组织的活动特点。按此标准进行划分，公共组织主要可以分为政府组织、非营利组织和准政府组织。按是否具有行政权对公共组织进行划分，从一个特定的侧面反映出了公共管理的三个基本的层面。在公共管理中，只有政府组织、非营利组织和准政府组织协调发展，才能形成一个完备的公共管理体系，才能最大限度地增进公共利益。现代公共管理是在一定环境中产生的…","contextPage":93},{"src":"cai-wang-3","pages":[95],"quote":"准政府组织是介于政府组织和非营利组织之间的一种过渡型公共组织","context":"…自身的性质特点，对基层公共事务的管理常常能比政府组织更具效率。3.1.3.3准政府组织在政府组织和非营利组织之间还存在一种难以直接定位的组织类型，即准政府组织。准政府组织是介于政府组织和非营利组织之间的一种过渡型公共组织，即以增进公共利益为组织目标，通过授权等行使一定的行政权力或通过所具有的公共权威管理公共事务，对公共事务的管理具有一定强制性的非营利的公共组织。在市场经济条件下，政府管理的基本范畴是社会公共事务，超出这一范围以行政权力直接管理市场，则可能导…","contextPage":95},{"src":"cai-wang-3","pages":[114],"quote":"事业单位是指受国家行政机关领导，没有生产收入、所需经费由国库支出、不实行经济核算、主要提供非物质生产和劳务服务的社会组织","context":"…种政府管理体制相适应，将社会事务和活动视为政府的事业，即“没有生产收入”“所需经费由国库支出”，并逐渐形成了高度集中的对社会事务的管理体制——事业单位管理体制。事业单位是指受国家行政机关领导，没有生产收入、所需经费由国库支出、不实行经济核算、主要提供非物质生产和劳务服务的社会组织。在计划经济体制下，整个社会组织主要被划分为行政单位、事业单位和企业单位三大类型，其中事业单位主要涉及科学、教育、文化、卫生和体育领域。相应地，事业单位管理体制就是政府办事业，即主要由各级政府及其工作部门直接举办；政府管事业，即事业单位的管…","contextPage":114},{"src":"cai-wang-3","pages":[127],"quote":"以政事分开为原则，根据事业单位的不同特点推进事业单位及其管理体制的分类改革","context":"…利益。3.事业单位及其管理体制是我国在计划经济体制下形成的，具有非经济性和行政化等特性。当代我国事业单位改革，必须以事业单位社会化以及运行法制化和民主化为目标，以政事分开为原则，根据事业单位的不同特点推进事业单位及其管理体制的分类改革。4.科层制采用严格的规章制度来约束公共组织成员的行为，是高效完成工作任务的管理方法。它强调组织标准化、工作秩序化、管理规范化。现代新技术对组织变革产生重大影响，科层制越来越不能适应信息社会的管理要求，必须进行变革。5.公共组织变革的目标就…","contextPage":127},{"src":"chen-2","pages":[20],"quote":"也称为第三部门或非营利组织，但因其具有如下鲜明的“公共”特性，也将其归入公共部门","note":"陈在此把第三部门直接算进广义公共部门；考「第三部门是不是公共管理主体」时这句最好用。","context":"…，其职能是对社会公共事务进行管理，无偿占有社会公共资源，并为社会提供公共物品和公共服务。除政府机构外，还存在公用事业、公共事业、非政府机构等“准公共部门”组织，也称为第三部门或非营利组织，但因其具有如下鲜明的“公共”特性，也将其归入公共部门①ChristopherPollitt,ManagerialismandthePublicService:CutsorCulturalChangeinthe1990s(2nded.),Oxford:BasilBlackwell,1993,p…","contextPage":20}],"moduleId":"m3","order":3},"l3-4":{"id":"l3-4","title":"公共组织的变革：机构改革为什么总在改","goal":"能说出公共组织变革的三个目标与五项内容，并解释「一般事务分权、宏观事务集权」为什么不是自相矛盾。","minutes":15,"tag":"第3章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2022 年简答考「当代西方国家公共部门改革的内容」，2026 年名解考「政府再造」。这些题的根都在这一节：组织为什么要变、变什么。"},{"t":"p","h":"变革不是机构加减法","text":"教材先说清一件事：变革在现象上常表现为机构调整，**机构调整只是手段，优化组织整体结构和功能才是目的**。它是有组织、有计划、有意识的变化过程，是一个系统工程。\n\n本尼斯提出四个衡量组织有效的标准，也被用来衡量变革目标：**适应性**（对环境需求变化的灵活反应）、**组织身份的认同感**（成员了解组织目的与下一步任务）、**对现实的认识能力**（准确感知并解释环境）、**整合性**（各部分服务于组织目标的整合程度）。前两者衡量对外适应力，后两者衡量自身稳定性与协调性。"},{"t":"p","h":"三个目标","text":"**一、提高适应环境的能力**：结构、职责、程序、方法都要立足于环境要求；同时要能改造环境，把握时机引导环境向好的方向发展。\n**二、提高自身的稳定性与协调性**：一是理顺工作秩序，科学划分各层级各部门的职、责、权、利；二是理顺组织与个人的关系，把个人目标纳入组织目标体系。\n**三、提高工作绩效**：在适应环境与稳定协调的基础上，改进知识、技能与行为方式，这是当代公共组织变革共同的、根本的目标。"},{"t":"p","h":"五项内容","text":"**1 组织结构的变革**：横向由重决策、执行、轻咨询信息监督，转向使咨询、信息、监督与决策、执行相平衡（完整体系由决策、执行、监督、咨询、信息五类部门构成）；纵向由集权式尖塔形转向分权式扁平型。\n**2 权力关系的变革**：向社会组织还权；横向分权（加大参谋部门的相对独立决策权、控制权与协调权）；纵向实行集权与分权的融合共存。\n**3 技术变革**：以互联网、大数据、人工智能推动流程再造、业务协同与资源共享，根治部门分割，实现「一网通办、一网统管」。\n**4 产品和服务的变革**：持续改进服务流程与方式，以更低成本提供更好品质。\n**5 人力资源变革**：投资训练与发展、使成员融入组织文化、改革规范与价值、改进晋升与奖励、变革高层管理团队。"},{"t":"ask","q":"「对一般事务分权、对宏观事务集权」看起来自相矛盾，怎么讲通？","a":"因为两者处理的是不同层次的不确定性。一般事务需要就地决策、快速响应，集权会把小事拖成大问题；宏观事务关系全体成员整体利益，必须保持高度协调一致，分权会造成秩序混乱。所以这不是摇摆，而是按事务性质做差异化配置——答题时点出「分权的对象与集权的对象不同」，这个矛盾就变成论证。"},{"t":"quote","text":"公共组织权力关系的变革，在对一般事务的管理上是从集权型走向分权型，而在对宏观事务的管理上是从分权型走向集权型。","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 125 页"},{"t":"tip","text":"论述题写到这里，记得补一句趋势：学习型组织、无缝隙组织与网络组织，以及区分「掌舵」与「划桨」。这三句能把答案从「背了教材」抬到「知道方向」。"}],"concepts":[{"term":"公共组织变革","def":"公共组织为适应环境、提高自身稳定性与协调性、提高工作绩效，对结构、权力关系、技术、产品服务与人力资源进行的有计划调整。","points":["目标是适应环境、稳定协调、提高绩效三项","内容是结构、权力关系、技术、产品服务、人力资源五项","机构调整是手段，优化整体结构与功能才是目的"],"exam":"常与「政府再造」「公共部门改革」「机构改革」连考，答题时先分目标、再分内容。"},{"term":"扁平化","def":"公共组织结构由集权式、尖塔形向分权式、扁平型发展的趋势。","points":["动因：层级过多削弱控制、降低效率；成员素质提高、交通通信便利；民主化与分权化要求","手段：扩大控制幅度、缩减纵向层级、以信息技术替代中层职能"],"exam":"「机构改革为什么强调减少层级」这类题的机制来源。"}],"exercises":[{"t":"multi","q":"按教材，公共组织变革的目标包括：","opts":["提高公共组织适应环境的能力","提高公共组织自身的稳定性与协调性","提高公共组织的工作绩效","压缩公共组织的财政支出规模"],"a":[0,1,2],"why":"三个目标是适应环境、稳定协调、提高绩效。压缩支出可能是改革的结果或动因，但不是教材列出的组织变革目标。"},{"t":"choice","q":"在横向部门结构上，公共组织变革的方向是：","opts":["继续加重决策与执行部门","使咨询、信息、监督部门与决策、执行部门相平衡","取消咨询与信息部门","把所有部门合并为一个"],"a":1,"why":"教材指出过去存在重决策执行、轻咨询信息监督的倾向，变革正是要把这五类部门配成完整闭环，而不是继续偏向一侧。"},{"t":"judge","q":"公共组织变革就是机构调整与人员增减。","a":false,"why":"教材明确反对这种理解：机构调整只是手段，优化组织整体结构和功能才是目的；变革是一个包含结构、权力、技术、服务、人力资源的系统工程。"},{"t":"choice","q":"公共组织纵向结构发展的趋势是：","opts":["由分权式扁平型转向集权式尖塔形","由集权式尖塔形转向分权式扁平型","层级与幅度同时无限扩大","取消所有中间层级"],"a":1,"why":"原话是「从集权式、尖塔形的结构形式向着分权式、扁平型的结构形式发展」。方向反了就是零分。"},{"t":"order","q":"把「机构改革为什么常常只是形式变化」的推理排好顺序。","items":["只调整机构设置与人员编制","职能配置与权责关系没有改变","部门之间仍然推诿、流程仍然割裂","结果公众感受到的服务没有改善"],"a":[0,1,2,3],"why":"这条链正好对应教材「机构调整只是手段，优化结构功能才是目的」。案例题里用它解释「改了机构没改服务」最有力。"}],"write":{"type":"论述题","prompt":"用 18 分钟写「公共组织变革的目标与内容」（20 分）。要求：概念 → 三个目标 → 五项内容 → 评价或趋势。","minutes":18,"points":["先界定：变革是有计划的变化过程，机构调整是手段，优化结构与功能才是目的","目标一：提高适应环境的能力（适应与改造环境）","目标二：提高自身稳定性与协调性（理顺工作秩序、理顺组织与个人关系）","目标三：提高工作绩效（根本目标）","内容一：组织结构的变革（横向五类部门平衡、纵向扁平化）","内容二：权力关系的变革（向社会还权、横向分权、纵向集权与分权融合）","内容三至五：技术变革、产品与服务变革、人力资源变革","评价或趋势：学习型组织、无缝隙组织与网络组织，区分掌舵与划桨"],"sample":"公共组织变革是公共组织为适应环境、提高自身稳定性与协调性、提高工作绩效而进行的有组织、有计划、有意识的变化过程。机构调整只是手段，优化组织整体结构和功能才是目的。其目标有三：一是提高适应环境的能力，使结构、职责、权限与工作方法立足于环境要求，并能动地影响和改造环境；二是提高自身的稳定性与协调性，既科学划分各层级各部门的职、责、权、利，又把组织成员的个人目标纳入组织目标体系；三是提高工作绩效，这是当代公共组织变革共同的、根本的目标。其内容有五：组织结构的变革，横向使咨询、信息、监督部门与决策、执行部门相平衡，纵向由集权式尖塔形转向分权式扁平型；权力关系的变革，向社会组织还权，横向加大参谋部门的相对独立权限，纵向实现集权与分权的融合共存；技术变革，以信息技术推动流程再造与业务协同；产品与服务的变革；人力资源变革。总的趋势是倡导学习型组织、无缝隙组织与网络组织，并区分掌舵职能与划桨职能。","tip":"20 分论述的分水岭在最后一段。三个目标、五项内容多数人都能背，能补上「学习型组织／无缝隙组织／掌舵与划桨」的，才是高分答案。"},"evidence":[{"src":"cai-wang-3","pages":[124],"quote":"机构调整只是手段，优化组织整体结构和功能才是目的","context":"…组织变革在现象上总是表现为组织机构的调整，机构调整也的确是组织变革中量最大的工作，但公共组织变革绝不是一个简单的机构调整、人员增减问题，而是一个复杂的系统工程。机构调整只是手段，优化组织整体结构和功能才是目的。与此相应，所有变革都与公共组织的目标密切联系。沃伦·本尼斯曾提出四个组织有效的标准，此标准同样也可适用于公共组织变革的目标。这四个标准分别是：第一，适应性——解决问题以及对环境需求的变化的灵活反应能力；第二，组织身份的认同感——从组织本身…","contextPage":124},{"src":"cai-wang-3","pages":[125],"quote":"从集权式、尖塔形的结构形式向着分权式、扁平型的结构形式发展的趋势","context":"…监督部门的地位和力量，使其职能与社会环境发展的要求相适应，使其与决策、执行部门合理配套，已成为公共组织变革的一项重要工作内容。在纵向层级上，整个公共组织结构有着从集权式、尖塔形的结构形式向着分权式、扁平型的结构形式发展的趋势。公共组织纵向层级的缩减既有政治上的考虑，也有管理上的考虑。从政治上考虑，纵向层级过多，组织高层级所辖事务过多，则有可能削弱对下级的控制；从管理上考虑，纵向层级过多会降低管理效率。而且，随着公共组织成员素质的提高，交通、通信条件的日益发达便…","contextPage":125},{"src":"cai-wang-3","pages":[125],"quote":"在对一般事务的管理上是从集权型走向分权型，而在对宏观事务的管理上是从分权型走向集权型","context":"…应，纵向层级也可以缩减，促进公共组织扁平化。2.权力关系的变革随着职能的转变和纵横结构的调整，公共组织的权力分配关系也要相应地发生调整。公共组织权力关系的变革，在对一般事务的管理上是从集权型走向分权型，而在对宏观事务的管理上是从分权型走向集权型。（1）公共组织向社会组织还权。公共组织是从社会中产生，又适应社会、服务于社会的。随着社会的发展变化，公共组织应不断调整自身的角色。库珀认为，目前的发展趋势非常明朗，过去仅由政府部门提供的物品和服务，现已通过承包、特许、颁发许可证、发放凭证…","contextPage":125},{"src":"chen-2","pages":[44],"quote":"公共组织理论研究的是公共组织的性质、结构、设计方式、组织过程或组织行为、组织环境、组织变革与发展一类的组织问题","note":"组织变革题的开头可以借这句把「性质—结构—过程—环境—变革」五个面一次点全。","context":"…和社会生活中的作用日益突出。公共管理活动也离不开组织，公共组织是公共事务的管理者和公共服务的提供者。从某种意义上说，公共管理学就是关于公共部门的组织与管理理论。公共组织理论研究的是公共组织的性质、结构、设计方式、组织过程或组织行为、组织环境、组织变革与发展一类的组织问题。它不是关于事实的罗列与汇总，而是关于公共组织及其管理的一种思维方式。因此，掌握公共组织理论是有效实施公共管理的重要基础。本章将从公共组织的内涵、结构、组织过程与行为、组织环境与组织变革等方面介绍公共组织理论。2.1了解公共组织组织是人类社…","contextPage":44}],"moduleId":"m3","order":4},"l4-1":{"id":"l4-1","title":"从「谁适合当领导」到「怎么领导才有效」","goal":"能说出领导理论演进的三个阶段及各自代表，并用权变公式解释为什么没有普遍适用的最佳领导方式。","minutes":15,"tag":"第4章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"领导理论考得不多，但它是「领导体制」「领导能力」这些题的地基。三段演进看懂了，评价类论述就有话可说。"},{"t":"p","h":"第一段：特质理论——找「天生的领导者」","text":"最早的研究试图找出领导者区别于常人的稳定特质。它在现实中不断被证伪：同一特质在不同情境下未必有效，在不同领导者身上也未必一致。于是研究重心转移。"},{"t":"p","h":"第二段：行为理论——看「他做了什么」","text":"行为理论认为，**真正决定一个人成为领导者的因素是他的行为**：既关心工作（生产）又关心人（下属）的领导才最有效，而且领导行为可以通过后天培养获得。代表成果有：\n\n**勒温的三种领导方式**——集权式（所有政策由领导者决定，奖惩对人不对事）、民主式（主要决策由成员集体讨论，领导者多用个人权力而非职位权力，下属有较大自由）、放任式（成员有完全决策权，领导者只提供条件与咨询）。\n**坦恩鲍姆和施米特的领导连续流**——领导方式不是「独裁」与「民主」二选一，而是依授权大小排列的连续谱，取决于环境与个性。\n**利克特的四种管理方式**——专制式集权、仁慈式集权、协商式民主、参与式民主，区别在于信任程度、激励方式、沟通方向与决策权位置。"},{"t":"p","h":"第三段：权变理论——加进「情境」这个变量","text":"人们逐渐认识到，不存在适合任何组织、任何对象的固定领导方式。领导效果取决于领导者、被领导者和环境三者的互动，教材用一个公式概括：\n\n**领导 = f（领导者、被领导者、环境）**\n\n这就是权变理论的实质：有效的领导行为因时间、地点、条件而变化。它的贡献是把被前两阶段忽视的环境因素拉了回来。代表成果有菲德勒的领导权变模型（用 LPC 量表区分任务取向与关系取向，再配职位权力、任务结构、上下级关系三种情境因素）和豪斯的路径-目标理论（领导者为下属指明路径、清除障碍，并分指导型、支持型、参与型、成就取向型四种风格）。"},{"t":"ask","q":"如果领导效果不由「人」决定，那选拔领导者还有意义吗？","a":"有，但意义变了。权变理论不是否定个人素质，而是说素质要「匹配」情境：任务取向型领导在情境极有利或极不利时更有效，关系取向型在中等情境更有效。所以选拔的落点不是「找最好的人」，而是「看这个岗位的情境需要什么取向的人」。这也是后来「人岗匹配」的理论来源。"},{"t":"tip","text":"答「领导理论」类题目，用「特质 → 行为 → 权变」这条线组织，比按人名罗列强得多。每一段都点明它「补上了前一段的什么缺陷」，评价分自然就有了。"}],"concepts":[{"term":"权变理论","def":"认为领导效果取决于领导者、被领导者与环境三者互动的领导理论，即领导＝f（领导者、被领导者、环境）。","points":["实质：没有一成不变、普遍适用的最好领导方式","贡献：强化了被特质理论与行为理论忽视的环境因素","代表：菲德勒权变模型、豪斯路径-目标理论"],"exam":"论述题里用来解释「为什么不能照搬某地经验」，一句话就够。"},{"term":"领导方式连续流","def":"坦恩鲍姆和施米特提出：领导方式按授予下属权力的大小排列成一个连续谱，不是独裁与民主的二选一。","points":["一个适宜的领导方式取决于环境与个性","连续流是开放的，组织与社会环境也会影响领导方式"],"exam":"反驳「民主一定优于专制」这类绝对化表述时最好用。"}],"exercises":[{"t":"choice","q":"权变理论的核心公式是：","opts":["领导＝领导者素质","领导＝f（领导者、被领导者、环境）","领导＝制度＋激励","领导＝决策＋执行"],"a":1,"why":"教材用这个函数式说明领导方式是领导者、被领导者和环境的一个变数，有效领导因时、地、条件而变化。"},{"t":"choice","q":"勒温提出的三种领导方式中，主要决策由组织成员集体讨论决定、领导者多用个人权力的是：","opts":["集权式领导","民主式领导","放任式领导","协商式领导"],"a":1,"why":"这是民主式领导的典型描述。集权式是一切政策由领导者决定，放任式是成员有完全决策权、领导者只提供条件。"},{"t":"judge","q":"行为理论认为领导者的特质是天生的，无法通过后天培养。","a":false,"why":"行为理论恰恰主张领导行为可以通过后天培养和锻炼得到；认为特质决定一切、且难以改变的是更早的特质理论。"},{"t":"multi","q":"关于菲德勒的领导权变理论，下列正确的有：","opts":["用 LPC 量表区分任务取向型与关系取向型","领导效果是领导者类型与领导情境配合的产物","情境因素包括职位权力、任务结构与上下级关系","认为变革型领导在任何情境下都有效"],"a":[0,1,2],"why":"D 是巴斯关于变革型领导的观点，不是菲德勒的。菲德勒强调「匹配」：类型与情境相容才有效。"},{"t":"order","q":"把领导理论的三个阶段按演进顺序排列。","items":["特质理论：寻找领导者区别于常人的稳定特质","行为理论：关注领导者的行为与风格","权变理论：加入情境因素，强调匹配"],"a":[0,1,2],"why":"这条线本身就是一道简答的骨架：每段补上前一段的不足，最后落到「没有普遍适用的最佳方式」。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「领导理论演进的主要阶段及其实质」（10 分）。","minutes":12,"points":["总述：研究重心从领导者特质转到行为，再转到情境","特质理论：寻找稳定特质，但因难以证伪而式微","行为理论：真正决定领导的是行为，代表有勒温三种方式、领导连续流、利克特四种管理方式","权变理论：领导＝f（领导者、被领导者、环境），代表有菲德勒模型与路径-目标理论","收束：结论是没有普遍适用的最佳领导方式，关键在于匹配"],"sample":"领导理论大体经历三个阶段。第一阶段是特质理论，试图找出领导者区别于常人的稳定特质，但因特质在不同情境与不同人身上效果不一而不断被证伪。第二阶段是行为理论，认为真正决定一个人成为领导者的因素是他的行为，只有既关心工作又关心下属的领导才最有效，且领导行为可以通过后天培养获得，代表成果有勒温的集权式、民主式、放任式三种领导方式，坦恩鲍姆和施米特的领导连续流理论，以及利克特的四种管理方式。第三阶段是权变理论，认为不存在适用于任何组织与对象的固定领导方式，领导效果取决于领导者、被领导者与环境的互动，即领导＝f（领导者、被领导者、环境），代表成果有菲德勒的领导权变模型与豪斯的路径-目标理论。三阶段的共同结论是：有效的领导行为因时间、地点、条件而变化，关键在于领导者与情境的匹配。","tip":"别把三个人名堆成流水账。每段写一句「它补上了前一段的什么缺陷」，这道题就从背书变成有逻辑的论证。"},"evidence":[{"src":"cai-wang-3","pages":[138],"quote":"真正决定一个人成为领导者的因素是他的行为","context":"…理论潜在的理论缺陷和在现实中不断被证伪，在人际关系理论的影响下，研究者开始将考察有效领导的重点转移到领导者的行为和风格上来，形成了领导行为理论①。这种理论认为，真正决定一个人成为领导者的因素是他的行为，只有那些行为上表现出既关心工作（生产）又关心个人（下属）的领导者才是最有效的，同时认为领导行为是可以通过后天的培养和锻炼得到的。这些理论的主要研究成果包括勒温的三种领导方式理论、利克特的四种管理方式理论、斯托格迪尔的领导四分图理论、布莱克…","contextPage":138},{"src":"cai-wang-3","pages":[139],"quote":"领导=f(领导者、被领导者、环境)","context":"…适用的、“最好的”领导方式。领导行为效果的好坏，不仅取决于领导者个人的素质和能力，而且取决于诸多的客观因素，如被领导者的特征、领导的环境等。用一个公式表示就是：领导=f(领导者、被领导者、环境)它说明，领导方式是领导者、被领导者和环境的一个变数（函数）。因此，有效的领导行为是因时间、地点、条件的变化而变化的，这就是领导权变理论的实质。它是对领导特质理论和领导行为理论的发展和推进。它强化了为领导特质理论和领导行为理论所忽视的环境因素…","contextPage":139},{"src":"cai-wang-3","pages":[138],"quote":"领导方式具有开放的性质","context":"…一般分为以领导者为中心和以下属为中心的一系列领导方式；认为领导方式不是独裁与民主任选其一，而是有一系列连续流，并不是一种方式正确而另一种方式就总是错误的。另外，领导方式具有开放的性质，组织环境和社会环境也会对领导方式施加影响，主管人员必须做出决定或在管辖下属时适当考虑组织外部的利益。（3）四种管理方式理论。密歇根大学伦西斯·利克特（RensisLikert）教授和他的同事对领导类型和作风做了长达30年的研究，他们把领导…","contextPage":138}],"moduleId":"m4","order":1},"l4-2":{"id":"l4-2","title":"领导体制：权力、责任和机构怎么配置","goal":"能给出领导体制的定义与四项内容，比较首长制与委员会制、集权制与分权制的优劣，并说出我国领导体制的问题与改革路径。","minutes":18,"tag":"第4章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「领导体制」2021、2024 两次考名词解释，2026 还考了论述。这是第 4 章唯一的高频考点，必须能写满。"},{"t":"p","h":"一句定义管住三道题","text":"**领导体制是指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制。** 三个关键词——职能、权力、责任——就是它的内容框架。\n\n教材给它的分量很重：领导体制的好坏直接关系到领导能否有效履行职能、能否调动成员积极性、能否实现组织目标；科学的领导体制是领导活动正常进行的组织保证，是提高整体领导效能的重要因素，有助于克服官僚主义，也是规范领导行为的根本机制。"},{"t":"p","h":"四项内容","text":"**一、领导结构**：领导职能、领导权力与领导责任的配置结构。职能是管什么，权力是凭什么管，责任是没管好要承担什么（政治责任、法律责任、纪律责任、道德责任）。\n**二、领导的层次与跨度**：层次是纵向等级；跨度是一个领导者能直接有效指挥下级的幅度，一般下层可大、上层应小，呈金字塔式。\n**三、各部门之间的职责与权限划分**：要求建立严格的领导法则与岗位责任制，这是**领导体制的核心问题**。\n**四、领导干部的管理制度**：选举、招考、任免、考核、调动、轮换、回避、离（退）休等，属狭义的人事制度。"},{"t":"cmp","h":"两种最常考的类型对比","head":["体制","优点","缺点","适用"],"rows":[["首长制（独任制）","权力集中、责任分明、行动迅速、指挥灵敏、冲突少、效率高、易于考核","过于倚重首长，影响工作稳定性与连续性；监督不完备时易个人专断；决策失误后果严重","速决性、执行性、技术性、纪律性、突发性领导活动"],["委员会制（合议制）","集思广益、减少失误；有代表性、利于内部协调；分工合作、避免个人滥权","权力分散、责任不明确、行动迟缓、效率较低、难考核；易议而不决、决而不行","方针政策、规划制定，以及立法性、协调性、综合平衡性活动"]]},{"t":"p","h":"另外两组类型，一句话记住","text":"**集权制 vs 分权制**：集权制政令统一、力量集中、利于重点建设，但不能因地因时制宜、适应性不强；分权制便于下级独立自主、发挥创造性，但政令不统一、易产生本位主义。两者没有绝对分界，要「必要的集中统一 + 相对的独立自主」。\n\n**层级制 vs 职能制**：层级制上下业务性质相同、逐层缩小，指挥统一、利于培养通才，但缺乏专业分工、中间层次多易信息失真；职能制平行设部门、按内容分工，分工精细、效率高、利于培养专家，但易机构臃肿、政出多门、相互扯皮。\n\n还有一组：**完整制（一元统属）与分离制**——同一层级的各机关受一个还是多个领导机关指挥。"},{"t":"p","h":"我国领导体制的五个问题","text":"**一、职能分工不够合理**：党组织与政府、立法、司法机关的关系需要理顺，机构设置需优化。\n**二、领导权力过于集中**：既集中于领导机关和部门，又集中于少数几个主要负责人身上，教材称之为「病根之一」。\n**三、领导权力的约束滞后**：缺乏对领导机关特别是领导者的有效约束机制。\n**四、公共组织机构膨胀**：机构臃肿、人浮于事，加重财政负担，也是官僚主义的重要成因。\n**五、用人制度缺乏活力**：能进不能出、能上不能下、能官不能民，人治色彩重，易生任人唯亲。"},{"t":"ask","q":"为什么说「职责与权限划分」是领导体制的核心问题？","a":"因为其他三项都靠它落地。领导结构要靠职权划分定型，层次与跨度要靠职权划分界定边界，干部管理制度本身就是对「谁能担什么责」的规则。反过来，职责权限不清，就会出现有权无责（乱决策）、有责无权（干不成）、权责交叉（相互推诿）三种典型病症。写作时分点讲这三种病，比空谈「要理顺关系」有力得多。"},{"t":"tip","text":"论述「领导体制的问题与改革」时，最省力的结构是「五问题对五对策」：分工不清→完善职能分工；权力集中→合理分权与授权；约束滞后→强化监督与问责；机构膨胀→精简机构；用人无活力→改革干部人事制度。一条一条咬住，分就稳。"}],"concepts":[{"term":"领导体制","def":"公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制。","points":["四项内容：领导结构、层次与跨度、部门职责权限划分（核心）、领导干部管理制度","四种划分：首长制与委员会制、集权制与分权制、层级制与职能制、完整制与分离制","功能：组织保证、提高效能、克服官僚主义、规范领导行为"],"exam":"2021、2024 名解原题。写「定义 + 四项内容 + 一句功能」即可满分。"},{"term":"首长制与委员会制","def":"按最高决策权所属人数划分：集中于一位首长是首长制（独任制），由两位以上首长行使是委员会制（合议制）。","points":["首长制：集中、迅速、责任分明，但易专断","委员会制：集思广益、有代表性，但责任不清、行动迟缓","适用：首长制宜速决执行类，委员会制宜政策规划类"],"exam":"比较题的高频点，也可以作为改革建议的依据（如重大决策用委员会制、执行用首长制）。"}],"exercises":[{"t":"choice","q":"按教材，领导体制的核心问题是：","opts":["领导干部的选拔","领导机构中各部门之间的职责与权限划分","领导者的个人素质","领导的层次与跨度"],"a":1,"why":"教材明确「这是领导体制的核心问题」。抓住这一句，答论述题时就有了主心骨。"},{"t":"multi","q":"下列属于首长制优点的有：","opts":["权力集中，责任分明","行动迅速，指挥灵敏","能够集思广益，减少决策失误","冲突较少，效率较高，易于考核优劣"],"a":[0,1,3],"why":"C 是委员会制的优点。首长制的取舍很清楚：用效率与明确换风险，所以要配监督机制。"},{"t":"judge","q":"委员会制的缺点是权力分散、责任不明确，容易出现「名为集体负责，实为无人负责」。","a":true,"why":"这是教材对委员会制缺点的原话概括，也是实践中「议而不决、决而不行」的根源。"},{"t":"multi","q":"教材指出的我国领导体制问题包括：","opts":["领导权力过于集中","领导权力的约束滞后","公共组织机构膨胀、人浮于事","用人制度缺乏活力"],"a":[0,1,2,3],"why":"四条都在教材列举的五个问题里（第五条是职能分工不够合理）。这四条正好可以拼成论述题的第一半。"},{"t":"order","q":"把我国领导体制的问题与对应改革路径配对后，按「问题 → 对策」的书写顺序排列。","items":["权力过于集中","合理分权、规范授权","约束滞后","强化对领导机关与领导者的监督"],"a":[0,2,1,3],"why":"「问题—对策」交替写，比先列完五个问题再列五条对策更容易让阅卷看到对应关系。"}],"write":{"type":"论述题","prompt":"用 18 分钟写「我国公共管理领导体制存在的问题和改革路径」（20 分）。","minutes":18,"points":["先界定领导体制：领导职能、领导权力与领导责任的配置制度、方法及运行机制","点明职责权限划分是领导体制的核心问题","问题一：职能分工不够合理，党、政、立法、司法关系需理顺","问题二：领导权力过于集中（集中于机关、更集中于少数主要负责人）","问题三：权力约束滞后，缺乏有效监督；问题四：机构膨胀、人浮于事","问题五：用人制度缺乏活力（能上不能下、人治色彩）","改革路径与问题对应：完善职能分工、合理分权授权、强化监督问责、精简机构、改革干部人事制度","收束：用首长制与委员会制的适用条件说明「执行讲效率、决策讲民主」"],"sample":"领导体制是公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制，其内容包括领导结构、领导的层次与跨度、各部门之间的职责与权限划分以及领导干部管理制度，其中职责权限划分是领导体制的核心问题。当前我国领导体制主要存在五个问题：一是职能分工不够合理，党组织与政府、立法、司法机关的关系尚需进一步理顺；二是领导权力过于集中，既集中于领导机关和部门，又集中于少数主要负责人；三是领导权力的约束滞后，缺乏对领导机关特别是领导者的有效约束机制；四是公共组织机构膨胀、人浮于事，加重财政负担并助长官僚主义；五是用人制度缺乏活力，存在能进不能出、能上不能下、能官不能民以及人治色彩较重的问题。改革路径应与问题一一对应：完善领导职能分工、理顺各种关系，按照权责相称原则确定职权体系；合理划分权限、规范授权，解决权力过分集中；强化监督与问责，使权力与责任同步；坚持精简机构、优化设置；改革干部人事制度，引入公平竞争与优胜劣汰。就体制类型而言，执行性、速决性事务宜采用首长制以保效率与责任明确，方针政策与综合平衡类事务宜采用委员会制以集思广益，两者结合才能兼顾效率与民主。","tip":"20 分论述最怕「五个问题写完就没了」。每个问题后面紧跟一条对策，最后再用首长制／委员会制的适用条件收一下，答案才是闭环的。"},"evidence":[{"src":"cai-wang-3","pages":[142],"quote":"指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制","context":"…体制的含义和内容4.2.1.1领导体制的含义体制是指国家机关、企事业单位在机构设置、领导隶属关系和管理权限划分等方面的体系、制度、方法、形式等的总称。领导体制是指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制。领导体制的好坏，直接关系到领导能否有效地履行职能，有效地调动组织成员的积极性，实现组织目标。在西方，领导体制是整个公共管理系统得以顺利运转的关键：选民、利益集团和政党的利益要求只有通过领导体制的转换，才能最后形成国家或政府政策；立法机关的…","contextPage":142},{"src":"cai-wang-3","pages":[143],"quote":"这是领导体制的核心问题","context":"….领导机构中各部门之间的职责与权限划分这种职权划分，要求建立严格的从上到下的领导行政法则和岗位责任制，对各个领导部门（领导干部）的职责权限做出严格而明确的规定。这是领导体制的核心问题。4.领导干部的管理制度领导干部的管理制度属于狭义的人事制度，包括选举、招考、任免、考核、调动、轮换、回避、离（退）休等方面的制度。它是国家政治制度的组成部分。4.2.2领导体制的基本类型领导体制类型可以按照不同的标准来划分：根据领导机关中…","contextPage":143},{"src":"cai-wang-3","pages":[146],"quote":"我国领导权限的最大弊端是权力过于集中","context":"推进机构改革，合理设置机构，加强权力制约与监督。2.领导权力过于集中领导权力是公共领导体制的核心，是领导体制改革的关键和主要内容。权力实施以权限划分为前提。我国领导权限的最大弊端是权力过于集中。领导权力过分集中于公共领导机关和领导部门，而在领导机关和领导部门中，又过于集中在为数很少的几个主要负责人身上。可以说，权力过分集中也是我国领导体制的病根之一。3.领导权力的约束滞后我国领导体制中一直缺乏对公共领导机关，尤其是领导者的有效的…","contextPage":146},{"src":"cai-wang-3","pages":[146],"quote":"我国公共组织机构臃肿、人浮于事","context":"…胀公共组织机构是实现领导职能的组织实体，是领导体制的组织表现形式，只有机构设置合理，领导工作才能完整有序地运转，才能达到工作质量和工作效率的统一。然而长期以来，我国公共组织机构臃肿、人浮于事，这不仅是我国领导体制的一个严重弊端，而且是加重政府的财政负担，使党和政府的领导机关产生官僚主义作风的一个重要原因。因此，领导体制改革要解决机构臃肿、效率低下的问题。5.用人制度缺乏活力干部人事制度是我国领导体制的重要组成部分，增强工作活力…","contextPage":146}],"moduleId":"m4","order":2},"l4-3":{"id":"l4-3","title":"领导方法与领导协调","goal":"能说出领导方法的含义与五个特征，并用「平等性、互利性、结果不确定性」解释领导协调为什么不同于指挥命令。","minutes":13,"tag":"第4章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"这一节容易被跳过，但它提供了一个很好用的答题角度：很多「领导不力」的问题，其实是方法问题，尤其是协调问题。"},{"t":"p","h":"领导方法是什么","text":"**领导方法是指领导者配置资源、沟通和协调关系、统筹安排时间、统御和激励下属的各种手段与途径。**\n\n它的五个特征是：**目的性**（通向组织目标，要把领导者的愿景整合为共同愿景）；**存在正确与错误、有效与无效之分**（不存在没有方法的领导工作，但存在不科学的方法）；**多层次性**（目标有层次，方法随之分层）；**具体相关性**（依附具体目标，并受情境与被领导者制约）；**动态变异性**（客观事物在变，方法也要变）。"},{"t":"p","h":"领导协调：内求团结，外求发展","text":"**领导协调**是公共部门领导者为实现既定目标，通过调配、协调政府与社会、政府不同组织、政府部门、公务员、政府不同职能之间可能产生的阻碍因素，使社会与组织保持平衡状态以实现预定目标、发挥整体最大功效的过程。\n\n教材用一句话概括它的作用：**内求团结、外求发展**。从领导者自身看，协调是正确履行职能、行使权力的重要保证；从社会看，协调有利于化解社会矛盾。"},{"t":"cmp","h":"协调与指挥的分界：三个特点","head":["特点","含义","为什么重要"],"rows":[["平等性","协调双方处于平等位置，没有强制力的直接作用，主要靠自然性影响力","使协调区别于计划、指挥、控制等职能"],["互利性","效果取决于措施对各方利益要求的满足度，最好的措施是最大限度满足各方合理要求","只讲整体利益、不顾成员合理要求，协调就落不了地"],["结果不确定性","方案与目标要随协调对象态度和要求的改变而调整","不能拿「已经定了」当理由拒绝协商"]]},{"t":"p","h":"协调什么","text":"分两类：**领导工作关系协调**——部门任务、工作时间、政策措施、工作要素（人财物）的协调；**领导人际关系协调**——上下级之间、同级组织之间、领导班子成员之间、领导者与下属之间的关系。\n\n教材给了一条很实用的原则：**以人为本**——协调的实质是处理人际关系，要把尊重人、关心人、理解人贯穿始终。"},{"t":"ask","q":"既然协调没有强制力，领导者凭什么让别人配合？","a":"靠自然性影响力：信息掌握、专业判断、利益分配的公平性、以及长期形成的信任。这也解释了为什么「只会下命令」的领导在跨部门事务上寸步难行——他手里只有职位权力，而协调恰恰要求少用职位权力。答题时点出「协调依赖自然性影响力而非强制力」，是一个能拉开档次的判断。"}],"concepts":[{"term":"领导方法","def":"领导者配置资源、沟通和协调关系、统筹安排时间、统御和激励下属的各种手段与途径。","points":["五个特征：目的性、有正确与错误之分、多层次性、具体相关性、动态变异性","不存在没有方法的领导工作，但存在不科学的方法"],"exam":"常与「领导能力」合并考，答「含义 + 特征 + 一种具体方法」。"},{"term":"领导协调","def":"领导者通过调配、协调各方之间可能产生的阻碍因素，使社会与组织保持平衡状态以实现目标、发挥整体最大功效的过程。","points":["作用：内求团结、外求发展","三个特点：平等性、互利性、结果不确定性","原则：以人为本"],"exam":"名解或简答均可，关键是写出三个特点并与指挥、控制作区分。"}],"exercises":[{"t":"choice","q":"教材用哪一句话概括领导协调的作用？","opts":["上情下达、下情上达","内求团结、外求发展","统筹兼顾、突出重点","统一指挥、分级负责"],"a":1,"why":"「内求团结、外求发展」是教材的原话概括，八个字记住就能在名解里直接拿分。"},{"t":"multi","q":"领导协调的特点包括：","opts":["平等性","互利性","结果不确定性","强制性"],"a":[0,1,2],"why":"协调恰恰以「没有强制力的直接作用」为前提；强制性是命令、指挥的特征，两者正相对。"},{"t":"judge","q":"领导协调中，即使一方处于领导地位，也主要借助自然性影响力的发挥。","a":true,"why":"这是「平等性」的准确表述。不排除领导强制力的间接影响，但它不能成为协调的主要手段。"},{"t":"choice","q":"下列属于领导工作关系协调内容的是：","opts":["领导班子成员之间的关系","部门任务、工作时间与工作要素的协调","领导者与下属的私人关系","同级组织之间的交往"],"a":1,"why":"工作关系协调包括部门任务、工作时间、政策措施和工作要素（人财物）四类；其余选项属于人际关系协调。"},{"t":"order","q":"按教材的推理顺序，把「为什么协调要靠平等与互利」排好。","items":["协调双方处于平等位置，没有强制力的直接作用","协调效果取决于对各方的利益满足程度","只靠命令会使协调退化为指挥","因此领导者要主要依靠自然性影响力与合理利益安排"],"a":[0,1,2,3],"why":"这条链把三个特点串成了机制：平等决定手段，互利决定效果，二者共同推出「靠影响力而非强制力」。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「领导协调」的名词解释（5 分）。","minutes":6,"points":["给出定义：领导者调配、协调各方阻碍因素，使组织保持平衡以实现目标、发挥整体功效的过程","点明作用：内求团结、外求发展","写出特点之一：平等性（没有强制力的直接作用，主要靠自然性影响力）","写出特点之二：互利性（效果取决于对各方利益要求的满足度）","写出特点之三：结果不确定性，或点明以人为本的原则"],"sample":"领导协调是指公共部门领导者为实现既定目标，通过调配、协调政府与社会之间、政府不同组织之间、政府各部门之间、公务员之间以及政府不同职能之间可能产生的阻碍公共事务处理和社会和谐发展的因素，使社会和组织保持平衡状态以实现预定目标、发挥整体最大功效的过程。其作用可概括为内求团结、外求发展。领导协调有三个特点：一是平等性，协调双方处于平等位置，没有强制力的直接作用，主要借助自然性影响力；二是互利性，协调效果取决于措施对协调各方利益要求的满足度；三是结果不确定性，方案与目标须随协调对象态度与要求的改变而调整。协调应坚持以人为本的原则。","tip":"三个特点是这道题的分数重心。只写定义和「内求团结」最多 2 分；把平等性、互利性、结果不确定性三条各用一句话说清，5 分才稳。"},"evidence":[{"src":"cai-wang-3","pages":[148],"quote":"领导方法是指领导者配置资源、沟通和协调关系、统筹安排时间、统御和激励下属的各种手段与途径","context":"…或途径；有人认为，领导方法是领导水平、执政能力和领导科学的重要组成部分；有人认为，领导方法是领导者在领导活动中所采取的各种手段、办法和程序的总称。因此，可以说，领导方法是指领导者配置资源、沟通和协调关系、统筹安排时间、统御和激励下属的各种手段与途径。4.3.1.2领导方法的特征根据领导方法内涵的阐释，领导方法具有以下特征：（1）领导方法的目的性。领导方法是通向领导愿景或组织目标的方法，这就表明了方法的目的性，且这种目的性也内在于领导者的意愿之中。就现代领导者来说，领导者在目的性上所要…","contextPage":148},{"src":"cai-wang-3","pages":[149],"quote":"用一句话概括，领导协调的作用就是内求团结、外求发展","context":"…各部门之间、公务员之间、政府不同职能之间等可能产生的阻碍公共事务的处理和社会和谐发展的因素，使社会和组织保持一种平衡状态以实现预定目标，发挥整体最大功效的过程。用一句话概括，领导协调的作用就是内求团结、外求发展。从领导者自身来看，协调是领导者正确履行职能、行使权力的重要保证；从公共组织所处的社会来看，协调有利于化解社会矛盾，建设和谐社会。因而，强化领导协调具有十分重要的意义。2.领导协调的特点（1）平等性。平等性是指协调双方处于平等位置，没有强制…","contextPage":149},{"src":"cai-wang-3","pages":[149],"quote":"平等性是指协调双方处于平等位置，没有强制力的直接作用","context":"…职能、行使权力的重要保证；从公共组织所处的社会来看，协调有利于化解社会矛盾，建设和谐社会。因而，强化领导协调具有十分重要的意义。2.领导协调的特点（1）平等性。平等性是指协调双方处于平等位置，没有强制力的直接作用。即使参与协调的一方处于领导地位，只要他行使的是协调职能，也主要借助自然性影响力的发挥。在这种情况下，尽管不能排除存在领导强制力的影响，但这种影响也只能是起间接作用。这一点使它与领导的计划、指挥、控制等职能区分开来。（2）互利性。协调活动能…","contextPage":149}],"moduleId":"m4","order":3},"l5-1":{"id":"l5-1","title":"政策靠什么落地：自愿、强制、混合三类工具","goal":"能按「政府介入程度」把政策工具分成三类，并各举出三个具体工具，说清每类的适用条件。","minutes":15,"tag":"第5章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「政策为什么没落地」有九成答案在工具上。618 近几年反复考凭单制、特许经营、用者付费，考的其实都是同一个框架：政府介入得有多深。"},{"t":"p","h":"先弄清概念","text":"**公共政策工具又称治理工具或政府工具**，是政策主体为实现政策目标而使用的具体手段。教材给了三种理解：**因果论**（探讨问题症结与解决方案间因果关系的过程）、**目的论**（目的导向的蓝图）、**机制论**（把政策目标转化为具体政策行动的机制）。答名词解释时，「机制论」最好用，因为它点出了工具的桥梁作用。"},{"t":"p","h":"最常用的分类：按政府介入程度","text":"霍利特和拉米什依据**提供公共物品和公共服务过程中政府介入程度的高低**，把工具分为**自愿性、强制性、混合性**三类。这条分类线之所以好用，是因为它同时回答了「谁做决定」和「目标群体有多少裁量空间」。"},{"t":"cmp","h":"三类工具的特征与清单","head":["类型","核心特征","具体工具"],"rows":[["自愿性","以不受或很少受政府影响为特征，政府有意识不介入，相信市场、家庭或志愿组织","家庭与社区、志愿组织、市场"],["强制性","又称直接工具，目标对象几乎没有自由裁量余地","管制、公共企业、直接提供"],["混合性","兼有两者特征：允许最终决定权留给私人部门，但政府不同程度介入决策形成","信息与劝诫、补贴、产权拍卖、征税、用户收费"]]},{"t":"p","h":"工具偏好背后是判断","text":"自愿性工具不是「政府偷懒」，而是承认有些问题家庭、社区和市场处理得更好；强制性工具也不是「政府强硬」，而是在公共安全、基本秩序这类领域，裁量空间本身就是风险。混合性工具的设计思路是：**把决定权留在私人手里，但改变他做决定时面对的成本与信息**——补贴、征税、信息发布都是这个逻辑。"},{"t":"ask","q":"垃圾分类既可以罚款（强制），也可以积分奖励（混合），还可以靠社区志愿督导（自愿）。三种做法该怎么选？","a":"看三个条件：问题的紧迫性与不可逆程度、目标群体的遵从成本、政府的执行能力。问题紧迫、后果不可逆（如有害垃圾混投）就上强制；遵从成本高、需要长期行为改变就用混合性工具；社区关系紧密、外部监督成本低时，自愿性工具反而最有效。真实政策通常是组合：强制定底线、混合给激励、自愿补细节。"},{"t":"tip","text":"凭单制、特许经营、用者付费、合同外包这些「市场化工具」在第 10 章细讲。答 618 的名解时，只要点明它属于混合性或强制性工具的哪一类，再补一句适用条件，就已经到位。"}],"concepts":[{"term":"政策工具","def":"政策主体为实现政策目标而使用的具体手段与机制，又称治理工具或政府工具。","points":["三种理解：因果论、目的论、机制论","按政府介入程度分：自愿性、强制性、混合性","工具选择直接影响政策目标能否实现"],"exam":"名解写「机制论定义 + 三类举例 + 一句选择要求」，比只写「手段」多拿两分。"},{"term":"混合性政策工具","def":"兼有自愿性与强制性特征的工具：把最终决定权留给私人部门，同时不同程度介入其决策形成。","points":["清单：信息与劝诫、补贴、产权拍卖、征税、用户收费","介入程度由低到高：发布导向信息 → 补贴与价格机制 → 对不服从者惩罚性课税","优势：兼顾自愿性的灵活与强制性的约束"],"exam":"常以「用者付费」「凭单制」的名解形式出现，答题时要能把它归入这一类。"}],"exercises":[{"t":"choice","q":"霍利特和拉米什划分三类政策工具依据的是：","opts":["工具的成本高低","提供公共物品和公共服务过程中政府介入程度的高低","是否具有法律效力","使用工具的主体是中央还是地方"],"a":1,"why":"原话是「依据提供公共物品和公共服务过程中政府介入程度的高低」。记住这条标准，三类工具的归属就不用死记。"},{"t":"multi","q":"下列属于强制性政策工具（直接工具）的是：","opts":["管制","公共企业","直接提供","志愿组织"],"a":[0,1,2],"why":"强制性工具是管制、公共企业、直接提供。志愿组织属于自愿性工具，与政府介入程度的判断方向相反。"},{"t":"multi","q":"下列属于混合性政策工具的是：","opts":["补贴","产权拍卖","征税与用户收费","家庭与社区"],"a":[0,1,2],"why":"混合性工具包括信息与劝诫、补贴、产权拍卖、征税和用户收费。家庭与社区是自愿性工具。"},{"t":"judge","q":"自愿性政策工具意味着政府放弃了对该领域的管理责任。","a":false,"why":"教材的表述是政府「有意识」地不介入，因为它们相信市场、家庭或志愿组织是解决问题的最佳渠道。这是分工判断，不是放弃责任——出了问题政府仍要兜底。"},{"t":"order","q":"把混合性工具的政府介入程度，从低到高排列。","items":["发布导向信息","对鼓励行为采取补贴或建立价格机制","对不服从的行为进行惩罚性课税"],"a":[0,1,2],"why":"教材明确说介入程度「从最低的发布导向信息到最高的对不服从的行为进行惩罚性课税，介于二者之间的是补贴和价格机制」。这条尺度是混合性工具的核心。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「政策工具」的名词解释（5 分）。","minutes":6,"points":["点明它是政策主体实现政策目标所使用的手段，又称治理工具或政府工具","给出机制论的定义：把政策目标转化为具体政策行动的机制","写出分类标准：按政府介入程度分为自愿性、强制性、混合性三类","每类各举至少一个工具（如市场／管制／补贴）","有一句边界：工具选择要综合政策问题、环境、目标群体与执行能力"],"sample":"政策工具又称治理工具或政府工具，是政策主体为实现政策目标而使用的具体手段与机制，其作用是把政策目标转化为具体的政策行动。按提供公共物品和公共服务过程中政府介入程度的高低，政策工具可分为三类：自愿性工具，以不受或很少受政府影响为特征，包括家庭与社区、志愿组织和市场；强制性工具，又称直接工具，目标对象几乎没有裁量余地，包括管制、公共企业和直接提供；混合性工具，兼有两者特征，包括信息与劝诫、补贴、产权拍卖、征税和用户收费。工具的选择直接关系到政策目标能否实现，需综合考虑工具特征、政策问题、政策环境与目标受众。","tip":"分类标准比清单更值钱。写清「按政府介入程度」这六个字，即使举例不全，也能让阅卷看出你懂结构；只罗列工具名，是最容易被扣分的写法。"},"evidence":[{"src":"cai-wang-3","pages":[172],"quote":"公共政策工具又称为治理工具或政府工具","context":"…目标的实现时，实际上也就转化为政策工具。政策工具的选择直接关系到公共政策目标的实现，它的选择需要综合考虑政策环境的具体情况。5.1.2.1公共政策工具研究的兴起公共政策工具又称为治理工具或政府工具。20世纪90年代以来，政策工具的研究日渐成为西方政策科学研究的一个焦点。政策工具研究兴起的主要原因有：一是政策执行的复杂多变性以及经常出现的政策失败引发人们对政策执行工具和方式的反思；二是政府组织对于政策的制定与执行的实践知识的需求日益增…","contextPage":172},{"src":"cai-wang-3","pages":[172],"quote":"将公共政策工具分为自愿性、强制性和混合性三种类型","context":"…不同的学者依据不同的标准进行了分类。加拿大学者霍利特和拉米什在《公共政策研究：政策循环与政策子系统》一书中，依据提供公共物品和公共服务过程中政府介入程度的高低，将公共政策工具分为自愿性、强制性和混合性三种类型③。①彼得斯，等．公共政策工具．北京：中国人民大学出版社，2007：12-13；陈振明．公共政策分析．北京：中国人民大学出版社，2002：47.②李允杰，丘昌泰．政策执行与评估．台北：空中大学，1999：163-164.③霍利特，拉米什．公…","contextPage":172},{"src":"cai-wang-3","pages":[173],"quote":"混合性政策工具兼有自愿性政策工具和强制性政策工具的特征","context":"…公民从事特定的活动，可以组建政府控制的公司来完成政府确定的职能，或者通过政府直接提供物品和服务。强制性政策工具包括：管制、公共企业和直接提供。3.混合性政策工具混合性政策工具兼有自愿性政策工具和强制性政策工具的特征，混合性政策工具在允许政府将最终决定权留给私人部门的同时，可以不同程度地介入非政府部门的决策形成过程。介入程度从最低的发布导向信息到最高的对不服从的行为进行惩罚性课税，介于二者之间的是对鼓励行为采取的补贴措施和在一些领域建立价格机制等，使用…","contextPage":173},{"src":"chen-2","pages":[227],"quote":"公共政策是公共管理过程中极为重要的一环，是公共管理的基础","note":"618 考政策与公共管理的关系时，这句是陈书的标准定位。","context":"…题做出决策，并将其转化成相关的公共项目，通过调动各种组织机构，调配各种社会资源，运用各种功能手段，达到问题解决、政治稳定和经济发展以及规范人们行为的目的。因此，公共政策是公共管理过程中极为重要的一环，是公共管理的基础。1.公共政策是公共管理的起点从一个孤立的管理过程来看，公共管理过程可分为政策制定、政策实施以及效果评估等环节。政策是实施行为的确定。公共组织通过制定政策实施方案，把政策目标分解为具体的执行目标或阶段目标，确定详细的、可操作的行动步骤，合理…","contextPage":227}],"moduleId":"m5","order":1},"l5-2":{"id":"l5-2","title":"工具怎么选：四个因素与一个二维模型","goal":"能列出影响政策工具选择的四种因素，并用霍利特—拉米什的「国家能力 × 子系统复杂度」模型给出选型判断。","minutes":16,"tag":"第5章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「政策工具选择的影响因素」是简答和论述的老熟人。多数人只答「成本、可行性、政治支持」，那是最朴素的一层；教材给了更硬的两套框架。"},{"t":"p","h":"巴格丘斯的四个因素","text":"巴格丘斯提出，政策工具选择要考虑四种因素：**政策工具的特征、政策问题、政策环境、目标受众的特征**。他的判断标准很直接——只有当「工具特征」与「政策环境 + 目标受众」相匹配时，这个工具才是**有效的政策工具**。\n\n这条标准拿来评价一个政策方案特别好用：不要说「这个工具不好」，而要说「它与这个环境、这批对象不匹配」。"},{"t":"p","h":"选择是一种理性，但不是纯经济理性","text":"教材说政策工具的选择是**以公共理性为主导和优先取向的多元综合理性**：不排斥经济理性（追求个人效用最大化），也不拒绝社会理性（在社会制度框架下寻求参与和共享），但主导的是公共理性——以政治正义为主导，维护和增进社会平等、自由和权利。\n\n这一点在答题时很值钱：它解释了为什么不能简单地「什么便宜用什么」。"},{"t":"p","h":"五条选择要求","text":"教材给出五条：**一是**基于以公共理性为主导的多元综合理性原则；**二是**与政策环境相适应；**三是**有利于协调目标群体当前、中期和长远利益；**四是**具有灵活性——单一工具、组合工具还是以一主多辅，取决于前三条的满足程度；**五是**工具的性质与效用在实施中会因环境和对象变化而改变，因此使用方式与力度要及时调整。\n\n第五条最容易被忽略，但它正好呼应「政策执行偏差」：工具用了却没跟着情况调整，就是偏差的来源之一。"},{"t":"cmp","h":"霍利特—拉米什的二维模型","head":["国家能力","政策子系统复杂度","应采用哪类工具"],"rows":[["强","高（行为者类型多且相互冲突）","利用市场工具实现自由竞争，通过市场配置资源"],["强","低（对象类型单一、数量不多）","管制、公共企业、直接提供等强制性工具"],["弱","高","只能选自愿性工具，如家庭与社区、志愿组织，借助社会力量"],["弱","低","可根据实际选择混合性工具：信息与劝诫、补贴、产权拍卖、征税、用户付费"]]},{"t":"ask","q":"为什么「国家能力强、子系统又高度复杂」时，教材反而建议用市场工具？","a":"因为对象太多、彼此冲突，政府很难辨别孰优孰劣。此时国家能力强的优势不在于「管得更细」，而在于有能力保证市场规则与竞争秩序——用市场配置资源，把具体判断交给分散的信息。反过来，国家能力弱又面对复杂对象时，硬上强制工具只会执行崩盘，所以教材建议退到自愿性工具。"},{"t":"tip","text":"答「影响工具选择的因素」时，可以按「环境—问题—对象—工具自身—执行能力」五层写，每层带一句机制。比堆砌十几个名词更像论述。"}],"concepts":[{"term":"有效政策工具","def":"与政策环境和目标受众相匹配的政策工具。","points":["判断依据：工具特征与国家能力、子系统复杂度、受众特征是否匹配","不匹配的工具即使本身设计合理也难奏效"],"exam":"评价类论述的落点句：「该工具与目标受众的遵从能力不匹配，因而难以成为有效工具」。"},{"term":"公共理性","def":"以政治正义为主导，维护和增进社会平等、自由和权利的选择取向。","points":["政策工具选择是以公共理性为主导的多元综合理性","不排斥经济理性与社会理性，但不以经济理性为最高标准"],"exam":"用来回答「为什么不能只按成本选工具」，是论述题的加分点。"}],"exercises":[{"t":"multi","q":"巴格丘斯提出，政策工具选择需要考虑的四种因素是：","opts":["政策工具的特征、政策问题","政策环境、目标受众的特征","决策者的个人偏好","国际组织的评价"],"a":[0,1],"why":"四种因素是工具特征、政策问题、政策环境、目标受众特征。C、D 都不是教材列出的因素，属常识性干扰项。"},{"t":"choice","q":"按教材，政策工具选择的主导理性是：","opts":["经济理性","社会理性","公共理性","技术理性"],"a":2,"why":"教材的表述是「以公共理性为主导和优先取向的多元综合理性」，经济理性与社会理性都在其中，但不是主导。"},{"t":"choice","q":"国家能力弱、政策子系统高度复杂时，教材建议优先使用：","opts":["强制性工具","自愿性工具","混合性工具","公共企业"],"a":1,"why":"政府没有足够能力管制，只能借助家庭与社区、志愿组织等社会力量实施政策。注意这与你直觉上的「越复杂越要管」正好相反。"},{"t":"judge","q":"政策工具一经选定就应稳定执行，频繁调整会损害政策权威。","a":false,"why":"教材第五条要求是：工具的性质和效用在实施中会因环境和目标群体变化而改变，使用方式或力度应及时调整。稳定不等于僵化。"},{"t":"order","q":"按教材顺序，把判断「用不用组合工具」的推理排好。","items":["明确政策问题与政策环境","比较单一工具与多种工具的效果","以公共理性协调目标群体的当前、中期与长远利益","据环境与对象变化调整工具组合与力度"],"a":[0,1,2,3],"why":"教材的原意是：单一工具、组合工具还是以一主多辅，取决于前述条件的满足程度；实施后还要根据环境与对象变化调整。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「影响政策工具选择的因素」（10 分）。要求：总述 + 分层作答 + 收束。","minutes":12,"points":["总述：工具选择直接关系政策目标能否实现，受主客观多重因素制约","写出巴格丘斯的四因素：工具特征、政策问题、政策环境、目标受众","点明「有效工具」的标准：工具特征与政策环境、目标受众相匹配","写出理性基础：以公共理性为主导的多元综合理性，不排斥经济理性与社会理性","写出教材的五条要求（环境适应、利益协调、灵活性、及时调整等）","能举一个组合工具的实例，或说明单一工具何时更优"],"sample":"政策工具的选择直接关系到公共政策目标的实现，受多种主客观因素制约。首先，巴格丘斯提出选择需考虑四种因素：政策工具的特征、政策问题、政策环境与目标受众的特征；一种工具只有在工具特征与政策环境、目标受众相匹配时才是有效的政策工具。其次，工具选择是一种以公共理性为主导和优先取向的多元综合理性：它不排斥经济理性与社会理性，但以政治正义为主导，维护和增进社会平等、自由与权利。再次，选择应遵循五条要求：基于公共理性原则；与政策环境相适应；有利于协调目标群体当前、中期与长远利益；保持灵活性，单一工具、组合工具或以一主多辅视条件而定；并随环境与对象变化及时调整使用方式与力度。以霍利特和拉米什的模型看，国家能力强而政策子系统复杂时可用市场工具，能力弱而对象复杂时只能借助自愿性工具，说明工具选择本质上是对国家能力与政策环境匹配程度的判断。","tip":"别把答案写成因素清单。10 分简答里，「四因素 + 有效工具标准 + 公共理性 + 五条要求」四个层次写全，比罗列十二个名词高一个档次。"},"evidence":[{"src":"cai-wang-3","pages":[173],"quote":"提出了政策工具选择需要考虑的四种因素，即政策工具的特征、政策问题、政策环境、目标受众的特征","context":"…户收费。5.1.2.3政策工具的选择及其应用1.政策工具的选择政策工具的选择受到各种主客观因素的制约。R.巴格丘斯在《在政策工具的恰当性与适配性之间权衡》一文中提出了政策工具选择需要考虑的四种因素，即政策工具的特征、政策问题、政策环境、目标受众的特征。根据这一理论，一种政策工具只有在以政策工具特征为一方与以政策环境和目标受众为另一方相匹配的时候才是有效的。在这样的情况下，有关的政策工具被称为有效的政策工具①。从根本上说，政策工具的选择是一种理性行为。理性是人类自主选择并为此调节自我行为…","contextPage":173},{"src":"cai-wang-3","pages":[173],"quote":"政策工具的选择是一种以公共理性为主导和优先取向的多元综合理性","context":"…具被称为有效的政策工具①。从根本上说，政策工具的选择是一种理性行为。理性是人类自主选择并为此调节自我行为的能力，即“阐述行为的理由并依此行动的能力及其运用”②。政策工具的选择是一种以公共理性为主导和优先取向的多元综合理性。这种选择并不排斥经济理性，也不拒绝社会理性。经济理性是追寻个人效用最大化的选择，社会理性是在社会构成和社会制度的框架之下寻求社会参与和社会共享的选择，而公共理性则是以政治正义为主导的维护和增进社会平等、自由和权利的选择③。政策工具的选择需…","contextPage":173},{"src":"cai-wang-3","pages":[174],"quote":"一个变量是国家能力，或者说是国家影响社会行为者的组织能力","context":"…化，因此使用有关工具的方式或力度应及时予以调整。2.政策工具选择的应用为有利于政策工具的选择和应用，霍利特和拉米什通过设置两个变量来构建政策工具选择与应用模型。一个变量是国家能力，或者说是国家影响社会行为者的组织能力；另一个变量是政策子系统的复杂程度，特别是政府在执行政策时面对的行为者的类型和数目①。他们所区分的政策工具的选择与应用模型如下所述：（1）国家能力强，政策子系统高度复杂。当政府面对的社会行为者的类型和数目很多而且彼此相互冲突时，政府很难辨别…","contextPage":174},{"src":"chen-2","pages":[201],"quote":"政府工具的选择还受到当时政治经济情境的约束","note":"工具选择的「情境约束」是蔡王四因素之外的一层，案例题里用来解释「为什么同一工具换个场景就不灵」。","context":"…政府工具本身不是政治中立的，除了诸多政治因素与政治上的动员将影响政府工具的初次选择外，选择特定工具进行政策干预也会引发不同的政治行动并带来不同的政治经济效应。①政府工具的选择还受到当时政治经济情境的约束。由于议程设定的选择性、法律、意识形态、面临的危机、预算、官僚体系抗拒变迁等各种限制，政府并不是可以不受限制地从“工具箱”中选择“最适当”的政府工具。同时，还必须考虑工具的标的群体的态度、行为、动机，及其对于既有政策的反应。②施奈德（A.S…","contextPage":201}],"moduleId":"m5","order":2},"l6-1":{"id":"l6-1","title":"从「管人」到「开发人」：人事管理与人力资源管理的分界","goal":"能说出传统人事管理与现代人力资源管理的四点区别，并按四个阶段复述人力资源管理理论的演进。","minutes":14,"tag":"第6章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「人事管理」和「人力资源管理」不是同一个东西换了块牌子。这两个词的分界，本身就是一道简答题。"},{"t":"p","h":"先看两种观念的对撞","text":"传统人事管理的核心目标是**防止管理层的权力滥用、保护员工利益、维护制度公正**，它把员工视为劳动力，强调标准化与刚性手段，主要靠行政命令。现代人力资源管理把员工视为组织的重要资源，强调灵活性与人性化，采取柔性的、参与式的管理。\n\n教材把这条转变浓缩成一句话：**传统人事制度强调的是控制，现代人力资源管理强调的是灵活性；传统关注程序统一，现代关注目标实现；管理制度所扮演的角色由保护者变成了激励者。**"},{"t":"cmp","h":"四点区别（简答骨架）","head":["维度","传统人事管理","现代人力资源管理"],"rows":[["对人的假设","员工是劳动力、是被管理对象、是成本","员工是组织的重要资源、是核心资本"],["管理职责","由人事部门单独承担，管人与管事脱节","各部门主管承担主要职责，管人与管事统一"],["部门角色","执行具体人事事务的办事机构","协调管理系统、提供决策预案的咨询中枢，可进入高层"],["方式手段","标准化、刚性，主要用行政命令","人性化、柔性、参与式民主管理，注重人文关怀"]]},{"t":"p","h":"四个阶段，一条主线","text":"**一、科学管理时代**（19 世纪末 20 世纪初，泰勒、法约尔、韦伯）：共同点是把人看成被动的、纯理性的，用「大棒加胡萝卜」控制；只重「物」的、「硬」的方面；迷信一种通用的最佳模式。局限是「经济人」假设、把人当机器附属物、只靠金钱刺激、忽视潜能开发。\n\n**二、行为主义时代**（20 世纪 20—40 年代）：从霍桑实验开始，梅奥提出人是「社会人」而不是「经济人」，生产效率取决于态度与士气，还有「非正式组织」。此后有马斯洛需要层次、赫茨伯格双因素、弗鲁姆期望价值、麦格雷戈 X-Y 理论、布莱克和穆顿管理方格。\n\n**三、现代管理时代**（二战后）：社会系统学派（巴纳德）、经验主义学派（德鲁克）、系统管理理论（卡斯特和罗森茨韦克）、权变管理理论（超 Y 理论、复杂人假设）。这一时期还出现了**人力资本理论**（舒尔茨、贝克尔），使人力资源管理有了实证解释力。\n\n**四、企业文化时代**（20 世纪 80 年代）：起因于对日本管理模式的研究，结论是日本企业成功的第一位因素不是规章制度或管理技术，而是「企业文化」。它把激励落到群体价值观上，用共同价值观念把外部强制转化为员工内在的自觉行为。"},{"t":"ask","q":"「人力资本理论」为什么在人力资源管理史上这么关键？","a":"因为它给「投资于人」提供了经济学理由。舒尔茨指出，单从自然资源、实物资本和劳动力角度无法解释经济增长的全部原因，必须把人力资本作为生产要素。这一下改变了管理的定位：培训与开发不是福利支出，而是投资；人也从「成本」变成了「资本」。答题时把这条和「从成本到资本」的说法连起来，比只写人名有力。"},{"t":"tip","text":"四个阶段不要按人名背。记「假设—方法—局限」三项，每段的变化就清楚了：经济人→社会人→复杂人→文化人，硬控制→士气→系统权变→共同价值观。"}],"concepts":[{"term":"人力资源管理","def":"把员工视为组织重要资源与核心资本，由各部门共同承担、以柔性与参与式方式进行的系统性人事管理。","points":["与传统人事管理的区别：假设、职责、角色、手段四方面","理论演进：科学管理、行为主义、现代管理、企业文化四阶段","关键转折：人力资本理论使「投资于人」具有经济依据"],"exam":"常以「人力资源管理变革的特点」「中西方人力资源管理差异」的简答形式出现。"},{"term":"人力资本理论","def":"舒尔茨、贝克尔等提出：经济增长不能只用自然资源、实物资本和劳动力解释，还必须考虑人力资本这一生产要素。","points":["宏观：促使各国把人力资源开发纳入国家发展规划","微观：涉及人力资本的吸引、选用、保值、增值与评价","意义：使人力资源管理建立在更坚实的理论基础之上"],"exam":"答「为什么现代人力资源管理强调开发」时的理论依据。"}],"exercises":[{"t":"choice","q":"按教材，传统人事制度与现代人力资源管理最根本的差别是：","opts":["管的人多人少不同","强调控制还是强调灵活性，关注程序统一还是关注目标实现","是否有专门的人事部门","是否使用计算机系统"],"a":1,"why":"教材的原话是「传统人事制度强调的是控制，现代人力资源管理强调的是灵活性」。其余是这一差别的表现，不是根本。"},{"t":"choice","q":"霍桑实验得出的核心判断是：","opts":["人是经济人，只受金钱刺激","人是社会人，生产效率很大程度取决于态度与士气，非正式组织有重要影响","人是复杂人，只能权变管理","人是文化人，由价值观决定行为"],"a":1,"why":"梅奥的人际关系学派是行为主义时代的起点。C 属权变理论，D 属企业文化时代，是更晚的阶段。"},{"t":"multi","q":"科学管理时代三位代表人物（泰勒、法约尔、韦伯）的共同点是：","opts":["都把人看成被动的、纯理性的，靠纪律规章与经济刺激控制","都把重点放在管理的「物」的、「硬」的方面","都认为存在适用于一切组织的通用最佳管理模式","都主张通过企业文化来激励员工"],"a":[0,1,2],"why":"D 是 20 世纪 80 年代企业文化理论的主张，比科学管理晚了半个多世纪。"},{"t":"judge","q":"现代人力资源管理强调各部门主管承担人力资源管理的主要职责，实现管人与管事的统一。","a":true,"why":"这正是教材列出的区别之一：传统人事管理由人事部门单独承担，造成管人与管事脱节；人力资源管理强调放射性与渗透性。"},{"t":"order","q":"把人力资源管理理论演进的四个阶段按时间顺序排列。","items":["科学管理时代：经济人假设，标准化与定额化","行为主义时代：社会人假设，士气与非正式组织","现代管理时代：复杂人假设，系统与权变","企业文化时代：共同价值观与自主管理"],"a":[0,1,2,3],"why":"四段对应「经济人—社会人—复杂人—文化人」的假设演进。答题时把假设写出来，比只写人名更像在讲理论。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「传统人事管理与现代人力资源管理的主要区别」（10 分）。","minutes":12,"points":["总述：两者的区别不止名称，而是对人的假设、职责分工、部门角色与管理手段的系统差别","区别一：员工被视为劳动力/成本，还是被视为组织的重要资源与核心资本","区别二：由人事部门单独承担、管人与管事脱节，还是各部门主管共同承担、管人与管事统一","区别三：部门角色是办事机构，还是协调系统、提供决策预案的咨询中枢","区别四：手段是标准化、刚性、行政命令，还是人性化、柔性、参与式","收束：提炼一句——从「控制」转向「激励与开发」"],"sample":"传统人事管理与现代人力资源管理存在系统差别。第一，对人的假设不同：传统人事管理把员工视为劳动力、被管理对象甚至成本；现代人力资源管理把员工视为组织的重要资源与核心资本，强调人具有增值潜力。第二，管理职责不同：传统人事管理主要由人事部门承担具体事务，容易造成管人与管事脱节；现代人力资源管理强调其放射性与渗透性，由各部门主管承担主要职责，实现管人与管事的统一。第三，部门角色不同：传统人事部门是执行具体事务的办事机构，现代人力资源部门则成长为协调管理系统、提供决策预案的咨询中枢，其负责人可进入高层。第四，方式手段不同：传统人事管理强调标准化、手段刚性，主要运用行政命令；现代人力资源管理强调人性化，采取柔性、参与式的民主管理，注重人文关怀。概括而言，传统人事制度强调控制、关注程序统一、把员工视为劳动力、扮演保护者角色；现代人力资源管理强调灵活性、关注目标实现、把员工视为资源、扮演激励者角色。","tip":"四点区别写成「A 还是 B」的对照句式最省时间，也最容易让阅卷数出四个点。最后一句「从控制转向激励与开发」是收束分。"},"evidence":[{"src":"cai-wang-3","pages":[212],"quote":"传统人事制度强调的是控制，现代人力资源管理强调的是灵活性","context":"…事制度的一个核心目标是防止管理层的权力滥用，保护员工的利益，维护制度的公正。现代人力资源管理者成了顾客，人事制度应该为他们服务，以便使管理者能更好地服务于大众。传统人事制度强调的是控制，现代人力资源管理强调的是灵活性；传统人事制度关注的是保证程序的统一，现代人力资源管理关注的则是目标的实现；传统人事制度把员工视为劳动力，现代人力资源管理把员工视为组织的重要资源；管理制度所扮演的角色也逐渐由保护者转变成了激励者。①徐晓丹．从传统人事管理到公共人力资源管理…","contextPage":212},{"src":"cai-wang-3","pages":[212],"quote":"传统人事制度把员工视为劳动力，现代人力资源管理把员工视为组织的重要资源","context":"…使管理者能更好地服务于大众。传统人事制度强调的是控制，现代人力资源管理强调的是灵活性；传统人事制度关注的是保证程序的统一，现代人力资源管理关注的则是目标的实现；传统人事制度把员工视为劳动力，现代人力资源管理把员工视为组织的重要资源；管理制度所扮演的角色也逐渐由保护者转变成了激励者。①徐晓丹．从传统人事管理到公共人力资源管理：转轨时期我国政府人事管理改革的一种思路．甘肃行政学院学报，1999（3）.②库珀，等．二十一世纪的公共行政：挑战与改革．北京：中国人民大学出版社…","contextPage":212},{"src":"cai-wang-3","pages":[214],"quote":"人是“社会人”而不是“经济人”","context":"…空间。6.1.2.2行为主义时代20世纪20—40年代是行为主义理论的时代。行为主义的早期为人际关系学派，是通过霍桑实验而形成的。其代表人物是梅奥，主要观点是：人是“社会人”而不是“经济人”，生产效率在很大程度上取决于人的工作态度或士气，“非正式组织”对职工的积极性有很大影响。人际关系理论奠定了行为科学理论的基础，此后产生了许多有代表性的行为主义理论，包括：第一，马斯洛的需要层次理论。该理论认为人的需要分为生理、安全、社交、尊…","contextPage":214},{"src":"cai-wang-3","pages":[215],"quote":"正是因为有了人力资本理论，才使人力资源管理建立在更加坚实的基础上","context":"…的创立和发展对实践领域的意义除了在宏观领域使许多国家把人力资源开发纳入国家经济社会发展规划中之外，在微观领域还涉及人力资本的吸引、选用、保值、增值和评价等方面。正是因为有了人力资本理论，才使人力资源管理建立在更加坚实的基础上，因而具有了强大的实证解释力。6.1.2.4企业文化时代企业文化是20世纪80年代出现的一种理论思潮，它起因于对日本管理模式的研究。进入20世纪70年代之后，美国在世界经济竞争中遇到了来自西欧、日本等的挑战，其中，日本对美国第一经济强国地位…","contextPage":215},{"src":"chen-2","pages":[251],"quote":"人事工作是组织管理的一项重要内容，它的好坏直接影响或决定组织目标的达成","note":"陈从这里转入「从人事管理到人力资源管理」，可作人事→人力资源这一节的开场句。","context":"…一次革命性转变。当前，人力资源的开发利用已扩展到各行各业，形成了一套与传统人事管理的理论及实践不同的人力资源管理的理论及实践。8.1.1从人事管理到人力资源管理人事工作是组织管理的一项重要内容，它的好坏直接影响或决定组织目标的达成、组织的活动效率和组织的发展。因为人是组织中的能动因素，组织的每项工作任务都要靠人来完成，组织的各项职能必须靠人来实施。在国外尤其是西方企业管理理论及实践发展的","contextPage":251}],"moduleId":"m6","order":1},"l6-2":{"id":"l6-2","title":"公务员制度：三个标准、三类范围与中西之别","goal":"能用三个标准判断一个人是不是公务员，说清中西方公务员制度的根本差别，并列出我国公务员管理的主要问题与改革方向。","minutes":16,"tag":"第6章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2023 年简答考的就是「公务员制度的涵义及中西方区别」。这道题不难，但「区别」那半段，很多人只会写「政治中立」，写不全。"},{"t":"p","h":"公务员的三个标准","text":"《公务员法》的界定是：**公务员是指依法履行公职、纳入国家行政编制、由国家财政负担工资福利的工作人员。** 三个条件必须**同时**满足——这是判断题的高发点：公立学校有编制的老师、公立医院有编制的医生，都由财政负担工资，但没纳入行政编制，不是公务员。"},{"t":"p","h":"范围三类，中西方不同","text":"世界范围内公务员的范围大小不一：**小范围**只指中央政府中非选举产生、非政治任命的常任官员（事务官），英国及英联邦属此类；**中等范围**把政务官与事务官都称公务员，但公务员法规只适用于事务官，美国、德国属此类；**大范围**还包括国会工作人员、审判官、检察官、国有企业和事业单位人员，日本、法国属此类。\n\n我国公务员的范围包括：中国共产党机关、人大机关、行政机关、政协机关、审判机关、检察机关和民主党派中的工作人员。"},{"t":"cmp","h":"中西方公务员制度的关键差别","head":["比较点","西方国家","我国"],"rows":[["政治立场","强调政治中立，与党派脱钩，晋升不受政党干预","不搞政治中立，坚持党的领导"],["干部管理","由专门机构按文官制度管理","坚持党管干部原则，按党的组织人事路线制定"],["分类","明确区分政务官与事务官两个体系","有领导职务与非领导职务之分，但无政务官与事务官之分"],["产生方式","事务官考试录用、常任","政府组成人员由人大常委会选举或决定任免"]]},{"t":"p","h":"我国公务员管理的六个问题","text":"**一、没有进行整体性的人力资源管理体系构建**，「头痛医头、脚痛医脚」，管理支离破碎。\n**二、基础工作薄弱**：缺乏系统规范的职位分析，人员测评手段单一、信度效度低，考核定性化表面化，薪酬存在平均主义。\n**三、没有形成以绩效为本的理念**：重过程轻结果，不求有功但求无过，官僚主义、办事拖拉。\n**四、重使用、轻开发**的传统用人观念仍在。\n**五、人事管理权力过于集中**，管人与管事相脱节，用人单位缺乏调节和激励手段。\n**六、业务部门主管缺乏人力资源管理技能。**"},{"t":"p","h":"改革方向","text":"教材把改革的第一条放在最前面：**强化党的领导和党管干部原则**。这是与西方文官制度最根本的分野，也是答题时必须先摆出来的立场。\n\n第二条是**把先进管理理念引入公共部门，变传统人事管理为现代人力资源管理**：过去把人看作被管理对象、是成本；现在要把人视为具有无限增值潜力、最重要的资源，从「控制」转向「开发」。"},{"t":"ask","q":"既然我国不搞「政治中立」，为什么还强调公务员要「依法履职」？","a":"两者不冲突，是不同层次的要求。政治中立解决的是「听哪个党」的问题，我国的选择是坚持党的领导；依法履职解决的是「按什么规则办事」的问题。公务员既要执行党的路线方针，又必须在法律授权范围内、按法定程序行使权力。答中西方比较题时，把「政治立场」和「法律约束」分成两层写，就不会把两者搅在一起。"},{"t":"tip","text":"「公务员制度的涵义及中西方区别」这种题，先写定义与三个标准（3 分），再写三种范围（2 分），再写四点区别（4 分），最后一句改革方向（1 分）。结构清楚比写得多更重要。"}],"concepts":[{"term":"公务员","def":"依法履行公职、纳入国家行政编制、由国家财政负担工资福利的工作人员。","points":["三个标准必须同时满足","范围：党的机关、人大、行政、政协、审判、检察机关和民主党派中的工作人员","我国有领导职务与非领导职务之分，无政务官与事务官之分"],"exam":"判断题最爱用「财政供养就是公务员」设坑，注意行政编制这一条。"},{"term":"公务员制度","def":"对公务员进行管理所依据的法律、法规和规章制度的总称，包括考试、录用、考核、奖惩、待遇、培训、晋升、调动、解职、退休及分类管理等制度。","points":["实质是制度化、法律化的公务员管理","三个理解层面：历史范畴、逐步规范化的法律制度、依法管理的依据与规则","与西方文官制度的根本差别：不搞政治中立、坚持党管干部"],"exam":"2023 年简答原题考的就是它的涵义与中西区别。"}],"exercises":[{"t":"multi","q":"按《公务员法》，判断一个人是否属于公务员需要同时满足：","opts":["依法履行公职","纳入国家行政编制","由国家财政负担工资福利","在政府机关大院内办公"],"a":[0,1,2],"why":"三个标准缺一不可。公立学校有编制的教师由财政负担工资，但未纳入行政编制，因此不是公务员。"},{"t":"choice","q":"与西方国家公务员制度相比，我国公务员制度不搞：","opts":["分类管理","政治中立","考试录用","考核晋升"],"a":1,"why":"教材的表述是「不搞政治中立，坚持党管干部的原则，没有政务官与事务官之分」。分类管理、考试录用这些做法我国同样有。"},{"t":"judge","q":"我国公务员区分领导职务与非领导职务，这与西方的政务官、事务官分类是同一回事。","a":false,"why":"教材明确说：我国有领导职务与非领导职务的分类，但没有政务官与事务官的区分。两者不能对应替换。"},{"t":"multi","q":"教材指出的我国公务员管理问题包括：","opts":["没有进行整体性的人力资源管理体系构建","缺乏系统规范的职位分析，考核定性化、表面化","重使用、轻开发，人事管理权力过于集中","公务员队伍规模总体偏小"],"a":[0,1,2],"why":"D 不在教材列举的问题里。教材列的是体系、基础工作、绩效理念、重使用轻开发、权力集中、主管缺技能六条。"},{"t":"order","q":"把「为什么要建立公务员制度」的推理排好顺序。","items":["恩赐官职与政党分赃造成任人唯亲、效率低下","工业革命后政府职能扩大，旧制度不匹配","以公务员法颁布为标志建立考试录用等制度","实现公共部门人力资源管理的科学化与法制化"],"a":[0,1,2,3],"why":"这条链来自教材对「公务员制度是历史范畴」的论述，写进答案能让「涵义」部分有历史纵深。"}],"write":{"type":"简答题","prompt":"用 14 分钟写「公务员制度的涵义及中西方公务员制度的区别」（10 分）。","minutes":14,"points":["定义：对公务员进行管理所依据的法律、法规和规章制度的总称，实质是制度化、法律化的管理","列出公务员的三个标准（依法履行公职、纳入行政编制、财政负担工资福利）","说明三种范围（英、美、日法的差别）或我国公务员的范围","区别一：西方强调政治中立、与党派脱钩；我国不搞政治中立","区别二：我国坚持党管干部原则；西方由专门机构按文官制度管理","区别三：西方有政务官与事务官之分，我国只有领导职务与非领导职务之分","收束：改革方向是强化党的领导与党管干部，并引入现代人力资源管理理念"],"sample":"公务员制度是对公务员进行管理所依据的法律、法规和规章制度的总称，具体包括考试、录用、考核、奖惩、待遇、培训、晋升、调动、解职、退休以及分类管理等制度，其实质是制度化、法律化的公务员管理。按《公务员法》，公务员是指依法履行公职、纳入国家行政编制、由国家财政负担工资福利的工作人员，三个标准须同时满足。世界各国公务员范围宽窄不一：英国等国仅指中央政府中非选举产生、非政治任命的常任事务官；美国、德国把政务官与事务官都称公务员，但法规只适用于事务官；日本、法国则包括国会工作人员、法官、检察官及国有企业与事业单位人员。与西方国家相比，我国公务员制度有三点根本区别：一是不搞政治中立，公务员制度坚持党的领导；二是坚持党管干部原则，按党的组织人事路线方针政策制定；三是我国有领导职务与非领导职务的分类，但没有政务官与事务官之分。因此，我国公务员制度改革的首要原则是加强党的领导与党管干部，同时引入现代人力资源管理理念。","tip":"「区别」只写政治中立，最多拿一半。把「党管干部」和「没有政务官事务官之分」补上，才是完整的四点。"},"evidence":[{"src":"cai-wang-3","pages":[228],"quote":"我国公务员制度不搞政治中立，坚持党管干部的原则，没有政务官与事务官之分","context":"…《党政领导干部选拔任用工作条例》和《公务员职务和职级并行规定》，标志着我国公务员制度顺应新时代发展潮流，进入了更加科学、成熟的阶段。与西方国家的公务员制度相比，我国公务员制度不搞政治中立，坚持党管干部的原则，没有政务官与事务官之分。6.3.1.1公务员的内涵公务员是公共管理的重要主体。公务员是由英文“civilservant”翻译而来。“公务员”是这一英文概念的意译。从世界范围来看，公务员的概念和范围大小不一。从已有的文献资料中，可以分为三类：第一类是小范围的，公务…","contextPage":228},{"src":"cai-wang-3","pages":[228],"quote":"公务员是指依法履行公职、纳入国家行政编制、由国家财政负担工资福利的工作人员","context":"…事业建设的中坚力量，是人民的公仆。2018年12月29日第十三届全国人民代表大会常务委员会第七次会议表决通过的《中华人民共和国公务员法（修订草案）》第二条规定，公务员是指依法履行公职、纳入国家行政编制、由国家财政负担工资福利的工作人员。根据这一概念的界定，我们可以看出，一个人员是否属于公务员必须同时符合以下三个标准：（1）依法履行公职。公务员是依法履行公职、从事公务活动的人员，他们既不是为自己工作，也不是为私人企业或组织工作。（2）纳入国家行政编制。依法履行公职是公务员…","contextPage":228},{"src":"cai-wang-3","pages":[229],"quote":"公务员制度是对公务员进行管理所依据的法律、法规和规章制度的总称","context":"…织部门负责考察，依法由各级人民代表大会及其常务委员会选举或决定任免。西方国家公务员制度（文官制度）对公务员的管理强调“与党派脱钩”，公务员职务晋升不受政党干预。公务员制度是对公务员进行管理所依据的法律、法规和规章制度的总称，具体包括公务员考试、录用、考核、奖惩、待遇、培训、晋升、调动、解职、退休以及分类管理等制度，其实质是制度化、法律化的公务员管理。正确理解公务员制度需要把握以下三个方面的内容：第一，公务员制度是一个历史范畴。随着人类社会的快速发展，特别是西…","contextPage":229},{"src":"cai-wang-3","pages":[236],"quote":"中国公务员制度改革的首要原则是加强党的领导和党管干部原则要求","context":"…会、历史文化和政治制度等内外环境和实践经验基础上，为适应中国特色社会主义制度和市场经济发展而构建和完善的，是“中国式治理”的重要体现。与西方国家公务员制度相比，中国公务员制度改革的首要原则是加强党的领导和党管干部原则要求。首先，公务员制度改革与完善必须坚持中国共产党的领导。党的十九届四中全会强调，党政军民学，东西南北中，党是领导一切的。中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领导力量。中国共…","contextPage":236},{"src":"chen-2","pages":[264],"quote":"第二，基本原则不同。西方文官制度强调“政治中立”，并将对公务员政治行为的限制列于一系列行为规则之首","note":"中西公务员制度比较，陈按「性质—原则—管理方式」分点，比蔡王的段落叙述更好背。","context":"新。而我国公务员制度的建立在更大程度上是我国政府通过理性思考，为节约成本而做出的选择、学习与建设，并自上而下推行的结果。①第二，基本原则不同。西方文官制度强调“政治中立”，并将对公务员政治行为的限制列于一系列行为规则之首；而我国公务员制度规定，公务员必须坚持四项基本原则，在政治上同党中央保持一致，积极参与国家的政治生活。公务员中的党员要起模范带头作用。第三，管理方式不同。西方文官制度是独立于党派之外，由专门机构进行管理；而我国公务员制度的各项具体管理制度都…","contextPage":264}],"moduleId":"m6","order":2},"l7-1":{"id":"l7-1","title":"公共预算：四个维度、五个功能、三个要素","goal":"能用四个维度解释公共预算的政治性，说出希克的三个职能加鲁宾的两个职能，并指出预算的三个要素与对应参与者。","minutes":16,"tag":"第7章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「公共预算」2019、2022、2023 都出过名解。它看起来像财务问题，其实教材第一句就把它拉回政治：预算是「谁从政府那里得到好处」的答案。"},{"t":"p","h":"一句定义，两个关键","text":"威尔达夫斯基一派的定义是：**公共预算是为实现一定的公共政策目标而进行的财政资源分配活动。** 这个定义点了两个关键：**第一，分配有政策导向**——钱是围绕政策目标分的；**第二，它是一系列分配决策过程**，不是一张纸。\n\n从操作角度看，公共预算是经法定程序批准的政府年度财政收支计划，以及政府的资金筹集、使用计划和相关制度。"},{"t":"p","h":"海德的四个维度","text":"海德提出从四个维度理解公共预算：\n\n**政治维度**——公共资源稀缺，分配必须考虑不同利益相关者的需求，最终结果反映政策优先性，是各方讨价还价的结果。\n**管理维度**——有效分配不等于有效使用，所以要用特定管理方法和技术保证公共服务与项目更有效。\n**经济维度**——预算承担刺激增长、稳定经济、促进就业、抑制通胀等宏观经济职能。\n**财务管理维度**——收支数量庞大繁杂，必须通过微观财务管理工具约束参与者行为。\n\n这四个维度既概括了公共预算的内涵，也说明了它为什么不同于企业或私人预算。"},{"t":"p","h":"五个功能：三个老职能 + 两个新职能","text":"希克把政府预算的职能划为三种：**计划**（确定目标、测算资源、决定怎样获取和使用，回答「做什么」）、**管理**（确保有效获得和利用资源以实现目标，回答「怎么做」）、**控制**（对具体人财物进行控制，通常建立在对支出的详细分类之上，线性预算就是为满足这个目的产生的，也是现代预算的编制基础）。\n\n鲁宾认为现代公共预算还必须具备另外两个职能：**优先性排序**（资源稀缺，必须对预算申请排序，它反映决策者的政策偏好）和**预算问责**（对上负责、对公众负责、对结果负责、保证公民的直接影响或控制）。\n\n注意：五个功能在所有预算系统中都存在，但地位不同。计划-项目预算强调计划功能，结果导向的预算强调管理与问责功能。"},{"t":"p","h":"三个要素与三类参与者","text":"希克提出公共预算有三个要素：**资源申请、资源分配、资源保护**；与之对应，参与者可分为**资源申请者、资源分配者、资源保护者**。任何国家的预算都必有这三个要素，「所谓预算制度就是围绕这三个基本要素构建的一系列规则和程序」。\n\n实践中三类角色常重叠：支出部门提出申请，同时也要考虑资源有限与持续发展，所以它也是资源保护者；财政部门主要是分配者与保护者，但当项目由它提出时又成了申请者；议会（或最高权力机关）是资源分配的最终决策者。"},{"t":"ask","q":"既然预算是按政策目标分配资源，为什么还说它「是政治的」？","a":"因为政策目标从来不是给定的。资源稀缺，先给谁、后给谁、给多少，本身就是一次利益排序；排序结果又反过来塑造下一年的政策重点。教材借克利夫兰的话点破了这一点：预算是决策的艺术。答论述时写「预算不是技术表格，而是政策优先性的显性化」，比罗列四个维度更有分量。"},{"t":"tip","text":"这道题的分数点在「数量」：四个维度、五个功能、三个要素。答题时先报数再展开，阅卷一眼就能确认你记全了。"}],"concepts":[{"term":"公共预算","def":"经法定程序批准的政府年度财政收支计划及资金筹集、使用计划与相关制度；本质是为实现公共政策目标而进行的财政资源分配活动。","points":["四个维度：政治、管理、经济、财务管理","五个功能：计划、管理、控制、优先性排序、预算问责","三个要素：资源申请、资源分配、资源保护"],"exam":"名解写「定义 + 四维度（或三要素）+ 一句政治性」，即可覆盖 5 分。"},{"term":"预算问责","def":"鲁宾提出的现代公共预算职能，包括对上负责、对公众负责、对结果负责和保证公民的直接影响或控制四方面。","points":["对上负责：符合上级政府相关政策法规","对公众负责：及时全面公开","对结果负责：主要是预算官员","公民参与：保证公民对分配过程与结果的直接影响"],"exam":"答「为什么要公开预算」「绩效预算的意义」时的理论落点。"}],"exercises":[{"t":"choice","q":"按教材，公共预算定义中的两个关键是：","opts":["收入与支出","预算分配的公共政策导向，以及它是一系列资源分配决策过程","合法性与公开性","中央与地方"],"a":1,"why":"威尔达夫斯基一派

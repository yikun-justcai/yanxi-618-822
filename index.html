称为第三方影响（third-partyeffects）或溢出效应。因为它通常会增加第三方的收益或成本。比如，廉租房等公共住宅项目不仅惠及低收入阶层，而且会给建筑企…","contextPage":278,"lessonId":"p10-1"},{"src":"ning-3","pages":[350],"quote":"政策信息不公开，使外部评估困难重重","context":"…策评估的因素有许多，人们往往以影响幅度大小、影响时间长短、影响效力高低，作为划分重要因素和次要因素的主要标准。影响公共政策评估的重要因素主要有以下几方面：（一）政策信息不公开，使外部评估困难重重政策评估的基础是掌握相关的政策信息和资料。准确的政策信息资源是高质量评估工作的前提。但在实际生活中，“准确而相关的统计数据及其他信息的缺少可能会妨碍政策评价者。”①政府往往以保密为由拒绝发布应该发布的政策信息和相关资料。而对于评估者来说，由…","contextPage":350,"lessonId":"p10-2"},{"src":"ning-3","pages":[275],"quote":"政策目标一般主要具有如下三大特征","context":"…规划问题。政策目标（policygoals）就是有关公共组织特别是政府为了解决有关政策问题而采取的行动所要达到的目的、指标标的和效果。根据这一定义，我们不难看出政策目标一般主要具有如下三大特征：（1）问题的针对性。任何政策目标都不是凭空产生的，几乎都建立在对一定的社会问题的关注、关怀和认识之上。当然，这并不是说政策目标仅仅针对过去或现实已经存在的重大问题，实际上许多政策目标还要关心未来可能出现的重大问题。（2）未来的预期性。政策…","contextPage":275,"lessonId":"p8-1"},{"src":"ning-3","pages":[91],"quote":"非概率抽样又称非随机抽样","context":"…上述研究在已确定的5类期刊中，又按照期刊的学术水平和地域分布状况采用判断抽样的方法选取若干种期刊，在样本选取方面有效地保证了研究结果的可靠性。二、非概率抽样调查非概率抽样又称非随机抽样，是指抽样时不遵循随机原则，而是按照政策研究人员的主观判断或仅仅按照方便的原则抽选样本。在与政策过程有关的调查中，采用非概率抽样通常是出于下述原因：受客观条件限制，无法进行严格的概率抽样；为了快速获得调查结果；在调查对象不确定或无法确定时，…","contextPage":91,"lessonId":"p3-1"},{"src":"ning-3","pages":[383],"quote":"政策调整是公共政策变动当中最常见的一种形式","context":"…，并努力从中寻找适合自己的经验，规避可能的教训。因此，不同层次、不同领域政策创新活动产生的示范效应，将在一定程度上成为政策创新的重要动力。第二节政策的调整与接续政策调整是公共政策变动当中最常见的一种形式，西方的公共政策学者一般很少把政策调整作为一个专门的论题来进行研究，而只是把它当作渐进决策的一个结果或者是政策部分终结的一种表现。这或许是由于在西方民主体制下，轮番执政的各党派为了彰显自己政纲的特色，总是抨击对手所采用的政策措施，因而更关注…","contextPage":383,"lessonId":"p11-1"}]},"p11":{"question":"政策什么时候该稳、该调、该结束？","position":"在“评估结果并反馈调整”层，评估之后要判断变动方式。","prerequisites":["p10-2"],"before":"政策失效了，就应该立刻废止吗？","branches":[{"title":"稳定、调整、接续与创新","question":"四类变化按什么区分？","lessons":["p11-1"]},{"title":"政策终结","question":"五种方式、四类对象与六类障碍怎样对应？","lessons":["p11-2"]}],"relations":[{"label":"评估与调整","text":"调整与否要看评估结果，不能凭领导偏好。","lessons":["p11-1","p10-1"]},{"label":"终结与议程","text":"终结旧政策会释放议程空间，也可能引发反终结联盟。","lessons":["p11-2","p7-2"]},{"label":"终结与执行","text":"执行中的偏差与失败，是终结判断的重要证据。","lessons":["p11-2","p9-3"]}],"hint":"按“稳—调—接—终”四类变化组织，再写终结的对象、方式与障碍。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，区分稳定、调整、接续与创新，并各举一个例子。","reference":"稳定是维持；调整是在既有框架内改目标、工具或对象；接续强调新旧衔接；创新是采用新理念、工具或制度。例子要说明变化幅度与目的。","check":"我区分了四类变化并举例。"},{"id":"relation","label":"解释一条知识联系","prompt":"说明政策终结的五种方式，并指出对象与方式为什么不是一回事。","reference":"废止、替代、分解、合并、缩减；对象是功能、组织、政策本身、工具。方式讲怎么结束，对象讲结束什么，不能混答。","check":"我写出了五种方式与四类对象。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老某项补贴效果不佳，判断应调整还是终结。","reference":"先看问题是否仍存在、目标是否仍有价值；若方向对但工具错，可调整或替代；若问题消失或政策造成更大损害，才考虑终结。还要评估反终结联盟与过渡成本。","check":"我按问题、目标与成本判断，而不是直接废止。"}],"evidenceLessons":["p11-1","p11-2","p10-1","p7-2","p9-3"],"bridge":{"subject":"618","module":"m13","text":"换到改革：调整、接续与终结都是改革的实现方式。"},"evidence":[{"src":"ning-3","pages":[350],"quote":"政策信息不公开，使外部评估困难重重","context":"…策评估的因素有许多，人们往往以影响幅度大小、影响时间长短、影响效力高低，作为划分重要因素和次要因素的主要标准。影响公共政策评估的重要因素主要有以下几方面：（一）政策信息不公开，使外部评估困难重重政策评估的基础是掌握相关的政策信息和资料。准确的政策信息资源是高质量评估工作的前提。但在实际生活中，“准确而相关的统计数据及其他信息的缺少可能会妨碍政策评价者。”①政府往往以保密为由拒绝发布应该发布的政策信息和相关资料。而对于评估者来说，由…","contextPage":350,"lessonId":"p10-2"},{"src":"ning-3","pages":[383],"quote":"政策调整是公共政策变动当中最常见的一种形式","context":"…，并努力从中寻找适合自己的经验，规避可能的教训。因此，不同层次、不同领域政策创新活动产生的示范效应，将在一定程度上成为政策创新的重要动力。第二节政策的调整与接续政策调整是公共政策变动当中最常见的一种形式，西方的公共政策学者一般很少把政策调整作为一个专门的论题来进行研究，而只是把它当作渐进决策的一个结果或者是政策部分终结的一种表现。这或许是由于在西方民主体制下，轮番执政的各党派为了彰显自己政纲的特色，总是抨击对手所采用的政策措施，因而更关注…","contextPage":383,"lessonId":"p11-1"},{"src":"ning-3","pages":[393],"quote":"一般说来，政策终结的对象有四种类型","context":"…益者、政策制定者和政策执行机构的负责人，更是与之有着切身的利害关系。如果处理不当就会阻碍政策的终结。因此，为了顺利实现政策的终结，就必须首先明确政策终结的对象。一般说来，政策终结的对象有四种类型。1.功能终结功能是政府为了满足民众的需要而提供的能够产生一定作用的服务，它代表着政府活动的基本方向，政策的效果就是通过具体的功能来体现的。所谓功能的终结，就是终止由政策执行而带来的某种或某些服务。在政策终结的所有对象中，以功能的终结最难，…","contextPage":393,"lessonId":"p11-2"},{"src":"xie-intro-5","pages":[278],"quote":"对目标群体以外的群体产生的影响","context":"…的过量生产；某一福利计划确实改变了受益群体的收入状况，却削弱了他们就业的主动性；廉租房计划可以有效改善贫困人员的居住状况，但可能会产生由贫富隔离引发的问题。2.对目标群体以外的群体产生的影响一项政策不仅会对目标群体产生影响，而且还会对一些非目标群体产生影响。这种影响被称为第三方影响（third-partyeffects）或溢出效应。因为它通常会增加第三方的收益或成本。比如，廉租房等公共住宅项目不仅惠及低收入阶层，而且会给建筑企…","contextPage":278,"lessonId":"p10-1"},{"src":"ning-3","pages":[265],"quote":"系统议程（system agenda）或称公众议程","context":"…织的高度重视并被正式纳入其政策讨论和被确定为应予以解决的政策问题的过程。在现代民主国家中，存在多种不同的议程，一般将议程通常分为如下两大类。^{③}1.系统议程系统议程（systemagenda）或称公众议程，它指的是由政治共同体的成员共同认为值得公众关注并且处于政府管辖范围之内的所有问题构成，政治系统讨论和认定有关公共问题的过程。由于政治系统本身有层级和区域以及行业等区分，因此系统议程就既可以是一定层级的，如国家、省、县、乡等，也可以是一定区…","contextPage":265,"lessonId":"p7-2"},{"src":"ning-3","pages":[330],"quote":"象征式政策执行","context":"…示了政策执行偏差的一种表现形式，但是在一定程度上表明了政策执行偏差的共同原因，即政策执行者有着不同于政策制定者的特殊动机。政策执行偏差有如下一些表现形式：（1）象征式政策执行，即在执行公共政策的过程中，只重视表面文章和形象包装，而忽视了深层问题的解决。政策执行成为一面到处挥舞的旗帜，政策目标则没有落到实处。（2）附加式政策执行，即在执行公共政策的过程中，人为地附加了与政策目标背离的其他内容，使政策执行超出了政策…","contextPage":330,"lessonId":"p9-3"}]},"p12":{"question":"怎样把前面所有概念用在同一个案例里？","position":"在“综合形成分析建议”层，把问题、目标、方案、执行与评估串成一条论证。","prerequisites":["p8-2","p10-2"],"before":"案例题是复述材料，还是用理论解释材料？","branches":[{"title":"六步分析框架","question":"帕顿与沙维奇的六步怎样形成闭环？","lessons":["p12-1"]}],"relations":[{"label":"框架与问题认定","text":"六步从问题开始，问题界定错了后面都错。","lessons":["p12-1","p7-1"]},{"label":"框架与评估","text":"标准与评估贯穿方案比较和事后反馈。","lessons":["p12-1","p10-1"]},{"label":"框架与建议","text":"建议要落到执行条件与反馈机制，不能只写口号。","lessons":["p12-1","p11-1"]}],"hint":"按“问题—标准—方案—比较—建议—反馈”六步写，每一步都指回材料。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，写出六步框架，并说明哪一步可能回到前面。","reference":"认定及细化问题、建立评估标准、确认备选政策、评估备选政策、展示和区分备选政策、监督和评估实施；发现新问题时可回到问题界定或标准。","check":"我写出了六步与反馈关系。"},{"id":"relation","label":"解释一条知识联系","prompt":"说明“问题—标准—方案”的顺序为什么不能颠倒。","reference":"问题是分析对象，标准是比較依据，方案是候选答案；先定方案会锁定手段，先定标准又可能脱离问题。三者需要迭代，但逻辑起点是问题。","check":"我说明了顺序与迭代关系。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老案例：用六步写出一页建议，至少包含两个方案与一条反馈机制。","reference":"先界定使用率低的对象与障碍，再定可及性、效果、公平、成本标准；比较延长开放、上门服务、机构合作等方案；说明责任、试点与评估指标。材料没给的数据要列为待核实。","check":"我写出了问题、标准、两个方案与反馈。"}],"evidenceLessons":["p12-1","p7-1","p10-1","p11-1"],"bridge":{"subject":"618","module":"m13","text":"换到改革：分析建议最终要面对组织与制度条件。"},"evidence":[{"src":"ning-3","pages":[280],"quote":"政策规划","context":"些重要问题，如政策规划与政策设计的概念界定、政策规划的主体与原则、政策学习与移植等。一、政策规划与政策设计的区别与联系（一）政策规划的含义及其特点政策规划（policyplan），也称政策构建（policyformulation）。有的学者认为，它是“发展一套处…","contextPage":280,"lessonId":"p8-2"},{"src":"ning-3","pages":[350],"quote":"政策信息不公开，使外部评估困难重重","context":"…策评估的因素有许多，人们往往以影响幅度大小、影响时间长短、影响效力高低，作为划分重要因素和次要因素的主要标准。影响公共政策评估的重要因素主要有以下几方面：（一）政策信息不公开，使外部评估困难重重政策评估的基础是掌握相关的政策信息和资料。准确的政策信息资源是高质量评估工作的前提。但在实际生活中，“准确而相关的统计数据及其他信息的缺少可能会妨碍政策评价者。”①政府往往以保密为由拒绝发布应该发布的政策信息和相关资料。而对于评估者来说，由…","contextPage":350,"lessonId":"p10-2"},{"src":"ning-3","pages":[410],"quote":"认定和不断地重新界定问题是非常重要的工作","context":"…为具体的组成部分。这些分析步骤构成了一个分析模型，见图12-2，现在简单介绍政策分析的基本过程。①图12-2帕顿和沙维奇的政策分析基本过程（1）认定和细化问题：认定和不断地重新界定问题是非常重要的工作。政策分析者通过这个过程要达到有意义地陈述政策问题、集中于中心问题和关键要素的目的。（2）建立评估标准：为了在备选方案之间进行比较、衡量和选择，必须建立评估标准。基本的评估标准包括成本、效益、效用、效率、平等以及政治可行性等。（3）确认备选…","contextPage":410,"lessonId":"p12-1"},{"src":"ning-3","pages":[250],"quote":"因而通过各种方式将其缩小差距的要求公之于众","context":"…把社会问题与公共问题看作在外延和内涵上相同的概念。而所谓公共问题，是指一定数量的社会成员感知其期望的目标、价值或景况，与现实获得的价值、利益或景况存在显著差距，因而通过各种方式将其缩小差距的要求公之于众，以争取社会同情与支持，或谋求引起政府关注和予以解决的一种情境。对于政策问题的含义，学术界也有不同的看法。美国学者安德森认为，从政策意图的角度来看，政策问题可以被定义为引起社会上某一部分人的需要或不满足的某种条件或环境，并为此寻求援助和补偿…","contextPage":250,"lessonId":"p7-1"},{"src":"xie-intro-5","pages":[278],"quote":"对目标群体以外的群体产生的影响","context":"…的过量生产；某一福利计划确实改变了受益群体的收入状况，却削弱了他们就业的主动性；廉租房计划可以有效改善贫困人员的居住状况，但可能会产生由贫富隔离引发的问题。2.对目标群体以外的群体产生的影响一项政策不仅会对目标群体产生影响，而且还会对一些非目标群体产生影响。这种影响被称为第三方影响（third-partyeffects）或溢出效应。因为它通常会增加第三方的收益或成本。比如，廉租房等公共住宅项目不仅惠及低收入阶层，而且会给建筑企…","contextPage":278,"lessonId":"p10-1"},{"src":"ning-3","pages":[383],"quote":"政策调整是公共政策变动当中最常见的一种形式","context":"…，并努力从中寻找适合自己的经验，规避可能的教训。因此，不同层次、不同领域政策创新活动产生的示范效应，将在一定程度上成为政策创新的重要动力。第二节政策的调整与接续政策调整是公共政策变动当中最常见的一种形式，西方的公共政策学者一般很少把政策调整作为一个专门的论题来进行研究，而只是把它当作渐进决策的一个结果或者是政策部分终结的一种表现。这或许是由于在西方民主体制下，轮番执政的各党派为了彰显自己政纲的特色，总是抨击对手所采用的政策措施，因而更关注…","contextPage":383,"lessonId":"p11-1"}]}},"case":{"title":"社区养老服务改善","text":"教学虚构案例：以下人物、数字和情节均为练习编写，不对应任何真实社区，引用时请保留“虚构”说明。\n\n【背景】河湾社区有常住人口约 1.2 万人，60 岁以上 2600 人，80 岁以上 420 人，独居老人约 310 人；社区估计失能、半失能老人约 90 人，但没有做过全员评估。社区养老服务站 2021 年建成，180 平方米，由街道委托“安和”社会工作服务中心运营，提供午餐、日间照料、健康监测和活动。站内厨房只能加热，午餐由 8 公里外的中央厨房配送；每天实际到站约 40 人，午餐约 30 份，而站点设计容量为 60 人。\n\n【参与方】街道负责场地、经费与监管；安和中心有 6 名工作人员（1 名负责人、2 名护理员、1 名厨师、1 名社工、1 名行政），另有 20 名注册志愿者，但常年活跃的只有 8 人；社区卫生服务中心掌握慢病档案，每月来测一次血压；物业提供场地和门禁，但对送餐上楼有顾虑；老人和家属既有依赖也有抱怨；区民政局提供运营补贴和星级评定。\n\n【资源与约束】街道年度运营经费 45 万元：人员 28 万、餐费补贴 8 万、活动 5 万、设备维护 4 万。午餐 12 元，80 岁以上补贴 2 元，90 岁以上免费；服务时间为工作日 9:00—17:00，周末和节假日不开。服务覆盖 3 个小区，最远 1.8 公里，其中 6 栋老楼没有电梯。\n\n【近期情况】老人反映菜偏咸、排队久、活动单一；有老人希望增加助浴、陪诊和夜间探访，但机构没有相应资质和人手；家属担心老人往返安全和责任划分。去年冬天曾因配送延误，一位独居老人低血糖被邻居送医。区里今年要求街道把站点使用率提高 20%，并拨了 10 万元适老化改造专项；街道想请第三方做评估，但还没定标准。周边有 2 家社会餐饮和 1 家养老驿站，愿意合作但尚未谈具体条件。\n\n【待核实】社区没有做过全社区需求普查，不清楚未使用者的具体原因；没有失能等级台账；没有服务对象健康改善的基线数据；也不掌握老人支付能力和家属照护安排。"}},"sources":{"ning-3":{"short":"宁","title":"宁骚《公共政策学》第3版","engine":"MinerU"},"xie-intro-5":{"short":"谢","title":"谢明《公共政策导论》第5版","engine":"MinerU"}},"totalOpen":29},"exams":[{"id":"exam-2a09bb7c7eef","year":2026,"type":"名词解释","topic":"政策过程","question":"集体行动困境","outline":"定义：共同利益需要合作，但个体有搭便车等激励，因而难以自发达成合作。\n机制：收益与成本分担不一致、协调和监督成本高。\n治理线索：规则、激励、信息公开与可信承诺。","answer":"集体行动困境是指成员都希望获得共同收益，却因个人付出成本而倾向搭便车，结果使群体难以形成合作，甚至共同利益受损。例如共享资源的使用者若都追求当期最大收益，资源可能被过度消耗。困境的根源在于收益和成本分配不对称、相互信任不足以及违约难以监测。解决不能只依赖道德号召，还需明确规则与产权或使用权、提供协商机制和可信承诺、实施相互监督与适当激励，使合作对成员可预期、可持续。","basis":"宁骚《公共政策学》第3版，集体行动与制度规则（OCR第80—82页）","source":"2026年真题.pdf · 第3页"},{"id":"exam-7c79aaa971db","year":2026,"type":"简答题","topic":"政策工具","question":"影响政策工具选择的因素","outline":"先说明政策工具是实现政策目标的手段。\n从政策目标和问题性质、目标群体、政府能力与资源、政治和制度环境、成本及公平影响、执行可行性几个维度作答。\n末尾强调组合使用与实施后的调整。","answer":"政策工具要与问题性质相匹配：外部性强、危害紧迫时需较明确的规制；信息不足时可用信息公开和劝导；能通过价格调整行为时可考虑税费、补贴等经济手段。选择还受政策目标与价值排序、目标群体特征、政府财政和执行能力、法律权限、政治支持以及工具成本和副作用影响。单一工具常难兼顾效率与公平，应比较不同方案的可执行性与风险，必要时把规制、激励和服务组合起来，并在执行中依据反馈调整。","basis":"宁骚《公共政策学》第3版，政策工具相关章节；谢明《公共政策导论》第5版，政策工具论述","source":"2026年真题.pdf · 第3页"},{"id":"exam-c20363c877cd","year":2026,"type":"简答题","topic":"政策评估","question":"影响政策评估的因素","outline":"先区分评估对象、标准与方法。\n分点：目标是否清晰且可测；数据的可得性与可靠性；评估主体的独立性；政策效果的滞后和外部环境；利益相关者的参与。\n最后说明如何用多方法和过程记录减轻偏差。","answer":"政策评估受目标、证据、主体和环境共同影响。目标若含混或相互冲突，评估就难确定何为成功；数据缺失、统计口径变化以及政策效果的滞后性，会使因果归因困难。评估主体的利益立场和独立性影响结论，公众参与不足则可能遗漏分配效果。政策与经济社会环境同时变化，也会干扰效果判断。改进时应事先明确指标和基线，结合定量数据、访谈与比较研究，公开方法和局限，区分政策产出与真实影响，并把结论用于调整政策。","basis":"宁骚《公共政策学》第3版，政策评估相关章节；《2019-2021真题&答案》政策评估题","source":"2026年真题.pdf · 第3页"},{"id":"exam-47379821326e","year":2026,"type":"论述题","topic":"政策执行","question":"结合所学的理论和知识论述史密斯模型的缺陷","outline":"先交代模型四变量：理想化政策、执行机关、目标群体、环境因素及其互动。\n再分析可能的不足：对动态反馈、政策学习及多层级网络的呈现有限；变量关系在复杂情境中不易操作化。\n结合一个执行案例说明何处解释力不足，并提出补充视角。","answer":"史密斯模型把执行结果理解为理想化政策、执行机构、目标群体和环境四个要素相互作用的产物，强调政策落地并非简单传达命令。它有助于识别政策设计与对象反应之间的张力，但也有局限：四要素的边界和作用机制较宽泛，难说明哪一因素在特定情境中更关键；模型以既定政策为起点，对执行者的裁量、基层再设计和多层级协商重视不足；对权力差异、利益冲突及随时间变化的反馈呈现也有限。分析具体政策时，应把四要素作为检查表，再结合资源配置、激励、跨部门协调与反馈机制解释偏差，不能机械套图。\n\n例如，若某项环保政策文本清楚、执行机构也有编制，仍因基层财政依赖相关产业而被选择性执行，单凭四要素分类并不能充分解释利益关系怎样改变执行激励。需要继续追问：谁承担治理成本、谁掌握检查数据、上级如何考核以及公众能否申诉。模型适合作为起点，其因果解释须由具体证据补足。","basis":"宁骚《公共政策学》第3版，史密斯政策执行模型（OCR第311页）","source":"2026年真题.pdf · 第3页"},{"id":"exam-5b06b37fcf5a","year":2026,"type":"论述题","topic":"政策过程模型","question":"结合实例论述渐进主义模型","outline":"定义：在既有政策基础上作有限、连续的调整。\n论证：信息和理性有限、政治协商成本高，因此较小调整易形成共识。\n结合实例写出原政策、每次调整及反馈。\n评价：有利于降低变革风险，也可能固化既有路径、难以应对突发性问题。","answer":"渐进主义认为决策者受信息、时间和认知能力限制，通常以现行政策为基础，对少数可行方案作边际比较，再逐步修正。以生育政策调整为例，可从原有制度出发分阶段放宽限制，并同步观察人口结构、家庭负担和公共服务承载能力；每轮调整都为下一轮提供反馈。渐进方式有利于降低一次性改革的风险、形成妥协和保留政策连续性，但也可能让既有利益格局固化，在问题迅速恶化时反应过慢。因此应设置评估节点和触发条件：需要快速纠偏时，不能以‘渐进’为由拖延。\n\n这种模型的基本命题是政策通常延续既有活动，决策者比较的是与现状相近的少数选择，并通过连续的小步调整寻求各方可接受的结果。它适合目标有争议、信息不完备但制度允许反复修正的情形；若面临突发危机或明显错误的制度安排，仅作边际修补可能无法解决根本问题，需配合更全面的方案审查。","basis":"宁骚《公共政策学》第3版，渐进决策模型（OCR第214—220页）","source":"2026年真题.pdf · 第3页"},{"id":"exam-90dfbab637eb","year":2025,"type":"名词解释","topic":"政策工具","question":"政策工具","outline":"定义：政策主体为实现政策目标而采用的具体手段与机制。\n可从规制、经济激励、信息和服务等方式举例。\n说明选择工具须兼顾有效性、成本、公平和可执行性。","answer":"政策工具是政策主体为实现政策目标而选择的具体干预方式和行动手段，它把目标转化为可执行的安排。常见工具包括法律规制与行政命令、税费和补贴等经济激励、公共服务供给以及信息公开和劝导。工具各有作用条件和代价：命令能迅速设定底线，却可能缺乏弹性；激励能改变行为成本，却需要财政或市场条件；信息工具成本较低，但对紧迫高风险问题可能不足。选择与组合工具时应同时考虑有效性、合法性、公平性和执行能力。","basis":"宁骚《公共政策学》第3版，政策工具相关章节","source":"2025年真题.pdf · 第3页"},{"id":"exam-855e76a6ed12","year":2025,"type":"简答题","topic":"政策网络","question":"政策网络产生的原因","outline":"先解释政策网络：政府与多元主体围绕政策问题形成的持续互动关系。\n原因：问题复杂化、资源与知识分散、政府单独行动能力有限、利益表达与协商需求上升。\n最后说明网络有助于协同，也会增加协调与问责难度。","answer":"政策网络产生于公共问题和资源分布的变化。环境、医疗等问题跨部门、跨层级，单一政府机构难掌握全部信息和执行资源；企业、社会组织、专家与公众又各自掌握资金、技术、专业知识或社会支持。为制定并执行政策，这些相互依赖的主体围绕议题持续交换资源、协商规则，形成较稳定的关系网络。网络有助于整合资源和提高政策适应性，也可能因成员不平等、协商不透明和责任分散带来问题，因此仍需公开程序和公共责任约束。","basis":"宁骚《公共政策学》第3版，政策网络（OCR第174—176页）","source":"2025年真题.pdf · 第3页"},{"id":"exam-62bb04e1a999","year":2025,"type":"论述题","topic":"政策过程模型","question":"有限理性模型","outline":"先与完全理性假设比较：决策者受信息、时间和计算能力约束。\n核心：在可接受的备选方案中寻求满意解，而非全知条件下的最优解。\n结合政策决策过程说明搜索、简化和逐步修正。\n评价模型的现实解释力及可能忽略的政治互动。","answer":"有限理性模型认为决策者既不可能掌握全部信息，也无法计算所有方案的后果；时间、预算、认知能力和组织规则都限制选择。因此实际决策往往先界定可接受的目标和约束，依次搜寻有限方案，找到‘足够满意’的方案便停止，而非追求理论上的全局最优。它比完全理性模型更贴近真实行政过程，也提醒决策者建立信息共享、专家论证和试点反馈机制。不过‘满意’标准可能受组织惯性或权力关系影响，重大政策仍须检验备选方案、风险和受影响群体，避免以有限理性掩盖草率决策。\n\n西蒙提出的满意原则并非鼓励随意拍板，而是承认寻找和计算本身有成本。实际流程通常是界定问题和最低可接受标准，搜寻有限方案，按顺序比较，在方案达到标准时作出选择。为了避免标准过低，可邀请不同部门和受影响群体检验问题定义，明确不可逾越的法律与安全底线，并在执行后根据新信息重新决策。","basis":"宁骚《公共政策学》第3版，有限理性决策（OCR第214—220页）","source":"2025年真题.pdf · 第3页"},{"id":"exam-fe7ee4de5c76","year":2025,"type":"论述题","topic":"政策执行","question":"政策执行偏差的原因及表现形式","outline":"定义偏差：实际执行效果偏离政策目标。\n表现可从象征式、附加式、残缺式、替代式、观望式等类型展开。\n原因按政策设计、执行组织、目标群体和环境四层分析。\n对策与原因对应，避免只列口号。","answer":"政策执行偏差是执行活动或实际效果偏离政策目标并产生不良后果。表现可以是完全不执行、选择性执行、把政策附加条件后执行、表面执行实则变通，或层层加码。原因既可能来自政策目标含混、资源不足和政策间冲突，也可能来自执行者的利益激励、裁量失当、部门协调不畅，以及目标群体不理解或难以遵从。纠偏要区分必要的因地制宜与背离目标的变形：明确政策边界和操作规则，匹配财力人力，公开执行信息与申诉渠道，跟踪效果并据反馈修订政策。\n\n表现形式需要与合法裁量区分：根据地区条件选择时间和方式，若仍实现政策目标，可能是合理适应；若以地方利益为由降低法定标准，或对上级目标层层加码侵害公众权益，则是偏差。政策设计者也有责任：目标过多而排序不清、财政与任务不匹配时，单靠追究基层责任不能消除偏差，必须同步修改规则和激励。","basis":"宁骚《公共政策学》第3版，政策执行偏差（OCR第325—332页）；《2019-2021真题&答案》相关题","source":"2025年真题.pdf · 第3页"},{"id":"exam-381cb30fda0d","year":2025,"type":"案例分析","topic":"政策调整","question":"用政策调整的知识，结合生育政策说明其特点、原因，说明为什么我国要实行渐进式政策调整","outline":"先按材料梳理各阶段政策目标和工具变化。\n特点：在既有制度上逐步调整，并依据人口与社会反馈修正。\n原因：问题情势、目标权衡和执行条件变化。\n论证渐进方式有利于试错和稳定预期，也需评估调整速度是否适配问题。","answer":"依据题目给出的生育政策调整主题，政策调整表现为在原有制度基础上改变限制范围、支持措施和执行规则，并根据反馈继续修正，而非每次都重新建立一套制度。推动调整的原因包括人口结构与生育意愿变化、家庭养育成本、公共服务供给及原政策效果与新目标之间的差距。渐进式调整可降低制度转轨成本，给家庭、用人单位和政府留出适应时间，也便于观察效果并纠错；但若问题发展快，过慢调整会削弱效果。分析时应区分政策文本变化与实际生育行为变化，并结合原材料中的具体阶段作答。\n\n政策调整通常同时涉及目标、工具、执行方式和适用对象。分析生育政策时，不能把放宽生育数量限制与家庭实际愿不愿生混为一谈；养育成本、就业机会、托育和教育服务会影响政策传导。若调整后预期效果不显著，应先检查配套工具和实施条件，再判断是否继续渐进修补或需要更大幅度的政策转向。","basis":"宁骚《公共政策学》第3版，政策调整与渐进决策（OCR第379—389、214—220页）","source":"2025年真题.pdf · 第3—4页"},{"id":"exam-0f41669ea517","year":2024,"type":"名词解释","topic":"政策网络","question":"政策网络","outline":"定义：围绕公共政策问题，政府及其他主体因资源、信息和利益相互依赖形成的关系网络。\n要素：参与者、资源交换、互动规则。\n评价：提高协同能力，也使责任划分更复杂。","answer":"政策网络是围绕某一政策议题，由政府部门、利益团体、专家、企业和社会组织等相互依赖的行动者形成的较稳定关系。各主体掌握不同资源，通过信息交换、谈判和合作影响议程、方案及执行。网络并不意味着各方权力相等，也不必然提高政策质量；封闭网络可能排斥弱势群体并模糊责任。分析网络时既要看参与者和资源，也要看进入规则、协商方式、权力分布以及最终的公共责任。","basis":"宁骚《公共政策学》第3版，政策网络（OCR第174—176页）","source":"2024年真题.pdf · 第3页"},{"id":"exam-73cd14b82eb8","year":2024,"type":"简答题","topic":"政策执行","question":"史密斯政策执行模型","outline":"先写四个变量：理想化政策、执行机关、目标群体、环境因素。\n解释变量相互作用及由此产生的执行张力。\n用一项政策说明政策设计、执行者、对象和环境怎样共同影响结果。","answer":"史密斯模型认为政策执行受四方面共同影响：理想化政策的目标与设计是否清晰可行；执行机构的组织能力、资源和态度；目标群体对政策的接受与反应；政治、经济、社会等环境条件。四者之间发生互动和紧张，可能促成执行，也可能引发抵抗和偏差。用模型分析具体政策时，应逐一说明政策要求、执行者行为、受影响者反应和环境约束，再解释它们如何相互作用；不能把政策未达目标简单归咎于某一个环节。","basis":"宁骚《公共政策学》第3版，史密斯政策执行模型（OCR第311页）","source":"2024年真题.pdf · 第3页"},{"id":"exam-5bd3dd0249a2","year":2024,"type":"简答题","topic":"政策评估","question":"政策评估基本内容","outline":"以政策目标为起点。\n依次检查执行过程、政策产出、目标群体影响、成本与效益，以及未预期后果。\n说明既要做事实判断，也要考虑公平等价值标准。","answer":"政策评估不仅看政策有没有发布或完成任务，还要评估政策方案、执行过程和实际结果。方案评估关注目标是否针对问题、工具是否可行及成本与风险；过程评估检查资源投入、执行偏差和对象覆盖；结果评估区分直接产出与对问题的真实影响，并考察效率、效果、公平、回应性及意外后果。评估还须说明数据来源、比较基准和环境变化，避免把同时发生的社会变化都算作政策功劳。结论应反馈到政策延续、调整或终结。","basis":"宁骚《公共政策学》第3版，政策评估相关章节；《2019-2021真题&答案》政策评估题","source":"2024年真题.pdf · 第3页"},{"id":"exam-4746858c6dc4","year":2024,"type":"论述题","topic":"政策议程","question":"结合实际说明利益集团在议程中的作用","outline":"先界定利益集团及政策议程。\n作用路径：表达诉求、提供信息和专业知识、动员公众、影响议题排序。\n结合实例分析不同集团资源不均及代表性问题。\n评价参与价值，并提出公开透明与平衡参与的条件。","answer":"利益集团通过汇集成员诉求、提供专业信息、开展倡议和与决策者沟通，影响社会问题能否进入政策议程以及问题如何被定义。例如围绕公共数据开放，行业组织可提出应用需求，隐私保护团体则可提醒数据滥用风险；两种信息都有助于议程更完整。其积极作用是使分散利益得到表达并提供政策知识，风险是资源雄厚者更易接近决策中心，导致议程偏向特定利益。政府应公开征求意见、披露参与渠道与利益关系，给受影响但组织能力弱的群体表达机会。\n\n利益集团影响议程常经历问题命名、证据提供、社会动员和进入决策窗口几个环节。某些群体会把私人损失表述为公共问题，以争取更广泛支持；这不必然不正当，但其主张需要与可核实证据和其他群体利益比较。决策者应把公开意见、专家证据与受影响群体的日常经验放在同一程序中审查，防止政策议程被单一组织长期占据。","basis":"宁骚《公共政策学》第3版，政策议程与利益集团相关章节","source":"2024年真题.pdf · 第3页"},{"id":"exam-757f562f2737","year":2024,"type":"案例分析","topic":"政策创新","question":"从政策创新角度列举一个政策实践并进行分析","outline":"先选一个有明确时间、目标和措施的政策实践。\n写清旧做法及其问题 → 新的目标、工具或组织方式 → 执行条件与效果。\n最后评价创新是否可复制、是否出现新成本；案例事实须能核实。","answer":"可用‘一网通办’作为政策创新案例：原先群众办理跨部门事项需分别提交材料，部门数据与流程不衔接；改革把同类事项整合到统一入口，推动材料复用、并联办理与办事进度查询。创新不只是把窗口搬到网上，而是改变部门间信息共享和协同的规则。评价时要看实际办理时间、重复提交次数、老年人等群体的可及性，以及数据安全和责任划分；若线下渠道被过早取消，便利可能只属于熟悉数字工具的人。本题原材料未指定地区，以上为一般性实践示例，作答时应换成材料中可核实的具体政策。\n\n从政策创新理论看，创新可以发生在目标、工具、组织流程或主体关系上。‘一网通办’若只是统一网页而审批仍在原部门串行流转，属于界面变化，创新程度有限；若实现数据互认、流程再造和责任协同，才可能真正降低交易成本。推广时应检查法律授权、技术能力和地区差异，不能把某地成功直接等同于全国可复制。","basis":"宁骚《公共政策学》第3版，政策创新及政策工具相关章节","source":"2024年真题.pdf · 第3页"},{"id":"exam-4a7fe5cb87f4","year":2022,"type":"论述题","topic":"政策工具","question":"请论述政策工具选择的影响因素","outline":"先界定目标和备选工具。\n从问题性质、政策目标、目标群体、资源和能力、制度环境、成本与公平、执行可行性分析。\n用一项政策示例说明工具组合与后续评估调整。","answer":"政策工具选择应先从问题机制出发：是需要禁止有害行为、纠正价格激励，还是弥补信息和服务不足。随后比较工具与目标的匹配程度、预期效果、成本、受益与负担的分布及潜在副作用。政府的法定权限、财政能力、基层执行资源和数据能力决定工具能否落地；目标群体的行为、政治支持和社会文化也影响遵从。以污染治理为例，可用排放标准设底线，以收费或补贴改变成本，以监测公开形成社会监督，并向小企业提供技术支持。应根据实施效果调整组合，避免因工具简单易用就忽视公平和效果。\n\n选择过程还具有政治与制度约束。强制工具可能见效快，却需要高质量执法和救济；经济工具给对象选择空间，却可能让低收入群体承担更高比例的成本；自愿与信息工具易被接受，但对高风险违法行为约束较弱。选择时应先设合法和公平底线，再比较成本效果，最后设计工具之间的互补与退出条件，而不是抽象地说某一工具永远最好。","basis":"宁骚《公共政策学》第3版，政策工具相关章节；谢明《公共政策导论》第5版，政策工具论述","source":"2022年真题.pdf · 第3页"},{"id":"exam-a2910943104f","year":2022,"type":"论述题","topic":"政策终结","question":"试述政策终结的形式","outline":"先说明政策终结是经评估后主动结束或改变不再适用的政策。\n形式可写废止、替代、合并、分解与缩减，并区分各自含义。\n最后讨论终结阻力、过渡安排及效果评估。","answer":"政策终结指政策因目标已实现、问题改变或政策失效而停止其全部或部分内容。形式可按对象区分：终止具体政策或项目，停止承担相关职能，撤销或合并执行机构，以及取消、替换特定工具和预算安排。终结不一定是突然废止，也可以通过期限届满、逐步退出、职能转移和新政策替代实现。判断是否终结应评估政策效果、成本与新的社会需求；实施时妥善处理人员、合同和受影响群体的过渡，避免政策真空。\n\n完全终结与部分终结也应区分。政策问题已经解决时可以废止整项政策；若方向仍合理但某个工具无效，则只替换工具或调整机构，保留有用的目标和服务。终结往往遇到机构、受益群体和既有合同的阻力，所以需要公开评估证据、设定过渡期并安排替代服务；否则名义上终结了旧政策，实际问题却转移给公众。","basis":"宁骚《公共政策学》第3版，政策终结（OCR第392—399页）","source":"2022年真题.pdf · 第3页"},{"id":"exam-d83eaa0cd435","year":2022,"type":"简答题","topic":"政策执行","question":"比较政策执行的行动学派与组织学派的异同","outline":"共同点：都解释政策从决定走向实施的过程。\n比较维度：分析单位、对执行者的理解、关注的组织结构与具体行动、对偏差成因的解释。\n最后用一个执行案例说明两种视角可互相补充。","answer":"行动学派侧重把执行视为行动者之间持续的选择、互动和博弈，关注基层执行者的裁量、目标群体的回应以及政策在现场如何被重新解释。组织学派则把执行放在组织结构、层级控制、规则、资源与协调机制中，解释为什么正式目标在部门之间传递时会受阻。两者都反对把执行当作自动落实的机械过程，也都承认目标、资源与环境会影响结果。区别在于分析单位：前者从具体行为与互动入手，后者更重制度化的组织安排。实际分析可结合两者：既检查权责和资源，也观察一线行动者的激励与裁量。","basis":"宁骚《公共政策学》第3版，政策执行理论相关章节；《2019-2021真题&答案》政策执行相关论述","source":"2022年真题.pdf · 第3页"},{"id":"exam-b70e9204620f","year":2021,"type":"名词解释","topic":"政策执行","question":"政策执行偏差","outline":"定义：执行行为或效果偏离政策目标并产生不良后果。\n点出主客观因素和多种表现形式。\n区分有意变通、正常政策调整与不当偏差。","answer":"政策执行偏差是执行者在实施政策时，因政策设计、资源条件、组织激励或对象反应等因素，使执行行为及其效果偏离政策目标并产生不良后果的现象。它可能表现为不执行、选择性执行、附加条件、变通替代或层层加码。判断偏差不能只看执行方式是否与原文件逐字一致，还要看是否违背政策目的、法定边界和公众权益。","basis":"宁骚《公共政策学》第3版，政策执行偏差（OCR第325—332页）；《2019-2021真题&答案》名词解释","source":"2019-2021真题&答案.docx · 2021部分"},{"id":"exam-a5b2a2478a30","year":2021,"type":"简答题","topic":"政策分析","question":"价值分析的意义以及如何进行价值分析","outline":"意义：使政策目标和方案中的价值取向可见，帮助辨认利益与公平冲突。\n步骤：识别相关主体与价值；说明评价标准；比较方案分配效果；公开讨论并作出权衡。\n结合一项政策说明事实判断和价值判断的区别。","answer":"价值分析要回答政策目标是否值得追求、实现目标的手段是否正当，以及结果对不同群体是否可接受。它能为方案比较提供准则，揭示效率、公平、自由、安全等价值之间的冲突，并帮助识别社会偏好变化。具体做法是先说明政策涉及哪些价值和受影响群体，再通过调查、听证、访谈等了解群体诉求，比较方案的收益与负担如何分配，检验手段是否合法、合乎伦理，最后公开说明取舍理由。价值分析不能被单纯成本收益计算替代。","basis":"宁骚《公共政策学》第3版，政策价值分析（OCR第83—84页）；《2019-2021真题&答案》价值分析题","source":"2019-2021真题&答案.docx · 2021部分"},{"id":"exam-b76d82d55752","year":2021,"type":"论述题","topic":"政策评估","question":"政策评估中的事实标准和价值标准","outline":"先区分：事实标准判断政策实际做了什么、产生什么结果；价值标准判断结果是否正当、公平、可接受。\n分别列出可用指标与证据。\n结合实例说明有效不必然公平，并讨论两类标准如何综合。","answer":"事实标准判断政策‘发生了什么’，可用投入产出、成本、目标完成度、覆盖率和实际影响等可观察证据，考察效率、效果和充分性。价值标准判断‘这样做是否应当’，关注公平、回应性、合法性、权利保障及利益分配。二者相互需要：一项政策可能以很低成本完成指标，却使弱势群体负担过重；也可能目标合理但执行低效。评估时应明确基线与数据口径，区分政策贡献和外部环境，再公开价值判断依据，避免用看似中立的数字掩盖利益取舍。\n\n事实与价值的区别也决定评估方法不同。事实判断需要可靠指标、样本和比较对象，价值判断需要说明所依据的公共原则及利益排序；两者都应接受公开质询。例如某项收费政策降低了财政支出，这是事实层面的收益，但是否妨碍低收入者使用基本服务，是价值层面的判断，仍需用分组数据检验。综合评估才能为政策延续或调整提供正当理由。","basis":"宁骚《公共政策学》第3版，政策评估相关章节；《2019-2021真题&答案》政策评估题","source":"2019-2021真题&答案.docx · 2021部分"},{"id":"exam-659b5c8e2e23","year":2020,"type":"名词解释","topic":"公共权力","question":"公共权力","outline":"定义：政治共同体通过同意或授权形成、用于管理公共事务的权力。\n要点：来源的公共性、对象的公共性、行使须受法律与责任约束。\n结合公共政策制定与执行说明其作用。","answer":"公共权力是国家机关及依法获得授权的组织，为管理公共事务、制定和执行公共规则而拥有的具有公共性和法定约束力的权力。其来源和边界由法律与公共授权规定，目的在于维护公共利益，不得转化为部门或个人私利。在政策过程中，公共权力体现为设置议程、制定规则、配置资源和监督执行的能力；行使时须遵守法定权限、程序公开、比例适当与责任追究。","basis":"宁骚《公共政策学》第3版，政策主体与公共权力相关论述","source":"2020年长安大学822试题答案.pdf · 第1页"},{"id":"exam-c145a3ce0bb1","year":2020,"type":"简答题","topic":"公共政策功能","question":"简述公共政策的基本功能","outline":"按资料答案的结构分点：管制、引导、调控和分配等功能。\n每项写含义和一个具体政策例子。\n结尾说明各功能可能同时存在且有价值取舍。","answer":"公共政策通过权威性规则和资源配置回应公共问题，基本功能包括：引导社会行为，明确鼓励与禁止的方向；调控经济社会运行，缓解市场失灵与公共风险；分配或再分配资源与机会，影响群体之间的利益格局；协调冲突、维持社会秩序，并提供公共服务。各功能可能相互牵制，例如提高效率的工具可能增加特定群体负担，因此政策设计要说明目标、受益者和成本承担者，执行后再检验实际效果。","basis":"宁骚《公共政策学》第3版，公共政策本质与功能相关章节；《2019-2021真题&答案》公共政策功能题","source":"2020年长安大学822试题答案.pdf · 第2页"},{"id":"exam-4d9843d53246","year":2020,"type":"论述题","topic":"政策执行","question":"政策执行偏差的表现形式、原因及对策","outline":"先界定执行偏差，列举象征、附加、残缺、替代等形式。\n原因：政策设计、执行机构与人员、目标群体、环境条件。\n对策对应原因：提高政策可行性、明确责任、加强沟通监督并允许反馈修正。","answer":"政策执行偏差的表现包括拖延或拒不执行、只执行有利于本部门的部分、以表面动作代替实际落实、擅自改变政策条件，以及层层加码。成因既有政策目标和规则含糊、资源不足、政策之间冲突，也有执行者追求部门利益、基层信息与上级判断不一致、监督反馈不畅和目标群体不配合。治理要把目标细化为可操作且有弹性的规则，配置相应人财物，培训执行人员，建立跨部门协调、信息公开、投诉和效果评估机制；发现偏差后分清执行责任与政策设计缺陷，分别纠正。\n\n防治执行偏差需要同时处理‘不能执行’与‘不愿执行’。前者侧重补充经费、数据和人员，消除相互矛盾的规定；后者侧重调整考核、公开裁量、加强监督和问责。目标群体若无法承担遵从成本，还应提供解释、服务或过渡安排。对执行结果定期评估，发现政策本身不适应新情况时依法调整政策，不能把所有偏差都归责给基层。","basis":"宁骚《公共政策学》第3版，政策执行偏差（OCR第325—332页）；《2019-2021真题&答案》执行偏差题","source":"2020年长安大学822试题答案.pdf · 第4—5页"},{"id":"exam-b27946867bec","year":2019,"type":"名词解释","topic":"政策过程","question":"政策链","outline":"定义：围绕同一政策问题先后形成、彼此衔接的一系列政策。\n要点：目标与内容有连续性，形式和功能又有差异。\n说明政策链与单项政策的关系。","answer":"政策链是政策主体为解决同一公共问题，先后制定的目标相互衔接、内容具有连续性而功能有所分工的一系列政策。链中的政策可以分别承担提出目标、规定实施办法、配置资源和修正反馈等作用，其中关键政策对整体方向具有统摄作用。判断是否构成政策链，不能只看文件发布时间相近，还要看是否围绕同一问题、目标是否一致、措施之间能否相互补充。","basis":"宁骚《公共政策学》第3版，政策链相关论述；《2019-2021真题&答案》名词解释","source":"2019年硕士研究生入学考试真题参考答案.docx"},{"id":"exam-7f403dd565cf","year":2019,"type":"简答题","topic":"政策目标","question":"公共政策目标的基本特征","outline":"依据参考答案分三点：问题的针对性、未来的预期性、目的的多元性。\n逐点解释并结合一项政策目标举例。\n最后说明主要目标与次要目标需要协调。","answer":"公共政策目标是政策主体为解决特定公共问题，期望政策行动在未来达到的状态或效果。其基本特征包括针对性，即目标来自明确的问题诊断；预期性，即目标指向尚未实现的未来结果；多元性，即政策常同时涉及效率、公平、安全等多个目的。目标还应具有层次性和可检验性，把总体方向落实为阶段性成果与观察指标。若目标过于笼统或相互冲突，执行者就难以选择工具，评估者也难判断政策是否奏效。","basis":"宁骚《公共政策学》第3版，政策目标相关章节；《2019-2021真题&答案》政策目标题","source":"2019年硕士研究生入学考试真题参考答案.docx"}],"points":{"books":[{"id":"ning-3","label":"宁骚","chapters":[{"name":"公共政策学的学科要素","modules":["p1"],"notes":[],"items":[{"id":"ning-3:1:1","term":"政策研究、政策分析、公共政策学","kind":"名词解释","page":5,"red":false,"ocr":[]},{"id":"ning-3:1:2","term":"政策群、政策链","kind":"名词解释","page":7,"red":true,"ocr":[]}]},{"name":"公共政策的研究视角和路径","modules":["p2"],"notes":[],"items":[{"id":"ning-3:2:1","term":"公共政策的系统分析","kind":"简答","page":47,"red":false,"ocr":[10,63]},{"id":"ning-3:2:2","term":"社会分层的理论解释","kind":"简答","page":61,"red":false,"ocr":[77]},{"id":"ning-3:2:3","term":"案例研究","kind":"简答","page":55,"red":false,"ocr":[]},{"id":"ning-3:2:4","term":"路径依赖观","kind":"名词解释","page":63,"red":false,"ocr":[79]},{"id":"ning-3:2:5","term":"价值分析","kind":"简答","page":67,"red":true,"ocr":[]}]},{"name":"政策研究的资料收集与分析方法","modules":["p3"],"notes":[],"items":[{"id":"ning-3:3:1","term":"非概率抽样","kind":"名词解释","page":75,"red":false,"ocr":[88,91,93]},{"id":"ning-3:3:2","term":"不等概率抽样","kind":"名词解释","page":77,"red":false,"ocr":[88,93]},{"id":"ning-3:3:3","term":"雪球抽样、PPS抽样","kind":"名词解释","page":77,"red":false,"ocr":[93]},{"id":"ning-3:3 "chen-2:13:1","term":"公共管理伦理的功能","kind":"简答","page":387,"red":false,"ocr":[405],"also":"cai-wang-3:11:1"},{"id":"chen-2:13:2","term":"官员问责制","kind":"简答","page":394,"red":false,"ocr":[]},{"id":"chen-2:13:3","term":"负责人行为构成要素","kind":"简答","page":398,"red":false,"ocr":[]},{"id":"chen-2:13:4","term":"合理有效公共管理伦理体系的形成","kind":"简答","page":405,"red":false,"ocr":[]}]}],"source":"公共管理/陈振明重点/陈振明公共管理.docx"}],"stats":{"items":218,"verified":111,"red":42,"both":18},"description":"红点沿用重点笔记的标红；纸书 P 是笔记页码，原文 p 是 MinerU 底稿中的 PDF 页序。关键词命中只帮助定位，不代表整条考点已逐句核验。"}</script>
<script id="exam-data" type="application/json">[{"id":"exam-4487a6e56aaf","year":2026,"type":"名词解释","topic":"公共部门管理","question":"全面质量管理","outline":"定义：以服务对象需求和持续改进为导向的全过程质量管理。\n要点：全员参与、过程控制、数据反馈、持续改进。\n公共部门落点：服务质量与公众感受，兼顾公共责任和公平。","answer":"全面质量管理是以服务质量为中心、全员参与、覆盖服务全过程的管理方法。用于公共部门时，质量不能只理解为办事速度，还包括合法、公平、可及和公众满意。管理者应明确服务标准，收集公众需求，按计划—执行—检查—改进的循环发现并纠正问题，使一线人员、管理者和服务对象共同参与改进。由于公共服务承担法定责任和多重公共价值，不能简单以顾客满意或成本降低代替公共利益。","basis":"蔡立辉、王乐夫《公共管理学》第3版，全面质量管理（OCR第375—376页）","source":"2026年真题.pdf · 第1页"},{"id":"exam-1fc475d6387d","year":2026,"type":"简答题","topic":"公共管理理论","question":"新公共服务理论的观点","outline":"总述：把公民和公共利益置于公共服务的中心。\n分点：服务公民而非仅把人看作顾客；共同界定公共利益；重视民主参与和多元责任；尊重人的价值而非只看生产率。\n收束：说明它对政府角色和公共服务方式的启发。","answer":"新公共服务理论强调政府的首要职责是服务公民和维护公共利益，而非把公民仅当作顾客、把政府仅当作掌舵者。公共利益应通过公共对话形成，政府要帮助公民表达共同需求并参与决策；政策既要有战略思考，也要通过民主协商付诸行动。公务人员须同时向法律、政治规范、社区和公民负责，尊重人的价值而不能只追求生产率。其贡献是补足单纯效率逻辑对民主、公平和参与的忽视，但协商成本与责任协调也需要制度支持。","basis":"蔡立辉、王乐夫《公共管理学》第3版，新公共服务理论（OCR第68—72页）","source":"2026年真题.pdf · 第1页"},{"id":"exam-f6090e846d45","year":2026,"type":"简答题","topic":"公共管理伦理","question":"加强公共管理伦理建设的途径","outline":"总述：把公共利益和公共责任落到制度与行为。\n分点：明确伦理规范；强化教育与职业训练；完善公开、监督和问责；建立利益冲突防范及纠错机制。\n落点：制度约束与个人自律相互配合。","answer":"公共管理伦理以公共利益和公共责任为核心，要求公职人员在使用受托权力时兼顾合法性、公平与廉洁。建设路径包括：把服务公众、守法、公正等要求纳入职业教育和日常领导示范；明晰权责边界、利益冲突回避和行为规范；以公开决策、过程留痕、审计与社会监督约束权力；建立可申诉、可问责的制度，并保护依法履职者。伦理建设不能只靠个人自觉，应使组织激励、绩效评价与公共价值一致，避免为追求数字指标牺牲群众权益。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共管理伦理（OCR第393—398页）","source":"2026年真题.pdf · 第1页"},{"id":"exam-acc17aa604bf","year":2026,"type":"论述题","topic":"政府作用","question":"政府失败的现象类型以及成因","outline":"先界定政府失败：政府干预未达公共目标或带来额外损失。\n现象：政策低效、信息失真、寻租与部门本位、公共服务供给偏差。\n成因：信息与能力限制、激励扭曲、监督不足、决策与执行脱节。\n最后区分市场失灵与政府失败，提出边界调整和治理改进。","answer":"政府失败是政府干预未能改善公共问题，反而产生低效率或不公平的情形。常见表现有公共品供给不足或过量、政策目标偏离、行政成本膨胀、寻租腐败、决策迟缓及执行中的一刀切。原因一是决策者信息有限，难以准确识别偏好和成本；二是政治与行政主体可能追求自身预算、权力或短期成绩；三是垄断供给、层级过多和监督不足削弱激励；四是政策外部性和复杂环境使干预结果偏离预期。因此应限定干预边界、公开信息、引入参与和竞争、强化绩效评估及问责，同时避免把市场机制当作万能替代。\n\n还需区分政府干预失败与政府不作为：前者可能是工具过强或执行扭曲，后者则可能使市场失灵和弱势群体需求无人回应。政策改进不能只做机构精简，而要先说明问题是否需要公共干预，再比较直接供给、规制、激励和合作治理的适用条件；对干预效果建立可撤回、可修正的评估程序。","basis":"陈振明《公共管理学》第二版，政府失败的类型与成因（OCR第176、183页）","source":"2026年真题.pdf · 第1页"},{"id":"exam-f2e1ed31f963","year":2026,"type":"案例分析","topic":"公共危机管理","question":"结合突发事件生命周期，分析应急管理活动的主要内容","outline":"按时间展开：风险识别与预防 → 预案、演练和资源准备 → 预警、响应、协调处置 → 恢复重建与复盘。\n每阶段对应材料中的具体行动，说明政府、专业机构和社会力量的分工。\n结尾指出阶段间的信息反馈与制度改进。","answer":"依据题目已知的‘突发事件生命周期’，应急管理应贯穿事前、事中、事后。事前识别风险源，开展监测预警、隐患排查、预案编制、物资储备与演练；事件发生时迅速核实信息，依法启动分级响应，由统一指挥机构组织救援、医疗、交通和信息发布，兼顾属地处置与跨部门协同；事后安置受影响者、恢复公共服务、评估损失与责任，复盘预案和制度。各阶段不是割裂的：预警决定响应速度，处置记录又为恢复和下一轮预防提供依据。具体措施应再与原案例材料对应，不宜臆造事件细节。\n\n若材料涉及具体事故，可逐项把事实放入生命周期：事件前是否有风险报告和预案，预警是否及时，现场是否形成统一指挥，救援信息是否向公众透明，恢复阶段是否照顾受损群体。这样分析才能指出哪个环节失效以及相邻环节如何传导，而非只罗列‘预防、准备、响应、恢复’四个词。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共危机管理相关章节；《公共管理真题&答案》危机管理体制题","source":"2026年真题.pdf · 第2页"},{"id":"exam-88c4deb4a67f","year":2025,"type":"名词解释","topic":"公共价值","question":"公共利益","outline":"定义：社会成员共同生活所依赖的公共价值和共同福祉。\n说明它与个人利益、群体利益存在联系和张力。\n答题时点出公共管理通过协商、制度和服务实现公共利益。","answer":"公共利益是社会成员在共同生活中需要共同维护、单个人难以独自实现的利益，体现为公共安全、基本服务、公平秩序等共同需要。它并非私人利益的简单相加，也不能由某个机关单方面宣称。公共管理中应通过法律程序、公众参与和公开论证识别不同群体的诉求，尤其关注受政策影响却表达能力较弱的人；再以合法、公平和可持续的方式配置资源。公共利益具有情境性和争议性，需要在政策执行与评估中持续校正。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共利益及公共服务价值相关论述","source":"2025年真题.pdf · 第1页"},{"id":"exam-ba428b24279b","year":2025,"type":"简答题","topic":"公共部门绩效","question":"结合实际论述公共部门绩效评估的问题","outline":"先写绩效评估目标：改进公共服务与公共责任。\n问题：目标和指标偏窄、重数量轻质量、数据失真、公众参与不足、结果运用形式化。\n对策对应问题：多维指标、过程与结果结合、外部参与、公开反馈及改进闭环。","answer":"公共部门绩效评估的难点首先在于目标多元：效率、质量、公平和合法性不能用单一数字替代。实践中若只考核办结量，可能诱发重数量轻服务、重短期轻长期；不同地区和服务对象条件不同，横向排名也可能失真。数据由被考核单位自行填报时，易出现选择性上报和‘唯指标’行为；公众感受若缺席，评估难反映实际效果。完善评估应将过程、产出、结果与公平性分开测量，设定基线并考虑环境差异，结合独立评估和群众反馈，公开方法，同时把结果用于改进服务而非只做奖惩。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共部门绩效管理与评估相关章节","source":"2025年真题.pdf · 第1页"},{"id":"exam-6ee5f7a1ae1b","year":2025,"type":"论述题","topic":"公共物品","question":"用所学理论分析公地悲剧产生的原因和措施","outline":"界定公地悲剧：共享资源在缺乏有效规则时被过度使用。\n原因：个体收益与共同损失分离、产权或使用边界不清、监督协调不足。\n措施：明确使用规则与责任、监测和惩戒、共同治理及适当激励。\n结合具体资源案例分析措施的适用条件。","answer":"公地悲剧发生在资源可共同使用、个人使用收益归自己而消耗成本由群体承担的情形。各使用者即使知道过度利用有害，也可能担心自己节制而他人不节制，于是选择抢先使用，最终使资源枯竭。这是外部性、搭便车和缺乏可信合作规则共同造成的，并非只因个人道德不足。治理可按资源特点明确使用边界和份额，制定共同认可的规则，建立监测、渐进处罚和争议解决机制；政府提供法律保障与跨区域协调，使用者参与协商和监督。若资源与使用者差异很大，应避免一刀切地私有化或封闭。\n\n奥斯特罗姆关于公用资源的讨论特别强调制度供给、可信承诺和相互监督。使用者只有相信他人也会遵守限制，才愿意承担眼前的节制成本；因此规则应由使用者参与制定，监测者要能被监督，处罚应与违规程度相称。对于跨区域资源，还需要更高层级制度处理单个社区无法解决的外部影响。","basis":"宁骚《公共政策学》第3版，集体行动与公共资源治理（OCR第80—82页）；蔡立辉、王乐夫《公共管理学》第3版，公共治理相关论述","source":"2025年真题.pdf · 第1页"},{"id":"exam-d683d5d63da9","year":2025,"type":"论述题","topic":"政府间关系","question":"我国政府间关系改革的必要性和措施","outline":"必要性：跨区域问题增多，职责、财力和信息需要更好匹配。\n措施：厘清事权和支出责任；健全纵向协调与横向合作；完善转移支付和信息共享；建立协商、监督与绩效反馈。\n结合一项跨区域公共事务说明改革如何落地。","answer":"政府间关系包括中央与地方、上下级地方以及同级政府之间的权责和合作关系。改革的必要性在于公共问题常跨行政边界，而现有事务分工、财力和责任有时不匹配，易出现重复建设、相互推诿与地方保护；公共服务均等化也要求更稳定的协调机制。改革应依法划清各级事权与支出责任，使财力同职责相适应；完善转移支付和绩效监督，减少层层下压任务；对环境治理、交通和应急等跨区事项建立信息共享、联合决策和成本分担机制。中央保持统一规则与基本标准，地方保留因地制宜的执行空间。\n\n纵向关系的改革要避免权力上收而责任仍由基层承担，也要避免地方只争取资源而不承担统一标准。横向关系的改革则应解决‘谁先投入、谁获收益’的问题，建立可执行的利益补偿和争议处理程序。衡量改革成效，最终应看跨区域问题是否得到解决、基本公共服务差距是否缩小，以及责任能否被公众识别。","basis":"陈振明《公共管理学》第二版，政府间关系（OCR第126、151、152页）；《公共管理真题&答案》政府间关系定义","source":"2025年真题.pdf · 第1页"},{"id":"exam-1d9be26ba48d","year":2025,"type":"案例分析","topic":"公共数据","question":"我国公共数据开发利用的措施","outline":"先界定公共数据及开发利用的公共目的。\n按流程答：依法归集和治理数据 → 分类开放与授权使用 → 跨部门共享和应用场景 → 安全、隐私与责任保障。\n结合材料指出数据质量、协同和公众受益如何检验成效。","answer":"依据题目已知的公共数据开发利用主题，关键是使数据在公共利益和安全边界内转化为服务能力。先明确数据目录、质量标准和归集责任，清理重复、缺失与口径不一的问题；再按分类分级规则推动部门间共享，对可公开的数据提供可理解、可复用的开放方式；在交通、医疗、基层服务等明确场景中以需求牵引应用，避免‘为了上平台而上平台’。涉及个人信息和敏感数据时，应实行最小必要使用、授权、脱敏、访问审计和责任追究。成效应看办事便利、治理改进和公众受益，而不只看开放数据量。\n\n数据开发利用还应区分共享、开放和授权运营：共享服务于履职协同，开放面向社会提供可公开的数据，授权使用需明确范围、期限和收益安排。三者的使用对象与风险不同，不能混作‘放出数据’。对应用效果可用群众少跑腿、部门少重复采集、问题发现更及时等指标检验，并对错误数据设纠错渠道。","basis":"蔡立辉、王乐夫《公共管理学》第3版，政务信息管理与公共数据利用（OCR第296—303页）","source":"2025年真题.pdf · 第1—2页"},{"id":"exam-6381155a8823","year":2024,"type":"名词解释","topic":"政府组织","question":"内部性","outline":"定义方向：组织内部成员或部门追求自身目标时，与组织公共目标产生偏离的倾向。\n说明其可能表现为预算扩张、信息封闭或部门本位。\n结合监督、激励和责任机制说明治理思路。","answer":"内部性指公共组织及其成员在履行公共职能时，把机构或个人的内部利益置于公共目标之上，由此造成的行为偏差。例如部门追求预算、编制、审批权或好看的考核数据，即使这些做法没有改善公众服务。它与外部性不同，问题发生在公共组织自身的激励结构中。纠正内部性需要明确法定职责与预算绩效约束，公开决策和支出信息，引入公众评价、审计和问责，使组织收益与公共服务效果相联系。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共选择与政府失灵相关论述","source":"2024年真题.pdf · 第1页"},{"id":"exam-acfe0f048485","year":2024,"type":"简答题","topic":"公共治理","question":"网络治理的新特征","outline":"先界定网络治理中的多元主体与相互依赖。\n分点：跨组织协作、资源互补、协商协调、较灵活的关系结构、共同责任。\n评价其回应复杂问题的能力与权责不清的风险。","answer":"网络治理以政府、企业、社会组织和公民等多元主体的相互依赖为出发点。相较单一层级命令，它通过协商、资源交换和合作规则处理跨部门问题，组织边界较开放，决策和执行常在多个节点同时发生。网络能够汇集分散知识、提高回应性，但也会使责任界面和代表性变得复杂。政府既是参与者，也要承担规则制定、协调冲突、保障公平与问责等元治理职责；不能因为有社会主体参与，就把公共责任完全转出。","basis":"陈振明《公共管理学》第二版，网络治理新特征与困境（OCR第81、89页）","source":"2024年真题.pdf · 第1页"},{"id":"exam-82e44b32f512","year":2024,"type":"简答题","topic":"公共危机管理","question":"结合实际，论述公共危机管理体制现状","outline":"从组织指挥、分级响应、属地管理、部门协同、社会参与五方面搭框架。\n每点用材料或现实案例说明已有机制及可能短板。\n结尾提出预案、信息共享、演练和事后复盘的改进路径。","answer":"公共危机管理体制的核心是统一指挥、分级负责、属地管理与部门协同。统一指挥可减少危机中的多头命令；分级响应使事件规模与调度能力相匹配；属地政府负责第一时间发现、报告和处置，跨区域或重大事件则需上级协调。实践难点是风险信息分散、部门预案衔接不够、基层资源与职责不匹配，专业力量和社会力量参与机制也可能不足。完善应从常态化监测、联合演练、数据共享、物资和人员保障入手，并在事件后复盘责任与制度，而不能只重视事发后的临时动员。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共危机管理相关章节；《公共管理真题&答案》危机管理体制题","source":"2024年真题.pdf · 第1页"},{"id":"exam-1c5bc1481f1b","year":2024,"type":"论述题","topic":"公共管理理论","question":"分别列举公平取向、效率取向的公共管理理论的代表人物、理论内容和评价","outline":"先说明评价维度：公平和效率是公共管理中的两类重要价值。\n效率取向可联系传统行政与新公共管理；公平取向可联系新公共行政、新公共服务。\n分别写代表观点、制度主张及局限，再讨论两类价值如何兼顾。","answer":"效率取向可举胡德概括的新公共管理：强调绩效标准、结果控制、竞争和管理自主权，意在缓解传统官僚制的低效率；其贡献是重视成本和服务回应，但把公民过度视为顾客时，可能忽略公平及民主责任。公平取向可举登哈特夫妇的新公共服务：主张服务公民、通过公共对话形成公共利益，重视参与、责任和人的价值；它纠正了唯效率倾向，但协商和跨主体协调需要时间与制度。两种取向并非只能二选一：公共管理应在法定职责下，用绩效改进服务，同时以平等可及、参与和公共责任评价绩效。\n\n评价代表理论还要看到各自的制度背景。新公共管理用竞争和绩效回应财政压力与低效服务，但对于司法、公平保障等不能按销量衡量的事务，市场式指标易产生失真。新公共服务强调公众参与，但‘公众’内部也有利益差异，需要保障弱势者能参与而非由最活跃者垄断发言。因此更合理的做法是让效率工具受公共价值约束，并用可检验的服务结果检验参与效果。","basis":"蔡立辉、王乐夫《公共管理学》第3版，新公共管理、新公共服务与公共治理相关章节","source":"2024年真题.pdf · 第1页"},{"id":"exam-b5f484de48aa","year":2024,"type":"案例分析","topic":"第三部门","question":"政府职能向社会组织转移的理论基础和现实依据；如何推进社会组织承接公共职能","outline":"理论：多中心治理、公共服务供给中的合作与资源互补。\n现实：公共需求多样、专业化服务要求、政府职能转变。\n路径：明确可转移事项和职责；公开遴选与合同约定；经费、能力建设与绩效监督；保持公共责任。","answer":"依据题目已知的职能转移主题，其理论基础是多元治理与合作供给：公共服务所需的信息、专业能力和社区联系分散在政府与社会组织之间，合作可形成互补。现实依据是服务需求日益多样，政府单独直接供给难覆盖所有细分需要。但可转移的是适宜由社会组织承担的具体服务，不是政府的法定责任。推进时应公布事项清单和服务标准，公开遴选有能力的组织，通过合同明确经费、服务对象、质量与数据责任；提供必要的培训和稳定支付，建立公众反馈、第三方评估和退出机制，防止‘一转了之’或利益输送。\n\n选择承接主体时，不能把低价当作唯一标准，应核查其治理结构、专业人员、历史服务记录和财务透明度。合同应规定服务中断时的接续责任，政府保留对标准、预算和基本权益的最终监督。对基层社会组织可通过公开培训和小额项目培育能力，避免资源始终流向少数大型机构；同时防止组织因过度依赖政府购买而失去对服务对象的回应。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共治理、第三部门与公共服务供给相关章节","source":"2024年真题.pdf · 第2页"},{"id":"exam-003ceff22491","year":2023,"type":"名词解释","topic":"公共管理伦理","question":"公共管理伦理","outline":"定义：公共管理主体在行使公共权力、提供公共服务时应遵循的价值和行为规范。\n核心：公共利益、责任、公正与廉洁。\n区分个人品德和组织制度，并说明监督与问责的作用。","answer":"公共管理伦理是公共组织和公职人员在管理公共事务、行使公共权力时应遵守的价值原则与行为规范。它以公共利益为实质，以公共责任为具体要求，要求权力、责任和利益相一致，处理好个人、组织与公众之间的关系。其内容包括守法、廉洁、公正、尊重公众和避免利益冲突。伦理要求既体现为个人职业操守，也要通过制度、监督和组织文化落实。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共管理伦理（OCR第393—398页）；《公共管理真题&答案》名词解释","source":"2023年真题.pdf · 第1页"},{"id":"exam-fbe4c9ba40f0","year":2023,"type":"简答题","topic":"第三部门","question":"第三部门作用","outline":"先界定第三部门的非政府、非营利及公共服务属性。\n作用：回应多样化需求、提供专业服务、动员社会资源、表达社会诉求、参与协同治理。\n补充其能力和问责边界。","answer":"第三部门通常指介于政府与营利企业之间、以公共或互益目标为导向的非营利组织。它能识别细分需求，提供社区服务和专业支持；在政策过程中汇集公众意见、倡导弱势群体利益，并监督公共权力；危机和复杂治理中还可动员志愿者、连接社会资源。这些作用建立在独立性、专业能力和公信力之上。第三部门也可能存在资金依赖、代表性不足和内部治理薄弱等问题，因此政府支持应与信息公开、绩效评价和依法监管相结合。","basis":"陈振明《公共管理学》第二版，第三部门的作用（OCR第326页）","source":"2023年真题.pdf · 第1页"},{"id":"exam-ba954c2e5c96","year":2023,"type":"论述题","topic":"公共管理理论","question":"现代公共管理理论的学派和思潮","outline":"按问题意识组织，而非只背名称。\n可依次写新公共管理的效率与竞争、新公共服务的公民与公共利益、治理理论的多元协作。\n对比政府角色、管理方式、核心价值，再评价各自适用条件。","answer":"现代公共管理理论可从几条脉络把握。传统公共行政以韦伯科层制为代表，强调职权分工、规则和层级，保障稳定与可预期，但容易僵化。公共选择与新公共管理借助经济学和企业管理方法，重视激励、竞争、成本和绩效，改善效率，却可能弱化公共性。新公共服务强调公民、民主参与和公共利益，提醒政府不能只把人当顾客。公共治理及网络治理关注政府、市场和社会的协同，能处理跨界问题，但责任界面较复杂。评价各学派应联系其要解决的问题，在合法、公平、效率和问责之间作综合判断。\n\n这些理论的分歧集中在政府应怎样行使权力、怎样动员资源、怎样衡量成效。科层制提供合法稳定的基础，新公共管理推动结果导向，新公共服务强调民主价值，治理理论解释组织间合作。现实管理往往同时需要四者：公共权力遵循法律和程序，服务流程追求效率，决策保障公众表达，跨界问题通过协作解决；任何单一理论都难覆盖全部情境。","basis":"蔡立辉、王乐夫《公共管理学》第3版，现代公共管理理论相关章节","source":"2023年真题.pdf · 第1页"},{"id":"exam-39ab20fe4764","year":2023,"type":"案例分析","topic":"政府工具","question":"评价环境污染治理中的运动式、一刀切做法，并提出政府工具改进建议","outline":"先抓材料事实：上级压力、集中关停、达标企业也受影响。\n诊断：目标替代、信息失真及单一强制工具的副作用。\n改进：按污染程度分类治理；监测与公开信息；规制、激励和服务组合；建立常态化协同和问责。","answer":"依据题目已知的环境治理情形，运动式检查可能在短期内集中资源、遏制明显违法行为，但若把‘关停数量’等同于治理成效，达标企业也被停产，就偏离了保护环境与正常生产兼顾的政策目标。一刀切通常反映污染数据和企业差异识别不足、层层加码及考核激励单一。改进应以监测数据和排污风险分类处置，对违法排放依法处罚，对达标主体保持稳定预期；同时运用排污许可、信息公开、技术服务和经济激励，建立常态化检查、公众监督与申诉机制。评价以持续减排和合规成本为依据，而非一次行动声势。\n\n运动式治理的根源常在于平时监管不足、信息不透明，临时目标又被压缩成容易统计的关停数量。短期处罚必须与长期制度衔接：建立连续监测、公开排污信息、稳定执法标准，并让企业有清晰的整改期限与复核渠道。对严重违法者严格执法，对轻微且可改正者依法分类处理，才能兼顾环境质量、程序公平和地方经济的长期预期。","basis":"蔡立辉、王乐夫《公共管理学》第3版，政府工具、公共治理与绩效管理相关章节","source":"2023年真题.pdf · 第1—2页"},{"id":"exam-67b5a8f901c9","year":2022,"type":"简答题","topic":"政府工具","question":"什么是用者付费？该工具的优点是什么？","outline":"定义：由公共服务的实际使用者承担相应费用的筹资或供给安排。\n优点：使受益与付费更直接对应，有助于需求表达、成本回收和节约使用。\n评价时补充可及性与公平问题，说明哪些服务不宜简单收费。","answer":"用者付费是由公共服务的直接使用者按使用量或受益程度承担部分成本的供给工具，如某些公共设施使用费。其优点是让受益与付费相联系，减少无差别财政补贴，抑制过度使用，并为设施维护提供收入；收费信号还可帮助了解需求。它适用于受益者较明确、使用可以计量且可排除的服务。若服务关乎基本权利或存在明显正外部性，过高收费会排斥低收入者并损害公共利益，因此应设置减免、价格监管和财政补贴。","basis":"蔡立辉、王乐夫《公共管理学》第3版，用者付费与公共服务供给（OCR第369—371页）","source":"2022年真题.pdf · 第1页"},{"id":"exam-17eecc1f3dc7","year":2022,"type":"论述题","topic":"公共部门绩效","question":"联系实际，如何完善我国公共部门绩效评估？","outline":"先指出评估应服务于绩效改进与公共责任。\n从目标设置、指标体系、数据质量、公众参与、第三方评估、结果反馈六方面展开。\n结合一个公共服务例子，把每项措施对应到可观察的改进。","answer":"完善公共部门绩效评估，首先要把公共价值转化为可观察而不失真的目标：同时考察效率、服务质量、公平、合法性和长期影响，避免只看办件量。指标应按职能和服务对象分类，并建立基线、数据核验和合理的环境修正，防止困难地区因基础差而持续被低估。评估主体应结合内部数据、独立机构、服务对象及公众意见；过程公开并允许申诉，减少‘唯排名’和数字造假。评估结果要反馈预算、培训、流程优化和政策调整，并定期删除诱发形式主义的指标。\n\n具体评估可采用投入、活动、产出、结果四层指标：投入看人员与经费，活动看服务流程，产出看完成量和及时性，结果看问题是否真正改善。结果指标更重要却更难归因，因此应辅以长期跟踪、对照比较和服务对象访谈。评价结果公布时说明数据局限，防止管理者为分数挑选容易服务的人群，或把难办事项排除在统计之外。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共部门绩效管理与评估相关章节","source":"2022年真题.pdf · 第1页"},{"id":"exam-42d51d12b07b","year":2022,"type":"简答题","topic":"公共危机管理","question":"公共危机决策的主体应该包括哪些方面？","outline":"按职责分层：政府统一指挥与决策、专业部门和专家提供研判、基层组织实施、社会组织和公众协同。\n说明信息如何汇集、意见如何进入决策、责任如何明确。\n结合危机类型调整主体组合。","answer":"公共危机决策必须有能够依法统一指挥并承担责任的政府领导机构，同时纳入承担救援、医疗、交通、通信等任务的专业部门和属地基层组织。专家提供风险研判与技术方案，相关企业和社会组织提供设施、物资和志愿服务，受影响公众的需求与反馈也应进入决策。不同主体的作用不能混同：政府负责法定权力、资源统筹和信息发布，专业人员负责科学判断，社会力量协助实施。建立统一信息平台、明确授权和会商程序，才能在时间压力下兼顾速度、专业性与合法性。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共危机管理相关章节；《公共管理真题&答案》危机管理体制题","source":"2022年真题.pdf · 第1页"},{"id":"exam-588350bd6293","year":2021,"type":"简答题","topic":"公共治理","question":"罗兹的公共治理模式","outline":"先写治理网络中组织间相互依赖。\n分点：持续互动、资源交换、协商形成规则、网络具有一定自主性。\n评价它对跨部门公共服务的解释力及协调责任难题。","answer":"罗兹的公共治理模式强调公共事务由相互依赖的政府与非政府组织共同处理。其一，组织之间相互依存，公共部门、私人部门和志愿部门的边界不再截然分明；其二，各主体为交换资源、协商共同目标而持续互动；其三，互动依赖信任和共同认可的博弈规则，通过谈判形成协调；其四，网络具有较强的自组织与自治特征，政府通常只能间接引导，而非完全以命令控制。该模式有助于解释跨组织合作，也提示要另行明确网络中的代表性、公共责任和监督机制。","basis":"蔡立辉、王乐夫《公共管理学》第3版，罗兹公共治理相关论述（OCR第484—485页）；《公共管理真题&答案》罗兹题","source":"2021年真题.pdf · 第1页"},{"id":"exam-d7d5f7d0a844","year":2021,"type":"论述题","topic":"公共部门绩效","question":"公共部门绩效评估的理论意义和实践意义","outline":"理论意义：推动从投入和程序走向结果、回应公共责任与价值问题。\n实践意义：改善资源配置、服务质量、组织学习和外部监督。\n结合实例说明指标设计与结果运用如何决定实际效果。","answer":"理论上，绩效评估把公共组织的投入、活动、产出和结果联系起来，为研究政府行为、检验政策目标和比较管理方式提供依据；它也促使‘效率’与公平、质量和公众回应等公共价值进入同一评价框架。实践上，评估帮助发现资源浪费和服务短板，支持预算配置、流程改进和责任追究，并向公众说明公共资金产生了什么效果。但若目标含混、数据失真或只以排名奖惩，评估会诱发形式主义。因此评估的价值在于持续学习和改进，而非制造单一分数。\n\n绩效评估在理论上还有重要的问责意义：公共权力使用了共同资源，组织需要解释为什么选择某项行动以及结果如何。但‘可测量’不等于‘有价值’，例如只考核处理速度，可能牺牲弱势群体获得充分说明的机会。实践中应将绩效数据与审计、公众评价和专业判断相互印证，使评估既约束滥用资源，也帮助管理者发现哪些制度安排妨碍服务。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共部门绩效管理与评估相关章节；《公共管理真题&答案》绩效评估题","source":"2021年真题.pdf · 第1页"},{"id":"exam-e442c1915884","year":2021,"type":"案例分析","topic":"公共治理","question":"材料中体现了什么治理模式和治理主体？用多中心治理解释王平镇垃圾分类","outline":"从材料提取政府引导监督、第三方运营、村民自治三个主体。\n解释多中心：不同主体分担收集、运输、处理、监督和激励任务。\n评价其资源互补、协同机制及可能的责任界面。","answer":"依据题目已知的王平镇垃圾分类材料，可识别出政府引导与监督、第三方承担部分运营、村民参与自治的多中心治理模式。政府负责规则、经费安排和结果问责；运营方提供收运及处理的专业能力；村民通过分类投放、互相监督和反馈影响日常执行。多中心不等于各自为政，关键在于明确收集、运输、处理、监督各环节的责任，并使数据和激励衔接。其优点是利用社区知识和专业资源，风险是合同责任不清或参与不均衡；评价应看分类质量、处理去向和持续成本。\n\n在这个案例中，村民自治提供了对投放行为的日常监督，第三方运营解决专业收运问题，政府则保障规则的持续性和最终处置合规。若分类只在前端有效而后端混装，或运营合同缺少质量标准，多中心安排仍会失效。因此应公开收运去向与费用，设置村民反馈和合同考核，并在主体之间建立发现问题后的协商和纠错程序。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共治理与网络治理（OCR第75—77页）；《公共管理真题&答案》相关案例","source":"2021年真题.pdf · 第2—3页"},{"id":"exam-f775f856b08f","year":2020,"type":"名词解释","topic":"公共管理伦理","question":"公共管理伦理","outline":"定义公共管理中的价值原则与行为规范。\n核心：公共利益、公共责任、公正与廉洁。\n联系公共权力行使和公共服务说明意义。","answer":"公共管理伦理是公共组织及其成员处理公共事务时应遵循的价值准则和行为规范，以公共利益为核心，以公共责任为具体体现，要求权力行使与责任承担相统一。其内容不仅包括个人廉洁自律，还包括依法行政、公平对待公众、公开说明决定、避免利益冲突，以及组织内部对错误的纠正机制。公共管理伦理最终要落实到可监督的制度和行为中。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共管理伦理（OCR第393—398页）；《公共管理真题&答案》名词解释","source":"2020年长安大学618试题答案.pdf · 第2页"},{"id":"exam-aa873e6b45ec","year":2020,"type":"简答题","topic":"公共危机管理","question":"公共危机管理体制的内容","outline":"总述：危机管理职能、权力与责任的配置安排。\n分点：统一指挥；分级响应和属地管理；部门与地区联动协同。\n分别说明这些安排如何改善信息传递与资源调度。","answer":"公共危机管理体制规定危机应对中机构、人员的职能、权力和责任。其一是统一指挥与综合协调机制，避免多头指令；其二是按事件严重程度分级响应，并坚持属地先期处置与上级支援相结合；其三是跨部门、跨地区的联动协同，整合监测、救援、医疗、交通与物资；其四是信息报告、发布和社会参与机制，使专业机构、企业和公众能在明确规则下协助。制度须通过预案、演练和事后复盘保持可用，不能只停留在组织图上。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共危机管理相关章节；《公共管理真题&答案》危机管理体制题","source":"2020年长安大学618试题答案.pdf · 第5页"},{"id":"exam-2e37a0216310","year":2020,"type":"论述题","topic":"公共权力","question":"公共权力监督的理论依据及完善措施","outline":"理论依据：分权制衡、人民主权与社会契约等视角。\n完善措施：内部层级与专门监督、外部权力机关和司法监督、社会监督。\n联系具体权力运行环节说明公开、追责和纠错。","answer":"公共权力来自公共授权并能影响他人权益，因而必须受约束。分权制衡说明可用法定权限和相互监督防止权力集中；人民主权说明公民有权知情、参与和监督受托权力；委托代理关系也提示掌权者与公众之间存在信息不对称。完善监督要明确权力清单和程序，强化人大、审计、纪检监察及司法等法定监督，保障信息公开、社会监督和申诉举报渠道；对重大决策和资金使用保留可追溯记录，形成发现问题、纠正问题、追究责任的闭环。监督还须保护正常依法履职，避免只重事后追责。\n\n监督体系的关键不是机构越多越好，而是不同主体能否获得真实信息并形成有效制约。事前应控制授权边界和利益冲突，事中应公开程序、预算和关键决定，事后应有审计、复议、诉讼与责任追究。对复杂公共服务还需公众和媒体监督补足内部信息盲点；但监督程序本身也应依法进行，避免以舆论压力替代事实调查和正式责任认定。","basis":"蔡立辉、王乐夫《公共管理学》第3版，公共权力与监督相关章节；《公共管理真题&答案》公共权力监督题","source":"2020年长安大学618试题答案.pdf · 第8页"},{"id":"exam-1cffdae5e708","year":2019,"type":"简答题","topic":"公共组织","question":"韦伯官僚制的特征","outline":"按组织结构作答：明确分工、等级权威、规则和程序、书面文件、专业化任用。\n说明这些设计怎样带来稳定性与可预期性。\n简要评价僵化与回应不足的局限。","answer":"韦伯所说的理想型官僚制以法理性权威为基础，组织按明确职权和专业分工运行，设置稳定的等级体系和逐级负责关系；公务依成文规则、档案和程序处理，人员凭专业资格选任并领取固定报酬，公职与私人财产相分离。这些特征使行政活动具有连续性、可计算性和可追责性，适合处理大规模常规事务。但层级和规则若变成目的本身，会造成程序僵化、部门壁垒和对公众需求反应迟缓，因而需以服务效果和合法性共同评价。","basis":"蔡立辉、王乐夫《公共管理学》第3版，韦伯官僚制理论（OCR第46—49页）","source":"长安大学618真题和答案 2012-2020.docx · 2019部分"},{"id":"exam-fd23a42017d8","year":2019,"type":"简答题","topic":"第三部门","question":"非营利组织的兴起原因","outline":"先界定非营利组织的公共服务属性。\n从公共需求多样化、政府和市场供给不足、公民参与及社会资源动员等方面作答。\n再说明其发展依赖制度环境与组织能力。","answer":"非营利组织兴起，首先因为政府难以独自满足多样、细分的公共需求，市场又缺乏向低收益群体供给服务的动力，形成服务缺口；其次，公民参与意识、志愿精神和社会资源增长，使组织化行动成为可能。社会问题跨部门、专业化程度提高，也需要灵活的社区联系和专业服务。政府购买服务、法律制度和慈善资源为其发展提供条件。不过非营利不等于无需监督，组织仍要回应代表性、资金透明和服务质量问题。","basis":"陈振明《公共管理学》第二版，第三部门兴起原因（OCR第308、321页）","source":"长安大学618真题和答案 2012-2020.docx · 2019部分"}]</script>
<script id="course-data" type="application/json">{"subject":{"code":"618","name":"公共管理学","school":"长安大学","textbook":"蔡立辉、王乐夫《公共管理学》第3版（人大社）","extra":"陈振明《公共管理学》第二版（人大社）","books":["cai-wang-3","chen-2"],"method":"懂 → 练 → 写 → 用 → 复"},"modules":[{"id":"m0","order":0,"chapter":"导学","title":"先看清这张卷子","why":"分数不是靠背得多，而是靠知道每一分从哪里来。这两课先解决「考什么、怎么给分、答案长什么样」，后面每一课都按这个标准练。","examTopics":[],"sections":[],"dual":null,"lessons":[{"id":"l0-1","order":1,"title":"618 这张卷子怎么给分","minutes":12,"tag":"考情"},{"id":"l0-2","order":2,"title":"四类题的答案长什么样","minutes":15,"tag":"方法论"}],"planned":0,"open":true,"examCount":0},{"id":"m1","order":1,"chapter":"第1章","title":"导论：从行政到公共管理","why":"整门课的地基。定义、范畴、研究对象这三件事决定了你后面每一道题的用词准不准；名词解释和简答的「第一句话」几乎都出自这一章。","examTopics":["公共管理","公共组织","公共利益","准政府组织","政府职能"],"sections":["1.1 公共管理学概述","1.2 公共管理学的研究对象","1.3 公共管理学的研究途径和方法"],"dual":{"cai":"第1章 §1.1–1.3","chen":"第1章 导论（1.1 概念、1.4 研究对象与途径）","diff":"两书的定义重心不同：蔡王落在「多元主体＋市场化社会化手段」，陈落在「公共组织提供公共物品和服务、对结果负个人责任」。答题先写蔡王的四零件，再用陈那句补「结果取向」，两种问法都接得住。"},"lessons":[{"id":"l1-1","order":1,"title":"公共管理：一句定义里的四个零件","minutes":14,"tag":"第1章"},{"id":"l1-2","order":2,"title":"为什么叫「公共」：公共性、公共产品与公共利益","minutes":15,"tag":"第1章"},{"id":"l1-3","order":3,"title":"P 途径与 B 途径：这门学科怎么长出来的","minutes":13,"tag":"第1章"}],"planned":0,"open":true,"examCount":1},{"id":"m2","order":2,"chapter":"第2章","title":"理论发展：五种理论怎么长出来的","why":"理论题是 618 的稳定大分项。它真正考的不是背书，而是「这个理论在回答上一个理论的什么缺陷」。按这条线学，论述题才有评价可写。","examTopics":["政治行政二分法","官僚制","新公共管理","新公共服务","公共选择","公共治理","网络治理","帕金森定律","瓦格纳法则"],"sections":["2.1 公共行政理论的演进","2.2 现代公共管理理论的发展"],"dual":{"cai":"第2章 §2.1–2.2","chen":"第1章 导论（范式变化）＋ 第3章 政府改革与治理","diff":"蔡王把理论史单列一章、按「回应上一个理论的缺陷」排队；陈不设理论史专章，把新公共管理放进第3章政府改革，把公共选择放进导论的研究途径。分期按蔡王写，评价可借陈的治理视角；第 8 课的网络治理就是陈书第3章的专章内容。"},"lessons":[{"id":"l2-1","order":1,"title":"传统奠基：威尔逊定边界，韦伯定结构，泰勒定方法","minutes":16,"tag":"第2章"},{"id":"l2-2","order":2,"title":"西蒙与沃尔多的挑战：效率不是唯一答案","minutes":15,"tag":"第2章"},{"id":"l2-3","order":3,"title":"公共选择：用经济学的手术刀切开官僚制","minutes":16,"tag":"第2章"},{"id":"l2-4","order":4,"title":"新公共管理：让管理者来管理","minutes":16,"tag":"第2章"},{"id":"l2-5","order":5,"title":"新公共服务：服务于公民，而不是顾客","minutes":15,"tag":"第2章"},{"id":"l2-6","order":6,"title":"公共治理：从「政府」到「治理」","minutes":17,"tag":"第2章"},{"id":"l2-7","order":7,"title":"理论怎么用：给一段材料，选出对的理论","minutes":18,"tag":"迁移"},{"id":"l2-8","order":8,"title":"网络治理：治理的第三种途径","minutes":15,"tag":"陈书"}],"planned":0,"open":true,"examCount":3},{"id":"m3","order":3,"chapter":"第3章","title":"公共组织","why":"「谁来管」的问题。真题里公共组织、事业单位、第三部门、政府间关系反复出现，名解和简答都爱考。","examTopics":["公共组织","事业单位","第三部门","准政府组织","政府间关系"],"sections":["3.1 公共组织的性质与结构","3.2 行政组织","3.3 非营利组织","3.4 事业单位","3.5 公共组织的变革"],"dual":{"cai":"第3章 §3.1–3.5","chen":"第2章 公共组织 ＋ 第10章 第三部门管理","diff":"蔡王把事业单位、准政府组织放进本章；陈不单列事业单位，而把第三部门独立成章，还给出「第三部门行政模型」。考事业单位照蔡王背；政府间关系（第 5 课）与第三部门（第 6 课）按陈书补，蔡王版对这两块几乎没展开。"},"lessons":[{"id":"l3-1","order":1,"title":"谁来管公共事务：公共组织的六个特征","minutes":14,"tag":"第3章"},{"id":"l3-2","order":2,"title":"组织的骨架：纵向层级与横向分部","minutes":15,"tag":"第3章"},{"id":"l3-3","order":3,"title":"政府之外：非营利组织、准政府组织与事业单位","minutes":16,"tag":"第3章"},{"id":"l3-4","order":4,"title":"公共组织的变革：机构改革为什么总在改","minutes":15,"tag":"第3章"},{"id":"l3-5","order":5,"title":"政府间关系：中央与地方之间那张网","minutes":17,"tag":"陈书"},{"id":"l3-6","order":6,"title":"第三部门：政府与市场之外的第三只手","minutes":16,"tag":"陈书"}],"planned":0,"open":true,"examCount":5},{"id":"m4","order":4,"chapter":"第4章","title":"公共领导","why":"领导体制、领导能力是简答题的常客，也常和公共组织一起出综合题。","examTopics":["领导体制","公共领导"],"sections":["4.1 公共领导概述","4.2 公共领导体制","4.3 公共领导方法","4.4 公共领导能力"],"dual":{"cai":"第4章 §4.1–4.4","chen":null,"diff":"陈书没有公共领导专章：只在导论把「领导科学」列为分支领域，在第2章把领导说成组织的一项核心职能。这一章只能按蔡王背；论述需要拔高时，引陈的「领导是组织管理的一个核心职能」即可。"},"lessons":[{"id":"l4-1","order":1,"title":"从「谁适合当领导」到「怎么领导才有效」","minutes":15,"tag":"第4章"},{"id":"l4-2","order":2,"title":"领导体制：权力、责任和机构怎么配置","minutes":18,"tag":"第4章"},{"id":"l4-3","order":3,"title":"领导方法与领导协调","minutes":13,"tag":"第4章"}],"planned":0,"open":true,"examCount":0},{"id":"m5","order":5,"chapter":"第5章","title":"公共政策（618 侧的概要）","why":"618 也考政策：政策工具、政策分析、政策执行的说法都会出现。这里只学「公共管理视角下的政策」，政策学本身放在 822。","examTopics":["公共政策分析","政策工具"],"sections":["5.1 公共政策概述","5.2 公共政策过程","5.3 公共政策分析","5.4 公共政策发展"],"dual":{"cai":"第5章 §5.1–5.4","chen":"第7章 公共政策","diff":"蔡王只讲公共管理视角的政策概要；陈第7章有完整的政策系统、政策过程与分析方法，并明确定位「公共政策是公共管理的基础、是起点」。政策类简答先引这句定位，再展开。"},"lessons":[{"id":"l5-1","order":1,"title":"政策靠什么落地：自愿、强制、混合三类工具","minutes":15,"tag":"第5章"},{"id":"l5-2","order":2,"title":"工具怎么选：四个因素与一个二维模型","minutes":16,"tag":"第5章"}],"planned":0,"open":true,"examCount":0},{"id":"m6","order":6,"chapter":"第6章","title":"公共人力资源","why":"公务员制度、人力资源变革特点是固定考点，简答题常考「中西方区别」「改革思路」。","examTopics":["公务员制度","人力资源管理"],"sections":["6.1 公共人力资源管理的基本理论","6.2 公共人力资源管理的主要内容"],"dual":{"cai":"第6章 §6.1–6.2","chen":"第8章 人力资源管理","diff":"两书都讲公务员制度与中西差异；陈把这组差异写成分点对比（性质、原则、管理方式……），比蔡王的叙述更像简答骨架。改革思路仍以蔡王的框架为主。"},"lessons":[{"id":"l6-1","order":1,"title":"从「管人」到「开发人」：人事管理与人力资源管理的分界","minutes":14,"tag":"第6章"},{"id":"l6-2","order":2,"title":"公务员制度：三个标准、三类范围与中西之别","minutes":16,"tag":"第6章"}],"planned":0,"open":true,"examCount":0},{"id":"m7","order":7,"chapter":"第7章","title":"公共预算","why":"钱怎么花，就是治理怎么落地。瓦格纳法则、预算调整、预算改革都是真题常客。","examTopics":["公共预算","预算调整","瓦格纳法则"],"sections":["7.1 公共预算的内涵、功能与要素","7.2 中国的公共预算管理","7.3 立法机关预算审查监督"],"dual":{"cai":"第7章 §7.1–7.3","chen":"第9章 公共预算与财政","diff":"陈把预算与财政合成一章，先讲公共财政管理再落到预算改革；蔡王分「要素—编制—人大监督」三块。人大监督题按蔡王，预算改革与公共财政题按陈。"},"lessons":[{"id":"l7-1","order":1,"title":"公共预算：四个维度、五个功能、三个要素","minutes":16,"tag":"第7章"},{"id":"l7-2","order":2,"title":"钱怎么改、谁来看：预算调整与人大监督","minutes":15,"tag":"第7章"}],"planned":0,"open":true,"examCount":0},{"id":"m8","order":8,"chapter":"第8章","title":"政务信息资源管理","why":"信息公开原则、公共数据开发利用是近几年明显升温的考点，常以案例题出现。","examTopics":["政务信息资源","政务信息公开","大数据","公共数据"],"sections":["8.1 政务信息资源管理概述","8.2 政务信息资源管理的内容","8.3 政务信息资源开发利用"],"dual":{"cai":"第8章 §8.1–8.3","chen":null,"diff":"陈书没有政务信息资源专章，只在导论把「数据管理与研究方法」「信息管理系统」列为相关分支。这一章按蔡王学全；引陈时只借他的「数字政府／数据化决策」判断，不借章节。"},"lessons":[{"id":"l8-1","order":1,"title":"政务信息公开：六条原则撑起一道题","minutes":15,"tag":"第8章"},{"id":"l8-2","order":2,"title":"交换共享：数据怎么从部门流向部门","minutes":15,"tag":"第8章"}],"planned":0,"open":true,"examCount":1},{"id":"m9","order":9,"chapter":"第9章","title":"应急管理","why":"近八年出现频率最高的考点之一。体制、预警、生命周期几乎每年换着问法考。","examTopics":["公共危机管理","公共危机管理体制","公共危机预警","危机决策"],"sections":["9.1 应急管理概述","9.2 应急管理体制、机制和法制","9.3 应急管理过程"],"dual":{"cai":"第9章 §9.1–9.3","chen":null,"diff":"陈书只在导论把「危机管理（应急管理）」列为分支领域，没有专章。618 的危机题几乎只能按蔡王的体制—机制—法制与生命周期来答。"},"lessons":[{"id":"l9-1","order":1,"title":"四个概念一条链：风险、突发事件、公共危机、应急管理","minutes":15,"tag":"第9章"},{"id":"l9-2","order":2,"title":"应急管理体制：二十个字怎么落地","minutes":16,"tag":"第9章"},{"id":"l9-3","order":3,"title":"预警与法制：把危机挡在爆发之前","minutes":16,"tag":"第9章"}],"planned":0,"open":true,"examCount":4},{"id":"m10","order":10,"chapter":"第10章","title":"公共管理技术与方法","why":"市场化工具、社会化手段、战略管理，是「怎么办」的答题工具箱；案例题里给建议最好用。","examTopics":["政府工具","社会化手段","战略管理","用者付费","凭单制","特许经营"],"sections":["10.1 传统行政方法","10.2 当代公共管理新方法","10.3 战略管理"],"dual":{"cai":"第10章 §10.1–10.3","chen":"第6章 政府工具 ＋ 第11章 战略管理","diff":"两书的工具三分法一致（市场化工具、工商管理技术、社会化手段），陈逐个讲民营化、用者付费、合同外包的市场逻辑，还把战略管理单独成章。案例题给建议时用陈的细节最出彩。"},"lessons":[{"id":"l10-1","order":1,"title":"政府工具箱：市场化工具与工商管理技术","minutes":17,"tag":"第10章"},{"id":"l10-2","order":2,"title":"战略管理：公共部门的战略为什么不能照搬企业","minutes":15,"tag":"第10章"}],"planned":0,"open":true,"examCount":2},{"id":"m11","order":11,"chapter":"第11章","title":"公共管理规范","why":"伦理、法律、监督三件事。公共管理伦理几乎年年考，是性价比极高的一章。","examTopics":["公共管理伦理","公共权力","公共权力监督","政务信息公开"],"sections":["11.1 公共管理伦理","11.2 公共管理法律","11.3 公共管理监督"],"dual":{"cai":"第11章 §11.1–11.3","chen":"第13章 公共管理伦理","diff":"陈把伦理与「公共责任、官员问责制」绑在一章，答「如何加强伦理建设」时比蔡王多一层问责制度；法律与监督两块仍以蔡王为主。"},"lessons":[{"id":"l11-1","order":1,"title":"公共管理伦理：三个构成要素与一条实质","minutes":15,"tag":"第11章"},{"id":"l11-2","order":2,"title":"公共管理监督：内部三类，外部四种","minutes":15,"tag":"第11章"}],"planned":0,"open":true,"examCount":4},{"id":"m12","order":12,"chapter":"第12章","title":"公共部门绩效评估","why":"论述题的常驻考点。真正难的是「怎么评才不失真」，这一章学的就是评价标准。","examTopics":["公共部门绩效"],"sections":["12.1 绩效评估概述","12.2 指标体系的构建","12.3 评估的程序","12.4 发展与完善"],"dual":{"cai":"第12章 §12.1–12.4","chen":"第12章 绩效管理","diff":"陈把绩效评估的要素压缩成「目标、途径、制度安排、信息系统」四条，适合当论述的框架句；指标体系与评估程序仍按蔡王写更细。"},"lessons":[{"id":"l12-1","order":1,"title":"绩效不等于产出：公共部门绩效评估的内涵","minutes":15,"tag":"第12章"},{"id":"l12-2","order":2,"title":"七个问题：绩效评估为什么容易跑偏","minutes":16,"tag":"第12章"}],"planned":0,"open":true,"examCount":3},{"id":"m13","order":13,"chapter":"第13章","title":"公共部门改革","why":"压轴章。案例题常给一段改革材料，让你用理论解释；它把前面所有理论串一遍。","examTopics":["公共部门改革","政府再造","政府职能","政府失败"],"sections":["13.1 公共部门改革概述","13.2 西方国家公共部门改革","13.3 当代中国行政体制改革"],"dual":{"cai":"第13章 §13.1–13.3","chen":"第3章 政府改革与治理、第4章 政府间关系、第5章 政府作用","diff":"陈把改革拆成治理理论、政府间关系、政府作用（含政府失败）三章，理论工具更多。618 出「政府失败」「政府间关系」时，基本只能靠陈这一条线——本章第 3 课专讲政府失败，第 3 章第 5 课专讲政府间关系，都是按陈书补的。"},"lessons":[{"id":"l13-1","order":1,"title":"西方公共部门改革：三个方向","minutes":15,"tag":"第13章"},{"id":"l13-2","order":2,"title":"中国行政体制改革：八轮改革与一条主线","minutes":15,"tag":"第13章"},{"id":"l13-3","order":3,"title":"政府失败：政府也会失灵","minutes":18,"tag":"陈书"}],"planned":0,"open":true,"examCount":0}],"lessons":{"l0-1":{"id":"l0-1","title":"618 这张卷子怎么给分","goal":"能说出 618 的四类题型、题量与分值，并解释为什么「写得多」和「拿得到分」是两件事。","minutes":12,"tag":"考情","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"先别急着背第一条定义。专业课分数上不去，最常见的不是背得少，而是从一开始就不知道这 150 分是怎么被拆走的。"},{"t":"p","h":"一张卷子的骨架","text":"长安大学 618《公共管理学》是 150 分一张卷。以 2020 年真题卷面为例，它把分值写得很清楚：**名词解释每题 5 分、共 30 分；简答题每题 10 分、共 60 分；论述题每题 20 分、共 40 分；案例分析题共 20 分**。\n\n2024、2025、2026 三年的卷面结构也稳定：6 道名词解释、6 道简答、2 道论述、1 道案例分析（案例通常分两小问）。也就是说，**名解和简答就占了 90 分**——这两块不是「送分题」，而是决定你能不能上线的底盘。"},{"t":"cmp","h":"四类题分别在考什么","head":["题型","分值","它其实在考","最容易丢分的地方"],"rows":[["名词解释","5 分 × 6","你能不能把概念说到边界上","只写一句大白话，没有要素、没有特征"],["简答题","10 分 × 6","你能不能把一个知识点拆成几条并列关系","写成一大段，阅卷找不到分点"],["论述题","20 分 × 2","你能不能讲清机制、再结合现实作评价","只有观点没有机制，或通篇举例没有理论"],["案例分析","20 分 × 1","你能不能用理论解释一段陌生材料","复述材料，或套理论不贴材料"]]},{"t":"p","h":"分数是按点给的","text":"专业课阅卷是**按得分点给分**：一道 10 分的简答题，标准里通常有 4—5 个关键点，每点 2 分左右。你的答案如果全写在同一个自然段里，阅卷老师要在几百份卷子里去「找」你的点，找不到就按没有处理。\n\n所以从今天开始，练习的默认格式是：**先一句话总述，再分点，每点第一句就是关键词**。这不是形式主义，是把分数从「也许有」变成「看得见」。"},{"t":"quote","text":"一、名词解释（每题 5 分，共 30 分）……二、简答题（每题 10 分，共 60 分）……三、论述题（每题 20 分，共 40 分）……四、案例分析题（共 20 分）","cite":"2020 年真题 · 公共管理学卷面"},{"t":"ask","q":"既然按点给分，为什么把教材上那一整段原文抄上去，反而可能丢分？","a":"因为原文通常把定义、背景、引文、例子混在一起，关键点被淹没。阅卷要的是「这个点有没有」，不是「这段话像不像教材」。改写成分点、每点先给关键词，才是把内容翻译成得分点。"},{"t":"p","h":"180 分钟怎么分","text":"分值就是时间。按「每分约 1.1 分钟」配时间，并留 10 分钟检查：名解 6 题共 40 分钟（6—7 分钟一个），简答 6 题共 70 分钟（11—12 分钟一个），论述 2 题共 40 分钟（20 分钟一个），案例 20 分钟，合计 170 分钟，余 10 分钟检查补漏。\n\n注意名解不要恋战：**5 分题写 7 分钟是上限**，超过就是在偷简答和论述的时间，而后面每漏一个分点都是 2 分。"},{"t":"tip","text":"本站每一次「动手写」都带计时和得分点清单。先按真实时间写，再自己对点，最后才看示范——顺序反了就没有练习效果。"}],"concepts":[{"term":"按得分点给分","def":"阅卷依据预先确定的若干关键点计分，答到即得分，未答到不给分。","points":["点的数量与分值由命题和评分细则决定","表达是否成段不影响给分，能否辨认出点才影响"],"exam":"所以名词解释要写成「定义 + 要素 + 边界」三层，而不是一段散文。"}],"exercises":[{"t":"choice","q":"618 的名词解释通常每题多少分？","opts":["5 分","10 分","15 分","20 分"],"a":0,"why":"2020 年卷面写明「每题 5 分，共 30 分」，即 6 道题。名解单题分值低但题量大，合计 30 分，不能轻视。"},{"t":"choice","q":"按 2020 年卷面，简答题合计占多少分？","opts":["30 分","40 分","60 分","90 分"],"a":2,"why":"简答每题 10 分、共 6 题，合计 60 分。加上名解 30 分，前两类题已经是 90 分。"},{"t":"judge","q":"论述题只有 2 道，所以准备时可以把重心完全放在名词解释上。","a":false,"why":"论述 2 道就有 40 分，占总分近三成，且是拉开差距的地方。名解 6 道只有 30 分，两者必须同时准备。"},{"t":"multi","q":"下面哪些做法更容易让阅卷老师「看到」你的得分点？","opts":["每题开头先写一句总述，交代「是什么、从哪几方面答」","分点书写，每点第一句先给关键词再展开","把教材原文整段照抄，保证内容完整","每点后面用一句话落到公共管理的实际或例子"],"a":[0,1,3],"why":"总述定框架、分点立关键词、例子证成，三者都是让点「可辨认」的技术。整段照抄会让关键点淹没在无关信息里，反而降低辨识度。"},{"t":"order","q":"把案例分析的作答步骤排成合理顺序。","items":["提炼材料中的关键事实","判断这属于哪个理论或考点","用理论机制解释这些事实","提出改进建议或作出评价"],"a":[0,1,2,3],"why":"案例题最忌讳先套理论再看材料。顺序必须是「材料 → 理论 → 分析 → 建议」，这样每一条分析都能指回具体事实，不会变成空谈。"}],"evidence":[{"src":"exam:2020年真题.pdf","quote":"名词解释（每题5 分，共30 分）"},{"src":"exam:2020年真题.pdf","quote":"简答题（每题10 分，共60 分）"},{"src":"exam:2020年真题.pdf","quote":"论述题（每题20 分，共40 分）"}],"moduleId":"m0","order":1},"l0-2":{"id":"l0-2","title":"四类题的答案长什么样","goal":"能默出名词解释、简答、论述、案例四类题的作答骨架，并判断一份答案缺了哪一层。","minutes":15,"tag":"方法论","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"同一个知识点，写成名解能拿 5 分，写成简答能拿 10 分，写成论述能拿 20 分。区别不在内容多少，而在**骨架**。"},{"t":"p","h":"名词解释：三层，三五句话","text":"**第一层给定义**（是什么，含主体和目的），**第二层给要素或特征**（通常是 2—3 条，能并列），**第三层给边界或意义**（它不是什么、为什么要它）。\n\n5 分的题，写成三到五句话最稳。三层缺一层，通常扣 1—2 分；只有定义没有特征，基本就是 2 分。"},{"t":"p","h":"简答题：总述 + 分点 + 收束","text":"**总述一句**说明从哪几个方面答（相当于给阅卷一个目录），**分点 3—4 条**，每点第一句是关键词，**收束一句**点出意义或条件。\n\n10 分题的分点最好带序号：一是……二是……三是……。看起来朴素，但它直接决定老师能不能数出你有几个点。"},{"t":"p","h":"论述题：概念 → 机制 → 实例 → 评价","text":"论述和简答的差别是**要有机制和评价**。概念交代清楚后，必须回答「它为什么会这样运作」——也就是因果链条；然后结合一个真实的政策或管理现象；最后给出评价：它解决了什么、又带来什么新问题。\n\n只罗列观点没有机制，最多拿一半分；有机制但没评价，通常再丢 4—5 分。"},{"t":"p","h":"案例分析：材料 → 理论 → 分析 → 建议","text":"案例题给的是陌生材料，考的是**迁移**。第一步从材料里提炼 3—4 条关键事实（谁做了什么、结果如何）；第二步判断它对应哪个考点；第三步用该考点的机制逐条解释事实；第四步给建议，建议要分清主体或阶段，不能只说「加强重视」。\n\n最忌两种写法：只复述材料（0 分分析），或只讲理论不贴材料（阅卷无法对应）。"},{"t":"cmp","h":"一眼看清四种骨架","head":["题型","骨架","长度","判断你是否合格的一句话"],"rows":[["名词解释","定义 → 特征/要素 → 边界","3—5 句","读完能复述出这个概念和它的邻居有什么不同"],["简答","总述 → 3—4 个分点 → 收束","300—500 字","每个分点的第一句都是关键词"],["论述","概念 → 机制 → 实例 → 评价","600—900 字","能指出这个机制成立的边界条件"],["案例","事实 → 理论 → 分析 → 建议","500—800 字","每条分析都能指回材料里的哪句话"]]},{"t":"ask","q":"为什么案例题的建议部分最容易写成废话？","a":"因为「加强领导、完善制度、提高认识」这类话不需要看材料也能写。真正有效的建议必须从材料里的具体缺陷出发，并指定谁来改、改什么环节、怎么检验。判断标准很简单：把这段建议拿去给另一个案例，如果照样说得通，它就是废话。"},{"t":"tip","text":"下一课的写作练习只要求你写「总述句 + 三个分点的标题」，不写内容。这是刻意设计的：搭骨架的能力可以脱离背诵单独训练，而且它决定你考场上的上限。"}],"concepts":[{"term":"作答骨架","def":"一类题型固定采用的段落顺序，用来保证得分点可辨认、逻辑不断层。","points":["骨架是形式，不是套话：每层都必须填真内容","四种骨架对应四种分值规模，混用会直接掉档"],"exam":"考场上先想骨架、再想内容，比先想内容再组织语言快得多。"}],"exercises":[{"t":"choice","q":"「社会公平是公共行政的核心价值，它要求政府提供服务的平等性，强调公共管理者在决策中的责任，并推动政治权力与经济福利向缺乏资源支持的人倾斜。」这段话最像哪种题型的答案？","opts":["名词解释（定义 + 要素）","论述题（机制 + 评价）","案例分析（材料 + 建议）","简答题的总述句"],"a":0,"why":"它有定义、有并列的要素（平等性、责任、倾斜），没有机制推演也没有结合实例，是典型的名词解释写法。"},{"t":"multi","q":"一份 20 分的论述题答案，下面哪些内容是「必须有」的？","opts":["对核心概念的界定","该理论或机制为什么会这样运作的因果解释","一个能对上具体情境的实例或材料","对该理论局限或适用条件的评价"],"a":[0,1,2,3],"why":"四层齐全才是 20 分答案。缺机制最多一半分，缺评价再丢 4—5 分，缺实例会让机制变得无法验证。"},{"t":"judge","q":"简答题写得越长越安全，哪怕没有分点。","a":false,"why":"简答是按点给分，长度不产生分数。没有分点会让关键点被埋掉，还会挤占后面论述和案例的时间。"},{"t":"order","q":"把案例分析的作答步骤排成正确顺序。","items":["从材料中提炼关键事实","定位对应考点或理论","用理论机制解释事实","按主体或阶段提出建议"],"a":[0,1,2,3],"why":"先材料后理论，才能保证分析贴着材料；顺序颠倒就会变成「套模板」。"},{"t":"multi","q":"下面哪些「建议」属于可以得分的写法？","opts":["针对材料中「分类后混装运输」的缺陷，要求运营方公开收运去向并纳入合同考核","加强领导，提高认识，狠抓落实","建议由属地政府承担前端投放监督，第三方负责后端处理，并建立村民反馈渠道","完善相关制度，营造良好氛围"],"a":[0,2],"why":"能得分的建议要指得出「针对材料的哪个缺陷、由谁、改哪个环节」。B、D 换到任何案例都成立，正是废话的典型。"}],"write":{"type":"简答题","prompt":"题目：简述公共部门绩效评估的意义。\n\n本次只写两样东西：①一句总述（说明你从哪几个方面答）；②三个分点的标题（每个不超过 15 字，必须是并列的不同维度）。不写展开内容。","minutes":8,"points":["总述句交代了「从哪几个方面答」，而不是重复题目","三个分点是三个不同维度（如：改进管理 / 强化责任 / 服务公众），不是同一意思的三种说法","每个分点标题的第一句就是关键词，能单独读懂","分点之间是并列关系，没有互相包含"],"sample":"总述：公共部门绩效评估的意义可以从管理改进、责任落实和公众信任三个层面来看。\n一是推动管理改进：以结果指标发现资源浪费和服务短板，把预算与流程调整到更有效的环节。\n二是强化公共责任：要求公共组织说明资源投入产生了什么结果，形成可追溯的问责依据。\n三是增进公众信任：公开评估的标准与结果，使公众能判断公共服务是否回应了自己的需要。","tip":"三个分点必须是三个不同维度。如果你写出来的是「提高效率、提升效果、增强效能」，那其实是一个维度换了三种说法，阅卷只会算一个点。"},"evidence":[{"src":"exam:2024年真题.pdf","quote":"三、论述题"},{"src":"exam:2021年真题.pdf","quote":"用多中心治理体系理论来解释王平镇垃圾分类的特点"}],"moduleId":"m0","order":2},"l1-1":{"id":"l1-1","title":"公共管理：一句定义里的四个零件","goal":"能背出教材定义，并把定义拆成主体、目的、手段、对象四个零件，说清公共管理与公共行政的区别。","minutes":14,"tag":"第1章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「公共管理」这四个字，很多人能背一句定义，但一遇到「公共管理与公共行政有什么区别」，就只会说「一个是管，一个是行政」。这句话之所以写不出来，是因为定义没有被拆开过。"},{"t":"p","h":"先看教材的原句","text":"蔡立辉、王乐夫版把定义压成了一句话，主体、目的、手段、对象全都塞在里面。先照原文读一遍，再拆。"},{"t":"quote","text":"公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称。","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 15 页"},{"t":"p","h":"四个零件","text":"把这句话拆开，正好是四个可以单独出题的部分：\n\n**主体**——以政府行政组织为核心的**多元主体**。\n**目的**——增进**公共利益**。\n**手段**——**市场化、社会化**的手段和方法。\n**对象**——**公共事务**管理与**公共服务**提供。\n\n这四个零件不是装饰。名词解释缺零件会被扣分，简答和论述则直接沿用它来搭骨架：问「如何改进」，你就按「主体—手段—对象」找改进点；问「为什么」，你就按「目的」倒推。"},{"t":"ask","q":"定义里为什么一定要写「多元主体」，只写「政府」不行吗？","a":"不行，那样就退回成「行政管理」了。公共管理之所以成为一个独立概念，前提正是承认政府之外还有非营利组织、企业和社区参与公共事务。少写这三个字，概念就丢了它区别于公共行政的核心。"},{"t":"p","h":"公共管理与公共行政到底差在哪","text":"教材把差别落在三组对比上：行政管理更重视**设计**，公共管理更重视目标实现的**运作过程**；行政管理更强调**政治的、法律的和行政的手段**，公共管理更强调**管理的、市场化和社会化的手段**；行政管理更关注**过程、程序和内部取向**，公共管理更关注**结果和外部取向**。\n\n记住这个规律的抓手：**行政向内（规则、程序、内部），管理向外（结果、对象、市场）**。这三组对比本身就是简答题的标准答案。"},{"t":"cmp","h":"三组对比（简答可直接照此分点）","head":["维度","行政管理（公共行政）","公共管理"],"rows":[["关注点","设计、规划","实现目标的具体运作过程"],["主要手段","政治的、法律的、行政的手段","管理的、市场化的、社会化的手段"],["取向","过程、程序、内部取向","结果、外部取向、对结果负责"]]},{"t":"p","h":"顺带说清第三层关系","text":"教材的立场是：公共管理是公共行政的**分支学派**，而不是取代公共行政的新范式；两者在主体、内容范围、目标这些基本原则上仍然一致，公共管理不能替代公共行政的全部。\n\n所以如果题目问「公共管理能否取代公共行政」，标准表态是**不能**，并给出理由：行政管理是更高层次的管理，公共管理是执行或实施过程的管理。"}],"concepts":[{"term":"公共管理","def":"以政府行政组织为核心的多元主体，为增进公共利益，运用市场化、社会化手段管理公共事务、提供公共服务的活动总称。","points":["主体：以政府行政组织为核心的多元主体","目的：增进公共利益","手段：市场化、社会化","对象：公共事务管理与公共服务提供"],"exam":"名词解释按四个零件写即得分；简答问「区别」时用三组对比。"},{"term":"公共行政","def":"政府依法执行公共政策、履行规制与服务职能的活动，更重视设计、程序与内部取向。","points":["与公共管理在主体、范围、目标上基本一致","在手段与取向上有明显差异"],"exam":"常与「公共管理」成对出现，考比较。"}],"exercises":[{"t":"multi","q":"教材定义中「市场化、社会化」这两个词，对应的是定义的哪个零件？","opts":["目的","手段","对象","主体"],"a":[1],"why":"市场化、社会化修饰的是「手段和方法」。这也是公共管理与传统公共行政最直观的分界：行政靠命令和规则，管理还会用市场和社会机制。"},{"t":"choice","q":"下面哪一句最准确地概括了公共管理与公共行政的差别？","opts":["公共管理管结果，公共行政管过程","公共管理用市场和社会的手段、向外对结果负责；公共行政更重设计、程序和内部规则","公共管理只管企业，公共行政只管政府","公共管理是新学科，公共行政已经不存在了"],"a":1,"why":"教材的差别落在「设计/运作、手段、内部/外部取向」三组对比上。A 说得太粗糙，C、D 与教材立场不符——公共管理并不取代公共行政。"},{"t":"judge","q":"教材认为公共管理已经取代公共行政，成为一种独立范式。","a":false,"why":"教材明确主张公共管理是公共行政的分支学派；连胡德也承认尚未形成关于公共管理的普遍共识。答成「已取代」会直接丢分。"},{"t":"choice","q":"「以政府行政组织为核心的多元主体」中，「核心」二字的作用是什么？","opts":["说明政府不重要，只是其中之一","说明政府不是唯一主体，但在多元主体中仍居核心地位","说明只有政府算公共管理主体","没有实际含义，只是修辞"],"a":1,"why":"「核心」既否定了「政府唯一」，也否定了「政府无关」。这个词组是教材立场的精确表达，答多主体的题时要保留它。"},{"t":"order","q":"按定义的四个零件，把作答顺序排好（问：简述公共管理的含义）。","items":["指出主体是多元主体、政府为核心","指出目的是增进公共利益","指出手段是市场化与社会化","指出对象是公共事务与公共服务"],"a":[0,1,2,3],"why":"按定义的叙述顺序作答，既不会漏零件，也让阅卷一眼看到结构。"}],"write":{"type":"名词解释","prompt":"用 5 分钟写「公共管理」的名词解释（5 分）。","minutes":5,"points":["给出了完整定义（主体 + 目的 + 手段 + 对象四个零件都在）","点出「以政府行政组织为核心」这一限定","至少写出一条特征或与公共行政的区别","结尾有一句边界或意义（如：不等于取代公共行政）"],"sample":"公共管理是以政府行政组织为核心的多元主体，为增进公共利益，运用市场化和社会化手段管理公共事务、提供公共服务的各种活动的总称。其主体包括政府部门与非政府公共组织，政府居于核心但不垄断；手段上强调管理的、市场的与社会的方式；对象是公共事务与公共服务。公共管理与公共行政在主体和目标上基本一致，但更关注运作过程与结果，是公共行政中重视技术与方法的分支。","tip":"5 分题的常见结构是「定义 + 特征 + 边界」，三到五句。不要一上来就写「随着社会发展……」，那属于论述的开头，会浪费名解的时间。"},"evidence":[{"src":"cai-wang-3","pages":[15],"quote":"公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称","context":"…平新时代中国特色社会主义思想是这个时期我国公共管理学的指导理论，习近平总书记“治国理政”的系列重要论述是中国气派、中国特色公共管理理论的重要组成部分。综上所述，公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称。公共管理学是研究以政府行政组织为核心的多元主体进行公共事务管理和公共服务提供的活动及其规律的学问。1.1.2公共管理学的概念范畴范畴（category）就是基本的概念体系。思想体系不同，也就是概念体系不同，或范畴不同。公共管理学的理论体系…","contextPage":15},{"src":"cai-wang-3","pages":[17,18],"quote":"公共管理更加重视实现公共行政目标的具体“运作”过程","context":"视“设计”，公共管理更加重视实现公共行政目标的具体“运作”过程；行政管理（公共行政）更加强调政治的、法律的和行政的手段，公共管理更加强调管理的、市场化和社会化的手段；行政管理（公共行政）更加关注过程、程序和遵照别人的指示办事以及内部取向，公共管理更加关注结果、对结果的获得负个人责任和外部取向①。公共管…","contextPage":18},{"src":"cai-wang-3","pages":[18],"quote":"公共管理更加强调管理的、市场化和社会化的手段","context":"视“设计”，公共管理更加重视实现公共行政目标的具体“运作”过程；行政管理（公共行政）更加强调政治的、法律的和行政的手段，公共管理更加强调管理的、市场化和社会化的手段；行政管理（公共行政）更加关注过程、程序和遵照别人的指示办事以及内部取向，公共管理更加关注结果、对结果的获得负个人责任和外部取向①。公共管理理论吸取了现代经济学和工商企业管理的理论与方法，包括从“理性人”的假设中获得绩效管理的依据；从公共选…","contextPage":18},{"src":"chen-2","pages":[20],"quote":"公共管理是公共组织提供公共物品和服务的活动，它主要关注的不是过程、程序和遵照别人的指示办事以及内部取向，而更多的是关注取得结果和对结果的获得负个人责任。","note":"陈书的定义落在「提供公共物品和服务」和「对结果负个人责任」，答题时接在蔡王四零件后面。","context":"…共行政学院主要是培养政府的职业文官的学科及机构）。尽管“公共管理”的确也包含了“行政”的许多内涵，但有以最低的成本达到目标以及管理者为取得结果负责的内涵。所以，公共管理是公共组织提供公共物品和服务的活动，它主要关注的不是过程、程序和遵照别人的指示办事以及内部取向，而更多的是关注取得结果和对结果的获得负个人责任。在过去的20多年，西方公共部门的管理实践发生了深刻的变化，过去被称为“公共行政”的活动，现在更经常地被称为“公共管理”活动；过去那些有着“行政官员”头衔的人，现在更多地被称为“管理者（或经理）”。正如英国学者波立特（ChristopherP…","contextPage":20}],"moduleId":"m1","order":1},"l1-2":{"id":"l1-2","title":"为什么叫「公共」：公共性、公共产品与公共利益","goal":"能解释「公共」的三层含义，判断一个物品是纯公共产品、准公共产品还是私人物品，并说清公共管理为什么不能照搬企业管理。","minutes":15,"tag":"第1章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"「公共」如果只是个形容词，这门课就没必要单独立科了。真正要回答的是：什么东西一沾上「公共」，供给方式就得变？"},{"t":"p","h":"沃尔多：从三个方向逼近「公共」","text":"沃尔多先确定「行政」的含义，再追问「公共」这个修饰词表示什么特征。他说可以从三方面理解：**一是**根据政府、国家之类的词来定义，涉及主权、合法性、普遍福利；**二是**按某个社会中人们认为有哪些公共职能或公共活动的认识，从经验上下定义——缺点是因人而异、难以统一；**三是**按政府所执行的职能或活动的常识性方法来定义——缺点是有许多政府行为并不稳定或不确定。"},{"t":"p","h":"从「公共」长出的三个概念群","text":"教材顺着沃尔多把「公共」当作基本范畴，向下分出：**公共主体**（以政府为核心的各类公共部门、非营利部门）；**公共客体**（公共权力、公共事务、公共秩序、公共利益、公共政策、公共产品与公共服务）；**公共行为**（行使公共权力、提供公共服务的方式与手段）。\n\n所以遇到「公共行政学/公共管理学的基本范畴是什么」这类题，答案就是「公共」，其余概念都由它延伸出来。"},{"t":"p","h":"公共产品：两个特征决定供给方式","text":"**非竞争性**：一个使用者消费，并不减少它对其他使用者的供应。\n**非排他性**：无法把某些使用者排除在消费之外，或排除成本极高。\n\n两个特征都满足的是**纯公共产品**（国防、公共安全、外交、法规政策、环境保护、基础研究）。只满足一个、或两个都不完全但外部收益较大的，是**准公共产品**（道路、能源、交通、通信、教育、广播电视、社会保障）。\n\n逻辑链是：非排他性导致收费不可能 → 私人没有供给积极性 → 一般由政府或其他公共部门提供。准公共产品之所以重要，是因为它证明这条链并非绝对：高速公路设收费站后就可以私人投资、私人收费，供给方式随之改变。"},{"t":"ask","q":"既然准公共产品可以由私人提供，那政府是不是就可以从这些领域退出来？","a":"不能这么推论。准公共产品仍有较大的外部收益，完全按市场定价会把低收入者排除在外，造成公共利益的损失。正确的说法是：供给方式可以多元（政府、市场、社会合作），但政府仍要为保证有效供给营造环境、守住公平底线。"},{"t":"p","h":"为什么不能照搬企业管理","text":"教材给了五条差别：**性质不同**（公共管理是公共事务领域，在政治环境中运作）；**使命不同**（服务公众、实现公共利益，而非营利）；**效率意识强弱不同**（经费来自公共财政，缺少削减开支的诱因）；**责任的性质与范围不同**（责任机制扩散、更强调公共责任）；**管理的广泛性与复杂性不同**（人事管理更复杂、更严格）。\n\n这五条是「公共管理与工商企业管理的区别」这道简答题的标准骨架。它的深层意思是：企业以利润为单一尺度，公共管理没有单一尺度，所以才有后面所有的绩效评估难题。"},{"t":"quote","text":"公共产品也称为公共商品、公共物品或公共品，是指用于满足社会公共消费需要的物品、劳务或服务，是具有消费的非竞争性和非排他性、自然垄断性以及收费困难等特征的物品。","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 19 页"},{"t":"tip","text":"判断公共产品时不要凭感觉。先问「多一个人用会不会减少别人的量」，再问「能不能把人挡在外面」。两个都答「是/不能」，才是纯公共产品。"}],"concepts":[{"term":"公共产品","def":"用于满足社会公共消费需要，具有消费的非竞争性和非排他性（及自然垄断性、收费困难）的物品、劳务或服务。","points":["两个核心特征：非竞争性、非排他性","分为纯公共产品与准公共产品","与私人物品的划分不由社会制度决定"],"exam":"名解按「定义 + 两特征 + 分类」写；简答常问「准公共产品为什么可以私人提供」。"},{"term":"准公共产品","def":"只具备非排他性和非竞争性之一，或两者都不完全具备但外部收益较大的产品。","points":["介于纯公共产品与私人物品之间","例：道路、交通、教育、社会保障","可通过收费等技术条件转为市场供给"],"exam":"是「政府提供 vs 市场提供」类论述题的关键论据。"}],"exercises":[{"t":"choice","q":"国防属于哪一类？","opts":["纯公共产品","准公共产品","私人物品","俱乐部产品"],"a":0,"why":"国防同时具备非竞争性和非排他性：多保护一个人不减少对他人的保护，也无法把某个人排除在国防之外。教材把它列为纯公共产品的典型。"},{"t":"choice","q":"高速公路通常被归为准公共产品，最主要的原因是：","opts":["它由政府修建","它可以通过设置收费站实现排他，但多一辆车仍会拥挤","它完全不能收费","它只对部分人开放"],"a":1,"why":"准公共产品是「两个特征只满足一个或都不完全」。高速公路能通过收费站排他（所以可能私人供给），但使用量增加到一定程度会出现拥挤，非竞争性不完整。"},{"t":"multi","q":"按教材，公共管理与工商企业管理的差别包括哪些？","opts":["管理性质不同：公共管理处于政治环境中，是公共事务领域","使命不同：公共管理以服务公众、实现公共利益为目的","效率意识强弱不同：公共管理经费来自公共财政，成本—效益意识较弱","责任性质不同：公共管理更强调公共责任与社会责任"],"a":[0,1,2,3],"why":"四条都在教材列出的差别里（第五条是管理的广泛性与复杂性）。这四条正好可以拼成一道 10 分简答。"},{"t":"judge","q":"公共产品与私人物品的划分由社会制度决定，公有制国家的物品都是公共产品。","a":false,"why":"教材明确说这种划分与社会制度没有必然联系；但公共产品的范围会受社会制度和发展程度影响，例如森林、矿产在公有制国家往往具有较强公共性。"},{"t":"choice","q":"沃尔多认为从「经验」角度给「公共」下定义的主要缺点是什么？","opts":["涉及主权与合法性，过于抽象","人们认识不同，很难有统一的规定","政府行为不稳定、不确定","无法与私人部门比较"],"a":1,"why":"三种途径各有缺点：依政府/国家定义太抽象，依经验定义难以统一，依职能的常识性方法则受制于政府行为的不稳定。C 是第三种途径的缺点。"}],"write":{"type":"名词解释","prompt":"用 6 分钟写「公共产品」的名词解释（5 分）。","minutes":6,"points":["给出定义并点明「满足社会公共消费需要」","写出两个核心特征：非竞争性、非排他性","给出分类：纯公共产品与准公共产品，并各举一例","有一句推理或边界（如：因此一般由政府提供，但准公共产品可市场化）"],"sample":"公共产品是用于满足社会公共消费需要的物品、劳务或服务，具有消费上的非竞争性和非排他性。非竞争性指一个使用者消费不减少对他人的供应，非排他性指无法以较低成本把他人排除在消费之外。同时具备两特征的是纯公共产品，如国防、环境保护；只具备其一或外部收益较大的是准公共产品，如道路、教育。由于收费困难、私人供给动力不足，公共产品一般由政府或其他公共部门提供。","tip":"这类名解最容易被扣分的地方是只写「非竞争性、非排他性」两个词却不解释。5 分题里，一个词各值 1 分，一句解释才让它变成得分点。"},"evidence":[{"src":"cai-wang-3","pages":[16],"quote":"他认为可以从三个方面来理解“公共”的含义","context":"…书中，先确定了“行政”的含义，然后提出了三个互相联系的问题：“什么是‘公共’行政？‘公共’这一修饰词表示什么特征？公共行政怎样区别于一般行政，种怎样区别于属？”他认为可以从三个方面来理解“公共”的含义：一是可以根据政府、国家之类的词给“公共”下定义，这就涉及主权、合法性、普通福利等法律概念、哲学概念和普通政治理论方面的问题；二是可以按照在某种社会中人们认为有哪些公共职能或公共活动的认识简单地从经验方面给“公共”下定义。这样一来，由于人们…","contextPage":16},{"src":"cai-wang-3","pages":[19],"quote":"是指用于满足社会公共消费需要的物品、劳务或服务，是具有消费的非竞争性和非排他性、自然垄断性以及收费困难等特征的物品","context":"使得对公共产品的消费进行收费是不可能的，因而私人提供者就没有提供这种产品的积极性①。综上所述，公共产品也称为公共商品、公共物品或公共品，是指用于满足社会公共消费需要的物品、劳务或服务，是具有消费的非竞争性和非排他性、自然垄断性以及收费困难等特征的物品。与公共产品相对应的是私人物品，即具有消费上的竞争性和排他性等特征的物品。公共产品的上述特征以及规模效益大、初始投资量大的特点，使得私人企业或市场不愿意提供、难以提供或提供难以做到有效益。因而，公共产品一般由政府或其他公共部门提供，而私人物…","contextPage":19},{"src":"cai-wang-3","pages":[21,22],"quote":"公共管理与工商企业管理是既相联系又相区别的两类管理活动","context":"…包括计划、组织、指挥、协调、人事、预算和控制等在内的一般的管理职能，但由于管理所要达成的目标不同、管理对象及内容不同、管理行为的依据不同，它们之间又存在着差异。公共管理与工商企业管理是既相联系又相区别的两类管理活动。其差别主要表现在：1.管理性质不同公共管理是国家、政府以及其他公共组织的职能、活动范围，与公共利益相关，具有广泛的社会公众参与，以行使公共权力为基础，是一个公共的事务领域。工商企业管","contextPage":21},{"src":"chen-2","pages":[20],"quote":"公共部门是公共事务的管理者和公共服务的提供者，广义上的公共部门包括政府机构、公用事业、公共事业、非政府公共机构等部门以及各种不同组织的公共层面","note":"陈书用「广义／狭义公共部门」给「公共」划范围，可与蔡王的公共产品两条特征对照。","context":"…职位占有者的角色、地位、期望、行为方式以及他们与政治家和公民关系变化的一种体现。1.1.2“公共部门”和“公共物品”人们习惯将经济领域划分为公共部门和私人部门。公共部门是公共事务的管理者和公共服务的提供者，广义上的公共部门包括政府机构、公用事业、公共事业、非政府公共机构等部门以及各种不同组织的公共层面；狭义上的公共部门仅包括政府机构以及依据政府决策产生的机构和部门，是最纯粹的公共部门。政府以公共利益为导向，其职能是对社会公共事务进行管理，无偿占有社会公共资源，并为社会提供公共物品和公共服务。除政府机构外，还存在公用事业、公共事业、非政府…","contextPage":20}],"moduleId":"m1","order":2},"l1-3":{"id":"l1-3","title":"P 途径与 B 途径：这门学科怎么长出来的","goal":"能说清 P 途径与 B 途径的来源和差别，并用它解释公共管理学为什么长期没有形成独立范式。","minutes":13,"tag":"第1章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2025 年简答第一题就是「B 途径与 P 途径异同」。这道题不需要背很多，但如果你不知道这两个字母指什么，一分都拿不到。"},{"t":"p","h":"两条来路","text":"公共管理这个概念是从两个方向汇合的：一条来自**公共政策学院**（Policy），关注政策分析、政策执行与项目评估；另一条来自**商学院**（Business），关注战略、组织绩效与管理技术。教材把前者称为 **P 途径**，后者称为 **B 途径**，两者逐渐汇合，形成了公共管理这个新兴的分支学科。"},{"t":"p","h":"博兹曼给的公共管理特征","text":"博兹曼在《公共管理：艺术的现状》中把政策途径与商业途径加以综合，归纳出五条特征：既关心战略又关心过程，但以**外部焦点**为取向；在强调「硬」知识（管理方法、定量分析技术）的同时，继续关注「软」知识（政治环境、价值）；以**资深公共管理者**为方向；「公共」的含义更广，非营利组织、私人企业的公共方面都包含其中；关注**理论和规范研究**。"},{"t":"p","h":"凯特尔：公共管理与公共行政不是一回事","text":"凯特尔把公共管理的特点归为五条：**排斥公共行政和政策执行研究**（公共管理学者多来自各种学科背景，认为前者对政策和管理没有多大指导意义）；是一种**乐观的规范研究领域**（政策执行研究致力于说明项目为何不起作用，公共管理致力于研究如何产生结果）；以**高层管理者的战略决策**为焦点；通过**案例研究**发展知识；为管理研究争取与政策研究相同的地位。\n\n这五条读起来像是学术史，其实是「公共管理与公共行政的区别」的另一种问法——只不过换成了学派演进的叙事。"},{"t":"ask","q":"为什么说公共管理至今还没有形成独立的范式？","a":"因为它的知识来自多个学科（政策分析、商学、经济学、组织理论），内部没有统一的分析框架。教材引胡德本人的说法：虽然讨论很多、也在谈「范式变化」，但还没有形成关于公共管理的普遍共识或接受的基本知识。教材的结论是：公共管理是公共行政中重视技术与方法、重视项目与绩效、重视政策执行的分支学派。"},{"t":"p","h":"研究对象：这门学问到底研究什么","text":"教材对公共管理学的定义紧跟在公共管理之后：**研究以政府行政组织为核心的多元主体进行公共事务管理和公共服务提供的活动及其规律的学问。**\n\n研究对象这一节要解决的是三件事：公共管理与公共行政、公共政策的关系是什么；由此看公共管理学有哪些特征；以及现阶段的学科定位——是分支学科还是独立范式。"},{"t":"quote","text":"公共管理学是研究以政府行政组织为核心的多元主体进行公共事务管理和公共服务提供的活动及其规律的学问。","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 15 页"},{"t":"tip","text":"遇到「异同」类题目，永远分两半写：先写相同（都研究公共部门、都关注绩效与执行、都承认价值因素），再写不同（P 途径重政策分析与评估，B 途径重战略与管理技术）。只写不同会丢一半分。"}],"concepts":[{"term":"P 途径","def":"源自公共政策学院的研究传统，关注政策分析、政策执行与项目评估，以政策问题为起点。","points":["强调政策过程与项目结果","与政策科学、政策分析关系密切"],"exam":"与 B 途径成对出现，常考「异同」。"},{"term":"B 途径","def":"源自商学院的研究传统，关注战略、组织绩效与管理技术，以管理者行为为起点。","points":["强调战略管理与一般管理技术","认为公私管理有相通之处"],"exam":"答「异同」时要点明两者的学科出身不同。"}],"exercises":[{"t":"choice","q":"P 途径与 B 途径的字母分别对应什么？","opts":["Policy（政策）与 Business（商业）","Public（公共）与 Bureaucracy（官僚）","Politics（政治）与 Budget（预算）","Process（过程）与 Behavior（行为）"],"a":0,"why":"P 指公共政策学院（Policy），B 指商学院（Business）。这是两个学院传统的差别，不是两个概念首字母的巧合。"},{"t":"multi","q":"按博兹曼的归纳，公共管理的特征包括：","opts":["既关心战略又关心过程，但以外部焦点为取向","强调硬知识的同时继续关注政治环境与价值等软知识","以资深公共管理者（中高层）为方向","只研究政府机构，不涉及非营利组织"],"a":[0,1,2],"why":"博兹曼恰恰认为「公共」的含义更广，非营利组织与私人企业的公共方面都包含其中。把公共管理窄化为只研究政府，是常见错误。"},{"t":"judge","q":"凯特尔认为公共管理是一种乐观的规范研究领域。","a":true,"why":"凯特尔的原意是：政策执行研究致力于说明项目为何难以奏效，而公共管理致力于研究如何产生结果，所以是乐观的、规范的。"},{"t":"choice","q":"教材对公共管理的学科定位是：","opts":["已取代公共行政的独立范式","公共行政的分支学派，重视技术与方法、项目与绩效、政策执行","公共政策学的下属分支","与管理学并列的一级学科"],"a":1,"why":"教材反复强调公共管理是公共行政的分支学派，且不能替代公共行政的全部。这一点在判断类和论述题里经常作为「边界」出现。"},{"t":"multi","q":"写「B 途径与 P 途径异同」时，下面哪些属于「相同」的一面？","opts":["都研究公共部门的管理活动","都关注绩效、结果与执行","都承认政治环境与价值因素的作用","都以商学院的管理技术为唯一来源"],"a":[0,1,2],"why":"两者的共同点在于研究对象与关切，而学科的出身和侧重才是差别。D 只描述了 B 途径，不能算共同点。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「B 途径与 P 途径的异同」（10 分）。要求：总述一句 + 相同点至少两条 + 不同点至少两条 + 收束一句。","minutes":12,"points":["开篇点明两途径的学科来源（公共政策学院 / 商学院）","写出相同点：都研究公共部门、都关注绩效与执行、都承认价值因素","写出不同点：P 重政策分析与项目评估，B 重战略与管理技术","点出两者汇合形成公共管理这一分支学科","结尾有一句评价或定位（如：尚未形成独立范式）"],"sample":"P 途径与 B 途径是公共管理形成的两条来路。P 途径源自公共政策学院，关注政策分析、政策执行与项目评估；B 途径源自商学院，关注战略、组织绩效与管理技术。二者的相同点在于：都以公共部门的管理活动为对象，都关注结果、绩效与执行，都不否认政治环境与价值因素的作用。不同点在于侧重：P 途径以政策问题为起点，强调政策过程与项目结果；B 途径以管理者行为为起点，强调战略管理与一般管理技术的移植。两条途径逐渐汇合，形成了公共管理这一重视技术与方法的分支学科；但因其知识来源多元，至今尚未形成独立的范式。","tip":"「异同」题的分数大多落在相同点上，而多数人只写不同。先把相同点写足两条，再写不同点，分数结构才完整。"},"evidence":[{"src":"cai-wang-3","pages":[12],"quote":"博兹曼在《公共管理：艺术的现状》的导言“两种公共管理概念”中将政策途径（P途径）和商业途径（B途径）加以综合","context":"博兹曼在《公共管理：艺术的现状》的导言“两种公共管理概念”中将政策途径（P途径）和商业途径（B途径）加以综合，认为公共管理途径具有如下特征：第一，既关心战略，又关心过程，但以一种外部的焦点为取向；第二，在强调“硬”知识（管理方法、技术尤其是定量分析技术）的同时，继续关注“软”知识（管理的政治环境、价值等）；第三，以资深公共管理者（中层和高层管理者…","contextPage":12},{"src":"cai-wang-3","pages":[15],"quote":"公共管理学是研究以政府行政组织为核心的多元主体进行公共事务管理和公共服务提供的活动及其规律的学问","context":"…重要组成部分。综上所述，公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称。公共管理学是研究以政府行政组织为核心的多元主体进行公共事务管理和公共服务提供的活动及其规律的学问。1.1.2公共管理学的概念范畴范畴（category）就是基本的概念体系。思想体系不同，也就是概念体系不同，或范畴不同。公共管理学的理论体系由公共管理的管理理念和基本范畴（或者基本概念体系）所组成。公共管理学是公共行政学的分支学科，公共行…","contextPage":15},{"src":"chen-2","pages":[37],"quote":"形成了较有影响的学科途径，主要有管理学途径、政治学途径、法学途径和经济学途径","note":"陈讲的是四条学科途径，蔡王讲的是 P／B 两条学院传统；问「研究途径」时先答自己学校的版本，再用另一版补一层。","context":"…一个跨学科、综合性的研究领域，它可以有不同的研究途径、方法或观点。首先，公共管理学可以从不同的社会科学学科的框架中来加以研究，在西方（美国）公共管理学的发展中，形成了较有影响的学科途径，主要有管理学途径、政治学途径、法学途径和经济学途径。其次，可以从某些社会科学的理论、假设或模型出发来研究公共管①参见陈振明、薛澜：《中国公共管理理论研究的重点领域和主题》，载《中国社会科学》，2007（3）。","contextPage":37}],"moduleId":"m1","order":3},"l2-1":{"id":"l2-1","title":"传统奠基：威尔逊定边界，韦伯定结构，泰勒定方法","goal":"能分别说清威尔逊、韦伯、泰勒各贡献了什么，并解释三者的理论为什么能互相支撑。","minutes":16,"tag":"第2章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"618 考过「政治行政二分法」的名词解释，也考过「韦伯官僚制的特征」。这两个考点背后其实是同一件事：一门学科要先划出自己的地盘，才能叫学科。"},{"t":"p","h":"威尔逊：把行政从政治里切出来","text":"威尔逊面对的现实是：政府职能越来越多、越来越难，「贯彻一部宪法变得愈来愈困难」。他的办法是把政府工作分成两个领域——**政治**决定「应当做什么」，**行政**负责「贯彻执行」。\n\n他由此提出四条主张：行政学科应建立在**单一的组织原型**上，能普遍运用于一切政治制度；任何良好的行政科学必须从政治学中**分离**出来；行政科学的指导价值是**效率**；有效的公共行政要求政府权力有**单一的领导中心**。\n\n注意他的目的不是学术分类，而是「使政府不走弯路，使政府专心处理公务和少做政治干预」。"},{"t":"p","h":"韦伯：给行政一套组织结构","text":"韦伯从**权威**入手，把组织分成三类：**神秘化组织**（权威来自领导者个人魅力，人存政举、人亡政息）、**传统组织**（权威来自先例和惯例，具有世袭性、封建性、绝对性）、**合理化—合法化组织**（权威来自组织内部的规则，服从实质上是对规则的服从）。他认为只有第三类才适合作为行政组织的基础，也就是**理想官僚制**。\n\n理想官僚制的七个特征是：合理的分工、层级节制的权力体系、依照规程办事的运作机制、形式正规的决策文书、组织管理的非人格化、适应工作需要的专业培训机制、合理合法的人事行政制度。"},{"t":"quote","text":"纯粹的官僚体制的行政管理，即集权主义的、采用档案制度的行政管理，精确、稳定、有纪律、严肃、紧张和可靠","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 47 页"},{"t":"p","h":"泰勒：把方法变成标准","text":"泰勒的科学管理针对的是企业，中心问题是**提高劳动生产率**：预先计划、科学挑选工人、标准化作业、管理与工人合作。它之所以能进入政府，是因为「政治与行政的分离」让行政事务非政治化，行政领域才可能像工厂一样讲标准、讲定额、讲流程。\n\n教材还点出泰勒与韦伯的相通之处：科学管理把个人经验、人格化的管理推向科学的、理性的、专业化的管理，与理性官僚制取代非专业的前官僚制具有相同的功能和意义；而科学管理的层级式管理结构，本身就是官僚制的组织结构。"},{"t":"ask","q":"三个人的理论为什么能拼成一个体系，而不是三套互不相干的观点？","a":"因为他们回答的是同一门学科成立所需的三个条件：威尔逊解决「学科地盘」（行政与政治分开），韦伯解决「组织形态」（什么样的结构才能承载理性行政），泰勒解决「作业方法」（怎样让行政可计算、可控制）。三者都指向同一个价值——效率，也都把非理性因素（个人魅力、私情、经验）排除在外。这个共同前提，正是后来新公共行政要攻击的地方。"},{"t":"cmp","h":"三人的分工","head":["人物","回答的问题","核心概念","留给后人的把柄"],"rows":[["威尔逊","行政凭什么独立成学","政治—行政二分","政治与行政在现实中分不开"],["韦伯","行政靠什么组织起来","合理化—合法化的理想官僚制","规则变成目的，组织僵化、反应迟缓"],["泰勒","行政怎样提高效率","科学管理、标准化","把人当作生产工具，忽视价值与情感"]]}],"concepts":[{"term":"政治—行政二分法","def":"威尔逊提出的划分：政治领域决定政策选择，行政领域执行经合法程序确定的规定，二者应分离。","points":["目的是使行政摆脱政治干预、追求效率","主张行政科学的指导价值是效率、权力应有单一领导中心","为公共行政学成为独立学科提供了理论支撑"],"exam":"2024 年名解考过；也常在「传统公共行政的缺陷」里作为被批判对象出现。"},{"term":"理想官僚制","def":"韦伯提出的以合理化—合法化权威为基础的组织形态，以规则而非个人为服从对象。","points":["七特征：分工、层级节制、依规程办事、正规文书、非人格化、专业培训、合理合法的人事制度","优点是精确、稳定、有纪律、可靠","缺陷是僵化、形式主义、难以回应变化"],"exam":"2019 简答考过「韦伯官僚制的特征」，2026 简答考过「科层制组织的缺陷」。"}],"exercises":[{"t":"choice","q":"威尔逊认为行政科学的指导价值是什么？","opts":["社会公平","效率","民主参与","公共利益"],"a":1,"why":"威尔逊的四条主张之一是「行政科学的指导价值是效率」。把公平当成核心价值的是后来的新公共行政学派——这正好是两条线的分界。"},{"t":"multi","q":"韦伯认为哪一类权威才能作为行政组织的基础？","opts":["神秘化（魅力型）权威","传统型权威","合理化—合法化权威","以上都可以"],"a":[2],"why":"韦伯认为魅力型组织基础不稳固、传统型组织效率较差，只有合理化—合法化权威与理想官僚制相适应。"},{"t":"choice","q":"泰勒的科学管理能进入政府管理，前提条件是什么？","opts":["政府开始重视社会公平","政治与行政分离，使行政事务非政治化、可标准化","官僚制被废除","企业开始承担公共服务"],"a":1,"why":"教材的原话是：政治与行政的分离强调行政管理事务的非政治化，使得行政领域运用科学管理的原理和原则成为可能。"},{"t":"judge","q":"韦伯认为传统型权威组织效率较差，是因为领导者不是按能力挑选，管理只是为保存过去的传统。","a":true,"why":"这正是教材对传统型组织的评价。另外两类的问题分别是：魅力型过于情绪化、非理性；只有合理化—合法化权威能支撑理性行政。"},{"t":"order","q":"按「权威基础 → 组织形态 → 特征」的推理顺序排列韦伯的论证。","items":["组织以某种形式的权威为基础","权威分为神秘化、传统、合理化—合法化三类","只有合理化—合法化权威适合行政组织","由此得出理想官僚制的七个特征"],"a":[0,1,2,3],"why":"韦伯的论证是典型的三段式：先给分类标准，再排除不合适的类型，最后描述理想类型的特征。答简答题时照这个顺序写，逻辑就立得住。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「韦伯官僚制的基本特征」（10 分）。要求：开篇一句说明官僚制的权威基础，再分 7 点（或合并为 5—6 点）作答，末尾一句评价。","minutes":12,"points":["开篇点明官僚制建立在合理化—合法化权威之上","写出合理的分工（权责范围的法定化）","写出层级节制的权力体系","写出依照规程办事的运作机制与形式正规的决策文书","写出组织管理的非人格化","写出专业培训机制与合理合法的人事行政制度","结尾评价：精确稳定可靠，但易僵化、形式主义"],"sample":"韦伯的官僚制建立在合理化—合法化权威之上，即服从的对象是组织规则而非个人。其特征有七：一是合理的分工，以法规形式规定每一职位的权责范围；二是层级节制的权力体系，使命令的取得与传达渠道明确；三是依照规程办事的运作机制，用规则和程序保证一致性与明确性；四是形式正规的决策文书，重要决定形成文件并归档；五是组织管理的非人格化，对事不对人、公私分明；六是适应工作需要的专业培训机制；七是合理合法的人事行政制度，任人唯贤、注重实绩。这一组织形式精确、稳定、可靠，但也容易因规则与层级而僵化，对变化反应迟缓。","tip":"七点不必逐字背，按「结构（分工+层级）→ 运行（规程+文书）→ 人（非人格化+培训+人事）」三组记，考试时一组一组往外写，不会漏。"},"evidence":[{"src":"cai-wang-3","pages":[26],"quote":"行政学科应当建立在单一的组织原型的基础上","context":"…程不是政治干预。根据威尔逊的观点，政治与公共政策的形成有关，行政与公共政策的执行有关。在此基础上，他进一步阐发了公共行政应当从政治中分离出来的基本思想：“（1）行政学科应当建立在单一的组织原型的基础上，它能普遍运用于一切政治制度；（2）任何良好的行政科学必须使它自己从政治学领域中分离出来；（3）行政科学的指导价值是效率；（4）有效的公共行政要求政府权力有单一的领导中心。”同时，他还认为建立独立的公共行政学的目的就是“使政府不走弯路，使政…","contextPage":26},{"src":"cai-wang-3","pages":[26],"quote":"有效的公共行政要求政府权力有单一的领导中心","context":"…应当建立在单一的组织原型的基础上，它能普遍运用于一切政治制度；（2）任何良好的行政科学必须使它自己从政治学领域中分离出来；（3）行政科学的指导价值是效率；（4）有效的公共行政要求政府权力有单一的领导中心。”同时，他还认为建立独立的公共行政学的目的就是“使政府不走弯路，使政府专心处理公务和少做政治干预，加强和纯洁政府的组织机构，为政府的尽职尽责带来美誉”。威尔逊的这些思想奠定了公共行政学的理论基础，并对后来公共行政学的发展产生了重大影响。虽…","contextPage":26},{"src":"cai-wang-3","pages":[46],"quote":"韦伯认为，任何一种组织都是以某种形式的权威为基础的","context":"…僚制理论则从组织体制的角度为公共行政理论之传统形态的公共行政学的创立提供了理论框架。韦伯的官僚制理论是基于他对由不同权威结构决定的组织类型的分析而提出和建立的。韦伯认为，任何一种组织都是以某种形式的权威为基础的，在权威制度下，下级把上级发布的命令看作是合法的。“行政管理班子对统治者（或统治者们）的服从，可能纯粹出自习俗，或者纯粹由于情绪，或者受到物质利害关系，或者受到思想动机（价值合乎理性）的约束。这类动机在很大程度上决定着统治的类型。”①正是根…","contextPage":46},{"src":"cai-wang-3","pages":[47],"quote":"合理的分工。组织以法规的形式严格根据分工的要求规定每一职位均有特定的权责范围","context":"…效益强度大和范围广，形式上可以应用于一切任务，纯粹从技术上看可以达到最高的完善程度。”②韦伯认为，作为一种理想的行政组织形式，“官僚制”具有以下基本特征：（1）合理的分工。组织以法规的形式严格根据分工的要求规定每一职位均有特定的权责范围，这样不仅有利于组织成员通过训练掌握专门的技能，更有利于提高组织的工作效率。（2）层级节制的权力体系。在官僚制组织这样的一个等级实体中，这种层级节制的权力体系可以使组织中的每一个成员都确切地知道从何处取得命令以及把命令传达给何人，它有助于克…","contextPage":47},{"src":"cai-wang-3","pages":[47],"quote":"组织管理的非人格化。在实行官僚制的组织中，管理工作是以法律、法规、条例和正式文件等来规范人的行为的","context":"…式文件下达，并且要记录在案，用毕归档，这样既可以防止工作的随意性，又有利于下级组织及其成员明确职责权限，还便于加强必要的控制，以利于组织有效地实现其目标。（5）组织管理的非人格化。在实行官僚制的组织中，管理工作是以法律、法规、条例和正式文件等来规范人的行为的，公私分明，对事不对人，人们在处理公务时只应考虑合法性、合理性以及有效性，而不应考虑任何私情关系。（6）适应工作需要的专业培训机制。随着社会的进步和科学技术的发展，建立在高度分工和专业化基础之上的官僚制组织必须为其成员提供各种必需的专业培训…","contextPage":47},{"src":"cai-wang-3","pages":[48],"quote":"威尔逊的“政治-行政”二分法和韦伯官僚制理论的提出为公共行政学成为一门独立的学科","context":"…同公共行政的完善取决于从行政公务中积极地排除政治性因素。公共行政的高效运作要依靠来自客观实际的可靠性法规的技术应用，采取一套有逻辑的、严格的和机械性的行为方式。威尔逊的“政治-行政”二分法和韦伯官僚制理论的提出为公共行政学成为一门独立的学科提供了理论支撑。2.1.1.3泰勒的科学管理理论除了“政治-行政”二分法和官僚制理论为公共行政学成为一门独立的学科提供支撑之外，对公共行政的科学化和技术化具有推波助澜作用的还有泰勒的科学管理理论。19世纪末，在以美国为代表的西方发达国家，工…","contextPage":48},{"src":"chen-2","pages":[25],"quote":"其研究对象主要集中于行政组织或官僚体制，注重组织的内部取向，以及机构、过程和程序和行政原则的研究，并将行政效率作为追求的最高目标","note":"陈把传统公共行政学的特征压成一句，正好用来解释韦伯—泰勒这条线为什么会被西蒙挑战。","context":"…生教育项目以及公共行政学院。在20世纪二三十年代所形成的并在60年代中期以前一直居于支配地位的传统公共行政学范式是建立在科层制理论和政治—行政二分法的基础上的，其研究对象主要集中于行政组织或官僚体制，注重组织的内部取向，以及机构、过程和程序和行政原则的研究，并将行政效率作为追求的最高目标。古利克在《行政科学论文集》中将公共行政学的基本原则概括为著名的“POSDCORB”，即计划（planning）、组织（organizing）、人事（staffing）、指挥（directing）、协调（coordinating）、报告（r…","contextPage":25}],"moduleId":"m2","order":1},"l2-2":{"id":"l2-2","title":"西蒙与沃尔多的挑战：效率不是唯一答案","goal":"能说出西蒙、沃尔多各自批判了什么，并完整复述新公共行政学的基本内容。","minutes":15,"tag":"第2章","reviewStatus":"reviewed","blocks":[{"t":"lead","text":"2020 年简答第一题就是「新公共行政学理论的基本内容」。要答好它，得先知道它是在反驳谁——否则你只能背四条标题，写不出「为什么」。"},{"t":"p","h":"西蒙：你们的「原则」只是谚语","text":"西蒙从两个方向拆传统行政学。\n\n**第一，行政原则不是科学原则。** 传统学者提出的每一条原则，几乎都能找到另一条同样合理却结论相反的原则，比如「专业分工」与「统一指挥」、「控制幅度宜小」与「层级不宜多」。西蒙因此说这些只是「**行政谚语**」。\n\n**第二，政治与行政分不开。** 传统学说只重「执行」不重「决策」，但任何行政活动都同时包含决策与执行，决策贯穿整个组织。他主张以「决策」为基本概念重建行政学。"},{"t":"p","h":"沃尔多：三个方向都不对","text":"沃尔多的批判更彻底：**政治—行政二分法**作为对现实的描述和对行政行为的规定都不恰当；传统**组织范式**过分强调组织间的共性与原则，忽视具体情境与组织的非正式方面；传统学派**过于重视效率**，而效率概念本身充满道德含义——追求「技术效率」会转变为追求「社会效率」，不能假定有效地达到任何目的都合乎需要。\n\n两人的争论持续了半个世纪，被称为「西蒙—沃尔多之争」，它正式结束了公共行政学的古典时期。"},{"t":"p","h":"新公共行政：把社会公平放回中心","text":"新公共行政学是回应 20 世纪 60 年代末社会危机与政府改革呼声形成的流派，它运用新的研究方法，强调以公共行政的「**公共**」部分为研究重心。基本内容有四条：\n\n**一是反思和批判「效率至上」**，认为公共行政不只是执行政策的工具，还担负广泛的社会责任；\n**二是提倡社会公平价值观**，认为核心价值不是经济与效率，而是社会公平；\n**三是突破「政治—行政」二分法**，认为二分只是一种理论虚构；\n**四是强调动态、开放的组织观**，主张顾客导向与应变灵活的组织形态。"},{"t":"quote","text":"新公共行政理论则强调，公共行政的核心价值在于社会公平，在于促进社会所拥有的、以社会公平为核心的基本价值。","cite":"蔡立辉、王乐夫《公共管理学》第3版 · OCR 第 59 页"},{"t":"ask","q":"新公共行政说要「社会公平」，是不是意味着不要效率了？","a":"不是。教材的说法是：经济和效率「固然是公共行政的价值追求和目标之一，但绝不是其核心价值，更不是唯一的价值准则和终极目标」。答题时必须写出这个分寸——把新公共行政说成「否定效率」，是常见的过度表述，会被扣分。"}],"concepts":[{"term":"社会公平","def":"新公共行政学的核心价值，强调政府提供服务的平等性、管理者的责任、行政变革以及对公众要求的积极回应。","points":["弗雷德里克森：社会公平包含对组织设计和管理形态在内的一系列价值选择","要求推动政治权力与经济福利向缺乏资源支持者倾斜","是把「效率至上」转为「公平至上」的核心主张"],"exam":"「新公共行政学的基本内容」四条的轴心；也常作为「公平取向理论」的代表出现在论述题里。"},{"term":"行政谚语","def":"西蒙对传统行政原则的贬称：相互矛盾却可以并行不悖，因而不是真正的科学原则。","points":["例：专业分工 vs 统一指挥、控制幅度 vs 层级数量","结论：需要新的研究方法才能建立真正的行政原则"],"exam":"考「西蒙对传统行政学的批判」时的第一个得分点。"}],"exercises":[{"t":"multi","q":"新公共行政学的基本内容包括：","opts":["对传统公共行政学「效率至上」观的反思和批判","提倡社会公平价值观","突破传统「政治—行政」二分法","强调动态、开放的组织观"],"a":[0,1,2,3],"why":"四条正好是教材列出的四项基本内容，也是这道 10 分简答的标准骨架。"},{"t":"choice","q":"西蒙称传统行政原则为「行政谚语」，理由是：","opts":["这些原则来自民间经验","每条原则都能找到另一条同样合理但结论相反的原则","这些原则过于抽象，无法操作","这些原则没有考虑效率"],"a":1,"why":"西蒙的批评是逻辑上的：可并行不悖的矛盾原则说明它们不是科学原则。这直接推出他要用「决策」这一新概念工具重建行政学。"},{"t":"judge","q":"沃尔多认为效率本身不是价值，只有在自觉持有的价值观念框架内才是有用的概念。","a":true,"why":"这正是沃尔多批判「过于重视效率」的核心论证：必须先考虑效率服务的目的，不能假定有效地达到任何目的都合乎需要。"},{"t":"choice","q":"新公共行政学被认为「正式结束了公共行政学的古典时期」，主要因为：","opts":["它提出了新的组织理论","西蒙与沃尔多围绕学科定位、研究方法和价值取向的长期争论","它废除了官僚制","它把行政学改名为管理学"],"a":1,"why":"教材的表述是：这场争论一方面正式结束了公共行政学的古典时期，另一方面深刻影响了随后半个多世纪的研究走向。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「新公共行政学理论的基本内容」（10 分）。要求：先用一句总述交代它出现的背景与核心主张，再分四点展开。","minutes":12,"points":["交代背景：回应 60 年代末社会危机与政府改革呼声，以公共行政的「公共」部分为重心","第一点：反思批判「效率至上」，公共行政负有广泛社会责任","第二点：提倡社会公平，指出效率不是核心价值、更非唯一目标","第三点：突破「政治—行政」二分法，认为二分是理论虚构","第四点：强调动态、开放的组织观（顾客导向、应变灵活）","结尾点明它对后续新公共管理与新公共服

:"quote","text":"该理论提出了“志愿失灵”的概念，指出非营利组织自身也存在缺陷","cite":"陈振明《公共管理学》第二版 · OCR 第 326 页"},{"t":"p","h":"作用：不止「做好事」","text":"陈书把第三部门的作用概括为七条：**促进经济增长**（在国民经济中占相当份额）、**增加就业机会**（并蕴藏更大就业潜力）、**提供公共物品和弥补政府缺陷**（进入教育、卫生、社会服务等核心领域）、**增加资源运用的透明度和合理性**、**扩大社会公平**（帮助弱势群体、缩小贫富差距）、**培养互助协作精神**（在志愿行动中学习合作）、**在国际事务中发挥监督、协调作用**。陈书的判断是：在西方它已经成长为一支主要的经济和社会力量。"},{"t":"quote","text":"在国外尤其是西方，第三部门已经成长为一支主要经济和社会力量","cite":"陈振明《公共管理学》第二版 · OCR 第 326 页"},{"t":"p","h":"我国：从「双重管理」到「政府购买」","text":"陈书讨论我国第三部门时注意到民间自发社团力量的兴起。读这一节要区分教材成书时的制度描述与今天的实践：不能把书中的阶段性判断直接当成现行登记规定。论述发展路径时，可围绕自主性、资源、专业能力和监督说明如何改进，并交代这些建议与志愿失灵的关系。"},{"t":"quote","text":"随着中国第三部门的兴起，出现了一种由民间自发产生并迅猛发展的社团力量","cite":"陈振明《公共管理学》第二版 · OCR 第 321 页"},{"t":"ask","q":"既然存在「志愿失灵」，是不是说明第三部门不可靠、应该让政府全部接管？","a":"不是。志愿失灵说明第三部门有短板，而不是它没有价值。正确的结论是互补：政府负责普遍性与公平，第三部门负责多样性与回应性，两者通过购买服务、伙伴关系分工。把它读成「政府替代」就丢了这一章的立场。"},{"t":"tip","text":"「作用」题按陈书的七条写：增长、就业、公共物品、透明合理、公平、互助、国际监督协调，最后补一句「与政府互补」。只写「弥补政府失灵」会遗漏其他作用。"}],"concepts":[{"term":"第三部门","def":"介于政府与企业之间、以非营利和志愿参与为特征的社会组织，又称非营利组织、非政府组织、志愿组织。","points":["不以营利为目的","相对独立于政府","提供公共服务、倡导政策、凝聚社会资本"],"exam":"名解写「定义＋别称＋与政府/企业的区别」三句最稳。"},{"term":"志愿失灵","def":"非营利组织自身在供给公共服务时出现的缺陷，如慈善供给不足、特殊主义、家长作风与业余主义。","points":["是与市场失灵、政府失灵并列的第三重失灵","说明第三部门需要与政府互补","是「政府购买服务」的理论依据之一"],"exam":"常与「第三部门为什么需要政府支持」连问。"},{"term":"政府购买服务","def":"政府通过合同等方式向社会组织购买公共服务，明确服务内容、质量要求与监督责任。","points":["把「养人」变成「买事」","需要配套的资质、评估与监管","是政府与社会组织合作供给服务的一种方式"],"exam":"答发展措施时，可结合资源支持、专业能力与监督机制展开。"}],"exercises":[{"t":"choice","q":"「第三部门」「非营利组织」「非政府组织」这几个名称的差别主要在于：","opts":["组织的法律地位完全不同","强调的属性不同：不营利、相对独立、志愿参与","前者包括政府，后者不包括","只是翻译不同，没有差别"],"a":1,"why":"陈书明确说，名称选择看要强调什么属性：不营利、相对政府独立、志愿参与。它们的所指基本重合。"},{"t":"multi","q":"按陈书，解释非营利部门介入公共服务的理论有哪些？","opts":["政府失败理论","契约失灵理论","第三部门（第三方管理）理论","政府全面替代理论"],"a":[0,1,2],"why":"陈书第326页列出政府失败、契约失灵、第三部门三种理论；第三种讨论志愿失灵与政府互补。"},{"t":"judge","q":"志愿失灵说明第三部门应当退出公共服务供给，由政府全面接管。","a":false,"why":"志愿失灵说明第三部门有短板，结论是政府与第三部门互补（购买服务、伙伴关系），不是替代。"},{"t":"choice","q":"下列哪一项不是第三部门的典型作用？","opts":["提供公共物品","培养互助协作精神","参与国际事务的监督协调","征收税款"],"a":3,"why":"征税是政府的权力；互助协作与国际监督协调分别对应陈书七项作用中的第六、七项。"},{"t":"order","q":"按“问题—机制—补充—边界”的论证顺序，说明契约失灵。","items":["问题：消费者难以判断服务质量","机制：信息不对称使逐利机构有机会损害消费者","补充：非营利组织的非分配约束可减少投机动机","边界：非营利组织仍需监督，并非天然没有缺陷"],"a":[0,1,2,3],"why":"这是教学论证顺序，不是教材规定的时间阶段。先解释信息问题，再说明非分配约束如何发挥作用，最后交代适用边界。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「第三部门的作用」（10 分）。要求：定义一句 + 按陈书列出七项作用并简要解释 + 一句互补性收束。","minutes":12,"points":["给出定义并点出非营利、志愿、相对独立","促进经济增长、增加就业机会","提供公共物品并弥补政府缺陷","增加资源运用的透明度和合理性、扩大社会公平","培养互助协作精神、参与国际事务的监督协调","结尾点出与政府互补，而非替代"],"sample":"第三部门是介于政府与企业之间、以非营利和志愿参与为特征的社会组织，又称非营利组织、非政府组织。陈书把它在西方的作用概括为七条：促进经济增长、增加就业机会、提供公共物品并弥补政府缺陷、增加资源运用的透明度和合理性、扩大社会公平、培养人们的互助协作精神、在国际事务中发挥监督和协调作用。第三部门与政府不是替代关系而是互补关系：政府负责普遍性与公平，第三部门负责多样性与回应性。","tip":"「作用」题的分数在分点，不在文采。按陈书七项作用逐项解释；这些要点用于自评，不是官方评分细则。"},"evidence":[{"src":"chen-2","pages":[306],"quote":"强调组织的存在不是为了营利或是强调组织与企业之间的区别时，就应选择“非营利组织”","context":"…上的非营利组织，在原苏东地区指所有慈善和非营利组织，在第三世界国家则指以促进发展为目的的民间组织。二是根据描述这类组织时所需要强调的相对属性而选择适当的名称，如强调组织的存在不是为了营利或是强调组织与企业之间的区别时，就应选择“非营利组织”；而强调组织相对于政府的独立性时，就应选择“非政府组织”或“独立部门”；在强调组织的资金来源是私人慈善性捐款时，使用“慈善组织”就更为合适。目前，第三部门所指的社会组织相当庞杂，因此，对其下定义就显得很困难。国际上有关第三部门的定义主要有如…","contextPage":306},{"src":"chen-2","pages":[326],"quote":"该理论提出了“志愿失灵”的概念，指出非营利组织自身也存在缺陷","context":"…论从交易成本分析入手，提出政府提供公共服务的交易成本比非营利组织高，所以当市场失灵时，非营利组织应是公共服务最初的提供者。这时，政府则成为非营利组织的补充机制。该理论提出了“志愿失灵”的概念，指出非营利组织自身也存在缺陷，如：公共产品供给中的“搭便车”现象，经济波动对慈善资源的影响；特定社会群体在获取公共服务时存在贫富不均现象；控制着慈善资源的出资人或发起人以个人偏好代替社会偏好，造成穷人真正需要的服务供给不足；等等。因此，政府是“志愿失灵”后的替代性制度…","contextPage":326},{"src":"chen-2","pages":[326],"quote":"契约失灵理论","context":"…论认为，政府、市场和非营利组织在满足个人需求方面可以相互替代。当发生政府、市场双“失灵”时，非营利组织正好在两者之间拾遗补阙，以满足个人对公共产品的需求。（2）契约失灵理论。该理论认为，营利组织的局限性导致对非营利组织的功能需求，后者不仅具有提供公共产品的功能，而且具有提供私人产品的功能（如托儿所、医院等）。从理论上讲，企业应向消费者提供社会效率最大化和价格合理的商品与服务。但现实中由于信息不对称，企业为追逐…","contextPage":326},{"src":"chen-2","pages":[327],"quote":"第三部门的作用可以概括为如下几点","context":"…由政府—国家体制实行的治理向由政府—国家体制与非政府的社会体制相结合的治理体制转变，促使传统的自上而下的治理向自上而下与自下而上相结合的治理转变。”②具体来说，第三部门的作用可以概括为如下几点：一是促进经济增长。第三部门为西方国民经济的增长贡献了巨大力量。如在1995年，美国第三部门的花费为5020亿美元，约占GDP的6.9%，雇用了约860万名全职的新工人；英国第三部门支出74.9亿美元，占GDP的6.06%，如果加上志愿行为…","contextPage":327},{"src":"chen-2","pages":[327],"quote":"六是培养人们的互助协作精神","context":"…门，以及遭遇困难的弱势群体，缩小经济发展中产生的贫富悬殊。通过为他们提供各种信息、资金和其他资源，第三部门能促使发展滞后的地区和弱势企业转变，帮助它们脱离困境。六是培养人们的互助协作精神。第三部门的发展有利于培养人们的互助协作精神。培养伦理品德的最佳方法就是让思想渗透到实践中，第三部门中志愿性的工作不仅让人们感觉到互助合作的好处，而且在潜移默化地影响着行动者、受益者和旁观者。七是在国际事务中发挥监督、协调作用。第三部门逐渐…","contextPage":327},{"src":"chen-2","pages":[327],"quote":"七是在国际事务中发挥监督、协调作用","context":"…互助协作精神。培养伦理品德的最佳方法就是让思想渗透到实践中，第三部门中志愿性的工作不仅让人们感觉到互助合作的好处，而且在潜移默化地影响着行动者、受益者和旁观者。七是在国际事务中发挥监督、协调作用。第三部门逐渐参与到国际事务中，在其中发挥了越来越重要的监督、协调作用，参与政府间国际组织的决策。英国学者爱德华兹等人探讨了第三部门在国际行动中出现的许多选择方案。它们是：影响民族国家政府外交政策的运作，使其超越“现实主义”思维方式；监督地…","contextPage":327},{"src":"chen-2","pages":[326],"quote":"在国外尤其是西方，第三部门已经成长为一支主要经济和社会力量","context":"…又是政府部门缺乏的。这种特征上的互补性，使政府与非营利组织建立了合作伙伴关系，既能保持精干高效的政府规模，又能较好地履行社会福利责任。10.3.2第三部门的作用在国外尤其是西方，第三部门已经成长为一支主要经济和社会力量。萨拉蒙和安海尔①参见［英］托尼·马歇尔：《我们能界定志愿域吗》，见李亚平、于海编选：《第三域的兴起——西方志愿工作及志愿组织理论文选》。②参见财政部财政科学研究所编：《热点与对策：2003年度财政研究报告》，北京，中国财政经济出版社，20…","contextPage":326},{"src":"chen-2","pages":[321],"quote":"随着中国第三部门的兴起，出现了一种由民间自发产生并迅猛发展的社团力量","context":"第四，自下而上的草根参与意识逐步流行。中国是一个有着很悠久的集权传统的国家，政府一直控制着社会的政治经济生活，包括第三部门的发展。但是，近年来，随着中国第三部门的兴起，出现了一种由民间自发产生并迅猛发展的社团力量。这主要是由于人们对社会公益事业的重要性有了进一步的认识以及参与意识的增强。这些第三部门虽然数量不多，规模也不大，但其影响却很大，甚至在国家层面有很高的声誉，如北京地球村、爱德基金会等组织。特别值得指出的是，2000年北京申办奥运会期间，梁…","contextPage":321}],"moduleId":"m3","order":6},"l2-8":{"id":"l2-8","title":"网络治理：治理的第三种途径","goal":"能区分政府管理、公民社会、合作网络三种治理途径，说出网络治理的新特征与多重困境，并用它分析跨域协作案例。","minutes":15,"tag":"陈书","reviewStatus":"reviewed","dual":{"cai":"第2章 §2.2（公共治理）","chen":"第3章 政府改革与治理（3.1 治理理论）","diff":"蔡王讲治理与统治的区别；陈书把治理理论分成政府管理、公民社会、合作网络三条途径，网络治理的新特征与多重困境是陈书独有的展开。"},"blocks":[{"t":"lead","text":"618 考过「网络治理的新特征」。第2章第6课讲的是「从统治到治理」，这一课再往里走一层：治理内部还分三条路，网络治理是第三条，也是最能出论述题的一条。"},{"t":"p","h":"治理不是一条路，是三条","text":"陈书把治理理论的研究途径分成三种：**政府管理的途径**（政府掌舵、市场划桨）、**公民社会的途径**（授权社团与公民、自我服务）、**合作网络的途径**（多中心行动者相互依存、协商合作）。三者的分析对象、行为假设、政策手段都不同，混着写就会自相矛盾。"},{"t":"quote","text":"在治理的诸多用法中，“只有网络治理才有新的特征”","cite":"陈振明《公共管理学》第二版 · OCR 第 80 页"},{"t":"cmp","h":"三种治理途径（论述题的分点骨架）","head":["途径","分析对象","关系特征","政策手段"],"rows":[["政府管理的途径","政府部门与市场力量","掌舵与划桨","私有化、工商管理技术"],["公民社会的途径","公民社会（第三部门）","自治与认同","授权社团与公民、自我服务"],["合作网络的途径","多中心的公共行动体系","相互依存","合作网络、协商、共同学习"]]},{"t":"p","h":"新特征：多中心、相互依赖、自我组织","text":"网络治理之所以「新」，在于它承认没有一个机构拥有解决全部问题所需的资源与知识。行动者通过交换资源、共享知识、谈判目标来集体行动；网络靠信任与规则自我组织，而不是靠上级命令。答题时抓三个词：**多中心、相互依赖、自我组织**。"},{"t":"quote","text":"网络治理的新特征有以下几个方面：（1）多中心的公共行动体系","cite":"陈振明《公共管理学》第二版 · OCR 第 81 页"},{"t":"p","h":"多重困境：网络也会失灵","text":"相互依赖是一把双刃剑。陈书把网络治理的多重困境列为四类：**可治理性问题**（并非所有问题都适合网络，且网络内部有合作与竞争、开放与封闭、原则性与灵活性三对矛盾，可能引发治理失败）、**合法性问题**（公众对非政府主体供给公共物品的认同危机）、**有效性问题**（治理能力与治理需求之间存在差距）、**责任性问题**（多主体合作后责任归属模糊）。写评价句时，这四类比空泛的「有利有弊」有用得多。"},{"t":"quote","text":"随着相互依赖关系的发展，合作网络也面临着多重困境，直接影响着治理的能力和绩效","cite":"陈振明《公共管理学》第二版 · OCR 第 89 页"},{"t":"ask","q":"既然网络治理有这么多困境，为什么还说它比政府管理、公民社会两条路更「新」？","a":"「新」不是说它更完美，而是说它换了一套假设：从单一中心的命令，换成多中心的相互依存。它承认政府不是唯一主体，也承认网络会失灵——正因为承认失灵，才要设计信任、规则与问责，而不是退回命令式管理。"},{"t":"tip","text":"案例题给「垃圾分类、跨域治水、社区共治」这类材料时，先判断主体是不是多中心，再套三个特征，最后用一条困境做评价，分数就齐了。"}],"concepts":[{"term":"网络治理","def":"由政府、企业、社会组织与公民等多元行动者，通过相互依存、资源共享与协商合作来共同处理公共事务的治理方式。","points":["多中心的公共行动体系","以信任与规则自我组织","与政府管理、公民社会并列为第三种途径"],"exam":"名解写「多中心＋相互依存＋协商合作」三点即可。"},{"term":"合作网络途径","def":"治理理论的一种研究途径，把公共事务管理看作多中心行动者组成的合作网络的集体行动。","points":["分析对象是多中心公共行动体系","行为假设是「具有反思理性的复杂人」","政策手段是合作网络与共同学习"],"exam":"与政府管理、公民社会两条途径对比着考。"},{"term":"治理困境","def":"合作网络在运行中面临的合作与竞争、开放与封闭、原则性与灵活性等矛盾，以及网络无法消解的市场失灵与政府失败。","points":["过度合作导致反应迟钝","封闭成员会丧失新机会","网络不能替代政府与市场"],"exam":"论述题的评价段用它，比空谈「有利有弊」得分高。"}],"exercises":[{"t":"choice","q":"按陈书，治理理论的三种研究途径是：","opts":["政府管理、公民社会、合作网络","中央控制、地方自治、网络","市场、政府、第三部门","管制、服务、治理"],"a":0,"why":"治理理论的三途径是政府管理、公民社会、合作网络。B 是政府间关系的三途径，别混。"},{"t":"multi","q":"网络治理的新特征包括：","opts":["多中心的公共行动体系","行动者相互依存、交换资源与知识","网络依靠信任与规则自我组织","由中央政府统一命令"],"a":[0,1,2],"why":"前三条都是网络治理的特征；「统一命令」恰好是它要摆脱的政府管理模式。"},{"t":"judge","q":"网络治理可以自动消解市场失灵与政府失败。","a":false,"why":"陈书明确说，市场失灵与政府失败并不能靠合作网络自动解决，这正是「治理失败」的一种表现。"},{"t":"choice","q":"「网络要求控制成员，却因此排除潜在合作者」描述的是哪一对困境？","opts":["合作与竞争","开放与封闭","原则性与灵活性","效率与公平"],"a":1,"why":"开放与封闭：网络需要边界来维持信任，但边界又挡掉了新成员与新机会。"},{"t":"order","q":"把「网络治理新特征」的作答顺序排好。","items":["多中心的公共行动体系","行动者相互依存、交换资源与共享知识","网络依靠信任与规则自我组织、共同学习"],"a":[0,1,2],"why":"从「谁在治理」到「怎么互动」再到「靠什么维持」，三层递进，比并列三点更像分析。"}],"write":{"type":"简答题","prompt":"用 12 分钟写「网络治理的新特征」（10 分）。要求：一句定位 + 三个特征 + 一句困境或评价。","minutes":12,"points":["点明网络治理是治理理论的第三种途径（合作网络）","写出多中心的公共行动体系","写出行动者相互依存、交换资源与共享知识","写出依靠信任与规则自我组织、共同学习","结尾补一句困境或边界（网络也会失灵）"],"sample":"网络治理是治理理论的第三种途径，与政府管理、公民社会并列。它的新特征有三：一是多中心的公共行动体系，政府、企业、社会组织与公民共同参与；二是行动者相互依存，通过交换资源、共享知识与谈判目标采取集体行动；三是网络依靠信任与规则自我组织，政策是共同学习的产物而非自上而下的安排。但相互依赖也是双刃剑：合作与竞争、开放与封闭、原则性与灵活性之间存在张力，网络并不能自动消解市场失灵与政府失败。","tip":"「新特征」题的关键是「新」——每写一条，最好对照一句旧模式（不是命令、不是单一中心），对比出来才叫特征。"},"evidence":[{"src":"chen-2","pages":[80],"quote":"在治理的诸多用法中，“只有网络治理才有新的特征”","context":"…强调国家与社会、政府与市场、私域与公域的合作。可以预见，随着历史的发展，统治将随着国家的消亡而消亡，而治理将成为“自由人的联合体”中管理共同事务的社会协调模式。在治理的诸多用法中，“只有网络治理才有新的特征”③。治理理论的三种研究途径如表3-1所示。表3-1治理理论的三种研究途径政府管理的途径公民社会的途径合作网络的途径分析的对象政府部门与市场力量的关系公民社会(第三部门)与政治国家的关系多中心的公共行动体系关系的特征掌舵与划桨自治与认同相互依…","contextPage":80},{"src":"chen-2","pages":[81],"quote":"网络治理的新特征有以下几个方面：（1）多中心的公共行动体系","context":"…阻塞;得不到政治上的认可缺乏集体行动的动机;利益、目标和策略上的冲突补救的措施加强协调和监控提高公民组织的动员能力和管理能力加强网络管理:优化公共行动者互动环境网络治理的新特征有以下几个方面：（1）多中心的公共行动体系。合作网络途径认为，我们生活在一个相互依赖的环境中，没有哪个机构拥有充足的资源和知识可以独自解决所有的问题；在处理公共事务时，相互依存的行动者通过交换资源、共享知识、谈判目标，采取有效的集体行动。的确，在公共管理领域，并非只有政府一个主体，…","contextPage":81},{"src":"chen-2","pages":[89],"quote":"随着相互依赖关系的发展，合作网络也面临着多重困境，直接影响着治理的能力和绩效","context":"…利益为解决依靠单个组织无法解决的事务提供了可能，对众多国家和地区的治理变革产生了深刻的影响，成为推动公共管理民主化、社会化、分权化和竞争化的重要力量。另一方面，随着相互依赖关系的发展，合作网络也面临着多重困境，直接影响着治理的能力和绩效。治理的困境表现在以下几个方面：1.可治理问题并非任何社会问题都可以通过合作网络来解决，在市场和政府起不了作用的地方，合","contextPage":89},{"src":"cai-wang-3","pages":[77],"quote":"提供公共物品和公共服务是网络治理的根本任务。合作网络的治理具有如下特征：多中心的治理体系","context":"…强国和跨国公司干涉别国内政、推行国际霸权政策提供理论上的支持③。①世界银行．1997年世界发展报告：变革世界中的政府．北京：中国财政经济出版社，1997：4.②提供公共物品和公共服务是网络治理的根本任务。合作网络的治理具有如下特征：多中心的治理体系、反思理性的“复杂人”假设、合作互惠的行动策略和组织学习的政策过程。合作网络的治理途径在当今世界流传得非常广泛，它主要应用于如下领域：全球治理（这是对国际合作网络的管理）、民族国家的治理、地方和社区治理。③俞可平．治理与善治．北京：社会科学…","contextPage":77}],"moduleId":"m2","order":8},"l13-3":{"id":"l13-3","title":"政府失败：政府也会失灵","goal":"能给出政府失败的定义、四类表现与三层成因，按「决策体制—竞争机制—监督问责」提出防范措施。","minutes":18,"tag":"陈书","reviewStatus":"reviewed","dual":{"cai":"导论（只把「政府失败」列为新主题之一）","chen":"第5章 政府作用（5.3 政府失败及其防范）","diff":"蔡王没有专章，只在导论提到「政府失败」；陈书第5章专节讲四类表现、三层成因与两条防范。2026 年论述题就从这里出。"},"blocks":[{"t":"lead","text":"2026 年论述题就考「政府失败的现象类型以及成因」。这一块蔡王版只在导论的主题清单里点了个名，成章讲的是陈振明第5章——不学这一章，这道 20 分的题只能写空话。"},{"t":"p","h":"先摆正政府的位置","text":"讨论政府失败，前提是承认政府有用。陈书的判断是：没有单纯的市场经济，只有市场调节与政府调控相结合的**混合经济**。政府的作用是弥补市场缺陷，但弥补本身也会出错——这就是政府失败的问题域。"},{"t":"quote","text":"没有单纯的市场经济，只有市场调节与政府调控相结合的混合经济","cite":"陈振明《公共管理学》第二版 · OCR 第 155 页"},{"t":"p","h":"四类表现：一句话记住","text":"陈书把非市场缺陷与政府失败归成四类：**公共政策失效或失误、公共物品供给的低效率、内部性与政府扩张、寻租及腐败**。答题时先把这四类摆出来，再各给一句解释，结构就成立了。"},{"t":"quote","text":"非市场缺陷及政府失败有种种表现，可以归纳为公共政策失效或失误、公共物品供给的低效率、内部性与政府扩张、寻租及腐败等基本类型","cite":"陈振明《公共管理学》第二版 · OCR 第 176 页"},{"t":"p","h":"三层成因：不是「官员笨」","text":"成因要往制度上找：**公共物品供求关系的特点**（偏好显示困难、成本收益难计量）、**公共决策的内在困难**（信息不完全、投票悖论、议程操纵）、**缺少有效的非市场机制**（没有利润约束，也缺少能把私人成本与社会成本对齐的机制）。三句话对应三种失败：算不清、定不准、管不住。"},{"t":"quote","text":"而非市场缺陷及政府失败的主要原因在于公共物品供求关系的特点、公共决策的内在困难以及缺少一种有效的非市场机制","cite":"陈振明《公共管理学》第二版 · OCR 第 176 页"},{"t":"p","h":"两个名解：内部性与寻租","text":"**内部性**（内在效应）指公共组织或官员追求自身目标与利益，而不是公共利益；它被看作非市场缺陷的核心，地位相当于市场失灵理论里的「外部性」。**寻租**是政府干预的副产品：干预制造租金，游说与腐败随之而来，资源被消耗在不生产任何价值的活动上。"},{"t":"quote","text":"所谓内部性（内在效应），就是公共组织或非市场组织自身的目标","cite":"陈振明《公共管理学》第二版 · OCR 第 179 页"},{"t":"p","h":"怎么防：两条主线","text":"陈书归纳公共选择与政策分析学者的处方，是两条主线：**改革公共决策体制与政治制度**（立宪改革、改进民主技术、约束政府规模）与**引进竞争机制**（用市场力量改进政府效率，如外包、凭单、内部市场）。放到我国语境，还要加一条**监督与问责**：公开、审计、绩效评估、官员问责制。"},{"t":"quote","text":"公共选择学者以及政策分析学者主要围绕改革公共决策体制及政治制度、引进竞争机制（用市场力量改进政府效率）两个方面来加以说明","cite":"陈振明《公共管理学》第二版 · OCR 第 183 页"},{"t":"ask","q":"政府失败和市场失灵是同一件事吗？","a":"不是。市场失灵是市场机制本身解决不了公共物品、外部性、垄断等问题，所以需要政府；政府失败是政府介入之后仍然没解决问题，甚至带来新问题。两者是「为什么需要政府」和「政府为什么也会失灵」两个问题，答题时必须分开写。"},{"t":"tip","text":"论述题四段：界定（混合经济里的政府）→四类表现→三层成因→两条防范（加我国语境下的监督问责）。最后一定区分市场失灵与政府失败，这是阅卷的常见踩分点。"}],"concepts":[{"term":"政府失败","def":"政府干预未能改善公共问题，反而产生低效率、高成本或不公平的现象，又称非市场缺陷。","points":["四类表现：政策失效、供给低效、内部性与扩张、寻租腐败","三层成因：供求特点、决策困难、缺少非市场机制","防范：改革决策体制＋引进竞争＋监督问责"],"exam":"论述题高频；先区分市场失灵，再展开四类表现。"},{"term":"内部性","def":"公共组织或官员追求自身目标与利益而非公共利益的现象，又称内在效应。","points":["是非市场缺陷的核心原因","对应市场失灵理论中的「外部性」","表现为预算扩张、机构膨胀、目标置换"],"exam":"名解写「定义＋与外部性对照＋表现」。"},{"term":"寻租","def":"为获取政府干预造成的租金而进行的游说、贿赂等非生产性活动。","points":["租金来自政府干预设置的垄断或限制","是非生产性活动，浪费社会资源","与腐败高度相关"],"exam":"常与「政府干预的边界」一起考。"}],"exercises":[{"t":"multi","q":"按陈书，政府失败的基本类型包括：","opts":["公共政策失效或失误","公共物品供给的低效率","内部性与政府扩张","寻租及腐败"],"a":[0,1,2,3],"why":"四类都是陈书明确列出的基本类型。答题时四类齐写，再各补一句解释。"},{"t":"choice","q":"「公共组织追求自身目标而非公共利益」说的是：","opts":["外部性","内部性","寻租","公共政策失效"],"a":1,"why":"内部性（内在效应）正是这个意思。陈书用沃尔夫的话把内部性比作非市场缺陷理论中的「外部性」。"},{"t":"judge","q":"政府失败就是市场失灵，两者可以互换使用。","a":false,"why":"市场失灵是市场机制解决不了的问题（需要政府），政府失败是政府介入后仍失灵（政府也会出错）。两者是不同层次的问题。"},{"t":"choice","q":"按陈书，政府失败的主要成因不包括：","opts":["公共物品供求关系的特点","公共决策的内在困难","缺少有效的非市场机制","政府官员的个人道德水平普遍低下"],"a":3,"why":"陈书把成因落在制度与机制上（供求特点、决策困难、缺少非市场机制），不是归因于官员个人道德。"},{"t":"order","q":"把「政府失败的防范」作答顺序排好。","items":["改革公共决策体制与政治制度","引进竞争机制，用市场力量改进效率","完善监督与问责（公开、审计、绩效评估）"],"a":[0,1,2],"why":"先改决策规则，再引入竞争，最后用监督问责兜底——从制度到机制再到约束，层次清楚。"}],"write":{"type":"论述题","prompt":"用 20 分钟写「政府失败的现象类型以及成因」（20 分），并给出防范思路。要求：界定一句 + 四类表现 + 三层成因 + 一段防范 + 区分市场失灵。","minutes":20,"points":["先界定政府失败（非市场缺陷），并点明混合经济背景","写出四类表现：政策失效、供给低效、内部性与扩张、寻租腐败","写出三层成因：供求特点、决策困难、缺少非市场机制","给出防范：改革决策体制、引进竞争、监督问责","明确区分市场失灵与政府失败"],"sample":"政府失败是政府干预未能改善公共问题，反而带来低效率、高成本或不公平的现象，也称非市场缺陷。现代市场经济是市场调节与政府调控相结合的混合经济，政府弥补市场缺陷的过程本身也会出错。其表现可归为四类：公共政策失效或失误、公共物品供给的低效率、内部性与政府扩张、寻租及腐败。成因有三层：公共物品供求关系的特点使偏好难以显示、成本收益难以计量；公共决策存在信息不完全、投票悖论与议程操纵等内在困难；缺少有效的非市场机制，把私人成本与社会成本对齐。防范有两条主线：改革公共决策体制与政治制度，引进竞争机制用市场力量改进效率；在我国还需完善公开、审计、绩效评估与官员问责。需要强调，政府失败不同于市场失灵：前者是政府介入后的失灵，不能用「更多干预」简单回应。","tip":"这题的分差在「成因」：写「官员素质不高」是外行话，写「公共决策的内在困难」「缺少非市场机制」才是教材语言。"},"evidence":[{"src":"chen-2","pages":[155],"quote":"没有单纯的市场经济，只有市场调节与政府调控相结合的混合经济","context":"…或地区的市场经济发展的经验教训，尤其是如何处理好政府与市场、政府与企业以及政府调控与市场调节之间关系的经验教训。各国市场经济发展的历史以及经济学的研究成果表明，没有单纯的市场经济，只有市场调节与政府调控相结合的混合经济。在市场经济发展的过程中，政府在市场运行中总是扮演着重要的角色。市场缺陷及市场失灵是政府干预的基本理由。政府可以做一些市场做不到或做不好的事情，它的干预可以弥补市场的不足，①世界银行：《1997年世界发展报告：变革世界中的政府》，1页。","contextPage":155},{"src":"chen-2","pages":[176],"quote":"非市场缺陷及政府失败有种种表现，可以归纳为公共政策失效或失误、公共物品供给的低效率、内部性与政府扩张、寻租及腐败等基本类型","context":"…与成因如前所述，市场缺陷及市场失灵有不同的类型及成因。同样地，非市场缺陷及政府失败也有不同的表现、类型与成因，这是非市场缺陷及政府失败论所要探讨的最基本的问题。非市场缺陷及政府失败有种种表现，可以归纳为公共政策失效或失误、公共物品供给的低效率、内部性与政府扩张、寻租及腐败等基本类型；而非市场缺陷及政府失败的主要原因在于公共物品供求关系的特点、公共决策的内在困难以及缺少一种有效的非市场机制——它能够把私人的或组织的成本与效益同整个社会的成本与效益进行调节和计算。下面，我们具体讨论非市场缺陷及政府失败的这几种类型及其成因…","contextPage":176},{"src":"chen-2","pages":[176],"quote":"而非市场缺陷及政府失败的主要原因在于公共物品供求关系的特点、公共决策的内在困难以及缺少一种有效的非市场机制","context":"…及政府失败论所要探讨的最基本的问题。非市场缺陷及政府失败有种种表现，可以归纳为公共政策失效或失误、公共物品供给的低效率、内部性与政府扩张、寻租及腐败等基本类型；而非市场缺陷及政府失败的主要原因在于公共物品供求关系的特点、公共决策的内在困难以及缺少一种有效的非市场机制——它能够把私人的或组织的成本与效益同整个社会的成本与效益进行调节和计算。下面，我们具体讨论非市场缺陷及政府失败的这几种类型及其成因。1.公共政策失效或失误政府对经济生活干预的基本手段是制定和实施公共政策，以政策、法规及行政手段来弥补市场的…","contextPage":176},{"src":"chen-2","pages":[179],"quote":"所谓内部性（内在效应），就是公共组织或非市场组织自身的目标","context":"…一样，内部性或内在效应被认作非市场缺陷以及政府失败的一个基本原因。“市场缺陷理论的核心是外在性，而非市场缺陷理论的核心是内在性。”（沃尔夫语）根据沃尔夫的界定，所谓内部性（内在效应），就是公共组织或非市场组织自身的目标，是公共组织用以评价全体成员，决定工资、提升和津贴，比较次一级组织以协助分配预算、办公室、停车管理的标准；或者说，是指导、规制和评估机构运行和机构人员行为的准则。沃尔夫认为，内在性或组织目标是使机构中的全体成员发挥最大机构职能的重要因素。因…","contextPage":179},{"src":"chen-2","pages":[183],"quote":"公共选择学者以及政策分析学者主要围绕改革公共决策体制及政治制度、引进竞争机制（用市场力量改进政府效率）两个方面来加以说明","context":"…。在公共选择学者看来，分析政府行为的效率并寻找政府最有效率工作的规则制约体系是公共选择理论的最高目标。那么，应当如何防范及纠正政府失败以及克服非市场缺陷现象呢？公共选择学者以及政策分析学者主要围绕改革公共决策体制及政治制度、引进竞争机制（用市场力量改进政府效率）两个方面来加以说明。首先，公共选择学者认为，政府失败及非市场缺陷是西方公共选择或公共决策体制的缺陷造成的，实质上是西方政治制度的失败。因此，要避免政府失败，首先必须改善现有的西方民主政体，发明一种新的政治技术和表达民主的方式。在公共选择学者眼里，现代西方政府…","contextPage":183},{"src":"cai-wang-3","pages":[35],"quote":"公共选择、政府失败、多元组织等大量新主题","note":"蔡王版只在导论把它列为新主题之一，没有专章。","context":"…；它在保留传统公共行政学、政策科学的某些主题的基础上，在研究领域及主题上有重大的突破与创新，涉及诸如公共物品、外部性、公共服务供给、理性人、交换范式、制度选择、公共选择、政府失败、多元组织等大量新主题；公共管理学更多地从经济学的途径来研究公共管理尤其是政府管理问题，常常被人们称为“以经济学为基础的新政策管理理论”或“市场导向的公共行政学”。3.具体研究问题的特征公共管理学将研究焦点由传统公共行政学的“内部取向”转变为“外部取向”，从重视…","contextPage":35}],"moduleId":"m13","order":3}},"framework":{"question":"公共事务由谁管理，怎样管好，又如何改进？","groups":[{"title":"为什么需要公共管理","text":"认识公共性、公共利益与不同理论的解释角度。","modules":["m1","m2"]},{"title":"谁来管理与协调","text":"辨认组织、领导及各主体之间的分工。","modules":["m3","m4"]},{"title":"如何作出行动安排","text":"通过政策组织行动，理解危机情境的特殊要求。","modules":["m5","m9"]},{"title":"用什么资源与方法","text":"把人员、预算、信息与管理工具连接到任务。","modules":["m6","m7","m8","m10"]},{"title":"受到哪些约束","text":"用伦理、责任与监督审视公共权力的运用。","modules":["m11"]},{"title":"如何评价与改进","text":"区分活动、产出与效果，再讨论改革的理由和边界。","modules":["m12","m13"]}],"threads":["每章都追问：这里的公共利益是什么？","把主体、资源、责任和效果联系起来。","理论是不同观察角度，不能只按年代背名称。"],"guides":{"m3":{"question":"不同公共组织为什么要分工，它们如何协调并改进？","position":"在“谁来管理与协调”这一层，先认清组织，再研究组织之间的关系。","prerequisites":["l1-1","l1-2"],"before":"一个组织提供公共服务，是否就意味着它拥有行政权？先写下你的判断，再进入本章。","branches":[{"title":"组织的性质与类型","question":"公共组织有什么特征，几类组织如何区分？","lessons":["l3-1","l3-3"]},{"title":"组织内部的结构","question":"层级、分部与权责怎样安排？","lessons":["l3-2"]},{"title":"组织之间的关系","question":"政府间怎样协调，第三部门怎样补充公共服务？","lessons":["l3-5","l3-6"]},{"title":"组织的变革","question":"结构调整要解决什么功能问题？","lessons":["l3-4"]}],"relations":[{"label":"区别：服务职能与行政权","text":"提供公共服务不能直接推出拥有行政权；比较组织类型时要说明分类依据。","lessons":["l3-1","l3-3"]},{"label":"联系：组织目标与绩效评估","text":"组织的公共目标需要转化为可讨论的评价标准；活动数量不能直接等同于公共效果。","lessons":["l3-1","l12-1"]},{"label":"互补：第三部门与政府","text":"第三部门的优势与志愿失灵要一起分析，合作供给仍需明确责任和监督。","lessons":["l3-6","l11-2"]}],"hint":"试着从性质与类型、内部结构、组织间关系、变革四个方向组织。每个分支再说明它解决的问题。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，用自己的话列出本章的主要分支，并解释它们怎样共同回答本章问题。","reference":"一种组织方式：性质与类型回答“是什么、有哪些”；内部结构回答“权责怎样安排”；组织间关系回答“不同政府及第三部门怎样协调”；变革回答“结构和功能如何改进”。也可以按不同层次组织，只要覆盖要点并说清联系。","check":"我写出了主要层次，并说明每个层次解决什么问题。"},{"id":"relation","label":"解释一条知识联系","prompt":"挑选本章两个概念，解释它们的区别或联系，并给出理由。","reference":"例如：组织类型与组织结构分别回答“是哪类组织”和“内部怎样安排”，不能互相替代。也可解释公共目标与绩效评价、第三部门优势与志愿失灵；关键是讲清关系及其理由。","check":"我说明了关系及理由，而不只是并列写了两个名词。"},{"id":"application","label":"用框架解释案例","prompt":"针对下面的养老案例，提出分工与协调的分析思路，并指出一种需要防范的问题。","reference":"先核实各组织的身份、权限与能力，再讨论需求识别、经费安排、服务提供和监督的分工。跨部门合作需明确衔接和责任；志愿参与可以补充供给，也应考虑资源不稳定与服务偏向。不要仅凭组织名称断定其权限，或认为合作天然高效。","check":"我把案例事实与概念对应，并交代了风险或待核实信息。"}],"evidenceLessons":["l3-1","l3-2","l3-3","l3-4","l3-5","l3-6","l12-1"],"bridge":{"subject":"822","module":"p4","text":"换到政策视角：这些组织可以使用哪些手段改善服务？"},"evidence":[{"src":"cai-wang-3","pages":[15],"quote":"公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称","context":"…平新时代中国特色社会主义思想是这个时期我国公共管理学的指导理论，习近平总书记“治国理政”的系列重要论述是中国气派、中国特色公共管理理论的重要组成部分。综上所述，公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称。公共管理学是研究以政府行政组织为核心的多元主体进行公共事务管理和公共服务提供的活动及其规律的学问。1.1.2公共管理学的概念范畴范畴（category）就是基本的概念体系。思想体系不同，也就是概念体系不同，或范畴不同。公共管理学的理论体系…","contextPage":15,"lessonId":"l1-1"},{"src":"cai-wang-3","pages":[16],"quote":"他认为可以从三个方面来理解“公共”的含义","context":"…书中，先确定了“行政”的含义，然后提出了三个互相联系的问题：“什么是‘公共’行政？‘公共’这一修饰词表示什么特征？公共行政怎样区别于一般行政，种怎样区别于属？”他认为可以从三个方面来理解“公共”的含义：一是可以根据政府、国家之类的词给“公共”下定义，这就涉及主权、合法性、普通福利等法律概念、哲学概念和普通政治理论方面的问题；二是可以按照在某种社会中人们认为有哪些公共职能或公共活动的认识简单地从经验方面给“公共”下定义。这样一来，由于人们…","contextPage":16,"lessonId":"l1-2"},{"src":"cai-wang-3","pages":[127],"quote":"公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织","context":"…着眼于组织功能的变化，区分“掌舵职能”和“划桨职能”、决策职能和执行职能，强化公共组织的社会服务职能。本章小结1.现代社会中的组织主要包括公共组织和非公共组织。公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织。为了实现组织目标和充分发挥功能，公共组织必须建立科学、合理的组织结构及其形式。2.在公共管理中，由于公共管理层次、公共事务性质的不同，政府组织、非营利组织、社会自治组织和准政府组织构成系统的公共管理主体。现代公共管理主体是以政府组织为核心…","contextPage":127,"lessonId":"l3-1"},{"src":"cai-wang-3","pages":[89],"quote":"公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式","context":"…质量和服务水平，正是当代各国政府在着力探索和解决的问题。3.1.2公共组织的结构“结构”一词是生物学上的名词，是指一个生物体对所具有的各种要素的科学的特定安排。公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式。良好的公共组织结构是完成公共组织目标、提高行政效率的物质基础，具有重要的功能。合理的组织结构能有效地满足公共组织目标的需要；有利于稳定工作人员的情绪，调动工作人员的积极性；能使组织保持良好的沟通关系；是提高微观和宏观行政效率的前提条件。为…","contextPage":89,"lessonId":"l3-2"},{"src":"cai-wang-3","pages":[93],"quote":"按此标准进行划分，公共组织主要可以分为政府组织、非营利组织和准政府组织","context":"…共权力的支持才能完成管理。相对其他标准而言，按公共组织是否拥有行政权力以及这一权力的大小来进行划分，更能反映出公共组织的本质特征以及不同类型公共组织的活动特点。按此标准进行划分，公共组织主要可以分为政府组织、非营利组织和准政府组织。按是否具有行政权对公共组织进行划分，从一个特定的侧面反映出了公共管理的三个基本的层面。在公共管理中，只有政府组织、非营利组织和准政府组织协调发展，才能形成一个完备的公共管理体系，才能最大限度地增进公共利益。现代公共管理是在一定环境中产生的…","contextPage":93,"lessonId":"l3-3"},{"src":"cai-wang-3","pages":[124],"quote":"机构调整只是手段，优化组织整体结构和功能才是目的","context":"…组织变革在现象上总是表现为组织机构的调整，机构调整也的确是组织变革中量最大的工作，但公共组织变革绝不是一个简单的机构调整、人员增减问题，而是一个复杂的系统工程。机构调整只是手段，优化组织整体结构和功能才是目的。与此相应，所有变革都与公共组织的目标密切联系。沃伦·本尼斯曾提出四个组织有效的标准，此标准同样也可适用于公共组织变革的目标。这四个标准分别是：第一，适应性——解决问题以及对环境需求的变化的灵活反应能力；第二，组织身份的认同感——从组织本身…","contextPage":124,"lessonId":"l3-4"},{"src":"chen-2","pages":[126],"quote":"政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。","context":"…，反过来又对政府间的纵向关系产生了深刻影响，大大改变了旧体制下的政府间关系的原有格局，使政府间关系超出了纵向与横向的简单脉络，朝向复杂的网络体系发展。综上所述，政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。4.1.2政府间关系研究的进展1.国外的政府间关系研究在国外，政府间关系一直以来都是公共行政与公共政策领域的重要研究课题。与政府间关系演变的实践相呼应，政府间关系的研究也经历了一个发展的过程。20世纪80年代以前的研究主要关注中央与地方的关…","contextPage":126,"lessonId":"l3-5"},{"src":"chen-2","pages":[306],"quote":"强调组织的存在不是为了营利或是强调组织与企业之间的区别时，就应选择“非营利组织”","context":"…上的非营利组织，在原苏东地区指所有慈善和非营利组织，在第三世界国家则指以促进发展为目的的民间组织。二是根据描述这类组织时所需要强调的相对属性而选择适当的名称，如强调组织的存在不是为了营利或是强调组织与企业之间的区别时，就应选择“非营利组织”；而强调组织相对于政府的独立性时，就应选择“非政府组织”或“独立部门”；在强调组织的资金来源是私人慈善性捐款时，使用“慈善组织”就更为合适。目前，第三部门所指的社会组织相当庞杂，因此，对其下定义就显得很困难。国际上有关第三部门的定义主要有如…","contextPage":306,"lessonId":"l3-6"},{"src":"cai-wang-3","pages":[432],"quote":"绩效既不等于产出本身，也不等于任务或产品本身","context":"…职责履行以外所产生的结果不能视为绩效。第二，从绩效产生的主体来看，绩效包括了公共部门整体绩效、公共管理人员个人绩效和项目绩效。第三，从绩效质与量的本质属性来看，绩效既不等于产出本身，也不等于任务或产品本身，绩效是投入所获得的产出及其所产生的社会效果，不仅有量的规定性，","contextPage":432,"lessonId":"l12-1"},{"src":"cai-wang-3","pages":[419],"quote":"专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动","context":"提高行政复议总体水平；6）必须不断完善行政复议制度和机制，进一步规范行政复议行为①。（2）专门监督。专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动。目前，我国公共管理专门监督中，最为核心、常用、有效的是国家行政监督机关实行的行政监察活动。国家行政监察机关以宪法和法律为依据，在我国县级以上各级政府中都有设立。它在上级行政监督机关和所属人民政府的领导下，独立地行使监察权，只服从国家有关法…","contextPage":419,"lessonId":"l11-2"}]},"m1":{"question":"公共管理是什么，它凭什么成为一门独立学科？","position":"在“为什么需要公共管理”这一层，先立定义，再说明公共性与学科来路。","prerequisites":["l0-1","l0-2"],"before":"“公共管理”只是“管理”前面加两个字吗？先写下你的判断。","branches":[{"title":"定义与边界","question":"公共管理的主体、目的、手段、对象各是什么？","lessons":["l1-1"]},{"title":"公共性与公共产品","question":"“公共”指什么，公共产品为什么需要公共供给？","lessons":["l1-2"]},{"title":"学科来路与定位","question":"P 途径与 B 途径怎样汇合，学科为什么长期是分支而非独立范式？","lessons":["l1-3"]}],"relations":[{"label":"定义与公共性","text":"定义里的“公共”不是形容词：主体、对象和供给方式都要用公共性解释。","lessons":["l1-1","l1-2"]},{"label":"学科定位与理论","text":"P/B 两条来路解释了后来的理论为什么既讲管理技术，也讲政治价值。","lessons":["l1-3","l2-1"]},{"label":"公共产品与工具","text":"非排他与非竞争限制私人供给，政策工具的选择由此有了理由。","lessons":["l1-2","l5-1"]}],"hint":"按“是什么—为什么公共—从哪里来”三层组织；每层各用一句定义和一条例子。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，列出本章三个层次，并说明它们怎样共同回答“公共管理是什么”。","reference":"可组织为：定义与边界（主体、目的、手段、对象）；公共性与公共产品（为什么需要公共供给）；学科来路（P/B 两条传统与分支学科定位）。三层从概念到依据再到学科身份。","check":"我写出了三个层次及它们的关系。"},{"id":"relation","label":"解释一条知识联系","prompt":"挑“公共管理/公共行政”或“公共产品/私人产品”一组，说明区别并举例。","reference":"公共管理更重运作、结果与外部取向，公共行政更重过程、程序与内部取向；公共产品非排他、非竞争，私人产品通常两者都具备。例子要能指出判断依据。","check":"我说明了区别并用例子验证。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老案例：判断哪些服务接近公共产品，政府、市场和志愿组织各可做什么。","reference":"先看服务是否可排他、是否竞争；助餐、探访等信息与协调环节常有外部性，适合多主体合作。政府可定规则与兜底，企业提供专业服务，志愿组织补细节；材料没给的支付能力与需求规模要列为待核实。","check":"我把产品属性与主体分工连起来，并列出待核实信息。"}],"evidenceLessons":["l1-1","l1-2","l1-3","l2-1","l5-1"],"bridge":{"subject":"822","module":"p1","text":"换到政策视角：政策研究怎样界定自己的对象与边界？"},"evidence":[{"src":"cai-wang-3","pages":[15],"quote":"公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称","context":"…平新时代中国特色社会主义思想是这个时期我国公共管理学的指导理论，习近平总书记“治国理政”的系列重要论述是中国气派、中国特色公共管理理论的重要组成部分。综上所述，公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称。公共管理学是研究以政府行政组织为核心的多元主体进行公共事务管理和公共服务提供的活动及其规律的学问。1.1.2公共管理学的概念范畴范畴（category）就是基本的概念体系。思想体系不同，也就是概念体系不同，或范畴不同。公共管理学的理论体系…","contextPage":15,"lessonId":"l1-1"},{"src":"cai-wang-3","pages":[16],"quote":"他认为可以从三个方面来理解“公共”的含义","context":"…书中，先确定了“行政”的含义，然后提出了三个互相联系的问题：“什么是‘公共’行政？‘公共’这一修饰词表示什么特征？公共行政怎样区别于一般行政，种怎样区别于属？”他认为可以从三个方面来理解“公共”的含义：一是可以根据政府、国家之类的词给“公共”下定义，这就涉及主权、合法性、普通福利等法律概念、哲学概念和普通政治理论方面的问题；二是可以按照在某种社会中人们认为有哪些公共职能或公共活动的认识简单地从经验方面给“公共”下定义。这样一来，由于人们…","contextPage":16,"lessonId":"l1-2"},{"src":"cai-wang-3","pages":[12],"quote":"博兹曼在《公共管理：艺术的现状》的导言“两种公共管理概念”中将政策途径（P途径）和商业途径（B途径）加以综合","context":"博兹曼在《公共管理：艺术的现状》的导言“两种公共管理概念”中将政策途径（P途径）和商业途径（B途径）加以综合，认为公共管理途径具有如下特征：第一，既关心战略，又关心过程，但以一种外部的焦点为取向；第二，在强调“硬”知识（管理方法、技术尤其是定量分析技术）的同时，继续关注“软”知识（管理的政治环境、价值等）；第三，以资深公共管理者（中层和高层管理者…","contextPage":12,"lessonId":"l1-3"},{"src":"cai-wang-3","pages":[26],"quote":"行政学科应当建立在单一的组织原型的基础上","context":"…程不是政治干预。根据威尔逊的观点，政治与公共政策的形成有关，行政与公共政策的执行有关。在此基础上，他进一步阐发了公共行政应当从政治中分离出来的基本思想：“（1）行政学科应当建立在单一的组织原型的基础上，它能普遍运用于一切政治制度；（2）任何良好的行政科学必须使它自己从政治学领域中分离出来；（3）行政科学的指导价值是效率；（4）有效的公共行政要求政府权力有单一的领导中心。”同时，他还认为建立独立的公共行政学的目的就是“使政府不走弯路，使政…","contextPage":26,"lessonId":"l2-1"},{"src":"cai-wang-3","pages":[172],"quote":"公共政策工具又称为治理工具或政府工具","context":"…目标的实现时，实际上也就转化为政策工具。政策工具的选择直接关系到公共政策目标的实现，它的选择需要综合考虑政策环境的具体情况。5.1.2.1公共政策工具研究的兴起公共政策工具又称为治理工具或政府工具。20世纪90年代以来，政策工具的研究日渐成为西方政策科学研究的一个焦点。政策工具研究兴起的主要原因有：一是政策执行的复杂多变性以及经常出现的政策失败引发人们对政策执行工具和方式的反思；二是政府组织对于政策的制定与执行的实践知识的需求日益增…","contextPage":172,"lessonId":"l5-1"}]},"m2":{"question":"公共管理理论为什么会不断“换代”，每一代理要解决前一代理的什么问题？","position":"仍在“为什么需要公共管理”层，把五种理论当作对“效率与公共性”的不同回答。","prerequisites":["l1-1","l1-3"],"before":"效率与公平只能二选一吗？先记下你的排序。","branches":[{"title":"传统奠基与第一次挑战","question":"威尔逊、韦伯、泰勒奠了什么基，西蒙与沃尔多又挑战了什么？","lessons":["l2-1","l2-2"]},{"title":"经济学视角","question":"公共选择怎样用经济人假设解释政府扩张与失败？","lessons":["l2-3"]},{"title":"管理主义与公共服务","question":"新公共管理与新公共服务各自把什么放在中心？","lessons":["l2-4","l2-5"]},{"title":"治理与网络","question":"治理为什么强调多中心，网络治理又新在哪里？","lessons":["l2-6","l2-8"]},{"title":"理论怎么选","question":"面对一段材料，怎样判断该用哪个理论？","lessons":["l2-7"]}],"relations":[{ 基本思想：“（1）行政学科应当建立在单一的组织原型的基础上，它能普遍运用于一切政治制度；（2）任何良好的行政科学必须使它自己从政治学领域中分离出来；（3）行政科学的指导价值是效率；（4）有效的公共行政要求政府权力有单一的领导中心。”同时，他还认为建立独立的公共行政学的目的就是“使政府不走弯路，使政…","contextPage":26,"lessonId":"l2-1"},{"src":"cai-wang-3","pages":[59],"quote":"新公共行政理论则强调，公共行政的核心价值在于社会公平","context":"…提出计划时，常常以牺牲社会的平等来强调效率和节约，与其说它照顾一般利益，倒不如说它照顾特殊利益，它以献身于争取公众福利和民众的面貌出现，但实际上却反其道而行之。新公共行政理论则强调，公共行政的核心价值在于社会公平，在于促进社会所拥有的、以社会公平为核心的基本价值。对于“社会公平”的含义，新公共行政学派做了更为具体的解释，并且将其视为公共行政的“公共目的”，正如弗雷德里克森所言：“社会公平包含着对包括组织设计和管理形态在内的一系列价值取向的选择。社会…","contextPage":59,"lessonId":"l2-2"},{"src":"cai-wang-3","pages":[63],"quote":"一是官员想要增加的是下属而不是对手，二是官员们相互之间制造工作","context":"…些通过福利再分配的政策性支出和公共服务会大大超过其他公共支出的增长，这将促使政府职能出现结构性扩展。2.帕金森定律帕金森定律揭示了政府机构不断膨胀的两大动力：“一是官员想要增加的是下属而不是对手，二是官员们相互之间制造工作。”②从官僚体制来看，官僚机构具有高度的垄断性，缺乏竞争，鼓励浪费与低效。同时，官僚机构有高度分化与专业化趋势，一方面使组织更加庞大，另一方面协调组织内个人和分支部门的困难和代价加大，官僚机构的交易成本提高。用数学方式说明帕金森定律为：在任…","contextPage":63,"lessonId":"l2-3"},{"src":"cai-wang-3","pages":[67],"quote":"（1）向职业化管理的转变；（2）标准与绩效测量；（3）产出控制；（4）单位的分散化","context":"…责任制，强调产出导向和绩效评估，以准独立的行政单位为主的分权结构，采用私人部门管理、技术、工具并引入市场机制以改善竞争。为此，他将新公共管理的内涵及特征概括为：（1）向职业化管理的转变；（2）标准与绩效测量；（3）产出控制；（4）单位的分散化；（5）竞争；（6）私人部门管理的风格；（7）纪律与节约②。哈伯德（M.Hubbard）将新公共管理归纳为十大方面：（1）主管的战略角色和战略管理实践的强化；（2）从行政到管理的重点转移，即从执行规则到实现既定目标的转移；（3）人事权由中央…","contextPage":67,"lessonId":"l2-4"},{"src":"cai-wang-3","pages":[69],"quote":"政府的职能是服务而不是掌舵","context":"…重点既不应该是为政府航船掌舵，也不应该是为其划桨，而应该是建立一些明显具有完善整合力和回应力的公共机构。具体来说，新公共服务理论包括以下几个方面的基本观点：1.政府的职能是服务而不是掌舵“对于公务员来说，越来越重要的是要利用基于价值的共同领导来帮助公民明确表达和满足他们的共同利益，而不是试图控制或掌控社会新的发展方向。”①在新公共服务理论家看来，尽管过去政府在为“社会掌舵”方面扮演着十分重要的角色，但当今时代为社会领航的公…","contextPage":69,"lessonId":"l2-5"},{"src":"cai-wang-3","pages":[75],"quote":"第一，公共治理是由多元的公共管理主体组成的公共行动体系","context":"…对新公共管理理论和新公共服务理论之合理内核进行整合的结果，其核心观点是主张通过合作、协商、伙伴关系、确定共同的目标等途径，实现对公共事务的管理，其主要内容包括：第一，公共治理是由多元的公共管理主体组成的公共行动体系。这些公共管理主体不仅包括几乎长期垄断公共管理主体地位的政府部门，而且还包括诸如私人部门和第三部门等非政府部门的参与者。我们知道，在现代公共管理理论兴起之前的很长一个时期，对社会公共事务的管理主要都是由政府垄断并且强制实施的，政府在公共管理…","contextPage":75,"lessonId":"l2-6"},{"src":"cai-wang-3","pages":[75],"quote":"政府并非公共管理的唯一主体","context":"…现代公共管理理论兴起之前的很长一个时期，对社会公共事务的管理主要都是由政府垄断并且强制实施的，政府在公共管理领域几乎成了独一无二的管理主体。公共治理理论则认为，政府并非公共管理的唯一主体，除此之外，私人部门、第三部门等非政府组织在公共事务的管理中也扮演着重要的角色，它（他）们在介于市场经济与公共部门之间的“社会经济”领域内积极活动并且依靠自身资源参与管理共同关切的社会事务，在某些领域，非政府组织和个人甚至比政府拥有更大的优…","contextPage":75,"lessonId":"l2-7"},{"src":"chen-2","pages":[80],"quote":"在治理的诸多用法中，“只有网络治理才有新的特征”","context":"…强调国家与社会、政府与市场、私域与公域的合作。可以预见，随着历史的发展，统治将随着国家的消亡而消亡，而治理将成为“自由人的联合体”中管理共同事务的社会协调模式。在治理的诸多用法中，“只有网络治理才有新的特征”③。治理理论的三种研究途径如表3-1所示。表3-1治理理论的三种研究途径政府管理的途径公民社会的途径合作网络的途径分析的对象政府部门与市场力量的关系公民社会(第三部门)与政治国家的关系多中心的公共行动体系关系的特征掌舵与划桨自治与认同相互依…","contextPage":80,"lessonId":"l2-8"}]},"m4":{"question":"领导为什么不能只靠个人特质，体制与方法各解决什么问题？","position":"在“谁来管理与协调”层，把领导者、体制与协调方法分开。","prerequisites":["l3-1","l3-2"],"before":"一个好领导靠天赋还是靠制度？先写出你的理由。","branches":[{"title":"领导理论的演进","question":"特质、行为、权变三段各回答什么问题？","lessons":["l4-1"]},{"title":"领导体制","question":"职能、权力、责任怎样配置，首长制与委员会制如何取舍？","lessons":["l4-2"]},{"title":"领导方法与协调","question":"协调为什么强调平等、互利与结果不确定？","lessons":["l4-3"]}],"relations":[{"label":"体制与组织权力","text":"领导体制是组织权力与责任的配置，讨论领导不能脱离组织结构。","lessons":["l4-2","l3-2"]},{"label":"协调与组织间关系","text":"跨部门协调依赖自然性影响力，这正好对应政府间关系的协商面。","lessons":["l4-3","l3-5"]},{"label":"权变与情境","text":"权变公式说明没有普遍最佳，应急管理中的统一指挥也是情境约束。","lessons":["l4-1","l9-2"]}],"hint":"先写“理论—体制—方法”三层，再各补一句它解决的问题。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，列出领导理论的三个阶段、领导体制的四项内容、领导协调的三个特点。","reference":"理论：特质→行为→权变；体制：领导结构、层次与跨度、职责权限、干部管理；协调：平等性、互利性、结果不确定性。能把三层并列并说明关系即可。","check":"我按三层写出了要点，而不是只背人名。"},{"id":"relation","label":"解释一条知识联系","prompt":"用首长制与委员会制比较，说明为什么“哪种更好”不能一概而论。","reference":"首长制决策快、责任明，适合执行性、突发性任务；委员会制集思广益、代表性强，适合方针政策与综合协调。选择取决于任务性质、环境与监督条件。","check":"我把制度优劣与适用情境连起来。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老要协调街道、服务机构与志愿组织，指出领导协调的难点与做法。","reference":"难点在各方地位平等、没有直接强制力，利益与信息又不一致。做法包括明确共同目标、建立定期沟通、公开资源与责任、用信任与专业判断形成自然性影响力。","check":"我说明了协调难点，并给出可执行的做法。"}],"evidenceLessons":["l4-1","l4-2","l4-3","l3-2","l3-5","l9-2"],"bridge":{"subject":"822","module":"p5","text":"换到政策系统：领导者只是政策主体之一，还要看权力与规则。"},"evidence":[{"src":"cai-wang-3","pages":[127],"quote":"公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织","context":"…着眼于组织功能的变化，区分“掌舵职能”和“划桨职能”、决策职能和执行职能，强化公共组织的社会服务职能。本章小结1.现代社会中的组织主要包括公共组织和非公共组织。公共组织是以实现公共利益为目的、以管理公共事务和提供公共服务为基本职能的社会组织。为了实现组织目标和充分发挥功能，公共组织必须建立科学、合理的组织结构及其形式。2.在公共管理中，由于公共管理层次、公共事务性质的不同，政府组织、非营利组织、社会自治组织和准政府组织构成系统的公共管理主体。现代公共管理主体是以政府组织为核心…","contextPage":127,"lessonId":"l3-1"},{"src":"cai-wang-3","pages":[89],"quote":"公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式","context":"…质量和服务水平，正是当代各国政府在着力探索和解决的问题。3.1.2公共组织的结构“结构”一词是生物学上的名词，是指一个生物体对所具有的各种要素的科学的特定安排。公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式。良好的公共组织结构是完成公共组织目标、提高行政效率的物质基础，具有重要的功能。合理的组织结构能有效地满足公共组织目标的需要；有利于稳定工作人员的情绪，调动工作人员的积极性；能使组织保持良好的沟通关系；是提高微观和宏观行政效率的前提条件。为…","contextPage":89,"lessonId":"l3-2"},{"src":"cai-wang-3","pages":[138],"quote":"真正决定一个人成为领导者的因素是他的行为","context":"…理论潜在的理论缺陷和在现实中不断被证伪，在人际关系理论的影响下，研究者开始将考察有效领导的重点转移到领导者的行为和风格上来，形成了领导行为理论①。这种理论认为，真正决定一个人成为领导者的因素是他的行为，只有那些行为上表现出既关心工作（生产）又关心个人（下属）的领导者才是最有效的，同时认为领导行为是可以通过后天的培养和锻炼得到的。这些理论的主要研究成果包括勒温的三种领导方式理论、利克特的四种管理方式理论、斯托格迪尔的领导四分图理论、布莱克…","contextPage":138,"lessonId":"l4-1"},{"src":"cai-wang-3","pages":[142],"quote":"指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制","context":"…体制的含义和内容4.2.1.1领导体制的含义体制是指国家机关、企事业单位在机构设置、领导隶属关系和管理权限划分等方面的体系、制度、方法、形式等的总称。领导体制是指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制。领导体制的好坏，直接关系到领导能否有效地履行职能，有效地调动组织成员的积极性，实现组织目标。在西方，领导体制是整个公共管理系统得以顺利运转的关键：选民、利益集团和政党的利益要求只有通过领导体制的转换，才能最后形成国家或政府政策；立法机关的…","contextPage":142,"lessonId":"l4-2"},{"src":"cai-wang-3","pages":[148],"quote":"领导方法是指领导者配置资源、沟通和协调关系、统筹安排时间、统御和激励下属的各种手段与途径","context":"…或途径；有人认为，领导方法是领导水平、执政能力和领导科学的重要组成部分；有人认为，领导方法是领导者在领导活动中所采取的各种手段、办法和程序的总称。因此，可以说，领导方法是指领导者配置资源、沟通和协调关系、统筹安排时间、统御和激励下属的各种手段与途径。4.3.1.2领导方法的特征根据领导方法内涵的阐释，领导方法具有以下特征：（1）领导方法的目的性。领导方法是通向领导愿景或组织目标的方法，这就表明了方法的目的性，且这种目的性也内在于领导者的意愿之中。就现代领导者来说，领导者在目的性上所要…","contextPage":148,"lessonId":"l4-3"},{"src":"chen-2","pages":[126],"quote":"政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。","context":"…，反过来又对政府间的纵向关系产生了深刻影响，大大改变了旧体制下的政府间关系的原有格局，使政府间关系超出了纵向与横向的简单脉络，朝向复杂的网络体系发展。综上所述，政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。4.1.2政府间关系研究的进展1.国外的政府间关系研究在国外，政府间关系一直以来都是公共行政与公共政策领域的重要研究课题。与政府间关系演变的实践相呼应，政府间关系的研究也经历了一个发展的过程。20世纪80年代以前的研究主要关注中央与地方的关…","contextPage":126,"lessonId":"l3-5"},{"src":"cai-wang-3","pages":[328],"quote":"国家建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制","context":"…各类主体在从事应急管理时在机构设置、领导隶属关系、管理权限划分和运行程序等方面的职责划分、制度、方法、形式等的总称。《中华人民共和国突发事件应对法》第四条规定：国家建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制，如图9-4所示。图9-4应急管理体制结构图应急管理体制的确立涉及一个国家或地区的政治、经济、自然、社会等多方面因素，而且随着人类社会的进步和应对突发事件能力的提高而不断变化和调整。在我国，应急","contextPage":328,"lessonId":"l9-2"}]},"m5":{"question":"政策靠什么工具落地，工具选择受什么限制？","position":"在“如何作出行动安排”层，把政策目标、工具类型与选择条件分开。","prerequisites":["l1-1","l2-3"],"before":"“发补贴”与“改善服务”是在回答同一个问题吗？","branches":[{"title":"工具类型","question":"自愿、强制、混合三类工具各适合什么情形？","lessons":["l5-1"]},{"title":"工具选择","question":"四种因素与二维模型怎样解释“为什么选这个工具”？","lessons":["l5-2"]}],"relations":[{"label":"目标与工具","text":"目标是希望实现的状态，工具是手段；把补贴当目标会掩盖真正要解决的问题。","lessons":["l5-1","l1-1"]},{"label":"工具与执行","text":"工具选择已经预设了执行方式，强制工具与自愿工具的执行难点不同。","lessons":["l5-1","l9-1"]},{"label":"工具与评估","text":"工具是否有效要靠结果检验，不能因为“用了某种工具”就认定有效。","lessons":["l5-2","l12-1"]}],"hint":"先分“是什么工具”，再写“为什么选它”，最后补“怎么判断有效”。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，列出三类工具、各自的例子与适用条件，再说出四种选择因素。","reference":"自愿（家庭、志愿组织、市场）、强制（管制、公共企业、直接提供）、混合（信息劝诫、补贴、产权拍卖、征税、用户收费）；选择看工具特征、问题、环境、目标受众。","check":"我写出了类型、例子与选择因素。"},{"id":"relation","label":"解释一条知识联系","prompt":"比较“罚款”和“积分奖励”在垃圾分类中的差别，说明选择理由。","reference":"罚款是强制工具，适合后果严重、需要底线约束的情形；积分奖励是混合工具，适合需要长期行为改变、遵从成本较高的情形。选择还取决于执行能力与对象接受度。","check":"我把工具属性与适用条件对应起来。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老案例：比较直接提供服务与补贴两种手段，说明需要什么证据。","reference":"直接提供能控制质量但成本与灵活性受限；补贴能保留选择但可能排斥不会使用的老人。要调查需求规模、支付能力、服务供给者与监督成本，不能只比较预算。","check":"我比较了两种手段，并列出了待核实证据。"}],"evidenceLessons":["l5-1","l5-2","l9-1","l12-1"],"bridge":{"subject":"822","module":"p4","text":"换到政策学：同一套工具在政策过程里还有目标、功能与合法化问题。"},"evidence":[{"src":"cai-wang-3","pages":[15],"quote":"公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称","context":"…平新时代中国特色社会主义思想是这个时期我国公共管理学的指导理论，习近平总书记“治国理政”的系列重要论述是中国气派、中国特色公共管理理论的重要组成部分。综上所述，公共管理是以政府行政组织为核心的多元主体，为了增进公共利益，运用市场化、社会化手段和方法进行公共事务管理和公共服务提供的各种活动的总称。公共管理学是研究以政府行政组织为核心的多元主体进行公共事务管理和公共服务提供的活动及其规律的学问。1.1.2公共管理学的概念范畴范畴（category）就是基本的概念体系。思想体系不同，也就是概念体系不同，或范畴不同。公共管理学的理论体系…","contextPage":15,"lessonId":"l1-1"},{"src":"cai-wang-3","pages":[63],"quote":"一是官员想要增加的是下属而不是对手，二是官员们相互之间制造工作","context":"…些通过福利再分配的政策性支出和公共服务会大大超过其他公共支出的增长，这将促使政府职能出现结构性扩展。2.帕金森定律帕金森定律揭示了政府机构不断膨胀的两大动力：“一是官员想要增加的是下属而不是对手，二是官员们相互之间制造工作。”②从官僚体制来看，官僚机构具有高度的垄断性，缺乏竞争，鼓励浪费与低效。同时，官僚机构有高度分化与专业化趋势，一方面使组织更加庞大，另一方面协调组织内个人和分支部门的困难和代价加大，官僚机构的交易成本提高。用数学方式说明帕金森定律为：在任…","contextPage":63,"lessonId":"l2-3"},{"src":"cai-wang-3","pages":[172],"quote":"公共政策工具又称为治理工具或政府工具","context":"…目标的实现时，实际上也就转化为政策工具。政策工具的选择直接关系到公共政策目标的实现，它的选择需要综合考虑政策环境的具体情况。5.1.2.1公共政策工具研究的兴起公共政策工具又称为治理工具或政府工具。20世纪90年代以来，政策工具的研究日渐成为西方政策科学研究的一个焦点。政策工具研究兴起的主要原因有：一是政策执行的复杂多变性以及经常出现的政策失败引发人们对政策执行工具和方式的反思；二是政府组织对于政策的制定与执行的实践知识的需求日益增…","contextPage":172,"lessonId":"l5-1"},{"src":"cai-wang-3","pages":[173],"quote":"提出了政策工具选择需要考虑的四种因素，即政策工具的特征、政策问题、政策环境、目标受众的特征","context":"…户收费。5.1.2.3政策工具的选择及其应用1.政策工具的选择政策工具的选择受到各种主客观因素的制约。R.巴格丘斯在《在政策工具的恰当性与适配性之间权衡》一文中提出了政策工具选择需要考虑的四种因素，即政策工具的特征、政策问题、政策环境、目标受众的特征。根据这一理论，一种政策工具只有在以政策工具特征为一方与以政策环境和目标受众为另一方相匹配的时候才是有效的。在这样的情况下，有关的政策工具被称为有效的政策工具①。从根本上说，政策工具的选择是一种理性行为。理性是人类自主选择并为此调节自我行为…","contextPage":173,"lessonId":"l5-2"},{"src":"cai-wang-3","pages":[322],"quote":"这种非常态的状态就是公共危机","context":"…生、给人们的生命和财产造成或者可能造成一定危害的事件，突发事件的生成和发展阶段一般称为风险状态；突发事件爆发后造成了一定危害，使生产和生活进入一种非常态的状态，这种非常态的状态就是公共危机；风险、突发事件是应急管理的对象。任何突发事件都有生成、发展、演化、爆发、衰退的过程，这构成了应急管理的生命周期。风险反应的是突发事件生成和发展阶段的一种状态，突发事件爆发后，使社会进入紧急状态或非常态的状态，从而诱发公共危机。采取措施摆脱…","contextPage":322,"lessonId":"l9-1"},{"src":"cai-wang-3","pages":[432],"quote":"绩效既不等于产出本身，也不等于任务或产品本身","context":"…职责履行以外所产生的结果不能视为绩效。第二，从绩效产生的主体来看，绩效包括了公共部门整体绩效、公共管理人员个人绩效和项目绩效。第三，从绩效质与量的本质属性来看，绩效既不等于产出本身，也不等于任务或产品本身，绩效是投入所获得的产出及其所产生的社会效果，不仅有量的规定性，","contextPage":432,"lessonId":"l12-1"}]},"m6":{"question":"从“管人”到“开发人”，公共部门用人制度要解决哪些老问题？","position":"在“用什么资源与方法”层，把人力资源看作与预算、信息并列的资源。","prerequisites":["l3-2","l4-2"],"before":"把员工当成本还是当资源，会改变哪些管理动作？","branches":[{"title":"人事管理到人力资源管理","question":"四点区别与四个理论阶段说明什么？","lessons":["l6-1"]},{"title":"公务员制度","question":"三个标准、三类范围与中西差别怎样影响管理？","lessons":["l6-2"]}],"relations":[{"label":"制度与领导体制","text":"公务员制度是领导体制中干部管理制度的延伸，二者都涉及权责配置。","lessons":["l6-2","l4-2"]},{"label":"开发与绩效","text":"把人员当资源，就要用培训与开发支撑绩效，而不只是考核。","lessons":["l6-1","l12-1"]},{"label":"公务员与伦理","text":"公务员的职责与裁量权使伦理约束成为制度的一部分。","lessons":["l6-2","l11-1"]}],"hint":"用“假设—职责—角色—手段”四点比较两种管理，再补公务员制度的三个标准。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，比较传统人事管理与现代人力资源管理的四点区别，并写出四个理论阶段。","reference":"四点：对人假设、管理职责、部门角色、方式手段；阶段：科学管理、行为主义、现代管理、企业文化。要说明每个阶段补上了前一阶段什么缺陷。","check":"我写出了四点区别与阶段线索。"},{"id":"relation","label":"解释一条知识联系","prompt":"用三个标准判断“公立医院有编制的医生”是不是公务员，并说明理由。","reference":"公务员须同时满足依法履行公职、纳入国家行政编制、由国家财政负担工资福利。公立医院医生通常未纳入行政编制，因此不是公务员；事业单位人员另有制度。","check":"我用三个标准逐条判断。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老服务机构招人难，结合人力资源管理阶段与公务员制度谈思路。","reference":"先判断岗位属于政府、事业单位还是社会组织，再谈招聘、培训、激励与职业发展。不能把公务员制度直接套到社会组织；可借鉴能力建设与绩效管理，但要注意编制与财政约束。","check":"我先区分组织类型，再给管理思路。"}],"evidenceLessons":["l6-1","l6-2","l4-2","l11-1","l12-1"],"bridge":{"subject":"822","module":"p9","text":"换到执行：政策最终要靠组织与人员去落实。"},"evidence":[{"src":"cai-wang-3","pages":[89],"quote":"公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式","context":"…质量和服务水平，正是当代各国政府在着力探索和解决的问题。3.1.2公共组织的结构“结构”一词是生物学上的名词，是指一个生物体对所具有的各种要素的科学的特定安排。公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式。良好的公共组织结构是完成公共组织目标、提高行政效率的物质基础，具有重要的功能。合理的组织结构能有效地满足公共组织目标的需要；有利于稳定工作人员的情绪，调动工作人员的积极性；能使组织保持良好的沟通关系；是提高微观和宏观行政效率的前提条件。为…","contextPage":89,"lessonId":"l3-2"},{"src":"cai-wang-3","pages":[142],"quote":"指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制","context":"…体制的含义和内容4.2.1.1领导体制的含义体制是指国家机关、企事业单位在机构设置、领导隶属关系和管理权限划分等方面的体系、制度、方法、形式等的总称。领导体制是指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制。领导体制的好坏，直接关系到领导能否有效地履行职能，有效地调动组织成员的积极性，实现组织目标。在西方，领导体制是整个公共管理系统得以顺利运转的关键：选民、利益集团和政党的利益要求只有通过领导体制的转换，才能最后形成国家或政府政策；立法机关的…","contextPage":142,"lessonId":"l4-2"},{"src":"cai-wang-3","pages":[212],"quote":"传统人事制度强调的是控制，现代人力资源管理强调的是灵活性","context":"…事制度的一个核心目标是防止管理层的权力滥用，保护员工的利益，维护制度的公正。现代人力资源管理者成了顾客，人事制度应该为他们服务，以便使管理者能更好地服务于大众。传统人事制度强调的是控制，现代人力资源管理强调的是灵活性；传统人事制度关注的是保证程序的统一，现代人力资源管理关注的则是目标的实现；传统人事制度把员工视为劳动力，现代人力资源管理把员工视为组织的重要资源；管理制度所扮演的角色也逐渐由保护者转变成了激励者。①徐晓丹．从传统人事管理到公共人力资源管理…","contextPage":212,"lessonId":"l6-1"},{"src":"cai-wang-3","pages":[228],"quote":"我国公务员制度不搞政治中立，坚持党管干部的原则，没有政务官与事务官之分","context":"…《党政领导干部选拔任用工作条例》和《公务员职务和职级并行规定》，标志着我国公务员制度顺应新时代发展潮流，进入了更加科学、成熟的阶段。与西方国家的公务员制度相比，我国公务员制度不搞政治中立，坚持党管干部的原则，没有政务官与事务官之分。6.3.1.1公务员的内涵公务员是公共管理的重要主体。公务员是由英文“civilservant”翻译而来。“公务员”是这一英文概念的意译。从世界范围来看，公务员的概念和范围大小不一。从已有的文献资料中，可以分为三类：第一类是小范围的，公务…","contextPage":228,"lessonId":"l6-2"},{"src":"cai-wang-3","pages":[394],"quote":"公共管理伦理是公共管理领域的规范体系","context":"…“道德科学”。一般来说，伦理有其普适性，但不同领域有着不同的伦理，如经济伦理、行政伦理、私人部门的伦理、公共部门的伦理、企业管理伦理和公共管理伦理等。就此而论，公共管理伦理是公共管理领域的规范体系，它所针对的基本对象是公共管理行为，虽然它不可避免地涉及管理者与管理对象之间的关系，但作为公共管理对象的公民、社会群体和公共场所的道德行为或伦理关系不是公共管理伦理所要考虑的主要问题。公共管理伦理通过赋予公共管理行为的价值规范体系，引导、规…","contextPage":394,"lessonId":"l11-1"},{"src":"cai-wang-3","pages":[432],"quote":"绩效既不等于产出本身，也不等于任务或产品本身","context":"…职责履行以外所产生的结果不能视为绩效。第二，从绩效产生的主体来看，绩效包括了公共部门整体绩效、公共管理人员个人绩效和项目绩效。第三，从绩效质与量的本质属性来看，绩效既不等于产出本身，也不等于任务或产品本身，绩效是投入所获得的产出及其所产生的社会效果，不仅有量的规定性，","contextPage":432,"lessonId":"l12-1"}]},"m7":{"question":"钱按什么规则分，由谁看住？","position":"在“用什么资源与方法”层，预算是把政策优先性变成数字的环节。","prerequisites":["l3-2","l4-2"],"before":"预算只是一张收支表吗？先写出它可能隐含的政治判断。","branches":[{"title":"预算的内涵与功能","question":"四个维度、五个功能、三个要素各说明什么？","lessons":["l7-1"]},{"title":"调整与监督","question":"预算调整的四类情形与人大监督怎样约束政府？","lessons":["l7-2"]}],"relations":[{"label":"预算与政策优先性","text":"预算分配反映政策排序，钱给谁、给多少本身就是政策选择。","lessons":["l7-1","l5-1"]},{"label":"预算与问责","text":"预算调整须经法定程序，是把变更放到台面上接受审查。","lessons":["l7-2","l11-2"]},{"label":"预算与绩效","text":"绩效评估要问钱花出了什么效果，预算为评估提供资源与约束。","lessons":["l7-1","l12-1"]}],"hint":"先写“预算是什么”，再写“钱怎么分、怎么改、谁来看”。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，用四个维度、五个功能、三个要素概括公共预算。","reference":"四维：政治、管理、经济、财务管理；五功能：计划、管理、控制、优先性排序、预算问责；三要素：资源申请、分配、保护。要说明它们不是并列名词，而是从不同角度描述同一过程。","check":"我按维度、功能、要素三组写出要点。"},{"id":"relation","label":"解释一条知识联系","prompt":"说明预算调整与一般预算变更的区别，并列出四类需调整的情形。","reference":"预算调整是经人大批准的预算在执行中因特殊原因增支或减收、变更原批准预算，须经人大常委会批准；一般变更按权限程序办理。四类情形：增减总支出、调入预算稳定调节基金、调减重点支出、增加举借债务。","check":"我区分了两个概念并写出四类情形。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老项目预算被削减，分析应怎样调整与接受监督。","reference":"先看削减属于预算调整还是一般变更，再说明理由、项目与数额；涉及重点支出或债务的要报批。监督上要公开调整依据、绩效目标与后续评估，不能只做内部记账。","check":"我把调整程序与监督要求连起来。"}],"evidenceLessons":["l7-1","l7-2","l5-1","l11-2","l12-1"],"bridge":{"subject":"822","module":"p8","text":"换到方案抉择：预算约束是方案可行性的重要条件。"},"evidence":[{"src":"cai-wang-3","pages":[89],"quote":"公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式","context":"…质量和服务水平，正是当代各国政府在着力探索和解决的问题。3.1.2公共组织的结构“结构”一词是生物学上的名词，是指一个生物体对所具有的各种要素的科学的特定安排。公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式。良好的公共组织结构是完成公共组织目标、提高行政效率的物质基础，具有重要的功能。合理的组织结构能有效地满足公共组织目标的需要；有利于稳定工作人员的情绪，调动工作人员的积极性；能使组织保持良好的沟通关系；是提高微观和宏观行政效率的前提条件。为…","contextPage":89,"lessonId":"l3-2"},{"src":"cai-wang-3","pages":[142],"quote":"指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制","context":"…体制的含义和内容4.2.1.1领导体制的含义体制是指国家机关、企事业单位在机构设置、领导隶属关系和管理权限划分等方面的体系、制度、方法、形式等的总称。领导体制是指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制。领导体制的好坏，直接关系到领导能否有效地履行职能，有效地调动组织成员的积极性，实现组织目标。在西方，领导体制是整个公共管理系统得以顺利运转的关键：选民、利益集团和政党的利益要求只有通过领导体制的转换，才能最后形成国家或政府政策；立法机关的…","contextPage":142,"lessonId":"l4-2"},{"src":"cai-wang-3","pages":[243],"quote":"公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动","context":"…问题就是要回答“应该以什么为基础来决定把X数量的预算资金分给A项目，而不是B项目”②。以美国著名政治学家、公共管理学家威尔达夫斯基为代表的早期公共管理学家认为：公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动③。这个定义指出了公共预算的两个关键：其一，预算分配的公共政策导向，即财政资源的分配是围绕公共政策的目标而进行的；其二，公共预算活动实质上是一系列资源的分配决策过程。从实际操作的角度看，公共预算是指经法定程序批准的政府年度财政收支计划，以及…","contextPage":243,"lessonId":"l7-1"},{"src":"cai-wang-3","pages":[259],"quote":"预算调整是指经人民代表大会批准的预算，在执行中因特殊原因需要增加支出或减少收入，变更原来批准预算的过程","context":"…可能确需进行预算变更。预算变更中属于预算调整的，要严格按照法定程序经人大常委会批准后调整预算；其他不属于预算调整的预算变更事项，要按有关规定权限和程序予以变更。预算调整是指经人民代表大会批准的预算，在执行中因特殊原因需要增加支出或减少收入，变更原来批准预算的过程。预算执行过程中，如果出现《预算法》规定的下列情况之一的，应当进行预算调整：第一，需要增加或者减少预算总支出的；第二，需要调入预算稳定调节基金的；第三，需要调减预算安排的重点支出数额的；第四，需要增加举借债务数额的。根据《预算法》的要求，在…","contextPage":259,"lessonId":"l7-2"},{"src":"cai-wang-3","pages":[172],"quote":"公共政策工具又称为治理工具或政府工具","context":"…目标的实现时，实际上也就转化为政策工具。政策工具的选择直接关系到公共政策目标的实现，它的选择需要综合考虑政策环境的具体情况。5.1.2.1公共政策工具研究的兴起公共政策工具又称为治理工具或政府工具。20世纪90年代以来，政策工具的研究日渐成为西方政策科学研究的一个焦点。政策工具研究兴起的主要原因有：一是政策执行的复杂多变性以及经常出现的政策失败引发人们对政策执行工具和方式的反思；二是政府组织对于政策的制定与执行的实践知识的需求日益增…","contextPage":172,"lessonId":"l5-1"},{"src":"cai-wang-3","pages":[419],"quote":"专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动","context":"提高行政复议总体水平；6）必须不断完善行政复议制度和机制，进一步规范行政复议行为①。（2）专门监督。专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动。目前，我国公共管理专门监督中，最为核心、常用、有效的是国家行政监督机关实行的行政监察活动。国家行政监察机关以宪法和法律为依据，在我国县级以上各级政府中都有设立。它在上级行政监督机关和所属人民政府的领导下，独立地行使监察权，只服从国家有关法…","contextPage":419,"lessonId":"l11-2"},{"src":"cai-wang-3","pages":[432],"quote":"绩效既不等于产出本身，也不等于任务或产品本身","context":"…职责履行以外所产生的结果不能视为绩效。第二，从绩效产生的主体来看，绩效包括了公共部门整体绩效、公共管理人员个人绩效和项目绩效。第三，从绩效质与量的本质属性来看，绩效既不等于产出本身，也不等于任务或产品本身，绩效是投入所获得的产出及其所产生的社会效果，不仅有量的规定性，","contextPage":432,"lessonId":"l12-1"}]},"m8":{"question":"信息怎样从“部门所有”变成“可公开、可共享”的公共资源？","position":"在“用什么资源与方法”层，信息与人员、预算一样是公共管理的资源。","prerequisites":["l3-3","l7-1"],"before":"“公开了”就等于“公众能用上”吗？","branches":[{"title":"政务信息公开","question":"六条原则怎样处理公开与保护的关系？","lessons":["l8-1"]},{"title":"交换共享","question":"两个阶段与三条管理措施各解决什么问题？","lessons":["l8-2"]}],"relations":[{"label":"公开与监督","text":"公开是监督的前提，没有可获取的信息，外部监督无法启动。","lessons":["l8-1","l11-2"]},{"label":"共享与组织协调","text":"跨部门共享卡在职责与利益，和政府间关系的协调问题同源。","lessons":["l8-2","l3-5"]},{"label":"信息与决策","text":"信息质量影响问题认定与方案比较，信息缺失会让决策靠猜。","lessons":["l8-1","l7-1"]}],"hint":"按“公开—共享—障碍”三层组织，每层各写一条原则或措施。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，写出政务信息公开的六条原则，并说明“利益平衡”为什么最难。","reference":"合法、及时、真实、利益平衡、不收费、责任；利益平衡要同时保护隐私、商业秘密与国家秘密，例外若不列举限定，就容易变成不公开的借口。","check":"我写出六条原则并解释了难点。"},{"id":"relation","label":"解释一条知识联系","prompt":"比较信息公开与交换共享的目标、对象与手段。","reference":"公开面向社会公众，重在知情与监督；共享面向政府部门，重在履职所需的数据流动。二者都涉及安全与责任，但公开强调权利，共享强调职责与协作。","check":"我比较了目标、对象与手段。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老数据分散在民政、卫健与街道，设计一个共享方案并指出风险。","reference":"先编目录明确数据项与责任，再定标准与接口，最后立管理制度（谁能用、怎么用、如何审计）。风险包括过度采集、转给第三方、用于商业目的与安全泄露；要最小必要与授权留痕。","check":"我按目录、标准、制度三层设计，并指出风险。"}],"evidenceLessons":["l8-1","l8-2","l11-2","l3-5","l7-1"],"bridge":{"subject":"822","module":"p7","text":"换到议程：指标与信息如何让一个问题被看见？"},"evidence":[{"src":"cai-wang-3","pages":[93],"quote":"按此标准进行划分，公共组织主要可以分为政府组织、非营利组织和准政府组织","context":"…共权力的支持才能完成管理。相对其他标准而言，按公共组织是否拥有行政权力以及这一权力的大小来进行划分，更能反映出公共组织的本质特征以及不同类型公共组织的活动特点。按此标准进行划分，公共组织主要可以分为政府组织、非营利组织和准政府组织。按是否具有行政权对公共组织进行划分，从一个特定的侧面反映出了公共管理的三个基本的层面。在公共管理中，只有政府组织、非营利组织和准政府组织协调发展，才能形成一个完备的公共管理体系，才能最大限度地增进公共利益。现代公共管理是在一定环境中产生的…","contextPage":93,"lessonId":"l3-3"},{"src":"cai-wang-3","pages":[243],"quote":"公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动","context":"…问题就是要回答“应该以什么为基础来决定把X数量的预算资金分给A项目，而不是B项目”②。以美国著名政治学家、公共管理学家威尔达夫斯基为代表的早期公共管理学家认为：公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动③。这个定义指出了公共预算的两个关键：其一，预算分配的公共政策导向，即财政资源的分配是围绕公共政策的目标而进行的；其二，公共预算活动实质上是一系列资源的分配决策过程。从实际操作的角度看，公共预算是指经法定程序批准的政府年度财政收支计划，以及…","contextPage":243,"lessonId":"l7-1"},{"src":"cai-wang-3","pages":[295],"quote":"政务信息资源公开也称政务信息资源开放","context":"…功能服务的特点。（4）资源形态类政务信息资源。这是以信息的存在形式为依据而形成的政务信息资源类别。8.2.5政务信息资源公开8.2.5.1政务信息资源公开的含义政务信息资源公开也称政务信息资源开放，是指政务部门以及法律法规授权的具有管理公共事务职能的公共组织主动或根据公众的申请公开政务信息，并方便社会公众获取和使用政务信息的各种活动与制度的总称。由法律确定的、现代意义的信息公开制度，产生于18世纪的欧洲。1766年，瑞典①俄罗斯《联…","contextPage":295,"lessonId":"l8-1"},{"src":"cai-wang-3","pages":[299],"quote":"政务信息资源交换共享是指一个部门为其他部门履行公共管理职能的需要而提供政务信息资源","context":"…息资源交换共享的含义政务信息资源交换共享包括全社会交换共享和各公共部门之间的交换共享。本章所研究的政务信息资源交换共享是指各公共部门之间的政务信息资源交换共享。政务信息资源交换共享是指一个部门为其他部门履行公共管理职能的需要而提供政务信息资源，以及为履行公共管理职能的需要从其他部门获取政务信息资源的行为。实现政务信息资源交换共享是充分开发利用政务信息资源的有效途径。一个部门从另一个部门获取的政务信息资源，只能用于本部门履行职能的需要，不得转给第三方和用于商业目的。政务信息资源交…","contextPage":299,"lessonId":"l8-2"},{"src":"cai-wang-3","pages":[419],"quote":"专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动","context":"提高行政复议总体水平；6）必须不断完善行政复议制度和机制，进一步规范行政复议行为①。（2）专门监督。专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动。目前，我国公共管理专门监督中，最为核心、常用、有效的是国家行政监督机关实行的行政监察活动。国家行政监察机关以宪法和法律为依据，在我国县级以上各级政府中都有设立。它在上级行政监督机关和所属人民政府的领导下，独立地行使监察权，只服从国家有关法…","contextPage":419,"lessonId":"l11-2"},{"src":"chen-2","pages":[126],"quote":"政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。","context":"…，反过来又对政府间的纵向关系产生了深刻影响，大大改变了旧体制下的政府间关系的原有格局，使政府间关系超出了纵向与横向的简单脉络，朝向复杂的网络体系发展。综上所述，政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。4.1.2政府间关系研究的进展1.国外的政府间关系研究在国外，政府间关系一直以来都是公共行政与公共政策领域的重要研究课题。与政府间关系演变的实践相呼应，政府间关系的研究也经历了一个发展的过程。20世纪80年代以前的研究主要关注中央与地方的关…","contextPage":126,"lessonId":"l3-5"}]},"m9":{"question":"风险怎样变成危机，体制与预警怎样把损失压到最低？","position":"在“如何作出行动安排”层，应急管理是政策组织行动的特殊情境。","prerequisites":["l3-2","l4-2"],"before":"危机管理只是事发后的救援吗？","branches":[{"title":"概念链与生命周期","question":"风险、突发事件、公共危机、应急管理怎样连成一条链？","lessons":["l9-1"]},{"title":"应急管理体制","question":"二十字原则各解决什么失灵？","lessons":["l9-2"]},{"title":"预警与法制","question":"预警为什么必须可行动，法制如何约束紧急权力？","lessons":["l9-3"]}],"relations":[{"label":"预警与体制","text":"预警不是发警报，而是体制内信息与行动链条的启动。","lessons":["l9-3","l9-2"]},{"label":"危机与组织协调","text":"跨部门、跨层级协同是应急的核心，也是政府间关系的压力测试。","lessons":["l9-2","l3-5"]},{"label":"应急与政策工具","text":"强制、混合与自愿工具在应急不同阶段各有位置。","lessons":["l9-3","l5-1"]}],"hint":"先写四概念链，再写体制五原则，最后写预警与法制的边界。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，用一条链说清四个概念，并写出生命周期的四个阶段。","reference":"风险是可能，突发事件是事件，公共危机是非常态，应急管理是行动；生命周期：爆发前（预防准备、监测预警）、爆发时（处置救援）、爆发后（善后恢复）、控制后（调查评估）。","check":"我写出了概念链与四阶段。"},{"id":"relation","label":"解释一条知识联系","prompt":"解释“属地管理为主”与“分级负责”为什么不矛盾。","reference":"属地管理为主解决第一反应的时间问题，事发地政府最先到场、最先处置；分级负责解决资源规模问题，不同级别事件由不同层级调配资源。两者一个是时间逻辑，一个是能力逻辑。","check":"我分别说明了两者的逻辑。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老机构突发食物中毒，按生命周期写出各阶段动作。","reference":"爆发前：预案、演练、监测；爆发时：报告、救治、封存、信息发布；爆发后：善后、补偿、心理支持；控制后：调查、追责、修订预案。要说明阶段之间的信息传导。","check":"我按阶段写了动作，并说明衔接。"}],"evidenceLessons":["l9-1","l9-2","l9-3","l3-5","l5-1"],"bridge":{"subject":"822","module":"p11","text":"换到政策变动：危机会推动调整、终结或重新界定问题。"},"evidence":[{"src":"cai-wang-3","pages":[89],"quote":"公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式","context":"…质量和服务水平，正是当代各国政府在着力探索和解决的问题。3.1.2公共组织的结构“结构”一词是生物学上的名词，是指一个生物体对所具有的各种要素的科学的特定安排。公共组织结构则是指公共组织各种要素的一种特定安排，即公共组织各要素的排列组合方式。良好的公共组织结构是完成公共组织目标、提高行政效率的物质基础，具有重要的功能。合理的组织结构能有效地满足公共组织目标的需要；有利于稳定工作人员的情绪，调动工作人员的积极性；能使组织保持良好的沟通关系；是提高微观和宏观行政效率的前提条件。为…","contextPage":89,"lessonId":"l3-2"},{"src":"cai-wang-3","pages":[142],"quote":"指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制","context":"…体制的含义和内容4.2.1.1领导体制的含义体制是指国家机关、企事业单位在机构设置、领导隶属关系和管理权限划分等方面的体系、制度、方法、形式等的总称。领导体制是指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制。领导体制的好坏，直接关系到领导能否有效地履行职能，有效地调动组织成员的积极性，实现组织目标。在西方，领导体制是整个公共管理系统得以顺利运转的关键：选民、利益集团和政党的利益要求只有通过领导体制的转换，才能最后形成国家或政府政策；立法机关的…","contextPage":142,"lessonId":"l4-2"},{"src":"cai-wang-3","pages":[322],"quote":"这种非常态的状态就是公共危机","context":"…生、给人们的生命和财产造成或者可能造成一定危害的事件，突发事件的生成和发展阶段一般称为风险状态；突发事件爆发后造成了一定危害，使生产和生活进入一种非常态的状态，这种非常态的状态就是公共危机；风险、突发事件是应急管理的对象。任何突发事件都有生成、发展、演化、爆发、衰退的过程，这构成了应急管理的生命周期。风险反应的是突发事件生成和发展阶段的一种状态，突发事件爆发后，使社会进入紧急状态或非常态的状态，从而诱发公共危机。采取措施摆脱…","contextPage":322,"lessonId":"l9-1"},{"src":"cai-wang-3","pages":[328],"quote":"国家建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制","context":"…各类主体在从事应急管理时在机构设置、领导隶属关系、管理权限划分和运行程序等方面的职责划分、制度、方法、形式等的总称。《中华人民共和国突发事件应对法》第四条规定：国家建立统一领导、综合协调、分类管理、分级负责、属地管理为主的应急管理体制，如图9-4所示。图9-4应急管理体制结构图应急管理体制的确立涉及一个国家或地区的政治、经济、自然、社会等多方面因素，而且随着人类社会的进步和应对突发事件能力的提高而不断变化和调整。在我国，应急","contextPage":328,"lessonId":"l9-2"},{"src":"cai-wang-3","pages":[334],"quote":"完善的监测预警机制主要包括：监测系统、咨询系统、组织网络和法规体系","context":"…件的处理中，信息沟通包括两个方面：一是建立冲突双方之间的谈判沟通渠道，增进交流沟通，减少误解；二是洞悉对方的动机、实力和决心，有针对性地拟订有效的危机处理方案。完善的监测预警机制主要包括：监测系统、咨询系统、组织网络和法规体系。（1）监测预警的监测系统。建立监测系统的主要目的是及时发现危机征兆，准确把握危机诱因、未来发展趋势和演变规律。应用大数据等现代科学技术，实现监测的科学性、精准性非常重要。公共危机预警流程如图9-7所示。图9-7监测预警流程监测预警流程包括…","contextPage":334,"lessonId":"l9-3"},{"src":"chen-2","pages":[126],"quote":"政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。","context":"…，反过来又对政府间的纵向关系产生了深刻影响，大大改变了旧体制下的政府间关系的原有格局，使政府间关系超出了纵向与横向的简单脉络，朝向复杂的网络体系发展。综上所述，政府间关系是指中央政府与各级地方政府之间纵横交错的网络关系，它包括纵向的中央政府与地方政府、各级地方政府之间的关系，同级地方政府之间以及各级政府部门之间的互动关系。这种关系具有多层次、多主体、网络状和动态性等特征。4.1.2政府间关系研究的进展1.国外的政府间关系研究在国外，政府间关系一直以来都是公共行政与公共政策领域的重要研究课题。与政府间关系演变的实践相呼应，政府间关系的研究也经历了一个发展的过程。20世纪80年代以前的研究主要关注中央与地方的关…","contextPage":126,"lessonId":"l3-5"},{"src":"cai-wang-3","pages":[172],"quote":"公共政策工具又称为治理工具或政府工具","context":"…目标的实现时，实际上也就转化为政策工具。政策工具的选择直接关系到公共政策目标的实现，它的选择需要综合考虑政策环境的具体情况。5.1.2.1公共政策工具研究的兴起公共政策工具又称为治理工具或政府工具。20世纪90年代以来，政策工具的研究日渐成为西方政策科学研究的一个焦点。政策工具研究兴起的主要原因有：一是政策执行的复杂多变性以及经常出现的政策失败引发人们对政策执行工具和方式的反思；二是政府组织对于政策的制定与执行的实践知识的需求日益增…","contextPage":172,"lessonId":"l5-1"}]},"m10":{"question":"政府有哪些“工具箱”，战略管理为什么不能照搬企业？","position":"在“用什么资源与方法”层，把工具与战略看作方法资源。","prerequisites":["l5-2","l7-1"],"before":"工具越多越好吗？先写出选择工具时最容易被忽略的约束。","branches":[{"title":"市场化工具","question":"民营化、用者付费、合同外包、内部市场各治什么病？","lessons":["l10-1"]},{"title":"战略管理","question":"公共部门战略的公共性体现在哪些差异上？","lessons":["l10-2"]}],"relations":[{"label":"工具与选择","text":"工具不是越多越好，选择要看问题、能力、对象与环境。","lessons":["l10-1","l5-2"]},{"label":"战略与预算","text":"战略要落到资源安排，预算周期与约束会改变战略可行性。","lessons":["l10-2","l7-1"]},{"label":"战略与绩效","text":"战略目标要通过绩效指标检验，不能只停留在愿景。","lessons":["l10-2","l12-1"]}],"hint":"先写“工具有哪些”，再写“战略为什么不同”，最后用案例把两者接起来。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，列出五种市场化工具、各自做法与适用问题。","reference":"用者付费、合同外包、内部市场、放松管制、产权交易；每种写一句“它治什么病”。不要只写名称，要说明它改变了什么激励或边界。","check":"我写出了工具、做法与适用问题。"},{"id":"relation","label":"解释一条知识联系","prompt":"比较公共部门与私人部门战略管理的目标、审查与激励差异。","reference":"公共部门目标多元模糊、受公众审查、激励受限；私人部门目标清晰、可保密、以金钱激励为主。差异根源是公共性与公共权力。","check":"我比较了目标、审查与激励三个维度。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老服务中心要不要引入内部市场？说明条件与风险。","reference":"内部市场让购买方与服务方分开，能形成竞争；条件是能分清购买与提供、有质量标准与信息系统。风险是博弈成本、服务碎片化与公平受损，需要监管与兜底。","check":"我说明了条件与风险。"}],"evidenceLessons":["l10-1","l10-2","l5-2","l7-1","l12-1"],"bridge":{"subject":"822","module":"p3","text":"换到方法：工具评估也要靠抽样、比较与因果推断。"},"evidence":[{"src":"cai-wang-3","pages":[173],"quote":"提出了政策工具选择需要考虑的四种因素，即政策工具的特征、政策问题、政策环境、目标受众的特征","context":"…户收费。5.1.2.3政策工具的选择及其应用1.政策工具的选择政策工具的选择受到各种主客观因素的制约。R.巴格丘斯在《在政策工具的恰当性与适配性之间权衡》一文中提出了政策工具选择需要考虑的四种因素，即政策工具的特征、政策问题、政策环境、目标受众的特征。根据这一理论，一种政策工具只有在以政策工具特征为一方与以政策环境和目标受众为另一方相匹配的时候才是有效的。在这样的情况下，有关的政策工具被称为有效的政策工具①。从根本上说，政策工具的选择是一种理性行为。理性是人类自主选择并为此调节自我行为…","contextPage":173,"lessonId":"l5-2"},{"src":"cai-wang-3","pages":[243],"quote":"公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动","context":"…问题就是要回答“应该以什么为基础来决定把X数量的预算资金分给A项目，而不是B项目”②。以美国著名政治学家、公共管理学家威尔达夫斯基为代表的早期公共管理学家认为：公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动③。这个定义指出了公共预算的两个关键：其一，预算分配的公共政策导向，即财政资源的分配是围绕公共政策的目标而进行的；其二，公共预算活动实质上是一系列资源的分配决策过程。从实际操作的角度看，公共预算是指经法定程序批准的政府年度财政收支计划，以及…","contextPage":243,"lessonId":"l7-1"},{"src":"cai-wang-3","pages":[371],"quote":"用者付费就是通过把价格机制引入公共服务之中，对一些公共服务采取收费的方式","context":"10.2.1.2用者付费用者付费就是通过把价格机制引入公共服务之中，对一些公共服务采取收费的方式。用者付费工具有如下优点：一是有利于公众显示对公共产品和服务的真实需求，有效配置资源和提高服务质量；二是能够克服免费提供公共服务所导致的对资源的不合理配置和浪费；三是无偿提供公共服务将导致无目的的补贴和资助，对社会公平造成损害；四是可以使价…","contextPage":371,"lessonId":"l10-1"},{"src":"cai-wang-3","pages":[384],"quote":"公共部门战略管理的性质是公共性的","context":"…所以存在着这些差异，最主要的原因就在于公共管理是运用公共权力进行的管理。从现实来看，公共部门引入战略管理的实践只是管理方式上的变革，并没有影响到公共部门的性质。公共部门战略管理的性质是公共性的。10.3.2.1公共部门战略管理的根本性质是公共性私人部门战略的性质是自利性的，即其产生、存在的目的是追求合理的自身利益的最大化。公共部门战略的性质是公共性的，即其产生、存在是为了公共利益、公共目标、公共服务以及创造具有公益精神的意识形态…","contextPage":384,"lessonId":"l10-2"},{"src":"cai-wang-3","pages":[432],"quote":"绩效既不等于产出本身，也不等于任务或产品本身","context":"…职责履行以外所产生的结果不能视为绩效。第二，从绩效产生的主体来看，绩效包括了公共部门整体绩效、公共管理人员个人绩效和项目绩效。第三，从绩效质与量的本质属性来看，绩效既不等于产出本身，也不等于任务或产品本身，绩效是投入所获得的产出及其所产生的社会效果，不仅有量的规定性，","contextPage":432,"lessonId":"l12-1"}]},"m11":{"question":"权力凭什么被信任，伦理与监督各管什么？","position":"在“受到哪些约束”层，伦理是内在约束，监督是外在约束。","prerequisites":["l4-2","l6-2"],"before":"如果监督制度很严，伦理还有必要吗？","branches":[{"title":"公共管理伦理","question":"三个构成要素与一条实质是什么？","lessons":["l11-1"]},{"title":"公共管理监督","question":"内部三类、外部四种怎样形成体系？","lessons":["l11-2"]}],"relations":[{"label":"伦理与责任","text":"伦理责任意识是核心，因为权力必须对应责任。","lessons":["l11-1","l4-2"]},{"label":"监督与信息","text":"外部监督依赖信息公开，信息不公开则监督失灵。","lessons":["l11-2","l8-1"]},{"label":"监督与绩效","text":"监督不只查违规，也要看结果与责任，二者共享评价逻辑。","lessons":["l11-2","l12-1"]}],"hint":"按“内在伦理—外在监督—二者互补”组织，不要只列监督类型。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，写出伦理的三个构成要素与监督的内部三类、外部四种。","reference":"伦理：观念（准则/责任/目标意识）、实践、准则评估；内部：一般、专门、特种；外部：权力机关、司法、政党、社会。要说明分类依据。","check":"我写出了两类约束的构成。"},{"id":"relation","label":"解释一条知识联系","prompt":"解释“以权力制约权力”和“以权利制约权力”为什么互补。","reference":"权力制约靠制度设计，解决“谁来查”；权利制约靠公民知情、申诉与诉讼，解决“谁知道、谁去告”。内部监督有信息与激励盲区，外部监督提供启动动力。","check":"我说明了两条路径的分工。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老补贴被举报优亲厚友，设计伦理与监督的处理方案。","reference":"先公开标准与名单，接受申诉；再启动内部专门监督与审计；涉及违纪的移交处理。伦理上要明确利益冲突回避与责任意识，不能只靠事后处罚。","check":"我把伦理约束与监督程序结合起来。"}],"evidenceLessons":["l11-1","l11-2","l4-2","l8-1","l12-1"],"bridge":{"subject":"822","module":"p10","text":"换到评估：评估也是一种问责，标准与程序同样重要。"},"evidence":[{"src":"cai-wang-3","pages":[142],"quote":"指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制","context":"…体制的含义和内容4.2.1.1领导体制的含义体制是指国家机关、企事业单位在机构设置、领导隶属关系和管理权限划分等方面的体系、制度、方法、形式等的总称。领导体制是指公共组织中领导职能、领导权力和领导责任的配置制度、方法及其运行机制。领导体制的好坏，直接关系到领导能否有效地履行职能，有效地调动组织成员的积极性，实现组织目标。在西方，领导体制是整个公共管理系统得以顺利运转的关键：选民、利益集团和政党的利益要求只有通过领导体制的转换，才能最后形成国家或政府政策；立法机关的…","contextPage":142,"lessonId":"l4-2"},{"src":"cai-wang-3","pages":[228],"quote":"我国公务员制度不搞政治中立，坚持党管干部的原则，没有政务官与事务官之分","context":"…《党政领导干部选拔任用工作条例》和《公务员职务和职级并行规定》，标志着我国公务员制度顺应新时代发展潮流，进入了更加科学、成熟的阶段。与西方国家的公务员制度相比，我国公务员制度不搞政治中立，坚持党管干部的原则，没有政务官与事务官之分。6.3.1.1公务员的内涵公务员是公共管理的重要主体。公务员是由英文“civilservant”翻译而来。“公务员”是这一英文概念的意译。从世界范围来看，公务员的概念和范围大小不一。从已有的文献资料中，可以分为三类：第一类是小范围的，公务…","contextPage":228,"lessonId":"l6-2"},{"src":"cai-wang-3","pages":[394],"quote":"公共管理伦理是公共管理领域的规范体系","context":"…“道德科学”。一般来说，伦理有其普适性，但不同领域有着不同的伦理，如经济伦理、行政伦理、私人部门的伦理、公共部门的伦理、企业管理伦理和公共管理伦理等。就此而论，公共管理伦理是公共管理领域的规范体系，它所针对的基本对象是公共管理行为，虽然它不可避免地涉及管理者与管理对象之间的关系，但作为公共管理对象的公民、社会群体和公共场所的道德行为或伦理关系不是公共管理伦理所要考虑的主要问题。公共管理伦理通过赋予公共管理行为的价值规范体系，引导、规…","contextPage":394,"lessonId":"l11-1"},{"src":"cai-wang-3","pages":[419],"quote":"专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动","context":"提高行政复议总体水平；6）必须不断完善行政复议制度和机制，进一步规范行政复议行为①。（2）专门监督。专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动。目前，我国公共管理专门监督中，最为核心、常用、有效的是国家行政监督机关实行的行政监察活动。国家行政监察机关以宪法和法律为依据，在我国县级以上各级政府中都有设立。它在上级行政监督机关和所属人民政府的领导下，独立地行使监察权，只服从国家有关法…","contextPage":419,"lessonId":"l11-2"},{"src":"cai-wang-3","pages":[295],"quote":"政务信息资源公开也称政务信息资源开放","context":"…功能服务的特点。（4）资源形态类政务信息资源。这是以信息的存在形式为依据而形成的政务信息资源类别。8.2.5政务信息资源公开8.2.5.1政务信息资源公开的含义政务信息资源公开也称政务信息资源开放，是指政务部门以及法律法规授权的具有管理公共事务职能的公共组织主动或根据公众的申请公开政务信息，并方便社会公众获取和使用政务信息的各种活动与制度的总称。由法律确定的、现代意义的信息公开制度，产生于18世纪的欧洲。1766年，瑞典①俄罗斯《联…","contextPage":295,"lessonId":"l8-1"},{"src":"cai-wang-3","pages":[432],"quote":"绩效既不等于产出本身，也不等于任务或产品本身","context":"…职责履行以外所产生的结果不能视为绩效。第二，从绩效产生的主体来看，绩效包括了公共部门整体绩效、公共管理人员个人绩效和项目绩效。第三，从绩效质与量的本质属性来看，绩效既不等于产出本身，也不等于任务或产品本身，绩效是投入所获得的产出及其所产生的社会效果，不仅有量的规定性，","contextPage":432,"lessonId":"l12-1"}]},"m12":{"question":"绩效为什么不能等同于产出，评估怎样才不跑偏？","position":"在“如何评价与改进”层，绩效评估连接目标、结果与责任。","prerequisites":["l7-1","l11-2"],"before":"办了多场活动、花了多少钱，能证明服务变好了吗？","branches":[{"title":"绩效与评估的内涵","question":"四个规定性、3E 到 4E 说明什么？","lessons":["l12-1"]},{"title":"评估的问题与改进","question":"七条问题怎样对应改进措施？","lessons":["l12-2"]}],"relations":[{"label":"绩效与目标","text":"绩效是履行职能产生的结果与社会效果，目标模糊会直接导致指标失真。","lessons":["l12-1","l8-1"]},{"label":"评估与监督","text":"评估结果要进入监督与问责，否则容易变成填表。","lessons":["l12-2","l11-2"]},{"label":"评估与预算","text":"预算提供资源约束，绩效评估回答钱花出了什么效果。","lessons":["l12-1","l7-1"]}],"hint":"按“评什么—怎么评—怎么用”三层组织，问题与措施按下标对齐。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，写出绩效的四个规定性、3E 到 4E 的变化与评估定义。","reference":"四规定：内容外延、主体、质与量、过程周期；3E（经济、效率、效益）后加公平成 4E；评估定义包含目标、指标体系、程序、测量与改进。","check":"我写出了内涵与 3E/4E 的逻辑。"},{"id":"relation","label":"解释一条知识联系","prompt":"说明“绩效不等于产出”会带来哪些评估难题。","reference":"产出易计数，效果难归因；一旦承认绩效包含社会效果，就要面对目标模糊、效果滞后、外部因素干扰，因此需要长期跟踪、对照与利益相关者评价。","check":"我把“不等于产出”与评估难题连起来。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老服务中心要评绩效，设计三个指标并说明局限。","reference":"可从服务覆盖、对象状况改善、单位效果成本入手，分别对应可及性、效果与效率；还要看公平与未覆盖人群。指标局限是可能诱发选择性服务，需要质性回访与外部评价。","check":"我设计了指标，并指出可能的扭曲。"}],"evidenceLessons":["l12-1","l12-2","l11-2","l7-1","l8-1"],"bridge":{"subject":"822","module":"p10","text":"换到政策评估：公共部门绩效与政策评估共享标准与归因难题。"},"evidence":[{"src":"cai-wang-3","pages":[243],"quote":"公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动","context":"…问题就是要回答“应该以什么为基础来决定把X数量的预算资金分给A项目，而不是B项目”②。以美国著名政治学家、公共管理学家威尔达夫斯基为代表的早期公共管理学家认为：公共预算是为了实现一定的公共政策目标而进行的财政资源分配活动③。这个定义指出了公共预算的两个关键：其一，预算分配的公共政策导向，即财政资源的分配是围绕公共政策的目标而进行的；其二，公共预算活动实质上是一系列资源的分配决策过程。从实际操作的角度看，公共预算是指经法定程序批准的政府年度财政收支计划，以及…","contextPage":243,"lessonId":"l7-1"},{"src":"cai-wang-3","pages":[419],"quote":"专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动","context":"提高行政复议总体水平；6）必须不断完善行政复议制度和机制，进一步规范行政复议行为①。（2）专门监督。专门监督是指在公共管理主体内部设置的专门监督机关即专门监察机关实行的监察活动。目前，我国公共管理专门监督中，最为核心、常用、有效的是国家行政监督机关实行的行政监察活动。国家行政监察机关以宪法和法律为依据，在我国县级以上各级政府中都有设立。它在上级行政监督机关和所属人民政府的领导下，独立地行使监察权，只服从国家有关法…","contextPage":419,"lessonId":"l11-2"},{"src":"cai-wang-3","pages":[432],"quote":"绩效既不等于产出本身，也不等于任务或产品本身","context":"…职责履行以外所产生的结果不能视为绩效。第二，从绩效产生的主体来看，绩效包括了公共部门整体绩效、公共管理人员个人绩效和项目绩效。第三，从绩效质与量的本质属性来看，绩效既不等于产出本身，也不等于任务或产品本身，绩效是投入所获得的产出及其所产生的社会效果，不仅有量的规定性，","contextPage":432,"lessonId":"l12-1"},{"src":"cai-wang-3","pages":[466],"quote":"我国当前施行公共部门绩效评估还处于自发、半自发状态","context":"…，从舆论、操作层面开始走向体制、制度层面。12.4.2.2我国公共部门绩效评估过程中存在的问题客观地说，当前我国公共部门绩效评估还很不成熟，其主要问题是：(1)我国当前施行公共部门绩效评估还处于自发、半自发状态，缺乏全国统一的、①中国地方政府绩效评估体系研究课题组．中国政府绩效评估报告．北京：中共中央党校出版社，2009.②刘晓洋，谭海波．政府绩效管理：权力配置与模式选择：基于“控权论”的理论视角．学术研究，2013(5).","contextPage":466,"lessonId":"l12-2"},{"src":"cai-wang-3","pages":[295],"quote":"政务信息资源公开也称政务信息资源开放","context":"…功能服务的特点。（4）资源形态类政务信息资源。这是以信息的存在形式为依据而形成的政务信息资源类别。8.2.5政务信息资源公开8.2.5.1政务信息资源公开的含义政务信息资源公开也称政务信息资源开放，是指政务部门以及法律法规授权的具有管理公共事务职能的公共组织主动或根据公众的申请公开政务信息，并方便社会公众获取和使用政务信息的各种活动与制度的总称。由法律确定的、现代意义的信息公开制度，产生于18世纪的欧洲。1766年，瑞典①俄罗斯《联…","contextPage":295,"lessonId":"l8-1"}]},"m13":{"question":"改革改什么，为什么政府也会失败？","position":"在“如何评价与改进”层，改革是对组织、职能与工具的再设计。","prerequisites":["l12-2","l2-4"],"before":"改革就是精简机构、减少人员吗？","branches":[{"title":"西方公共部门改革","question":"职能、服务方式、内部管理三个方向各改什么？","lessons":["l13-1"]},{"title":"中国行政体制改革","question":"八轮改革的主线与关键节点是什么？","lessons":["l13-2"]},{"title":"政府失败","question":"四类表现、三层成因与两条处方是什么？","lessons":["l13-3"]}],"relations":[{"label":"改革与职能","text":"机构是职能的影子，先定职能再定机构，改革才稳。","lessons":["l13-1","l3-4"]},{"label":"中国改革与政府失败","text":"政府失败的解释为改革提供理由，但改革也可能产生新的失败。","lessons":["l13-2","l13-3"]},{"label":"改革与绩效","text":"改革是否有效要用绩效检验，不能只看机构数量。","lessons":["l13-1","l12-2"]}],"hint":"按“为什么改—改什么—怎样防止改坏”组织，最后回到政府失败。","tasks":[{"id":"structure","label":"还原本章结构","prompt":"不看目录，用三个方向概括西方改革，用一条主线概括中国八轮改革。","reference":"西方：重新界定职能、公共服务市场化与社会化、内部管理改革；中国：以转变政府职能为中心，机构与人员随之调整。要举关键节点说明主线。","check":"我写出了三个方向与一条主线。"},{"id":"relation","label":"解释一条知识联系","prompt":"解释“政府失败”与“市场失灵”的区别与联系。","reference":"市场失灵是市场机制解决不了公共物品、外部性等问题，所以需要政府；政府失败是政府介入后仍未解决甚至带来新问题。二者是“为什么需要政府”和“政府为什么也会失灵”两个问题。","check":"我区分了两个概念并说明联系。"},{"id":"application","label":"用框架解释案例","prompt":"社区养老改革方案：用政府失败的四类表现预判风险，并提出防范。","reference":"可预判政策失效（需求判断错）、低效率（供给垄断）、内部性（部门自利）、寻租（购买服务中的腐败）。防范靠决策论证、竞争机制、公开与问责，并在试点中评估。","check":"我把四类表现对应到案例风险与防范。"}],"evidenceLessons":["l13-1","l13-2","l13-3","l3-4","l12-2"],"bridge":{"subject":"822","module":"p11","text":"换到政策变动：改革常通过调整、接续与终结实现。"},"evidence":[{"src":"cai-wang-3","pages":[466],"quote":"我国当前施行公共部门绩效评估还处于自发、半自发状态","context":"…，从舆论、操作层面开始走向体制、制度层面。12.4.2.2我国公共部门绩效评估过程中存在的问题客观地说，当前我国公共部门绩效评估还很不成熟，其主要问题是：(1)我国当前施行公共部门绩效评估还处于自发、半自发状态，缺乏全国统一的、①中国地方政府绩效评估体系研究课题组．中国政府绩效评估报告．北京：中共中央党校出版社，2009.②刘晓洋，谭海波．政府绩效管理：权力配置与模式选择：基于“控权论”的理论视角．学术研究，2013(5).","contextPage":466,"lessonId":"l12-2"},{"src":"cai-wang-3","pages":[67],"quote":"（1）向职业化管理的转变；（2）标准与绩效测量；（3）产出控制；（4）单位的分散化","context":"…责任制，强调产出导向和绩效评估，以准独立的行政单位为主的分权结构，采用私人部门管理、技术、工具并引入市场机制以改善竞争。为此，他将新公共管理的内涵及特征概括为：（1）向职业化管理的转变；（2）标准与绩效测量；（3）产出控制；（4）单位的分散化；（5）竞争；（6）私人部门管理的风格；（7）纪律与节约②。哈伯德（M.Hubbard）将新公共管理归纳为十大方面：（1）主管的战略角色和战略管理实践的强化；（2）从行政到管理的重点转移，即从执行规则到实现既定目标的转移；（3）人事权由中央…","contextPage":67,"lessonId":"l2-4"},{"src":"cai-wang-3","pages":[489],"quote":"公共部门改革的第一要务就是重新界定和优化政府职能","context":"…方国家公共部门改革的内容进行如下概括。13.2.2.1重新界定和优化政府职能20世纪70年代，导致西方国家公共管理面临困境的一个重要原因就是政府职能扩张。因此，公共部门改革的第一要务就是重新界定和优化政府职能，解决政府应该管什么、不应该管什么和怎么管的问题。一是在政府部门内部实行大部制，将相近的职能尽可能集中到一个部门，精简政府机构，减少横向协调的困难；二是政府从大量社会事务中解脱出来，将这些职能交给或归还给社会，由社会经济组织或中介组织去承担…","contextPage":489,"lessonId":"l13-1"},{"src":"cai-wang-3","pages":[504],"quote":"坚持以科学理论为指导，坚持从中国国情和实际出发","context":"…体制改革的历史进程与我国政治、经济和社会客观实际的变化相联系，新中国成立以来的行政体制改革也经历了不同的发展阶段。我国行政体制改革积累的丰富经验，概括起来包括：坚持以科学理论为指导，坚持从中国国情和实际出发，坚持以人民为中心和执政为民，坚持统筹规划、协调推进，坚持提高改革决策的科学性。13.3.2.11949年新中国成立到1978年实行改革开放从1949年新中国成立到1978年实行改革开放，是中国特色社会主义行政体制创立和奠基的时期。这一历史…","contextPage":504,"lessonId":"l13-2"},{"src":"chen-2","pages":[155],"quote":"没有单纯的市场经济，只有市场调节与政府调控相结合的混合经济","context":"…或地区的市场经济发展的经验教训，尤其是如何处理好政府与市场、政府与企业以及政府调控与市场调节之间关系的经验教训。各国市场经济发展的历史以及经济学的研究成果表明，没有单纯的市场经济，只有市场调节与政府调控相结合的混合经济。在市场经济发展的过程中，政府在市场运行中总是扮演着重要的角色。市场缺陷及市场失灵是政府干预的基本理由。政府可以做一些市场做不到或做不好的事情，它的干预可以弥补市场的不足，①世界银行：《1997年世界发展报告：变革世界中的政府》，1页。","contextPage":155,"lessonId":"l13-3"},{"src":"cai-wang-3","pages":[124],"quote":"机构调整只是手段，优化组织整体结构和功能才是目的","context":"…组织变革在现象上总是表现为组织机构的调整，机构调整也的确是组织变革中量最大的工作，但公共组织变革绝不是一个简单的机构调整、人员增减问题，而是一个复杂的系统工程。机构调整只是手段，优化组织整体结构和功能才是目的。与此相应，所有变革都与公共组织的目标密切联系。沃伦·本尼斯曾提出四个组织有效的标准，此标准同样也可适用于公共组织变革的目标。这四个标准分别是：第一，适应性——解决问题以及对环境需求的变化的灵活反应能力；第二，组织身份的认同感——从组织本身…","contextPage":124,"lessonId":"l3-4"}]}},"case":{"title":"社区养老服务改善","text":"教学虚构案例：以下人物、数字和情节均为练习编写，不对应任何真实社区，引用时请保留“虚构”说明。\n\n【背景】河湾社区有常住人口约 1.2 万人，60 岁以上 2600 人，80 岁以上 420 人，独居老人约 310 人；社区估计失能、半失能老人约 90 人，但没有做过全员评估。社区养老服务站 2021 年建成，180 平方米，由街道委托“安和”社会工作服务中心运营，提供午餐、日间照料、健康监测和活动。站内厨房只能加热，午餐由 8 公里外的中央厨房配送；每天实际到站约 40 人，午餐约 30 份，而站点设计容量为 60 人。\n\n【参与方】街道负责场地、经费与监管；安和中心有 6 名工作人员（1 名负责人、2 名护理员、1 名厨师、1 名社工、1 名行政），另有 20 名注册志愿者，但常年活跃的只有 8 人；社区卫生服务中心掌握慢病档案，每月来测一次血压；物业提供场地和门禁，但对送餐上楼有顾虑；老人和家属既有依赖也有抱怨；区民政局提供运营补贴和星级评定。\n\n【资源与约束】街道年度运营经费 45 万元：人员 28 万、餐费补贴 8 万、活动 5 万、设备维护 4 万。午餐 12 元，80 岁以上补贴 2 元，90 岁以上免费；服务时间为工作日 9:00—17:00，周末和节假日不开。服务覆盖 3 个小区，最远 1.8 公里，其中 6 栋老楼没有电梯。\n\n【近期情况】老人反映菜偏咸、排队久、活动单一；有老人希望增加助浴、陪诊和夜间探访，但机构没有相应资质和人手；家属担心老人往返安全和责任划分。去年冬天曾因配送延误，一位独居老人低血糖被邻居送医。区里今年要求街道把站点使用率提高 20%，并拨了 10 万元适老化改造专项；街道想请第三方做评估，但还没定标准。周边有 2 家社会餐饮和 1 家养老驿站，愿意合作但尚未谈具体条件。\n\n【待核实】社区没有做过全社区需求普查，不清楚未使用者的具体原因；没有失能等级台账；没有服务对象健康改善的基线数据；也不掌握老人支付能力和家属照护安排。"}},"sources":{"cai-wang-3":{"short":"蔡王","title":"蔡立辉、王乐夫《公共管理学》第3版","engine":"MinerU"},"chen-2":{"short":"陈","title":"陈振明《公共管理学》第二版","engine":"MinerU"}},"totalOpen":42}</script>
<script>
(()=>{
'use strict';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n{2,}/g,'</p><p class="prose">').replace(/\n/g,'<br>');
const $=s=>document.querySelector(s);
const subjectCode=new URLSearchParams(location.search).get('subject')==='822'?'822':'618';
const policyData=JSON.parse($('#policy-data').textContent||'{}');
const COURSE=subjectCode==='822'?policyData.course:JSON.parse($('#course-data').textContent||'{}');
const EXAMS=subjectCode==='822'?policyData.exams:JSON.parse($('#exam-data').textContent||'[]');
const POINTS=subjectCode==='822'?policyData.points:JSON.parse($('#points-data').textContent||'{"books":[],"stats":{}}');
const SRC=COURSE.sources||{};
const FRAME=COURSE.framework||{groups:[],guides:{},threads:[]};
const KEY='yanxi-'+subjectCode+'-v2';
document.title='研习 · '+subjectCode+' '+COURSE.subject.name;
$('.brand p').textContent=subjectCode+' '+COURSE.subject.name;
$('#subject-select').value=subjectCode;
$('#subject-select').onchange=e=>{
  save();
  const url=new URL(location.href);url.searchParams.set('subject',e.target.value);url.hash='/';location.href=url.href;
};
const pad=n=>String(n).padStart(2,'0');
const stamp=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>stamp(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return stamp(d)};

let P={lessons:{},chapters:{},last:null};
let storageFailed=false;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');P={lessons:raw.lessons||{},chapters:raw.chapters||{},last:raw.last||null};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));storageFailed=false;return true}catch(e){storageFailed=true;toast('浏览器未能保存进度，请检查存储权限。');return false}};
window.addEventListener('pagehide',save);
const st=id=>P.lessons[id]||{};
const modules=COURSE.modules||[];
const lessons=COURSE.lessons||{};
const journey=modules.flatMap(m=>m.lessons.map(l=>l.id));
const meta={};
modules.forEach(m=>m.lessons.forEach(l=>{meta[l.id]={...l,moduleId:m.id,chapter:m.chapter,moduleTitle:m.title}}));
const moduleOf=id=>modules.find(m=>m.id===(meta[id]&&meta[id].moduleId));

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.classList.remove('show'),2000)}

const exState=(id,i)=>(st(id).ex||{})[i];
function lessonDone(id){
  const L=lessons[id];if(!L)return false;
  const s=st(id);
  const total=(L.exercises||[]).length;
  const answered=Object.keys(s.ex||{}).length;
  if(total>answered)return false;
  if(L.write&&!s.checked)return false;
  return total>0||!!L.write;
}
function lessonStarted(id){const s=st(id);return !!(s.done||(s.ex&&Object.keys(s.ex).length)||s.text||s.checked)}
function dueList(){const t=today();return journey.filter(id=>st(id).next&&st(id).next<=t)}
function nextLesson(){return journey.find(id=>!lessonDone(id))||journey[journey.length-1]}
function coverage(id){
  const ex=(lessons[id]||{}).exercises||[];
  let right=0,answered=0;
  ex.forEach((e,i)=>{const v=exState(id,i);if(v){answered++;if(v==='y')right++}});
  return {total:ex.length,answered,right};
}
function syncShell(){
  const done=journey.filter(lessonDone).length,all=journey.length;
  $('#nav-progress').textContent=`${done}/${all}`;
  $('#nav-exam').textContent=EXAMS.length;
  $('#nav-points').textContent=(POINTS.stats&&POINTS.stats.items)||0;
  $('#nav-due').textContent=dueList().length;
  $('#foot-line').textContent=done?`已学完 ${done} 课，还剩 ${all-done} 课`:'还没有开始';
  const pct=all?Math.round(done/all*100):0;
  $('#foot-bar').style.width=pct+'%';
  const bar=$('#foot-bar').parentNode;
  if(bar)bar.setAttribute('aria-valuenow',String(pct));
  const streak=streakDays(), todayCount=Object.values(P.lessons).filter(s=>s.at===today()).length;
  $('#foot-streak').textContent=streak>1?`连续学习 ${streak} 天${todayCount?` · 今天 ${todayCount} 课`:''}`:(todayCount?'今天已开始，保持住':'学完一课就开始记录');
  $('#aside-modules').innerHTML=modules.map(m=>{
    const d=m.lessons.filter(l=>lessonDone(l.id)).length;
    const full=m.lessons.length&&d===m.lessons.length;
    return `<button data-go="#/module/${esc(m.id)}" class="${full?'done':''}" title="${esc(m.title)}"><b>${esc(m.chapter)}</b><span>${esc(m.title)}</span></button>`;
  }).join('');
}
function streakDays(){
  const days=new Set();
  Object.values(P.lessons||{}).forEach(s=>{if(s&&s.at)days.add(s.at)});
  if(!days.size)return 0;
  const d=new Date();
  if(!days.has(stamp(d)))d.setDate(d.getDate()-1);
  let n=0;
  while(days.has(stamp(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function updateReadbar(){
  const bar=$('#readbar'),top=$('#to-top');
  const max=document.documentElement.scrollHeight-window.innerHeight;
  if(bar)bar.style.width=(max>0?Math.min(100,Math.max(0,window.scrollY/max*100)):0)+'%';
  if(top)top.classList.toggle('show',window.scrollY>720);
}
function spySections(){
  const ids=['sec-read','sec-concept','sec-evid','sec-ex','sec-write'];
  let active=null;
  ids.forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<=150)active=id});
  document.querySelectorAll('.secnav a,.rail-card a[href^="#sec-"]').forEach(a=>{
    const on=a.getAttribute('href')==='#'+active;
    a.classList.toggle('on',on);
    if(on)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');
  });
}
window.addEventListener('scroll',()=>{updateReadbar();spySections()},{passive:true});
function setNav(active){
  document.querySelectorAll('#main-nav button').forEach(b=>{
    const go=b.dataset.go;
    const on=(active==='map'&&go==='#/')||(active==='exam'&&go==='#/exam')||(active==='points'&&go==='#/points')||(active==='review'&&go==='#/review');
    b.classList.toggle('active',on);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}

function route(){
  const h=location.hash.replace(/^#/,'')||'/';
  if(h.indexOf('/lesson/')===0){
    const id=h.slice(8);
    if(!lessons[id]){location.hash='#/';return}
    P.last=id;save();
    setNav('map');renderLesson(id);return;
  }
  if(h==='/framework'){setNav('map');renderFramework();return}
  if(h.indexOf('/rebuild/')===0){setNav('map');renderRebuild(h.slice(9));return}
  if(h.indexOf('/module/')===0){setNav('map');FRAME.guides[h.slice(8)]?renderChapter(h.slice(8)):renderMap(h.slice(8));return}
  if(h.indexOf('/exam')===0){setNav('exam');renderExam();return}
  if(h.indexOf('/points')===0){setNav('points');renderPoints();return}
  if(h.indexOf('/review')===0){setNav('review');renderReview();return}
  setNav('map');renderMap();
}
window.addEventListener('hashchange',()=>{window.scrollTo({top:0});route()});
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();location.hash=go.dataset.go;}
});

function moduleRow(m,nid){
  const d=m.lessons.filter(l=>lessonDone(l.id)).length;
  const cls=['route-item',m.open?'open':'closed',m.lessons.some(l=>l.id===nid)?'current':'',m.lessons.length&&d===m.lessons.length?'done':''].join(' ').replace(/\s+/g,' ').trim();
  const chips=[];
  if(m.open)chips.push(`<span class="chip warm">${m.lessons.length} 课已开放</span>`);
  if(m.examCount)chips.push(`<span class="chip">真题出现 ${m.examCount} 次</span>`);
  if(!m.open)chips.push(`<span class="chip hold">排队中</span>`);
  if(m.dual){
    const secondary=m.dual.secondary===undefined?m.dual.chen:m.dual.secondary;
    const label=COURSE.subject.secondaryShort||'陈书';
    const nums=secondary?[...secondary.matchAll(/第(\d+)章/g)].map(x=>x[1]):[];
    chips.push(nums.length?`<span class="chip chen" title="${esc(secondary)}">${esc(label)} 第${nums.join('、')}章</span>`:`<span class="chip hold">${esc(label)} 未单列对应章节</span>`);
  }
  const list=m.open?`<ul class="lesson-list">${m.lessons.map(l=>{
    const done=lessonDone(l.id),doing=!done&&lessonStarted(l.id);
    const mark=done?'✓':doing?'·':l.order;
    return `<li><a class="lesson-row ${l.id===nid?'active':''}" href="#/lesson/${esc(l.id)}" ${l.id===nid?'aria-current="true"':''}>
      <span class="lesson-state ${done?'done':doing?'doing':''}" aria-hidden="true">${mark}</span>
      <span class="lesson-title">${esc(l.title)}</span>
      ${l.tag==='陈书'?'<span class="chip chen">陈书</span>':''}
      <span class="lesson-min">${l.minutes} 分钟</span></a></li>`;
  }).join('')}</ul>`:'';
  const plan=(!m.open&&m.sections&&m.sections.length)
    ?`<div class="route-plan"><span>教材小节</span>${m.sections.map(s=>`<code>${esc(s)}</code>`).join('')}</div>`:'';
  return `<div class="${cls}" id="m-${esc(m.id)}">
    <div class="marker"><span>${esc(m.order)}</span></div>
    <div class="route-body">
      <div class="route-head"><b>${esc(m.chapter)}</b><h3>${esc(m.title)}</h3>${chips.join('')}</div>
      <p class="route-why">${esc(m.why)}</p>
      ${FRAME.guides[m.id]?`<div class="framework-actions"><a class="quiet-btn" href="#/module/${esc(m.id)}">章前定位与知识联系</a><a class="quiet-btn" href="#/rebuild/${esc(m.id)}">闭卷重建</a><span class="framework-status">${esc(chapterStatus(m.id))}</span></div>`:''}
      ${list}${plan}
    </div></div>`;
}

  const hint=$('#rebuild-hint');if(hint)hint.onclick=()=>{s.hint=true;$('#rebuild-hint-text').hidden=false;$('#rebuild-hint-text').textContent=g.hint;persist()};

    const editTop=$('#rebuild-edit-top');

    $('#rebuild-new').onclick=()=>{
      const snapshot={answers:{...s.answers},checks:[...s.checks],hint:s.hint,at:s.at};

      P.chapters[id]=next;

      renderRebuild(id);$('#recall-structure').focus();
    };
  }

function evidenceHTML(L){
  const refs=(L.evidence||[]).filter(r=>SRC[r.src]);
  if(!refs.length)return '';
  const order=COURSE.subject.books.filter(s=>refs.some(r=>r.src===s));
  const groups=order.map(s=>({src:s,items:refs.filter(r=>r.src===s)}));
  const tally=groups.map(g=>`${SRC[g.src].short} ${g.items.length}`).join(' / ');
  return `<details class="evid" id="sec-evid"><summary>教材依据 · ${refs.length} 条（${tally}），点开核对原文</summary>
    ${groups.map(g=>`<div class="evid-group"><h5>${esc(SRC[g.src].title)}</h5>
      ${g.items.map(r=>`<p class="evid-quote">${esc(r.quote)}</p>

      ${L.reviewStatus==="reviewed"?'<div class="review-note ok">本课已对照文本抽核；教材引文已回查 MinerU 底稿。讲解与范答为教学归纳，关键表述仍请核对扫描页。</div>':'<div class="review-note">教材引文已回查 MinerU 底稿；讲解为教学归纳，尚未逐句抽核，关键判断请对照原书。</div>'}

function bindAnchors(){
  document.querySelectorAll('.rail-card a[href^="#sec-"]').forEach(a=>{

      e.preventDefault();

function exerciseHTML(id,e,i){
  const done=exState(id,i);
  const no=`第 ${i+1} 题`;
  if(e.t==='choice'||e.t==='multi'){
    const multi=e.t==='multi';
    return `<div class="ex" data-ex="${i}" data-type="${e.t}">
      <span class="ex-no">${no} · ${multi?'多选':'单选'}</span>
      <p class="ex-q">${esc(e.q)}</p>
      <div class="opts">${e.opts.map((o,k)=>`<button class="opt" data-opt="${k}" ${done?'disabled':''}><span class="k">${'ABCDEFG'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="ex-foot">${multi&&!done?'<button class="quiet-btn" data-submit="1">确认答案</button>':''}${done?`<span style="font-size:12px;color:${done==='y'?'var(--green-text)':'var(--red-text)'}">${done==='y'?'答对了':'答错了'}</span>`:''}</div>
      <div class="ex-why" ${done?'':'hidden'}><b>解析　</b>${fmt(e.why)}</div>
    </div>`;
  }
  if(e.t==='judge'){
    return `<div class="ex" data-ex="${i}" data-type="judge">
      <span class="ex-no">${no} · 判断</span>
      <p class="ex-q">${esc(e.q)}</p>
      <div class="opts" style="grid-template-columns:1fr 1fr">
        <button class="opt" data-judge="1" ${done?'disabled':''}><span class="k">对</span><span>这个说法对</span></button>
        <button class="opt" data-judge="0" ${done?'disabled':''}><span class="k">错</span><span>这个说法错</span></button>
      </div>
      <div class="ex-foot">${done?`<span style="font-size:12px;color:${done==='y'?'var(--green-text)':'var(--red-text)'}">${done==='y'?'答对了':'答错了'}</span>`:''}</div>
      <div class="ex-why" ${done?'':'hidden'}><b>解析　</b>${fmt(e.why)}</div>
    </div>`;
  }
  if(e.t==='order'){
    const n=e.items.length;
    const display=done?e.a.slice():[...Array(n).keys()].map(k=>(k+1)%n);
    return `<div class="ex" data-ex="${i}" data-type="order">
      <span class="ex-no">${no} · 排序</span>
      <p class="ex-q">${esc(e.q)}　<span style="color:#9e9688;font-size:12px">用 ↑ ↓ 调整</span></p>
      <div class="order-list">${display.map((k,pos)=>`<div class="order-item${done?' ok':''}" data-item="${k}"><span class="idx">${pos+1}</span><span>${esc(e.items[k])}</span>
        <button class="move" data-move="up" aria-label="上移">↑</button><button class="move" data-move="down" aria-label="下移">↓</button></div>`).join('')}</div>
      <div class="ex-foot"><button class="quiet-btn" data-submit="1" ${done?'disabled':''}>检查顺序</button>
        ${done?`<span style="font-size:12px;color:${done==='y'?'var(--green-text)':'var(--red-text)'}">${done==='y'?'排序正确':'顺序不对'}</span>`:''}</div>
      <div class="ex-why" ${done?'':'hidden'}><b>解析　</b>${fmt(e.why)}<div style="margin-top:7px;color:#81796a">正确顺序：${e.a.map(k=>esc(e.items[k])).join(' → ')}</div></div>
    </div>`;
  }
  return '';
}
